# Nightly "Refresh all": re-pull every profile, record the day's fundamentals,
# extend the bar archive, and email the report.
#
# Why a runner rather than a Vercel cron: a full pass is a dozen rounds spaced a
# minute apart, and no serverless function stays alive for twelve minutes. This
# drives exactly the loop the browser drives, against the same endpoint.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   APP_URL       https://www.tickrlab.com   (no trailing slash)
#   CRON_SECRET   the same value set in the Vercel environment

name: Nightly refresh

on:
  schedule:
    # 4:15 PM in New York, fifteen minutes after the close.
    #
    # GitHub cron is UTC and has no timezone option, so one entry cannot mean a
    # local time in a place that moves its clocks. BOTH UTC times are registered
    # — 20:15 while Eastern Daylight Time is in force (UTC-4) and 21:15 while
    # Eastern Standard Time is (UTC-5) — and the job throws away whichever of
    # the two is not 4PM in New York on the day.
    #
    # The guard asks the tz database rather than hardcoding the changeover
    # dates, because those move: the US has shifted them before and may again.
    # So this keeps working without anyone remembering it exists.
    - cron: '15 20 * * *'     # 4:15 PM EDT (Mar-Nov)
    - cron: '15 21 * * *'     # 4:15 PM EST (Nov-Mar)
  workflow_dispatch:          # the "Run workflow" button, for a refresh on demand

# A run still going when the next fires would fight it for the refresh flag.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Two crons are registered so one of them lands on 4:15 PM Eastern
      # whatever the clocks are doing. Exactly one can be right on any given
      # day; this is where the other one stops. A manual run is never gated.
      - name: Is it 4:15 PM in New York?
        id: gate
        run: |
          NY=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
          HOUR=$(TZ=America/New_York date '+%H')
          echo "New York: $NY   (UTC $(date -u '+%H:%M'))"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — not gated"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "16" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$NY is not 4PM Eastern — this is the other daylight-saving cron. Nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Drive a full Refresh all
        if: steps.gate.outputs.go == 'yes'
        env:
          # APP_URL is not sensitive, so accept it from either tab. "Secrets and
          # variables" puts them side by side and the wrong one is easy to pick.
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Read only so the failure can say *where* the value ended up. A
          # variable is not masked, so this must never be echoed.
          CRON_SECRET_IN_VARS: ${{ vars.CRON_SECRET }}
        run: |
          set -uo pipefail

          # The old message named both variables whether or not both were
          # missing, which left the actual fault to guesswork. Say which one,
          # and say where it is if it was filed in the wrong place.
          missing=""
          [ -z "${APP_URL:-}" ] && missing="APP_URL"
          [ -z "${CRON_SECRET:-}" ] && missing="${missing:+$missing and }CRON_SECRET"

          if [ -n "$missing" ]; then
            echo "::error::Missing from this workflow's environment: ${missing}."
            if [ -n "${CRON_SECRET_IN_VARS:-}" ]; then
              echo "::error::CRON_SECRET exists as a repository *variable*. It has to be a *secret* — variables are readable by anyone who can see the repo. Delete it from the Variables tab and add it under Secrets."
            fi
            echo "::error::Set them at Settings -> Secrets and variables -> Actions -> Secrets (repository level, not an environment): APP_URL = https://www.tickrlab.com (no trailing slash), CRON_SECRET = the same value as in Vercel."
            exit 1
          fi

          # Enough to spot a typo or a pasted newline without revealing anything.
          echo "APP_URL     = ${APP_URL}"
          echo "CRON_SECRET = ${#CRON_SECRET} characters"

          MAX_ROUNDS=60        # 7 profiles a round after the price rounds. The nightly run
                               # rotates a seventh of the profiles, so 60 covers ~2,800
                               # symbols; it is a full sweep (FUND_ROTATION_DAYS=1) that
                               # would need more, and that is not what this job does.
          GAP=62               # the pacing the browser loop uses, unchanged
          STAGNANT_LIMIT=3     # rounds without progress before giving up

          call() {             # $1 = query string
            curl -sS -m 180 -X POST "${APP_URL}/api/cron/refresh$1" \
              -H "authorization: Bearer ${CRON_SECRET}" \
              -H 'content-type: application/json' \
              -d '{"actor":"nightly job (GitHub Actions)"}'
          }

          finish() {           # clear the flag and report whatever was gathered
            curl -sS -m 120 -X DELETE "${APP_URL}/api/cron/refresh" \
              -H "authorization: Bearer ${CRON_SECRET}" >/dev/null || true
          }

          echo "Starting Refresh all against ${APP_URL}"
          resp=$(call '?start=1')
          last=-1
          stagnant=0

          for round in $(seq 1 $MAX_ROUNDS); do
            done=$(printf '%s' "$resp" | jq -r '.done // empty' 2>/dev/null)
            loaded=$(printf '%s' "$resp" | jq -r '.loaded // empty' 2>/dev/null)
            total=$(printf '%s' "$resp" | jq -r '.total // empty' 2>/dev/null)

            if [ -z "$loaded" ]; then
              # A rate limit or a cold start, not a reason to abandon the night.
              echo "round ${round}: no usable response — $(printf '%s' "$resp" | head -c 200)"
              stagnant=$((stagnant + 1))
              if [ "$stagnant" -ge "$STAGNANT_LIMIT" ]; then
                echo "::warning::Giving up after ${stagnant} failed rounds."
                finish
                exit 1
              fi
            else
              echo "round ${round}: ${loaded}/${total} profiles"
              if [ "$done" = "true" ]; then
                echo "Complete — the server has sent the report."
                exit 0
              fi
              if [ "$loaded" = "$last" ]; then
                stagnant=$((stagnant + 1))
              else
                stagnant=0
              fi
              last="$loaded"
              if [ "$stagnant" -ge "$STAGNANT_LIMIT" ]; then
                echo "::warning::No progress for ${stagnant} rounds — stopping at ${loaded}/${total}."
                finish
                exit 1
              fi
            fi

            sleep "$GAP"
            resp=$(call '')
          done

          echo "::warning::Hit the ${MAX_ROUNDS}-round ceiling without finishing."
          finish
          exit 1
