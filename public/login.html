<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in — Ticker Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; overflow-x: clip;
      display: flex; align-items: center; justify-content: center; padding: 24px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 12% 4%, rgba(52, 211, 153, 0.13), transparent 62%),
        radial-gradient(50vw 44vw at 92% 96%, rgba(124, 156, 255, 0.13), transparent 64%); }
    .grain { z-index: 60; }

    .bezel {
      position: relative; z-index: 1; width: 100%; max-width: 420px; border-radius: 26px; box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.95); }
    .bezel > .core {
      overflow: visible;
      background:
        radial-gradient(90% 60% at 0% 0%, rgba(52, 211, 153, 0.07), transparent 60%),
        radial-gradient(80% 60% at 100% 100%, rgba(124, 156, 255, 0.07), transparent 62%),
        var(--surface);
      border-radius: 20px; box-shadow: var(--inset); padding: 30px 28px;
    }

    .brand { display: inline-flex; align-items: baseline; gap: 6px; margin: 0;
             font-size: 19px; font-weight: 600; letter-spacing: -0.03em; }
    .brand .w2 {
      background: linear-gradient(100deg, #9aa4b6 10%, #5d6474 92%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lede { margin: 10px 0 0; }

    .tabs { display: flex; gap: 4px; margin: 22px 0 18px; padding: 4px;
            border: 1px solid var(--hair); border-radius: 999px; background: rgba(255, 255, 255, 0.03); }
    .tab {
      flex: 1; padding: 8px 12px; border: 0; border-radius: 999px; cursor: pointer;
      background: none; color: var(--muted); font-family: var(--sans);
      font-size: 12.5px; font-weight: 500; line-height: 1;
      transition: background 0.5s var(--ease), color 0.5s var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { background: rgba(255, 255, 255, 0.085); color: #fff; box-shadow: var(--inset); }

    label { display: block; margin: 0 0 6px; font-size: 10px; font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.2em; color: var(--faint); }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; padding: 11px 14px; border-radius: 12px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03);
      color: var(--text); font-family: var(--sans); font-size: 13.5px;
      box-shadow: var(--inset); outline: none;
      transition: border-color 0.5s var(--ease), background 0.5s var(--ease);
    }
    input:focus { border-color: var(--hair-2); background: rgba(255, 255, 255, 0.055); }
    input::placeholder { color: var(--faint); }
    .hint { margin: 6px 0 0; font-size: 11px; color: var(--faint); }

    .btn {
      width: 100%; justify-content: center; margin-top: 6px; padding: 12px 16px;
      border: 1px solid transparent;
      background: linear-gradient(180deg, #ffffff, #dee3ed); color: #07090d; font-size: 13.5px; font-weight: 600;
      box-shadow: 0 14px 34px -14px rgba(255, 255, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.4s var(--ease), background 0.5s var(--ease); }
    .btn:hover { background: linear-gradient(180deg, #ffffff, #e9edf5); }
    .btn:active { transform: scale(0.985); }
    .btn:disabled { opacity: 0.5; }

    .msg { display: none; align-items: flex-start; gap: 9px; margin-top: 16px;
           font-size: 12.5px; line-height: 1.5; }
    .msg.show { display: flex; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    .msg .ic { margin-top: 1px; }

    .forgot { margin: 12px 0 0; text-align: center; }
    .forgot button {
      background: none; border: 0; padding: 4px; cursor: pointer;
      color: var(--faint); font-family: var(--sans); font-size: 12px;
      text-decoration: underline; text-underline-offset: 2px;
      transition: color 0.4s var(--ease);
    }
    .forgot button:hover { color: var(--muted); }
    .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hair);
            font-size: 11.5px; color: var(--faint); line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.6 21 19.4H3L12 4.6Z"/><path d="M12 10.4v3.8M12 17.1v.1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6 9.8 17.4 19 6.6"/></symbol>
  </svg>

  <main class="bezel">
    <div class="core">
      <h1 class="brand"><span class="w1">Ticker</span> <span class="w2">Lab</span></h1>
      <p class="lede" id="lede">Sign in to view the screener.</p>

      <div class="tabs" role="tablist">
        <button class="tab" id="tabSignin" role="tab" aria-selected="true">Sign in</button>
        <button class="tab" id="tabRegister" role="tab" aria-selected="false">Create account</button>
      </div>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
          <p class="hint" id="pwHint" style="display:none">At least 8 characters.</p>
        </div>
        <div class="field" id="codeField" style="display:none">
          <label for="code">Invite code</label>
          <input type="text" id="code" name="code" autocomplete="off" placeholder="Ask the owner for this" />
        </div>
        <button class="btn" id="submit" type="submit">Sign in</button>
      </form>

      <p class="forgot" id="forgotWrap">
        <button type="button" id="forgotBtn">Forgot your password?</button>
      </p>

      <div class="msg" id="msg"><svg class="ic" aria-hidden="true"><use href="#i-warn" /></svg><span id="msgText"></span></div>

      <p class="foot" id="foot">Everyone signed in sees the same shared screener. Only the owner can add tickers, refresh data or run a backtest.</p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let mode = 'signin';
    let signupCodeRequired = false;

    function setMsg(text, kind) {
      const box = $('msg');
      if (!text) { box.classList.remove('show'); return; }
      box.className = 'msg show ' + (kind || 'err');
      box.querySelector('use').setAttribute('href', kind === 'ok' ? '#i-check' : '#i-warn');
      $('msgText').textContent = text;
    }

    // Sends the address already typed in, so the flow is one click rather than
    // a second form. The reply is deliberately the same whether or not the
    // account exists, so the message here cannot say more than it knows.
    async function requestReset() {
      const email = ($('email').value || '').trim();
      if (!email) { $('email').focus(); return setMsg('Enter your email address first, then click again.'); }
      const btn = $('forgotBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        setMsg(data.message || 'If that address has an account, a reset link is on its way.');
      } catch {
        setMsg('Could not reach the server. Try again in a moment.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Forgot your password?';
      }
    }

    function setMode(next) {
      mode = next;
      const reg = mode === 'register';
      $('tabSignin').setAttribute('aria-selected', String(!reg));
      $('tabRegister').setAttribute('aria-selected', String(reg));
      $('submit').textContent = reg ? 'Create account' : 'Sign in';
      $('lede').textContent = reg
        ? 'Create an account to view the screener.'
        : 'Sign in to view the screener.';
      $('pwHint').style.display = reg ? '' : 'none';
      $('codeField').style.display = reg && signupCodeRequired ? '' : 'none';
      $('forgotWrap').style.display = reg ? 'none' : '';
      $('password').setAttribute('autocomplete', reg ? 'new-password' : 'current-password');
      setMsg('');
    }

    $('tabSignin').addEventListener('click', () => setMode('signin'));
    $('tabRegister').addEventListener('click', () => setMode('register'));
    $('forgotBtn').addEventListener('click', requestReset);

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('');
      $('submit').disabled = true;
      const body = {
        email: $('email').value.trim(),
        password: $('password').value,
        code: $('code').value.trim(),
      };
      try {
        const res = await fetch(mode === 'register' ? '/api/register' : '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        setMsg(mode === 'register' ? 'Account created — taking you in…' : 'Signed in — taking you in…', 'ok');
        window.location.href = '/';
      } catch (err) {
        setMsg(err.message);
        $('submit').disabled = false;
      }
    });

    // If a session is already live, skip the form entirely.
    (async () => {
      try {
        const me = await fetch('/api/me', { cache: 'no-store' }).then((r) => r.json());
        signupCodeRequired = !!me.signupCodeRequired;
        if (me.signedIn) { window.location.href = '/'; return; }
      } catch { /* show the form */ }
      setMode('signin');
    })();
  </script>
</body>
</html>
