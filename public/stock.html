<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stock — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; padding: 0 0 60px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 6% -6%, rgba(52, 211, 153, 0.12), transparent 62%),
        radial-gradient(50vw 44vw at 96% 4%, rgba(124, 156, 255, 0.12), transparent 64%); }

    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center;
                   padding: 10px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%;
      padding: 6px 7px 6px 16px; border-radius: 999px; background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset);
    }

    /* masthead — the chips sit on this row rather than claiming one of their
       own, which was costing a 26px band plus 30px of margins above the chart */
    .head { display: flex; align-items: baseline; gap: 10px 14px; flex-wrap: wrap; margin: 12px 0 0; }
    h1 { margin: 0; font-size: clamp(28px, 3.4vw, 38px); font-weight: 600;
         letter-spacing: -0.035em; line-height: 1; font-family: var(--mono); }
    .co { font-size: 15px; color: var(--muted); letter-spacing: -0.01em; }

    /* The symbol doubles as the way to reach another one. Styled to look like
       the heading it replaced, so the page does not grow a control: the caret
       is the only thing that says it opens. */
    .sympick { position: relative; }
    #symBtn {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      margin: 0; padding: 2px 6px 2px 0; border: 0; background: none; border-radius: 10px;
      font: inherit; color: inherit; letter-spacing: inherit;
      transition: background 0.35s var(--ease);
    }
    #symBtn:hover, #symBtn[aria-expanded="true"] { background: rgba(255, 255, 255, 0.05); }
    #symBtn .caret { width: 15px; height: 15px; color: var(--faint); flex: none;
                     transition: transform 0.4s var(--ease), color 0.35s var(--ease); }
    #symBtn:hover .caret { color: var(--muted); }
    #symBtn[aria-expanded="true"] .caret { transform: rotate(180deg); }

    #symMenu {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: var(--z-nav);
      display: none; width: 320px; max-width: calc(100vw - 32px);
      padding: 6px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--hair);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      box-shadow: 0 34px 70px -24px rgba(0, 0, 0, 0.95);
    }
    #symMenu.open { display: block; }
    #symMenu .menucore { background: rgba(10, 12, 17, 0.92); border-radius: 13px;
                         padding: 8px; box-shadow: var(--inset); }
    #symFilter {
      width: 100%; padding: 8px 11px; margin-bottom: 6px; border-radius: 10px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.04);
      color: var(--text); font-family: var(--sans); font-size: 13px; outline: none;
      transition: border-color 0.35s var(--ease);
    }
    #symFilter:focus { border-color: var(--hair-2); }
    #symList { max-height: 46vh; overflow-y: auto; scrollbar-width: thin; }
    #symList .opt {
      display: flex; align-items: baseline; gap: 9px; width: 100%;
      padding: 7px 10px; border: 0; border-radius: 9px; cursor: pointer;
      background: none; color: var(--text); text-align: left; font-family: var(--sans);
      transition: background 0.25s var(--ease);
    }
    #symList .opt .s { font-family: var(--mono); font-size: 12.5px; font-weight: 600;
                       min-width: 62px; flex: none; }
    #symList .opt .n { font-size: 12px; color: var(--faint); overflow: hidden;
                       text-overflow: ellipsis; white-space: nowrap; }
    #symList .opt:hover, #symList .opt.active { background: rgba(255, 255, 255, 0.07); }
    #symList .opt.here .s { color: var(--accent); }
    #symList .none { padding: 12px 10px; font-size: 12px; color: var(--faint); }
    .px { margin-left: auto; text-align: right; align-self: flex-end; }
    .px b { display: block; font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .px span { font-family: var(--mono); font-size: 12.5px; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
            font-size: 12px; color: var(--faint); }
    .chip.has-tip { cursor: help; border-color: var(--hair-2); }
    .chip.has-tip:hover { background: rgba(255, 255, 255, 0.06); }
    .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hair);
            background: rgba(255, 255, 255, 0.03); color: var(--muted); }

    section.card { margin-bottom: 16px; }
    section.card:first-of-type { margin-top: 14px; }
    section.card > .core { padding: 13px 18px 16px; }
    .sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
                text-transform: uppercase; color: var(--muted); }
    .ranges { margin-left: auto; display: flex; gap: 5px; }
    .rng {
      padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 11.5px;
      font-family: var(--sans); border: 1px solid var(--hair); color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .rng:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .rng.on { background: rgba(124, 156, 255, 0.14); border-color: rgba(124, 156, 255, 0.4); color: var(--text); }

    /* the shared chart, at page scale — taller, with a gutter on the right for
       the price axis and room underneath for the dates. The svg fills the
       content box, so the padding is what creates both. */
    #chart.rc-chart { height: 320px; border-radius: 12px; padding: 0 52px 18px 0;
                      transition: height 0.45s var(--ease); }
    /* The svg stretches with preserveAspectRatio="none", so a taller viewBox
       alone would squash every band instead of adding one. Growing the box in
       the same proportion (213 -> 284) keeps the price panel its own size. */
    #chart.rc-chart.has-rsi { height: 427px; }
    #chart .cap { font-size: 11px; }
    #chart .cap.chg { font-size: 15px; }
    /* Pane labels sit against the geometry the chart reports, not a guessed
       percentage — turning RSI on moves the volume band down. */
    #chart .cap.vol, #chart .cap.rsi {
      left: 9px; bottom: auto; font-size: 9.5px;
      text-transform: uppercase; letter-spacing: 0.12em;
      transform: translateY(-125%);
    }
    #chart .cap.rsi { color: var(--accent-2); }
    /* Worded thresholds, sitting just clear of the lines they name — above the
       overbought line, below the oversold one, as a terminal draws them. */
    #chart .rsi-zone {
      position: absolute; left: 50%; pointer-events: none;
      font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
      text-shadow: 0 0 4px rgba(10, 12, 17, 0.95), 0 0 2px rgba(10, 12, 17, 0.95);
    }
    #chart .rsi-zone.hi { color: var(--red); transform: translate(-50%, -118%); }
    #chart .rsi-zone.lo { color: var(--green); transform: translate(-50%, 18%); }

    #chart .rsi-lbl {
      position: absolute; right: 56px; transform: translateY(-50%);
      font-family: var(--mono); font-size: 9px; color: var(--faint);
      pointer-events: none;
      text-shadow: 0 0 4px rgba(10, 12, 17, 0.95), 0 0 2px rgba(10, 12, 17, 0.95);
    }
    .rsi-toggle.on { background: rgba(167, 139, 250, 0.14);
                     border-color: rgba(167, 139, 250, 0.4); color: var(--accent-2); }
    /* legend: a swatch per average, in that average's own colour */
    #chart .cap.ma { left: 9px; top: 30px; font-size: 10px; color: var(--faint);
                     display: flex; gap: 12px; }
    #chart .cap.ma i { display: inline-block; width: 10px; height: 2px;
                       margin-right: 5px; vertical-align: 3px; border-radius: 1px; }
    #chart .cap.ma i.ma50 { background: var(--accent); }
    #chart .cap.ma i.ma200 { background: var(--amber); }

    .ma-toggle:first-of-type { margin-left: 10px; }
    .ma-toggle.ma50.on { background: rgba(124, 156, 255, 0.14);
                         border-color: rgba(124, 156, 255, 0.4); color: var(--accent); }
    .ma-toggle.ma200.on { background: rgba(251, 191, 36, 0.14);
                          border-color: rgba(251, 191, 36, 0.4); color: var(--amber); }

    /* price axis, in the right gutter */
    #chart .yaxis { position: absolute; top: 0; right: 0; bottom: 18px; width: 52px;
                    pointer-events: none; }
    #chart .ytick {
      position: absolute; right: 0; transform: translateY(-50%);
      padding-left: 8px; font-family: var(--mono); font-size: 10px;
      color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    /* The ticks come back low-to-high, so the FIRST is the bottom of the axis
       and the LAST is the top — the reverse of reading order. Getting this the
       wrong way round pushed the top label 6px above the chart, where
       overflow:hidden ate it. */
    #chart .ytick:first-child { transform: translateY(-100%); }
    #chart .ytick:last-child { transform: translateY(0); }

    /* crosshair */
    #chart .xhair {
      position: absolute; top: 0; bottom: 18px; width: 0; pointer-events: none;
      border-left: 1px dashed rgba(255, 255, 255, 0.45);
    }
    #chart .xdot {
      position: absolute; width: 7px; height: 7px; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      background: var(--text); box-shadow: 0 0 0 2px var(--surface);
    }
    #chart .xdate {
      position: absolute; bottom: 0; padding: 2px 7px; border-radius: 6px;
      background: var(--surface-2); border: 1px solid var(--hair);
      font-family: var(--mono); font-size: 9.5px; color: var(--text);
      white-space: nowrap; pointer-events: none;
    }
    /* Sits over the static change caption while hovering, so the top-left says
       one thing at a time. */
    #chart .readout {
      position: absolute; left: 9px; top: 8px; padding: 5px 10px; border-radius: 8px;
      background: rgba(13, 16, 23, 0.92); border: 1px solid var(--hair);
      font-family: var(--mono); font-size: 11px; white-space: nowrap;
      pointer-events: none; display: flex; gap: 6px; align-items: baseline;
    }
    #chart .readout .k { color: var(--faint); font-size: 9.5px;
                         text-transform: uppercase; letter-spacing: 0.1em; }
    #chart .readout .v { color: var(--text); }
    #chart .readout .v.rsi { color: var(--accent-2); }
    /* the captions the readout replaces */
    #chart.hovering .cap.chg, #chart.hovering .cap.ma { opacity: 0; }
    #chart .cap.chg, #chart .cap.ma { transition: opacity 0.2s var(--ease); }

    #chart .axis { position: absolute; left: 0; right: 52px; bottom: 3px; height: 12px;
                   pointer-events: none; }
    #chart .axis .tick {
      position: absolute; transform: translateX(-50%); white-space: nowrap;
      font-family: var(--mono); font-size: 9.5px; color: var(--faint);
    }
    /* the end labels would otherwise hang off the edges */
    #chart .axis .tick:first-child { transform: none; }
    #chart .axis .tick:last-child { transform: translateX(-100%); }
    .ranges { flex-wrap: wrap; }
    .rng { padding: 5px 10px; }

    /* the shared sections, wider than the card's three columns */
    .fields { column-count: 4; column-gap: 26px; }
    .fields .rc-sec { margin-bottom: 14px; }
    .fields .rc-row { line-height: 1.9; font-size: 12.5px; }
    .fields .rc-v { font-size: 12px; }
    @media (max-width: 1000px) { .fields { column-count: 2; } }
    @media (max-width: 620px)  { .fields { column-count: 1; } }

    .later { color: var(--faint); font-size: 12px; line-height: 1.6; }
    .err { color: var(--red); font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6.5 9.5 12 15.2l5.5-5.7"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark"><span class="wordmark">Tickr Lab</span></span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page" id="page">
    <p class="lede" id="status">Loading…</p>
  </main>

  <script src="/rowcard.js"></script>
  <script>
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // /stock/MU  ->  MU
    const SYMBOL = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '').toUpperCase();

    // Trading days, not calendar days — roughly 21 a month. The archive reaches
    // ~20 years for older listings and a symbol simply gets whatever it has, so
    // "Max" is honest rather than a fixed promise.
    const RANGES = [
      { id: '1w',  label: '1W',  days: 5 },
      { id: '2w',  label: '2W',  days: 10 },
      { id: '1m',  label: '1M',  days: 21 },
      { id: '3m',  label: '3M',  days: 63 },
      { id: '6m',  label: '6M',  days: 126 },
      { id: '1y',  label: '1Y',  days: RowCard.HISTORY_DAYS },
      { id: '5y',  label: '5Y',  days: 1260 },
      { id: 'max', label: 'Max', days: 5200 },
    ];
    let range = RANGES.find((r) => r.id === '1y');
    // Moving averages. Adding another is one entry here plus a colour in
    // app.css; nothing else needs to change.
    const MAS = [
      { len: 50,  cls: 'ma50',  label: '50D',  on: true },
      { len: 200, cls: 'ma200', label: '200D', on: true },
    ];
    // Always padded by the longest average rather than by whichever are
    // switched on, so toggling redraws from the cache instead of refetching.
    // The server clamps at its own ceiling, which only bites on Max, where 200
    // missing bars are invisible across twenty years.
    const MA_PAD = Math.max.apply(null, MAS.map((m) => m.len));
    // On by default. RSI(14) rides on the same padding the averages need —
    // Wilder smoothing converges slowly, so a short warm-up would not match the
    // screener's own RSI column.
    const RSI_LEN = 14;
    let showRSI = true;
    let stock = null;

    const curSym = (c) => ({ USD: '$', EUR: '€', GBP: '£', JPY: '¥', KRW: '₩', INR: '₹' }[c] || '');

    // Axis labels want to be scannable, not precise: decimals on a gridline are
    // noise, but a $2 stock still needs them.
    function tickLabel(v) {
      const a = Math.abs(v);
      if (a >= 100) return String(Math.round(v));
      if (a >= 10) return v.toFixed(1);
      return v.toFixed(2);
    }

    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    // Short spans want a day, long ones want a year; a month alone is ambiguous
    // over five years and redundant over five days.
    function axisLabel(iso) {
      const p = String(iso || '').split('-');
      if (p.length !== 3) return iso || '';
      const [y, m, d] = p;
      if (range.days <= 63) return `${+d} ${MON[+m - 1]}`;
      if (range.days <= 253) return `${MON[+m - 1]} ${y.slice(2)}`;
      return `${MON[+m - 1]} ${y}`;
    }

    // chartSVG reports positions as fractions of the viewBox, but the svg does
    // not fill the box — 18px at the bottom is reserved for the date axis. A
    // raw top:% therefore lands everything progressively low, which pushed the
    // oversold label clean out of its pane. Convert once, here.
    const AXIS_H = 18;
    const atY = (f) => `calc(${f.toFixed(4)} * (100% - ${AXIS_H}px))`;

    // The series currently drawn, so the crosshair can read values without
    // recomputing anything.
    let hover = null;

    const fmtVol = (v) => {
      if (v == null || !isFinite(v) || v <= 0) return '—';
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return Math.round(v / 1e3) + 'K';
      return String(Math.round(v));
    };
    const fullDate = (iso) => {
      const p = String(iso || '').split('-');
      return p.length === 3 ? `${MON[+p[1] - 1]} ${+p[2]}, ${p[0]}` : (iso || '');
    };

    function paintChart() {
      const box = document.getElementById('chart');
      if (!box) return;
      box.dataset.range = range.id;
      box.classList.toggle('has-rsi', showRSI);
      RowCard.loadHistory(SYMBOL, range.days + MA_PAD).then((data) => {
        if (box.dataset.range !== range.id) return;      // a later click won
        const all = (data && data.closes) || [];
        box.classList.remove('up', 'down');
        if (all.length < 2) {
          box.innerHTML = '<div class="msg">No price history stored for this symbol yet</div>';
          return;
        }
        // Averaged over everything fetched, then sliced to the window asked
        // for, so each line is drawn from the first visible bar.
        const from = Math.max(0, all.length - range.days);
        const closes = all.slice(from);
        const series = MAS.map((m) => ({
          ma: m, values: RowCard.sma(all, m.len).slice(from),
        })).filter((x) => x.ma.on && x.values.some((v) => v != null));
        const volumes = (data.volumes || []).slice(from);
        const dates = (data.dates || []).slice(from);
        const first = closes[0], last = closes[closes.length - 1];
        const chg = ((last - first) / first) * 100;
        box.classList.add(chg >= 0 ? 'up' : 'down');
        const rsi = showRSI ? RowCard.rsiSeries(all, RSI_LEN).slice(from) : null;
        const rsiNow = rsi ? [...rsi].reverse().find((v) => v != null) ?? null : null;
        const c = RowCard.chartSVG(closes, {
          volumes, ticks: 5, rsi,
          overlays: series.map((x) => ({ values: x.values, cls: x.ma.cls })),
        });

        // Axis labels are HTML rather than SVG text: the chart stretches with
        // preserveAspectRatio="none", which would distort any glyph inside it.
        const ticks = [];
        const want = Math.min(5, Math.max(2, Math.floor(closes.length / 25) + 1));
        for (let k = 0; k < want; k++) {
          const i = Math.round((k / (want - 1)) * (dates.length - 1));
          const pct = dates.length === 1 ? 50 : (i / (dates.length - 1)) * 100;
          ticks.push(`<span class="tick" style="left:${pct.toFixed(2)}%">${esc(axisLabel(dates[i]))}</span>`);
        }

        // The price axis replaces the old floating high/low captions — with real
        // gridlines those two were saying the same thing twice.
        const yLabels = c.ticks.map((tk) =>
          `<span class="ytick" style="top:${atY(tk.top)}">${esc(tickLabel(tk.v))}</span>`
        ).join('');

        box.innerHTML = c.svg +
          `<span class="cap chg">${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%${c.log ? ' · log scale' : ''}</span>` +
          `<span class="cap ma">${series.map((x) =>
            `<i class="${x.ma.cls}"></i>${x.ma.len}-day`).join('')}</span>` +
          (c.panes.rsi
            ? `<span class="cap rsi" style="top:${atY(c.panes.rsi.top)}">` +
              `RSI ${RSI_LEN}${rsiNow == null ? '' : ' &middot; ' + rsiNow.toFixed(0)}</span>` +
              `<span class="rsi-lbl" style="top:${atY(c.panes.rsi.at(70))}">70</span>` +
              `<span class="rsi-lbl" style="top:${atY(c.panes.rsi.at(30))}">30</span>` +
              `<span class="rsi-zone hi" style="top:${atY(c.panes.rsi.at(70))}">Overbought</span>` +
              `<span class="rsi-zone lo" style="top:${atY(c.panes.rsi.at(30))}">Oversold</span>`
            : '') +
          `<span class="cap vol" style="top:${atY(c.panes.volume.top)}">Volume</span>` +
          `<span class="yaxis">${yLabels}</span>` +
          `<span class="axis">${ticks.join('')}</span>` +
          // Overlaid rather than drawn into the svg: preserveAspectRatio="none"
          // would stretch a dot into an ellipse and distort any text.
          '<span class="xhair" hidden></span>' +
          '<span class="xdot" hidden></span>' +
          '<span class="xdate" hidden></span>' +
          '<span class="readout" hidden></span>';

        // Everything the crosshair needs, kept for the pointer handler.
        hover = { dates, closes, volumes, rsi, panes: c.panes };
      });
    }

    (async () => {
      let payload;
      try {
        const res = await fetch(`/api/stock?symbol=${encodeURIComponent(SYMBOL)}`, { cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        payload = await res.json();
        if (!res.ok) throw new Error(payload.error || 'Could not load this stock.');
      } catch (err) {
        document.getElementById('status').innerHTML =
          `<span class="err">${esc(err.message)}</span>`;
        return;
      }

      stock = payload.stock;
      document.title = `${stock.symbol} — Tickr Lab`;

      const price = stock.price != null ? curSym(stock.currency) + stock.price.toFixed(2) : '—';
      const today = stock.todayPct;
      // Rank is the one chip with a calculation behind it, so it is the one that
      // opens the breakdown; the rest are plain labels.
      const chips = []
        .concat(stock.sector ? [{ t: esc(stock.sector) }] : [])
        .concat((stock.portfolios || []).map((x) => ({ t: esc(x) })))
        .concat(payload.rank ? [{ t: `Rank ${payload.rank} of ${payload.rankTotal}`, tip: 'rank' }] : []);

      document.getElementById('page').innerHTML = `
        <div class="head">
          <h1 class="sympick">
            <button id="symBtn" aria-expanded="false" aria-haspopup="listbox"
                    title="Pick another stock">${esc(stock.symbol)}<svg class="caret ic" aria-hidden="true"><use href="#i-chevron" /></svg></button>
            <div id="symMenu"><div class="menucore">
              <input id="symFilter" type="text" placeholder="Filter by symbol or name"
                     autocomplete="off" spellcheck="false" />
              <div id="symList" role="listbox"></div>
            </div></div>
          </h1>
          <span class="co">${esc(stock.name || '')}</span>
          <span class="meta">${chips.map((c) =>
            `<span class="chip${c.tip ? ' has-tip' : ''}"${c.tip ? ` data-tip="${c.tip}"` : ''}>${c.t}</span>`
          ).join('')}</span>
          <span class="px"><b>${esc(price)}</b>
            <span class="${today == null ? 'na' : today >= 0 ? 'pos' : 'neg'}">${
              today == null ? '—' : (today >= 0 ? '+' : '') + today.toFixed(2) + '% today'}</span></span>
        </div>

        <section class="bezel card"><div class="core">
          <div class="sec-h"><h2>Price</h2>
            <span class="ranges">${RANGES.map((r) =>
              `<button class="rng${r.id === range.id ? ' on' : ''}" data-r="${r.id}">${r.label}</button>`).join('')}
              ${MAS.map((m) =>
                `<button class="rng ma-toggle ${m.cls}${m.on ? ' on' : ''}" data-ma="${m.len}">${m.label}</button>`
              ).join('')}
              <button class="rng rsi-toggle${showRSI ? ' on' : ''}" id="rsiBtn">RSI</button></span>
          </div>
          <div class="rc-chart" id="chart"><div class="msg">…</div></div>
        </section></div>

        <section class="bezel card"><div class="core">
          <div class="sec-h"><h2>Everything the screener knows</h2></div>
          <div class="fields">${RowCard.buildSections(stock, {
            colors: RowCard.GROUP_COLORS, labels: RowCard.GROUP_LABELS, rank: payload.rank,
            // There is no table to hover here, so the scores would otherwise be
            // four bare numbers with nothing to explain them.
            tips: true,
          })}</div>
        </section></div>

        <p class="later">Prices as of ${esc(payload.updatedAt ? new Date(payload.updatedAt).toLocaleString() : 'n/a')}.
        More charts will land on this page.</p>
      `;

      // ---- symbol picker ------------------------------------------------------
      // The masthead symbol opens the whole universe, alphabetically, with a
      // filter over symbol and name. A plain navigation rather than swapping the
      // page in place: back and forward keep working, and the per-symbol history
      // fetch dominates the timing anyway.
      const symBtn = document.getElementById('symBtn');
      const symMenu = document.getElementById('symMenu');
      const symFilter = document.getElementById('symFilter');
      const symList = document.getElementById('symList');
      const universe = payload.universe || [];
      let shown = universe;
      let active = -1;

      function drawList() {
        const q = symFilter.value.trim().toLowerCase();
        shown = !q ? universe : universe.filter((x) =>
          x.symbol.toLowerCase().includes(q) || x.name.toLowerCase().includes(q));
        active = shown.length ? 0 : -1;
        // Typing has its own first match; with no filter the eye wants the stock
        // it is already looking at.
        if (!q) {
          const i = shown.findIndex((x) => x.symbol === stock.symbol);
          if (i >= 0) active = i;
        }
        symList.innerHTML = shown.length
          ? shown.map((x, i) =>
              `<button class="opt${x.symbol === stock.symbol ? ' here' : ''}${i === active ? ' active' : ''}" ` +
              `role="option" aria-selected="${i === active}" data-sym="${esc(x.symbol)}">` +
              `<span class="s">${esc(x.symbol)}</span><span class="n">${esc(x.name)}</span></button>`).join('')
          : '<div class="none">Nothing matches that.</div>';
        scrollActiveIntoView('center');
      }

      // 'center' when the list is rebuilt, so opening on a stock two-thirds down
      // the alphabet does not leave it pinned to the bottom edge; 'nearest' while
      // arrowing, which should scroll as little as possible.
      function scrollActiveIntoView(mode) {
        const el = symList.children[active];
        if (el && el.scrollIntoView) el.scrollIntoView({ block: mode || 'nearest' });
      }

      function markActive(next) {
        if (!shown.length) return;
        const els = symList.querySelectorAll('.opt');
        if (els[active]) { els[active].classList.remove('active'); els[active].setAttribute('aria-selected', 'false'); }
        active = (next + shown.length) % shown.length;
        if (els[active]) { els[active].classList.add('active'); els[active].setAttribute('aria-selected', 'true'); }
        scrollActiveIntoView();
      }

      function go(sym) {
        if (sym && sym !== stock.symbol) window.location.href = '/stock/' + encodeURIComponent(sym);
        else closeSym();
      }

      function openSym() {
        symMenu.classList.add('open');
        symBtn.setAttribute('aria-expanded', 'true');
        symFilter.value = '';
        drawList();
        symFilter.focus();
      }
      function closeSym() {
        symMenu.classList.remove('open');
        symBtn.setAttribute('aria-expanded', 'false');
      }
      const symOpen = () => symMenu.classList.contains('open');

      symBtn.addEventListener('click', (e) => { e.stopPropagation(); symOpen() ? closeSym() : openSym(); });
      symFilter.addEventListener('input', drawList);
      symList.addEventListener('click', (e) => {
        const b = e.target.closest('.opt');
        if (b) go(b.dataset.sym);
      });
      symMenu.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', () => { if (symOpen()) closeSym(); });
      window.addEventListener('resize', () => { if (symOpen()) closeSym(); });

      symFilter.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); markActive(active + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); markActive(active - 1); }
        else if (e.key === 'Enter') { e.preventDefault(); if (shown[active]) go(shown[active].symbol); }
        else if (e.key === 'Escape') { e.preventDefault(); closeSym(); symBtn.focus(); }
      });

      // ---- score breakdown on hover -----------------------------------------
      // Markup from rowcard.js, so this page and the screener explain a score
      // identically. Rank has no factors of its own — it is a position in a
      // sorted list — so what its card explains is the number it sorts on.
      const tipEl = document.getElementById('tip');
      const pulled = payload.updatedAt
        ? new Date(payload.updatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        : null;

      function hideTip() { tipEl.style.display = 'none'; }

      document.querySelectorAll('[data-tip]').forEach((el) => {
        el.addEventListener('mouseenter', () => {
          const html = RowCard.scoreTip(stock, el.dataset.tip, {
            pulled, rank: payload.rank, rankTotal: payload.rankTotal,
          });
          if (!html) return;
          tipEl.innerHTML = `<div class="tipcore">${html}</div>`;
          tipEl.style.display = 'block';
          RowCard.placeTip(tipEl, el);
        });
        el.addEventListener('mouseleave', hideTip);
      });
      window.addEventListener('scroll', hideTip, true);
      window.addEventListener('resize', hideTip);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { hideTip(); if (symOpen()) closeSym(); }
      });

      // ---- hover crosshair ---------------------------------------------------
      const chartEl = document.getElementById('chart');

      function hideHover() {
        chartEl.querySelectorAll('.xhair, .xdot, .xdate, .readout')
          .forEach((el) => { el.hidden = true; });
        chartEl.classList.remove('hovering');
      }

      chartEl.addEventListener('pointermove', (e) => {
        if (!hover || !hover.closes || hover.closes.length < 2) return;
        const box = chartEl.getBoundingClientRect();
        // The svg does not fill the box: 52px on the right is the price axis,
        // 18px at the foot is the date axis.
        const plotW = box.width - 52;
        const x = e.clientX - box.left;
        if (x < 0 || x > plotW) return hideHover();

        const n = hover.closes.length;
        const i = Math.max(0, Math.min(n - 1, Math.round((x / plotW) * (n - 1))));
        const px = (i / (n - 1)) * plotW;

        const close = hover.closes[i];
        const prev = i > 0 ? hover.closes[i - 1] : null;
        const chg = prev ? ((close - prev) / prev) * 100 : null;
        const r = hover.rsi ? hover.rsi[i] : null;

        const line = chartEl.querySelector('.xhair');
        const dot = chartEl.querySelector('.xdot');
        const date = chartEl.querySelector('.xdate');
        const out = chartEl.querySelector('.readout');

        line.style.left = px + 'px';
        line.hidden = false;

        dot.style.left = px + 'px';
        dot.style.top = atY(hover.panes.price.at(close));
        dot.hidden = false;

        date.textContent = fullDate(hover.dates[i]);
        date.hidden = false;
        // Keep the pill inside the plot rather than letting it hang off an edge.
        const dw = date.offsetWidth || 90;
        date.style.left = Math.max(0, Math.min(plotW - dw, px - dw / 2)) + 'px';

        out.innerHTML =
          `<span class="k">Price</span> <span class="v">${RowCard.fmtPrice(close)}</span>` +
          (chg == null ? '' : ` <span class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>`) +
          `<span class="k">Vol</span> <span class="v">${fmtVol(hover.volumes[i])}</span>` +
          (r == null ? '' : `<span class="k">RSI</span> <span class="v rsi">${r.toFixed(1)}</span>`);
        out.hidden = false;
        chartEl.classList.add('hovering');
      });

      chartEl.addEventListener('pointerleave', hideHover);

      document.querySelector('.ranges').addEventListener('click', (e) => {
        const b = e.target.closest('.rng');
        if (!b) return;
        if (b.id === 'rsiBtn') {
          showRSI = !showRSI;
          b.classList.toggle('on', showRSI);
          paintChart();
          return;
        }
        if (b.dataset.ma) {
          const m = MAS.find((x) => String(x.len) === b.dataset.ma);
          m.on = !m.on;
          b.classList.toggle('on', m.on);
          paintChart();
          return;
        }
        range = RANGES.find((r) => r.id === b.dataset.r) || RANGES[0];
        document.querySelectorAll('.rng[data-r]').forEach((x) => x.classList.toggle('on', x.dataset.r === range.id));
        paintChart();
      });
      paintChart();
    })();
  </script>
  <div id="tip"></div>
</body>
</html>
