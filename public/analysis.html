<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Analysis — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; padding: 0 0 60px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 6% -6%, rgba(52, 211, 153, 0.12), transparent 62%),
        radial-gradient(50vw 44vw at 96% 4%, rgba(124, 156, 255, 0.12), transparent 64%); }
    @keyframes drift { from { transform: translate3d(-1.5%,-1%,0) scale(1); } to { transform: translate3d(2%,1.5%,0) scale(1.06); } }
    .grain { z-index: 60; }

    .bezel { border-radius: 26px; }
    .bezel > .core { border-radius: 20px; }

    /* floating island */
    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center;
                   padding: 16px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%;
      padding: 6px 7px 6px 16px; border-radius: 999px; background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset);
    }
    .btn {
      transition: background 0.55s var(--ease), border-color 0.55s var(--ease), color 0.55s var(--ease); }

    h1 { margin: 22px 0 0; font-size: clamp(26px, 3vw, 34px); font-weight: 600;
         line-height: 1; letter-spacing: -0.04em; }
    h1 .w2 { background: linear-gradient(100deg, #9aa4b6 10%, #5d6474 92%);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { margin: 10px 0 20px; max-width: 76ch; }

    /* sections */
    .sec { margin-bottom: 14px; }
    .sec > .core { padding: 18px 20px 8px; }
    .sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .sec-h h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
    .pill { font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
            border: 1px solid; background: color-mix(in srgb, currentColor 12%, transparent); }
    .sec-sub { margin: 0 0 12px; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
    th, td { text-align: right; padding: 7px 10px;
             border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
    th { white-space: nowrap; }
    td { font-family: var(--mono); font-size: 12px; letter-spacing: -0.02em; white-space: nowrap; }
    th.l, td.l { text-align: left; }
    td.name { font-family: var(--sans); color: var(--muted); font-size: 12.5px;
              max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    tbody tr { transition: background 0.35s var(--ease); }
    tbody tr:last-child td { border-bottom: 0; }
    .sym { letter-spacing: 0.03em; }
    .sym a { color: inherit; text-decoration: none; }
    .sym a:hover { color: var(--accent); }
    .badge { display: inline-block; padding: 1px 7px;
             font-size: 10px;
             background: color-mix(in srgb, currentColor 12%, transparent); }
    .empty { padding: 26px 4px 30px; font-size: 12.5px; text-align: left; line-height: 1.6; }
    .note { padding: 10px 4px 14px; font-size: 11px; font-family: var(--sans); line-height: 1.6; }

    #rowcard { z-index: 55; pointer-events: none; }
    td.name { cursor: help; }

    @media (max-width: 760px) {
      .page { padding: 0 14px; }
      td.name, th.name-h { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark">
        <span class="wordmark">Tickr Lab</span>
      </span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page">
    <h1><span class="w1">Analysis</span></h1>
    <p class="lede" id="lede">Loading…</p>
    <div id="out"></div>
  </main>
  <div id="rowcard"></div>

  <script src="/screens.js"></script>
  <script src="/rowcard.js"></script>
  <script>
    // Must match GROUP_COLORS / GROUP_LABELS in index.html — the card colours
    // its sections with these.
    const GROUP_COLORS = {
      info: '#7c9cff', rank: '#a3e635', short: '#34d399', long: '#a78bfa', fwd: '#fb923c',
      rel:  '#22d3ee', trend: '#fbbf24', vol:  '#f472b6',
      size: '#94a3b8', fund: '#fb7185',
    };
    const GROUP_LABELS = {
      info: 'Info', rank: 'Rank', short: 'Short-term %', long: 'Long-term %', fwd: 'Forward',
      rel: 'Relative', trend: 'Trend', vol: 'Volume',
      size: 'Size', fund: 'Fundamentals',
    };

    // ---- formatting ---------------------------------------------------------
    const CUR = { USD:'$', EUR:'€', GBP:'£', JPY:'¥', KRW:'₩', HKD:'HK$', CNY:'¥', INR:'₹',
                  CAD:'C$', AUD:'A$', CHF:'CHF ', TWD:'NT$', BRL:'R$', SGD:'S$' };
    const cur = (c) => (c ? (CUR[c] || c + ' ') : '$');
    const num = (n) => n != null && isFinite(n);
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // Signed percentage, coloured the way the screener colours it.
    const pct = (n, d = 1) => num(n)
      ? `<td class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+' : ''}${n.toFixed(d)}%</td>`
      : '<td class="na">—</td>';
    // A level rather than a change: no leading +, red only when negative.
    const lvl = (n, d = 1, suffix = '%') => num(n)
      ? `<td class="${n < 0 ? 'neg' : ''}">${n.toFixed(d)}${suffix}</td>`
      : '<td class="na">—</td>';
    const plain = (n, d = 1) => num(n) ? `<td>${n.toFixed(d)}</td>` : '<td class="na">—</td>';
    // Score points, not a percentage: signed and coloured, but no % sign, since
    // a move from 48.9 to 65 is 16 points and emphatically not 16%.
    const pts = (n, d = 1) => num(n)
      ? `<td class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+' : ''}${n.toFixed(d)}</td>`
      : '<td class="na">—</td>';
    const money = (n, c) => {
      if (!num(n)) return '<td class="na">—</td>';
      const sign = n < 0 ? '-' : '', a = Math.abs(n), s = cur(c);
      const t = a >= 1e12 ? (a/1e12).toFixed(1)+'T' : a >= 1e9 ? (a/1e9).toFixed(1)+'B'
              : a >= 1e6 ? (a/1e6).toFixed(1)+'M' : a.toLocaleString();
      return `<td>${sign}${s}${t}</td>`;
    };
    const score = (n) => {
      if (!num(n)) return '<td class="na">—</td>';
      const c = n >= 8 ? 'pos' : n <= 4 ? 'neg' : 'warn';
      return `<td class="${c}" style="font-weight:600">${n}</td>`;
    };
    // Where a stock sits in its own 52-week range, 0 = on the low. Older
    // snapshots predate the field, so fall back to distance from the high and
    // say so rather than showing a blank column.
    const rangeCell = (x) => num(x.range52Pos)
      ? `<td class="${x.range52Pos <= 25 ? 'neg' : x.range52Pos >= 75 ? 'pos' : ''}">${x.range52Pos.toFixed(0)}%</td>`
      : '<td class="na">—</td>';

    const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const shortDate = (iso) => { const p = String(iso).split('-'); return p.length === 3 ? `${M[+p[1]-1]} ${+p[2]}` : iso; };
    const gf = (s) => `https://www.google.com/finance/quote/${encodeURIComponent(s.symbol)}`;
    const symCell = (s) => `<td class="l sym"><a href="${gf(s)}" target="_blank" rel="noopener">${esc(s.symbol)}</a></td>`;
    // Same destination and behaviour as the screener's name cell: a new tab, so
    // following one from a screen never loses the list you were reading.
    const nameCell = (s) => `<td class="l name"><a class="namelink" ` +
      `href="/stock/${encodeURIComponent(s.symbol)}" target="_blank" rel="noopener" ` +
      `title="Open ${esc(s.symbol)} in full ↗">${esc(s.name || '')}</a></td>`;

    function section(id, title, count, tone, subtitle, headers, rows, emptyMsg, note) {
      const head = headers.map((h) => `<th class="${h.l ? 'l' : ''}${h.name ? ' name-h' : ''}">${h.t}</th>`).join('');
      const body = rows.length
        ? `<table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table>`
        : `<div class="empty">${emptyMsg}</div>`;
      return `<section class="bezel sec"><div class="core">
        <div class="sec-h"><h2>${title}</h2>
          <span class="pill" style="color:${tone}">${count}</span></div>
        <p class="sec-sub">${subtitle}</p>
        ${body}
        ${note ? `<div class="note">${note}</div>` : ''}
      </div></section>`;
    }

    // ---- build --------------------------------------------------------------
    (async () => {
      let data;
      try {
        const res = await fetch('/api/stocks', { cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        data = await res.json();
      } catch {
        document.getElementById('lede').textContent = 'Could not load the screener data.';
        return;
      }
      const all = (data.stocks || []).filter((s) => !s.error);
      const asOf = data.updatedAt ? new Date(data.updatedAt).toLocaleString() : 'n/a';
      document.getElementById('lede').innerHTML =
        `Nine screens the sorted table can't give you — which way momentum is moving, where a base is ` +
        `turning, what has just started moving, what is drifting after a beat, what looks cheap on its ` +
        `own numbers, and what is stretched. ` +
        `Built from the raw data, not the composite scores. ${all.length} tickers, as of ${esc(asOf)}.`;

      const out = [];

      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = (d) => Math.round((new Date(d) - today) / 86400000);

      // Which rows each screen contains — defined in screens.js so the nightly
      // email reports exactly what this page shows. The columns and the prose
      // below are the page's own.
      const S = Screens.run(all);

      // --- Momentum improving / fading -------------------------------------
      // These lead because they are the only screens describing a change in
      // standing rather than a standing. The ranked table already tells you who
      // is strong; only this says who is getting stronger.
      const MOVE = Screens.MOM_MIN_MOVE;
      const climbing = S.climbing;
      const fading = S.fading;
      // The field arrived with the direction arrow; a snapshot written before
      // that has none, and both lists sit empty until the next refresh.
      const noMove = all.length > 0 && all.every((x) => !num(x.momentumChange));
      const moveNote = noMove
        ? 'Momentum change is worked out on refresh — until the next one these two lists stay empty.'
        : '';
      const moveCols = [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Mom.'},{t:'Change'},
                        {t:'Was'},{t:'Now'},{t:'2W'},{t:'1M'},{t:'3M'},{t:'RSI'}];
      const moveRow = (x) => `<tr>${symCell(x)}${nameCell(x)}` +
        score(x.momentumRating) + pts(x.momentumChange) +
        plain(x.momentumScorePrev) + plain(x.momentumScore) +
        pct(x.twoWeekPct) + pct(x.oneMonthPct) + pct(x.threeMonthPct) + plain(x.rsi, 0) + '</tr>';

      out.push(section('climbing', 'Momentum improving', climbing.length, 'var(--green)',
        `Momentum score up ${MOVE} points or more over the last fortnight. Every other screen here ` +
        'describes where a stock stands; this one describes where it is going. A name climbing from ' +
        'the middle of the pack is the interesting case — by the time it reaches the top of the ' +
        'ranking the move has already happened.',
        moveCols, climbing.map(moveRow),
        `Nothing has gained ${MOVE} points of momentum in the last fortnight.`, moveNote));

      out.push(section('fading', 'Momentum fading', fading.length, 'var(--red)',
        `Momentum score down ${MOVE} points or more over the last fortnight. A high rating that is ` +
        'falling is worth more attention than a low one sitting still: the score is relative, so ' +
        'losing ground here means the rest of the list is pulling away.',
        moveCols, fading.map(moveRow),
        `Nothing has lost ${MOVE} points of momentum in the last fortnight.`, moveNote));

      // --- 1. Bouncing off the lows ----------------------------------------
      const bounce = S.bounce;
      const noRange = all.some((x) => !num(x.range52Pos));
      out.push(section('bounce', 'Bouncing off the lows', bounce.length, 'var(--green)',
        'Low in the 52-week range but rising over both the last month and the last fortnight — a base that has ' +
        'started to turn, rather than one still falling. Range position is the anchor: 0% is the 52-week low, ' +
        '100% the high, so it tells you how much room the recovery has before it meets old resistance.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Range pos'},{t:'From 52w low'},{t:'From 52w hi'},
         {t:'2W'},{t:'1M'},{t:'3M'},{t:'vs 50D MA'},{t:'RSI'}],
        bounce.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          rangeCell(x) + lvl(x.pctFromLow) + pct(x.pctFromHigh) +
          pct(x.twoWeekPct) + pct(x.oneMonthPct) + pct(x.threeMonthPct) +
          pct(x.vs50ma) + plain(x.rsi, 0) + '</tr>'),
        'Nothing low in its range is turning up yet.',
        noRange ? 'Range position is computed on refresh — until then this list falls back to ' +
                  '“more than 25% below the 52-week high”, which is a coarser filter.' : ''));

      // --- 2. Just started moving ------------------------------------------
      const waking = S.waking;
      out.push(section('waking', 'Just started moving', waking.length, 'var(--accent-2)',
        'Up more than 5% in a fortnight while still negative over three months. The recent move has not yet ' +
        'shown up in the longer horizons, which is the whole point — by the time it does, the ranking will ' +
        'already reflect it. Treat a large gap between the two columns as the thing to explain.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'1W'},{t:'2W'},{t:'1M'},{t:'3M'},
         {t:'Range pos'},{t:'vs 50D MA'},{t:'RSI'}],
        waking.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          pct(x.oneWeekPct) + pct(x.twoWeekPct) + pct(x.oneMonthPct) + pct(x.threeMonthPct) +
          rangeCell(x) + pct(x.vs50ma) + plain(x.rsi, 0) + '</tr>'),
        'Nothing has broken ranks over the last two weeks.'));

      // --- 3. Drifting after a beat ----------------------------------------
      const SURPRISE_CAP = Screens.SURPRISE_CAP;
      const drift = S.drift;
      out.push(section('drift', 'Drifting after a beat', drift.length, 'var(--amber)',
        'Beat consensus by more than 10% and reported within the last three weeks. Prices tend to keep ' +
        'drifting in the direction of a surprise for weeks after the print rather than adjusting at once, ' +
        'so the columns to watch are the ones since: if 2W and 1M are positive, the drift is underway.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Surprise'},{t:'Reported'},{t:'Ago'},
         {t:'2W'},{t:'1M'},{t:'RSI'},{t:'From 52w hi'}],
        drift.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          pct(x.lastSurprise) + `<td>${shortDate(x.lastEarningsDate)}</td>` +
          `<td>${-days(x.lastEarningsDate)}d</td>` +
          pct(x.twoWeekPct) + pct(x.oneMonthPct) + plain(x.rsi, 0) + pct(x.pctFromHigh) + '</tr>'),
        'No recent report beat by more than 10%.',
        `Surprises above ${SURPRISE_CAP}% are excluded — on this feed they come from a near-zero estimate ` +
        'rather than a real result.'));

      // --- 4. Earnings in the next 14 days ---------------------------------
      const soon = S.earnings;
      out.push(section('earnings', 'Reporting in the next 14 days', soon.length, 'var(--amber)',
        'A catalyst and a risk in the same event. Confirmed dates come from the feed; ~ marks an estimate ' +
        '(about 91 days after the last report). Last surprise is how far the previous quarter beat or missed consensus.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Reports'},{t:'In'},{t:'Last surprise'},{t:'Overall'},{t:'1M'},{t:'3M'}],
        soon.map((s) => `<tr>${symCell(s)}${nameCell(s)}` +
          `<td class="${s.nextEarningsEstimated ? 'na' : ''}">${s.nextEarningsEstimated ? '~' : ''}${shortDate(s.nextEarningsDate)}</td>` +
          `<td class="${days(s.nextEarningsDate) <= 7 ? 'warn' : ''}">${days(s.nextEarningsDate)}d</td>` +
          pct(s.lastSurprise) + score(s.overallRating) + pct(s.oneMonthPct) + pct(s.threeMonthPct) + '</tr>'),
        'Nothing in your universe reports in the next 14 days.'));

      // --- 5. Cheap, growing and profitable --------------------------------
      // Deliberately not PEG: on this feed PEG < 1.2 alone returns a third of
      // the universe, and it is the field that rated a loss-maker 8/10.
      // Server-derived now, so the page, the export and the chatbot all read one
      // number. The fallback keeps snapshots written before the field existed working.
      const fcfYield = Screens.fcfYield;
      const value = S.value;
      out.push(section('value', 'Cheap, growing and profitable', value.length, 'var(--green)',
        'Forward P/E under 20 while revenue grows more than 15% and the net margin clears 15% — three ' +
        'conditions that rarely hold together. Free-cash-flow yield is the cross-check: it comes from cash ' +
        'actually generated, so it is the hardest of these numbers to flatter.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Fwd P/E'},{t:'Rev growth'},{t:'Net margin'},
         {t:'FCF yield'},{t:'3M'},{t:'From 52w hi'}],
        value.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          plain(x.forwardPe) + pct(x.revenueGrowthYoY) + pct(x.profitMargin) +
          lvl(fcfYield(x)) + pct(x.threeMonthPct) + pct(x.pctFromHigh) + '</tr>'),
        'Nothing currently clears all three bars at once.'));

      // --- 6. Business improving, price isn't ------------------------------
      const disconnect = S.disconnect;
      out.push(section('disconnect', "Business improving, price isn't", disconnect.length, 'var(--accent)',
        'Revenue growing more than 25% while the price has fallen more than 10% over three months. Either the ' +
        'market is discounting something the reported numbers do not show yet, or you are early. The 200-day ' +
        'column is the tell: still above it is a pullback, below it is a broken trend.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'Rev growth'},{t:'Net margin'},{t:'3M'},{t:'1M'},
         {t:'From 52w hi'},{t:'vs 200D MA'},{t:'Fwd P/E'}],
        disconnect.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          pct(x.revenueGrowthYoY) + pct(x.profitMargin) + pct(x.threeMonthPct) + pct(x.oneMonthPct) +
          pct(x.pctFromHigh) + pct(x.vs200ma) + plain(x.forwardPe) + '</tr>'),
        'No name is growing that fast while the price falls.'));

      // --- 7. Overextended -------------------------------------------------
      const hot = S.hot;
      out.push(section('hot', 'Overextended', hot.length, 'var(--red)',
        'RSI above 75 and more than 12% above the 50-day average. This is a risk list, not a sell list — ' +
        'strong trends stay overbought for a long time. It is where a stop is worth reviewing, and where ' +
        'adding is most expensive.',
        [{t:'Symbol',l:1},{t:'Name',l:1,name:1},{t:'RSI'},{t:'vs 50D MA'},{t:'2W'},{t:'1M'},
         {t:'Range pos'},{t:'From 52w hi'}],
        hot.map((x) => `<tr>${symCell(x)}${nameCell(x)}` +
          plain(x.rsi, 0) + pct(x.vs50ma) + pct(x.twoWeekPct) + pct(x.oneMonthPct) +
          rangeCell(x) + pct(x.pctFromHigh) + '</tr>'),
        'Nothing is stretched that far above its 50-day average.'));

      document.getElementById('out').innerHTML = out.join('');

      // Same hover card as the screener. Rank is computed across the whole
      // universe here, since these lists are filtered views rather than a
      // ranking of their own.
      const ranked = all.filter((s) => s.overallScore != null)
        .slice().sort((a, b) => b.overallScore - a.overallScore);
      RowCard.attach({
        root: document.getElementById('out'),
        selector: 'td.name',
        colors: GROUP_COLORS,
        labels: GROUP_LABELS,
        getStock: (td) => {
          const sym = td.closest('tr')?.querySelector('td.sym')?.textContent.trim();
          return sym ? all.find((x) => x.symbol === sym) : null;
        },
        rankOf: (s) => {
          const i = ranked.findIndex((x) => x.symbol === s.symbol);
          return i < 0 ? null : `${i + 1}/${ranked.length}`;
        },
      });
    })();
  </script>
</body>
</html>
