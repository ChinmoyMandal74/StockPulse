<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset password — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; display: flex; align-items: center; justify-content: center;
           padding: 24px; overflow-x: clip; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 12% 4%, rgba(52, 211, 153, 0.13), transparent 62%),
        radial-gradient(50vw 44vw at 92% 96%, rgba(124, 156, 255, 0.13), transparent 64%); }

    .bezel { position: relative; z-index: 1; width: 100%; max-width: 420px;
             box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.95); }
    .bezel > .core { padding: 30px 28px 26px;
      background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.035), transparent 70%), var(--surface); }

    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; }
    .lede { margin: 8px 0 20px; font-size: 12.5px; }

    label { display: block; font-size: 10.5px; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--faint); margin: 0 0 6px; }
    input {
      width: 100%; padding: 11px 13px; border-radius: 12px; margin-bottom: 14px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03);
      color: var(--text); font-size: 13.5px; outline: none;
      transition: border-color 0.4s var(--ease), background 0.4s var(--ease);
    }
    input:focus { border-color: var(--hair-2); background: rgba(255, 255, 255, 0.055); }
    .btn { width: 100%; justify-content: center; margin-top: 4px; }

    .msg { margin-top: 14px; font-size: 12.5px; line-height: 1.6; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    .foot { margin-top: 18px; font-size: 12px; color: var(--faint); text-align: center; }
    .foot a { color: var(--muted); }
    .hint { font-size: 11px; color: var(--faint); margin: -8px 0 14px; }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <section class="bezel"><div class="core">
    <h1>Choose a new password</h1>
    <p class="lede" id="lede">Set a new password for your Tickr Lab account.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input type="password" id="pw" autocomplete="new-password" minlength="8" required />
      <p class="hint">At least 8 characters.</p>

      <label for="pw2">Confirm</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="8" required />

      <button class="btn btn-primary" type="submit" id="go">Set password</button>
    </form>

    <div class="msg" id="msg"></div>
    <p class="foot"><a href="/login">Back to sign in</a></p>
  </div></section>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token') || '';

    function say(text, cls) {
      const m = $('msg');
      m.className = 'msg' + (cls ? ' ' + cls : '');
      m.textContent = text;
    }

    // Nothing to do without a token; say so rather than letting someone fill in
    // a form that cannot succeed.
    if (!token) {
      $('form').style.display = 'none';
      $('lede').textContent = 'This page needs the link from your reset email.';
      say('No reset token in the link. Request a new one from the sign-in page.', 'err');
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('pw').value;
      if (pw !== $('pw2').value) return say('Those two passwords do not match.', 'err');
      $('go').disabled = true;
      say('');
      try {
        const res = await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not set the password.');
        $('form').style.display = 'none';
        say('Password changed. You have been signed out everywhere else — redirecting to sign in…', 'ok');
        setTimeout(() => { window.location.href = '/login'; }, 2200);
      } catch (err) {
        say(err.message, 'err');
        $('go').disabled = false;
      }
    });

    $('pw').focus();
  </script>
</body>
</html>
