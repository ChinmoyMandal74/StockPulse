<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Visitor Log — Ticker Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; padding: 0 0 80px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 4% -8%, rgba(124, 156, 255, 0.13), transparent 62%),
        radial-gradient(50vw 42vw at 98% 4%, rgba(167, 139, 250, 0.11), transparent 64%); }

    .bezel { border-radius: 26px; }
    .bezel > .core { border-radius: 20px; }

    /* floating glass island */
    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex;
                   justify-content: center; padding: 18px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px;
      width: max-content; max-width: 100%; padding: 6px 7px 6px 16px; border-radius: 999px;
      background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair);
      box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset);
    }
    .mark .glyph {
      width: 26px; height: 26px; border-radius: 9px; display: inline-flex;
      align-items: center; justify-content: center; color: var(--green);
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.20), rgba(52, 211, 153, 0.04));
      border: 1px solid rgba(52, 211, 153, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .btn {
      transition: background 0.55s var(--ease), border-color 0.55s var(--ease),
                  color 0.55s var(--ease), transform 0.4s var(--ease); }
    .btn:disabled { opacity: 0.4; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 8px;
      border-radius: 999px; border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.035);
      font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.2em;
      color: var(--muted); box-shadow: var(--inset);
    }
    .eyebrow .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    h1 { margin: 20px 0 0; font-size: clamp(38px, 5vw, 58px); font-weight: 600;
         line-height: 0.94; letter-spacing: -0.045em; }
    h1 .w2 { background: linear-gradient(100deg, #9aa4b6 10%, #5d6474 92%);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { margin: 16px 0 0; max-width: 52ch; font-size: 13px; line-height: 1.65; }
    .masthead { margin: 34px 0 22px; }

    /* stat bento */
    .stats { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-bottom: 16px; }
    .stat { grid-column: span 4; }
    .stat > .core { padding: 22px 24px; }
    .k { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.2em; color: var(--faint); }
    .val { margin-top: 12px; font-family: var(--mono); font-size: 34px; font-weight: 500;
           letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .stat:nth-child(1) .val { color: var(--accent); }
    .stat:nth-child(2) .val { color: var(--green); }
    .stat:nth-child(3) .val { color: var(--accent-2); }
    @media (max-width: 768px) { .who { max-width: 30vw; } }

    .table-wrap { max-height: calc(100dvh - 420px); min-height: 260px;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent; scrollbar-width: thin; }
    .table-wrap::-webkit-scrollbar { width: 11px; height: 11px; }
    .table-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border: 3px solid var(--surface); background-clip: padding-box; }
    table { font-size: 12.5px; }
    thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); }
    th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
    th { border-bottom: 1px solid var(--hair); }
    tbody tr { animation: rowIn 0.5s var(--ease-soft) both;
               animation-delay: calc(min(var(--i, 0), 24) * 14ms); }
    .ts { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; letter-spacing: -0.02em; }
    .ip { font-family: var(--mono); font-size: 11.5px; color: var(--accent); letter-spacing: -0.01em; }
    .who { font-family: var(--mono); font-size: 11.5px; color: var(--green); white-space: nowrap;
           max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .who.dash { color: var(--faint); }
    .ua { color: var(--muted); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ref { color: var(--muted); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash { color: var(--faint); }
    .error { display: flex; align-items: center; gap: 10px; color: var(--red); padding: 28px; font-size: 13px; }
    .error a { color: var(--accent); text-decoration: none; }
    .error a:hover { text-decoration: underline; }
    .note { margin: 14px 4px 0; }

    @media (max-width: 900px) { .stat { grid-column: span 12; } }
    @media (max-width: 768px) {
      .page { padding: 0 16px; }
      .hide-sm { display: none !important; }
      h1 { font-size: clamp(32px, 11vw, 44px); }
      .stats { grid-template-columns: 1fr; }
      .stat { grid-column: span 1; }
      .table-wrap { max-height: calc(100dvh - 340px); }
      .ua, .ref { max-width: 46vw; }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.6 6.6h14.8"/><path d="M9.6 6.6V4.9a1.3 1.3 0 0 1 1.3-1.3h2.2a1.3 1.3 0 0 1 1.3 1.3v1.7"/><path d="M6.9 6.6 7.8 19a1.5 1.5 0 0 0 1.5 1.4h5.4A1.5 1.5 0 0 0 16.2 19l.9-12.4"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.6 21 19.4H3L12 4.6Z"/><path d="M12 10.4v3.8M12 17.1v.1"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark hide-sm">Ticker Lab</span>
      </span>
      <span class="divider"></span>
      <a class="btn" href="/">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener
      </a>
      <button class="btn danger" id="clearBtn" style="display:none" title="Delete every entry in the visitor log">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-trash" /></svg>Clear log
      </button>
    </nav>
  </div>

  <main class="page">
    <header class="masthead reveal">
      <span class="eyebrow"><span class="pip"></span>Admin</span>
      <h1><span class="w1">Visitor</span> <span class="w2">Log</span></h1>
      <p class="lede">Every request the screener has served, newest first — timestamp, source address, client and referrer.</p>
    </header>

    <div id="main">
      <div class="bezel"><div class="core"><div class="empty">Loading…</div></div></div>
    </div>
  </main>

  <script>
    function revealAll() {
      const els = document.querySelectorAll('.reveal:not(.in)');
      if (!('IntersectionObserver' in window)) { els.forEach((el) => el.classList.add('in')); return; }
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          e.target.classList.add('in');
          obs.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0 });
      els.forEach((el) => obs.observe(el));
    }

    let lastTotal = 0;

    async function load() {
      const main = document.getElementById('main');
      try {
        const me = await fetch('/api/me').then(r => r.json());
        if (!me.admin) {
          main.innerHTML = '<div class="bezel reveal"><div class="core"><div class="error">' +
            '<svg class="ic" aria-hidden="true"><use href="#i-warn" /></svg>' +
            '<span>Admin access required. <a href="/">Go back</a> and log in first.</span>' +
            '</div></div></div>';
          revealAll();
          return;
        }
        const data = await fetch('/api/visitors').then(r => r.json());
        const { total, todayCount, uniqueIps, uniqueUsers, entries } = data;
        lastTotal = total;
        document.getElementById('clearBtn').style.display = total > 0 ? '' : 'none';

        let html = `
          <div class="stats">
            <div class="stat bezel reveal"><div class="core"><div class="k">Total visits</div><div class="val">${total.toLocaleString()}</div></div></div>
            <div class="stat bezel reveal" style="--d:90ms"><div class="core"><div class="k">Today</div><div class="val">${todayCount.toLocaleString()}</div></div></div>
            <div class="stat bezel reveal" style="--d:150ms"><div class="core"><div class="k">Signed-in users</div><div class="val">${(uniqueUsers ?? 0).toLocaleString()}</div></div></div>
          </div>`;

        if (entries.length === 0) {
          html += '<div class="bezel reveal"><div class="core"><div class="empty">No visits logged yet.</div></div></div>';
        } else {
          html += `<div class="bezel reveal" style="--d:210ms"><div class="core"><div class="table-wrap"><table>
            <thead><tr><th>Time</th><th>User</th><th>IP</th><th>User agent</th><th>Referrer</th></tr></thead>
            <tbody>`;
          entries.forEach((e, i) => {
            const ts = new Date(e.ts).toLocaleString();
            const ua = e.ua ? `<td class="ua" title="${esc(e.ua)}">${esc(e.ua)}</td>` : '<td class="ua dash">—</td>';
            const ref = e.ref ? `<td class="ref" title="${esc(e.ref)}">${esc(e.ref)}</td>` : '<td class="ref dash">—</td>';
            // Null means the visit predates accounts, or was an ADMIN_PASSWORD
            // login, which has no account behind it.
            const who = e.user
              ? `<td class="who">${esc(e.user)}</td>`
              : '<td class="who dash" title="Before accounts existed, or an ADMIN_PASSWORD login">—</td>';
            html += `<tr style="--i:${i}"><td class="ts">${esc(ts)}</td>${who}<td class="ip">${esc(e.ip || '—')}</td>${ua}${ref}</tr>`;
          });
          html += '</tbody></table></div></div></div>';
          if (total > 500) html += `<p class="note">Showing the most recent 500 of ${total.toLocaleString()} visits.</p>`;
        }
        main.innerHTML = html;
        revealAll();
      } catch (err) {
        main.innerHTML = '<div class="bezel reveal"><div class="core"><div class="error">' +
          '<svg class="ic" aria-hidden="true"><use href="#i-warn" /></svg>' +
          `<span>Failed to load: ${esc(err.message)}</span></div></div></div>`;
        revealAll();
      }
    }

    document.getElementById('clearBtn').addEventListener('click', async () => {
      // Irreversible, so name the number being destroyed rather than asking a
      // vague "are you sure".
      if (!window.confirm(
        `Delete all ${lastTotal.toLocaleString()} visitor log entries?\n\nThis cannot be undone.`)) return;
      const btn = document.getElementById('clearBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/visitors', { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not clear the log.');
        await load();          // repaint from the now-empty table
      } catch (err) {
        window.alert(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    revealAll();
    load();
  </script>
</body>
</html>
