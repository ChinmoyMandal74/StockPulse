<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>%TITLE% — Tickr Lab</title>
  <meta name="description" content="%DESC%" />
  <meta property="og:title" content="%TITLE%" />
  <meta property="og:description" content="%DESC%" />
  <meta property="og:type" content="article" />
  <link rel="canonical" href="%CANONICAL%" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 28px 90px; }
    /* A two-column post needs a wider page, and the class that says so sits on
       a DESCENDANT — so the container asks about its own contents rather than
       the server stamping a second class further up. If :has() is ever missing
       the page stays 760px and the text column merely gets narrow: cramped, not
       broken. */
    /* THE SPLIT IS A RATIO, NOT A WIDTH (2026-09-25, owner: "make the
       proportion 50/50"). A fixed 320px rail meant the halves were only ever
       equal at one page width and drifted at every other; expressed as a
       percentage they stay equal at 1500px, at 1280 and at the collapse.
       That is also why the labels name a SHARE rather than a number of pixels:
       CSS cannot read a length back out as text, so a printed "rail 320" would
       be a string that goes stale the moment the window moves.
       `layout-test.js` measures the two drawn columns and asserts they are
       equal, which is a stronger check than matching a string. */
    :root {
      --railgap: 36px;    --gap-label: "gap 36";
      --rail-label: "rail 50%";
      --text-label: "text 50%";
      --one-label: "text 704";    /* 760 - 28 - 28 — a one-column post */
    }
    /* The wider page for a two-column post is set WITH the two-column layout,
       inside its min-width, and deliberately not here: left unconditional it
       would widen a collapsed post to 1040px between 760 and 1040 while a
       one-column post stayed at 760 — the two reading the same content at two
       different measures, which is exactly what the collapse exists to avoid. */
    .aura { background:
      radial-gradient(48vw 42vw at 6% -10%, rgba(124, 156, 255, 0.12), transparent 62%),
      radial-gradient(46vw 40vw at 98% 2%, rgba(52, 211, 153, 0.10), transparent 64%); }
    .nav-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .nav { pointer-events: auto; display: flex; align-items: center; gap: 8px; width: min(760px, 100%);
      padding: 8px 10px 8px 18px; border-radius: 999px; background: rgba(9, 11, 15, 0.74);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }
    .nav .mark { display: inline-flex; align-items: center; gap: 9px; margin-right: auto; text-decoration: none; color: var(--text); }
    .nav .glyph { width: 26px; height: 26px; border-radius: 9px; display: inline-flex; align-items: center;
      justify-content: center; color: var(--green);
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.20), rgba(52, 211, 153, 0.04));
      border: 1px solid rgba(52, 211, 153, 0.24); }

    article { padding-top: 56px; }
    .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--faint); text-transform: uppercase; }
    h1 { margin: 14px 0 0; font-size: clamp(32px, 5.2vw, 52px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.02; }
    .summary { margin: 18px 0 0; font-size: 16.5px; line-height: 1.65; color: var(--muted); }
    .rule { margin: 34px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    .body { font-size: 15.5px; line-height: 1.78; color: #cfd6e2; }
    .body h2 { margin: 40px 0 0; font-size: 25px; font-weight: 600; letter-spacing: -0.025em; color: var(--text); line-height: 1.2; }
    .body h3 { margin: 30px 0 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
    .body h4 { margin: 24px 0 0; font-size: 16px; font-weight: 600; color: var(--text); }
    .body p { margin: 16px 0 0; }
    .body ul, .body ol { margin: 16px 0 0; padding-left: 22px; }
    .body li { margin: 7px 0; }
    .body a { color: var(--accent); }

    /* ---- pictures ---------------------------------------------------------
       DEFAULT IS THE COLUMN, not the file's own size. max-width:100% with
       height:auto is the whole of the bug fix; the named widths below are the
       control, set in markdown's title slot: ![alt](src "small").            */
    .body .pimg { margin: 26px 0 0; }
    .body .pimg img {
      display: block; width: 100%; height: auto; max-width: 100%;
      border-radius: 12px; border: 1px solid var(--hair); background: var(--surface-2);
    }
    .body .pimg figcaption {
      margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--faint); text-align: center;
    }
    .body .pimg.small  { max-width: 300px; margin-left: auto; margin-right: auto; }
    .body .pimg.medium { max-width: 460px; margin-left: auto; margin-right: auto; }
    /* WIDE breaks out of the reading column, which is the point: a screenshot
       of an eighty-column table is unreadable at 704px. It can never be wider
       than the window has room for, so it does not reintroduce a sideways
       scroll on a phone -- the one thing the page must not do. */
    .body .pimg.wide {
      width: min(1040px, calc(100vw - 40px));
      max-width: none;
      margin-left: 50%; transform: translateX(-50%);
    }

    /* ---- two columns: text left, pictures in a rail on the right ----------
       FLOAT, not grid. A grid gives each child its own row, so a picture would
       sit in the right column on a row of its own and tear a hole in the text
       beside it. A float keeps the text flowing.
       `clear: right` is what stacks consecutive pictures down the rail instead
       of letting them sit side by side, and the RESERVED PADDING is what stops
       the text reclaiming the full width once it has passed the last one —
       without it the layout stops being two columns half way down the page. */
    /* CONTAIN THE FLOATS. A float does not grow its parent, so a post with more
       pictures than text ran the tail of its rail straight over the footer —
       invisible until the guides drew the wrapper's own edge. `flow-root` is
       the one-word version of a clearfix and, unlike `overflow: hidden`, it
       does not clip the rail, which sits in the padding by negative margin.
       The ::after clearfix is not available here: the guides own it. */
    /* THE ARITHMETIC, because it is not obvious and the two percentages resolve
       against DIFFERENT boxes. Let W be the page's content width.
         padding-right: 50% + gap/2   →  text column = W/2 - gap/2
         the float's width: 100%      →  100% of the TEXT column, so the rail
                                         is the same W/2 - gap/2. Equal halves.
         margin-right: -100% - gap    →  a percentage margin resolves against
                                         the same box, so this pushes the float
                                         clear of the text and leaves exactly
                                         `gap` between them.
       Reaching for `width: 50%` on the float instead gives a quarter of the
       page, because its containing block is already the halved text column.

       ALL OF IT LIVES INSIDE A min-width, and that is a correctness fix rather
       than tidiness. It used to sit unconditionally with a max-width block
       below undoing it, and undoing by later source order DOES NOT WORK here:
       `.body.two .pimg.wide` is more specific than `.body.two .pimg`, so it
       survived the collapse it was supposed to be cancelled by and drew a
       752px picture on a 390px phone, with real sideways scroll. A rule that
       only exists where two columns exist cannot need cancelling.
       The pair is 1041 / 1040 — CSS cannot share one number between a
       min-width and a max-width, so they are written together here. */
    @media (min-width: 1041px) {
    /* 1500 - 28 - 28 = 1444; (1444 - 36) / 2 = 704, which is EXACTLY the
       one-column reading measure. So a two-column post does not squeeze the
       text to make room for the rail — the page grows and the prose is read at
       the width it is read at everywhere else. */
    .page:has(.body.two) { max-width: 1500px; }
    .body.two { display: flow-root; padding-right: calc(50% + var(--railgap) / 2); }
    .body.two .pimg {
      float: right; clear: right;
      width: 100%; max-width: 100%;
      margin: 6px 0 18px calc(var(--railgap) / 2);
      margin-right: calc(-100% - var(--railgap));
    }
    /* The escape hatch: a chart that genuinely needs the width drops out of the
       rail and spans BOTH columns. At 50/50 the old behaviour — span the text
       column — was no width at all, since the text column and the rail are now
       the same size, so "wide" would have drawn the same picture in a different
       place. 200% of the text column plus the gap is exactly the page.
       The over-constrained margin is simply ignored, which is what lets the box
       overflow its own column to the right. */
    .body.two .pimg.wide {
      float: none; clear: both;
      width: calc(200% + var(--railgap)); max-width: none;
      margin: 26px 0 0; transform: none;
    }
    /* In a rail, "small" and "medium" have nothing to be small against — the
       column is already the constraint, so they fill it. */
    .body.two .pimg.small, .body.two .pimg.medium { max-width: 100%; }
    /* Nothing may straddle the rail. */
    .body.two h2, .body.two h3, .body.two hr { clear: none; }
    }   /* end of the two-column layout */

    /* ---- ?guides=1 : where the width actually goes ------------------------
       An authoring aid, reached only by putting ?guides=1 on the URL, so no
       reader can arrive at it. CSS only -- this page carries no script. */
    .body.guides { position: relative; }
    .body.guides > * { outline: 1px dashed rgba(124, 156, 255, 0.35); outline-offset: 2px; }
    .body.guides::before, .body.guides::after {
      position: absolute; top: -26px; font: 500 10px/1 var(--mono);
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
      pointer-events: none; white-space: nowrap;
    }
    /* One column: the whole measure is the text, so one label and no boundary.
       It is a DIFFERENT number from the two-column text column (704 against
       728), and printing the wider one here would be the guide lying about the
       very thing it exists to show. */
    .body.guides::before { left: 0; content: var(--one-label); }

    .body.two.guides::before { content: var(--text-label); }
    /* The boundary itself: a rule down the full height at the rail's left edge,
       which is the thing being asked about. */
    .body.two.guides::after {
      content: var(--rail-label) " · " var(--gap-label);
      right: 0; text-align: right;
    }
    .body.two.guides {
      /* The rail band, drawn as a background rather than an element so it
         cannot disturb the layout it is describing. */
      background:
        /* THE BORDER BEING ASKED FOR: a 1px rule exactly where the text column
           ends and the reserved rail begins. Measured from the RIGHT, because
           that is where both bands are anchored and the text column is simply
           whatever is left. */
        /* A background percentage resolves against the PADDING box, which here
           is the whole page width — so the same 50% arithmetic as the layout
           above, and the bands cannot drift from the columns they describe. */
        linear-gradient(to right, rgba(124, 156, 255, 0.85) 0 100%)
          right calc(50% + var(--railgap) / 2) top / 1px 100% no-repeat,
        /* the gap */
        linear-gradient(to right, rgba(251, 191, 36, 0.10) 0 100%)
          right calc(50% - var(--railgap) / 2) top / var(--railgap) 100% no-repeat,
        /* the rail */
        linear-gradient(to right, rgba(52, 211, 153, 0.07) 0 100%)
          right / calc(50% - var(--railgap) / 2) 100% no-repeat;
    }
    .body.two.guides .pimg { outline-color: rgba(52, 211, 153, 0.55); }
    .body strong { color: var(--text); }
    .body code { font-family: var(--mono); font-size: 13px; background: rgba(255, 255, 255, 0.06);
                 padding: 2px 6px; border-radius: 6px; color: var(--text); }
    .body pre { margin: 20px 0 0; padding: 16px 18px; border-radius: 14px; overflow-x: auto;
                background: var(--surface-2); border: 1px solid var(--hair); }
    .body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
    .body blockquote { margin: 20px 0 0; padding: 2px 0 2px 18px; border-left: 2px solid rgba(52, 211, 153, 0.5); color: var(--muted); }
    .body blockquote p:first-child { margin-top: 0; }
    .body hr { margin: 30px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    .after { margin-top: 54px; }
    .after .core { padding: 26px 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .after p { margin: 0; font-size: 14px; color: var(--muted); max-width: 46ch; }
    .after .btn { margin-left: auto; }
    footer { margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 24px;
             display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--faint); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); text-decoration: underline; }
    /* A half-page rail beside a readable text column needs about 1040px of
       window. Below that the post reads as one column, and there is NOTHING
       HERE TO UNDO IT: the two-column rules live inside their own min-width
       above, so a phone never applies them in the first place and a collapsed
       two-column post is byte-for-byte a one-column post — same page width,
       same measure, same picture sizes, `wide` and `medium` included.
       Undoing by source order was tried and did not work; see the note there. */
    @media (max-width: 1040px) {
      /* The guides describe the two-column allocation, and there is no longer
         one. The dashed outlines stay; the bands and the labels go, rather than
         naming widths the page has stopped using. Below this width the measure
         is the WINDOW's, not a number anyone chose, so there is nothing to
         label honestly. */
      .body.two.guides { background: none; }
      .body.guides::before, .body.guides::after,
      .body.two.guides::before, .body.two.guides::after { content: none; }
    }
    @media (max-width: 640px) { .page { padding: 0 16px 60px; } article { padding-top: 38px; } .after .btn { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
  </svg>

  <div class="nav-wrap">
    <nav class="nav">
      <a class="mark" href="/">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark">Tickr Lab</span>
      </a>
      <a class="btn" href="/blog">All posts</a>
      <a class="btn btn-primary" href="/login?guest=1">Try it</a>
    </nav>
  </div>

  <main class="page">
    <article>
      <div class="meta">%META%</div>
      <h1>%TITLE%</h1>
      <p class="summary">%SUMMARY%</p>
      <hr class="rule" />
      <div class="%BODYCLASS%">%BODY%</div>
    </article>

    <div class="bezel after"><div class="core">
      <p><b>From data to decisions.</b> Tickr Lab scores every stock it tracks the same way every night,
        and shows its working.</p>
      <a class="btn btn-primary" href="/login?guest=1">See the screener</a>
    </div></div>

    <footer>
      <a href="/blog">All posts</a>
      <a href="/">Home</a>
      <a href="/login">Sign in</a>
    </footer>
  </main>
</body>
</html>
