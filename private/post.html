<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>%TITLE% — Tickr Lab</title>
  <meta name="description" content="%DESC%" />
  <meta property="og:title" content="%TITLE%" />
  <meta property="og:description" content="%DESC%" />
  <meta property="og:type" content="article" />
  <link rel="canonical" href="%CANONICAL%" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 28px 90px; }
    /* A two-column post needs a wider page, and the class that says so sits on
       a DESCENDANT — so the container asks about its own contents rather than
       the server stamping a second class further up. If :has() is ever missing
       the page stays 760px and the text column merely gets narrow: cramped, not
       broken. */
    :root { --rail: 320px; --railgap: 36px; }
    .page:has(.body.two) { max-width: 1140px; }
    .aura { background:
      radial-gradient(48vw 42vw at 6% -10%, rgba(124, 156, 255, 0.12), transparent 62%),
      radial-gradient(46vw 40vw at 98% 2%, rgba(52, 211, 153, 0.10), transparent 64%); }
    .nav-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .nav { pointer-events: auto; display: flex; align-items: center; gap: 8px; width: min(760px, 100%);
      padding: 8px 10px 8px 18px; border-radius: 999px; background: rgba(9, 11, 15, 0.74);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }
    .nav .mark { display: inline-flex; align-items: center; gap: 9px; margin-right: auto; text-decoration: none; color: var(--text); }
    .nav .glyph { width: 26px; height: 26px; border-radius: 9px; display: inline-flex; align-items: center;
      justify-content: center; color: var(--green);
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.20), rgba(52, 211, 153, 0.04));
      border: 1px solid rgba(52, 211, 153, 0.24); }

    article { padding-top: 56px; }
    .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--faint); text-transform: uppercase; }
    h1 { margin: 14px 0 0; font-size: clamp(32px, 5.2vw, 52px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.02; }
    .summary { margin: 18px 0 0; font-size: 16.5px; line-height: 1.65; color: var(--muted); }
    .rule { margin: 34px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    .body { font-size: 15.5px; line-height: 1.78; color: #cfd6e2; }
    .body h2 { margin: 40px 0 0; font-size: 25px; font-weight: 600; letter-spacing: -0.025em; color: var(--text); line-height: 1.2; }
    .body h3 { margin: 30px 0 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
    .body h4 { margin: 24px 0 0; font-size: 16px; font-weight: 600; color: var(--text); }
    .body p { margin: 16px 0 0; }
    .body ul, .body ol { margin: 16px 0 0; padding-left: 22px; }
    .body li { margin: 7px 0; }
    .body a { color: var(--accent); }

    /* ---- pictures ---------------------------------------------------------
       DEFAULT IS THE COLUMN, not the file's own size. max-width:100% with
       height:auto is the whole of the bug fix; the named widths below are the
       control, set in markdown's title slot: ![alt](src "small").            */
    .body .pimg { margin: 26px 0 0; }
    .body .pimg img {
      display: block; width: 100%; height: auto; max-width: 100%;
      border-radius: 12px; border: 1px solid var(--hair); background: var(--surface-2);
    }
    .body .pimg figcaption {
      margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--faint); text-align: center;
    }
    .body .pimg.small  { max-width: 300px; margin-left: auto; margin-right: auto; }
    .body .pimg.medium { max-width: 460px; margin-left: auto; margin-right: auto; }
    /* WIDE breaks out of the reading column, which is the point: a screenshot
       of an eighty-column table is unreadable at 704px. It can never be wider
       than the window has room for, so it does not reintroduce a sideways
       scroll on a phone -- the one thing the page must not do. */
    .body .pimg.wide {
      width: min(1040px, calc(100vw - 40px));
      max-width: none;
      margin-left: 50%; transform: translateX(-50%);
    }

    /* ---- two columns: text left, pictures in a rail on the right ----------
       FLOAT, not grid. A grid gives each child its own row, so a picture would
       sit in the right column on a row of its own and tear a hole in the text
       beside it. A float keeps the text flowing.
       `clear: right` is what stacks consecutive pictures down the rail instead
       of letting them sit side by side, and the RESERVED PADDING is what stops
       the text reclaiming the full width once it has passed the last one —
       without it the layout stops being two columns half way down the page. */
    .body.two { padding-right: calc(var(--rail) + var(--railgap)); }
    .body.two .pimg {
      float: right; clear: right;
      width: var(--rail);
      margin: 6px 0 18px calc(var(--railgap) / 2);
      margin-right: calc((var(--rail) + var(--railgap)) * -1);
      max-width: var(--rail);
    }
    /* The escape hatch: a chart that genuinely needs the width drops out of the
       rail and spans the text column instead of being crushed into 320px. */
    .body.two .pimg.wide {
      float: none; clear: both; width: 100%; max-width: 100%;
      margin: 26px 0 0; transform: none;
    }
    .body.two .pimg.small, .body.two .pimg.medium { max-width: var(--rail); }
    /* Nothing may straddle the rail. */
    .body.two h2, .body.two h3, .body.two hr { clear: none; }
    .body strong { color: var(--text); }
    .body code { font-family: var(--mono); font-size: 13px; background: rgba(255, 255, 255, 0.06);
                 padding: 2px 6px; border-radius: 6px; color: var(--text); }
    .body pre { margin: 20px 0 0; padding: 16px 18px; border-radius: 14px; overflow-x: auto;
                background: var(--surface-2); border: 1px solid var(--hair); }
    .body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
    .body blockquote { margin: 20px 0 0; padding: 2px 0 2px 18px; border-left: 2px solid rgba(52, 211, 153, 0.5); color: var(--muted); }
    .body blockquote p:first-child { margin-top: 0; }
    .body hr { margin: 30px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }

    .after { margin-top: 54px; }
    .after .core { padding: 26px 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .after p { margin: 0; font-size: 14px; color: var(--muted); max-width: 46ch; }
    .after .btn { margin-left: auto; }
    footer { margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 24px;
             display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--faint); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); text-decoration: underline; }
    /* A 320px rail beside a readable text column needs about 1040px of window.
       Below that the rail is dropped and the post reads as one column — the
       pictures stay in the flow, in order, which is what they were written
       into. Everything here UNSETS rather than overrides, so there is one
       description of two columns rather than two that can drift. */
    @media (max-width: 1040px) {
      .page:has(.body.two) { max-width: 760px; }
      .body.two { padding-right: 0; }
      .body.two .pimg {
        float: none; clear: both; width: 100%; max-width: 100%; margin: 26px 0 0;
      }
    }
    @media (max-width: 640px) { .page { padding: 0 16px 60px; } article { padding-top: 38px; } .after .btn { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
  </svg>

  <div class="nav-wrap">
    <nav class="nav">
      <a class="mark" href="/">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark">Tickr Lab</span>
      </a>
      <a class="btn" href="/blog">All posts</a>
      <a class="btn btn-primary" href="/login?guest=1">Try it</a>
    </nav>
  </div>

  <main class="page">
    <article>
      <div class="meta">%META%</div>
      <h1>%TITLE%</h1>
      <p class="summary">%SUMMARY%</p>
      <hr class="rule" />
      <div class="%BODYCLASS%">%BODY%</div>
    </article>

    <div class="bezel after"><div class="core">
      <p><b>From data to decisions.</b> Tickr Lab scores every stock it tracks the same way every night,
        and shows its working.</p>
      <a class="btn btn-primary" href="/login?guest=1">See the screener</a>
    </div></div>

    <footer>
      <a href="/blog">All posts</a>
      <a href="/">Home</a>
      <a href="/login">Sign in</a>
    </footer>
  </main>
</body>
</html>
