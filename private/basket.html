<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Theme — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/wmark.js" defer></script>
  <style>
    body { min-height: 100dvh; padding: 0 0 80px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 32px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 6% -8%, rgba(52, 211, 153, 0.12), transparent 62%),
        radial-gradient(50vw 42vw at 96% 4%, rgba(124, 156, 255, 0.11), transparent 64%); }
    .bezel { border-radius: 26px; }
    .bezel > .core { border-radius: 20px; }

    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex;
                   justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .island { pointer-events: auto; display: flex; align-items: center; gap: 8px;
      width: max-content; max-width: 100%; padding: 6px 7px 6px 16px; border-radius: 999px;
      background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair);
      box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }

    .head { display: flex; align-items: baseline; gap: 12px 16px; flex-wrap: wrap; margin: 26px 0 4px; }
    h1 { margin: 0; font-size: clamp(26px, 3.4vw, 36px); font-weight: 600; letter-spacing: -0.035em; }
    h1 .kind { color: var(--faint); font-weight: 400; }
    .ppick { position: relative; }
    #pfBtn { display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
             margin: 0; padding: 2px 8px 2px 2px; border: 0; background: none; border-radius: 10px;
             font: inherit; color: inherit; letter-spacing: inherit;
             transition: background 0.35s var(--ease); }
    #pfBtn:hover, #pfBtn[aria-expanded="true"] { background: rgba(255, 255, 255, 0.05); }
    #pfBtn .caret { width: 16px; height: 16px; color: var(--faint); flex: none;
                    stroke: currentColor; fill: none; stroke-width: 1.6;
                    stroke-linecap: round; stroke-linejoin: round;
                    transition: transform 0.4s var(--ease); }
    #pfBtn[aria-expanded="true"] .caret { transform: rotate(180deg); }
    #pfMenu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 46; display: none;
              min-width: 250px; max-height: 55vh; overflow-y: auto; padding: 6px;
              border-radius: 16px; border: 1px solid var(--hair-2);
              background: rgba(9, 11, 15, 0.9);
              backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
              box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }
    #pfMenu.open { display: block; }
    #pfMenu a { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                border-radius: 10px; font: 500 13px var(--sans); color: var(--muted);
                text-decoration: none; }
    #pfMenu a:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
    #pfMenu a.on { color: var(--text); background: rgba(52, 211, 153, 0.08); }
    #pfMenu a .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
    #pfMenu .sep { height: 1px; margin: 5px 8px; background: var(--hair); }
    #pfMenu .pdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .chip { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px;
            border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.035);
            font-size: 11.5px; color: var(--muted); }
    .lede { margin: 8px 0 20px; font-size: 12.5px; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    /* A GRID ITEM IS min-width: auto, so it refuses to shrink below its
       content — the stock table's 620px floor then pushed the card wider
       than the phone and `.tblwrap` never got the chance to scroll. The
       zero has to be on every level between the grid and the scroller. */
    .grid > .card, .card > .core { min-width: 0; }
    .card > .core { padding: 20px 22px 18px; }
    .card h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase;
               letter-spacing: 0.14em; color: var(--muted); }
    .card .note { font-size: 11px; color: var(--faint); line-height: 1.5; }

    /* the curve */
    .ranges { display: flex; gap: 6px; margin: 10px 0 4px; }
    .rng { padding: 5px 13px; border-radius: 999px; cursor: pointer; font: 500 11.5px var(--sans);
           border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03); color: var(--muted); }
    .rng.on { color: var(--text); border-color: rgba(52, 211, 153, 0.45); background: rgba(52, 211, 153, 0.08); }
    #chartBox { position: relative; margin-top: 8px; }
    #chartBox svg { display: block; width: 100%; height: auto; }
    .lgd { display: flex; gap: 18px; margin-top: 10px; font: 500 12px var(--sans); color: var(--muted); }
    .lgd span::before { content: ''; display: inline-block; width: 16px; height: 3px; border-radius: 2px;
                        margin-right: 7px; vertical-align: 3px; background: var(--c); }

    /* stance */
    .stack { display: flex; height: 18px; border-radius: 999px; overflow: hidden; margin: 12px 0 12px; }
    .stack div { height: 100%; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 500 12px var(--sans); }
    .tags b { font-family: var(--mono); }
    .chgline { margin-top: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
    .chgline .mono { font-family: var(--mono); }
    .pos { color: var(--green); } .neg { color: var(--red); } .amb { color: var(--amber); }

    /* returns table */
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { text-align: right; padding: 9px 12px; font-size: 13px;
             border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
    th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint);
         font-weight: 500; }
    th:first-child, td:first-child { text-align: left; }
    td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    td:first-child { font-family: var(--sans); color: var(--muted); }
    tbody tr:last-child td { border-bottom: none; }

    /* composition — the bar is cap, the number beside it is companies */
    .complist { display: grid; gap: 2px; margin: 12px 0 10px; }
    .comp { display: grid; grid-template-columns: minmax(90px, 1.5fr) 3fr 42px 62px;
            align-items: center; gap: 12px; padding: 5px 8px; border-radius: 9px;
            font: 500 12.5px var(--sans); color: var(--muted); text-decoration: none; }
    .comp:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
    .comp .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comp .cb { display: block; height: 8px; border-radius: 999px;
                background: rgba(255, 255, 255, 0.05); overflow: hidden; }
    .comp .cb > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
    .comp .cc, .comp .cm { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--faint); }

    /* leaders and laggards */
    .ldrcols { display: grid; grid-template-columns: 1fr; gap: 6px 26px; margin: 10px 0 4px; }
    @media (min-width: 720px) { .ldrcols { grid-template-columns: 1fr 1fr; } }
    .ldrcols h3 { margin: 6px 0 4px; font: 500 10.5px var(--sans); text-transform: uppercase;
                  letter-spacing: 0.12em; color: var(--faint); }
    .ldr { display: grid; grid-template-columns: 58px 1fr 62px; align-items: baseline; gap: 10px;
           padding: 5px 8px; border-radius: 9px; text-decoration: none;
           font: 500 12.5px var(--sans); color: var(--muted); }
    .ldr:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
    .ldr .ls { font-family: var(--mono); font-size: 12px; color: var(--text); }
    .ldr .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ldr .lv { font-family: var(--mono); text-align: right; }
    /* the verdict is context, not the row's subject — it drops on a phone
       rather than squeezing the name it sits beside */
    .ldr .la { display: none; font-size: 11px; color: var(--faint); }
    @media (min-width: 900px) { .ldr { grid-template-columns: 58px 1fr 62px 96px; }
      .ldr .la { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }

    /* the stock list — its own scroller, so a long group cannot make the
       PAGE scroll sideways (seven columns do not fit a phone) */
    .tblwrap { overflow-x: auto; margin-top: 6px; }
    .rowtbl { min-width: 620px; }
    .rowtbl td.nm { font-family: var(--sans); color: var(--muted); text-align: left;
                    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rowtbl th:nth-child(2), .rowtbl td:nth-child(2) { text-align: left; }
    .rowtbl th:last-child, .rowtbl td:last-child { text-align: left; font-family: var(--sans);
                                                   font-size: 12px; color: var(--muted); }
    .rowtbl a { color: var(--text); text-decoration: none; }
    .rowtbl a:hover { text-decoration: underline; }
    td.dim { color: var(--faint); }

    /* the group picker's search box and its section headings */
    .pffind { width: calc(100% - 12px); margin: 2px 6px 6px; padding: 7px 10px; border-radius: 10px;
              border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.04);
              font: 500 12.5px var(--sans); color: var(--text); }
    .pffind:focus { outline: none; border-color: var(--hair-2); }
    #pfMenu .mh { padding: 6px 12px 2px; font: 500 10px var(--sans); text-transform: uppercase;
                  letter-spacing: 0.13em; color: var(--faint); }
    #pfMenu .pfnone { padding: 10px 12px; font: 500 12.5px var(--sans); color: var(--faint); }

    /* per-stock overlays on the one chart: a chip per stock, click to hide */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .chipS { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px;
             border-radius: 999px; cursor: pointer; border: 1px solid var(--hair);
             background: rgba(255, 255, 255, 0.03); font: 500 11.5px var(--mono);
             color: var(--muted); transition: opacity 0.3s var(--ease); }
    .chipS .cd { width: 8px; height: 8px; border-radius: 50%; background: var(--c);
                 box-sizing: border-box; }
    .chipS b { font-weight: 600; }
    .chipS.off { opacity: 0.45; text-decoration: line-through; }
    .chipS.off .cd { background: transparent; border: 1.5px solid var(--c); }
    .chipS:hover { border-color: var(--hair-2); color: var(--text); }
    .chipU { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px;
             cursor: pointer; border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03);
             font: 500 11px var(--sans); color: var(--faint); }
    .chipU:hover { color: var(--text); border-color: var(--hair-2); }
    .stkToggle { padding: 5px 13px; border-radius: 999px; cursor: pointer; margin-left: auto;
                 font: 500 11.5px var(--sans); border: 1px solid var(--hair);
                 background: rgba(255, 255, 255, 0.03); color: var(--muted); }
    .stkToggle.on { color: var(--text); border-color: rgba(167, 139, 250, 0.45);
                    background: rgba(167, 139, 250, 0.09); }

    .empty, .error { padding: 32px; font-size: 13px; color: var(--muted); }
    .error { color: var(--red); }
    @media (max-width: 768px) { .page { padding: 0 16px; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark">Tickr Lab</span>
      </span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page">
    <div id="main"><div class="empty">Loading…</div></div>
  </main>

  <script src="/action.js"></script>
  <!-- for CAP_ORDER: a size ladder sorted alphabetically reads as nonsense,
       and the order is defined once in the module the server also requires -->
  <script src="/filters.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // FOUR SCOPES, ONE PAGE (2026-09-27). A sector, an industry and a size
    // band differ from a theme only in which stocks are in them, so the path
    // says which dimension and the value rides in the last segment. The wire
    // name carries the dimension as a prefix, the way 'my:' already did.
    //
    // Both theme addresses still land here, and /portfolio/ normalises to
    // theme — splitting on one literal prefix returned undefined the moment
    // the canonical URL became /theme/.
    const PATH = location.pathname.match(/^\/(theme|portfolio|sector|industry|size)\/(.*)$/);
    const SCOPE = PATH ? (PATH[1] === 'portfolio' ? 'theme' : PATH[1]) : 'theme';
    const VALUE = decodeURIComponent(PATH ? PATH[2] : '');
    const NAME = SCOPE === 'theme' ? VALUE : SCOPE + ':' + VALUE;
    const SCOPE_WORD = { theme: 'theme', sector: 'sector', industry: 'industry', size: 'size band' };
    // What a group is best broken down BY. A sector is made of industries; an
    // industry is one sector by construction, so its only interesting cut is
    // size; everything else reads as a sector mix.
    const COMP_BY = { sector: 'industry', industry: 'capBand', size: 'sector', theme: 'sector' };
    const COMP_WORD = { industry: 'industries', capBand: 'size bands', sector: 'sectors' };
    // The window's own return field, so the leaders agree with the range
    // button above them rather than quietly always being a year.
    const RANGE_FIELD = { '1M': 'oneMonthPct', '3M': 'threeMonthPct', '6M': 'sixMonthPct', '1Y': 'oneYearPct' };
    const RANGES = [
      { id: '1M', days: 21 }, { id: '3M', days: 63 }, { id: '6M', days: 126 }, { id: '1Y', days: 253 },
    ];
    let range = RANGES[3];
    let rows = [];           // snapshot rows in this basket
    let allRows = [];        // the whole visible snapshot, for context means
    let curve = null;        // /api/basket payload for the current range
    const curveCache = {};
    let sharedNames = [];    // from the snapshot payload
    let myNames = [];        // the member's own lists
    let showStocks = null;   // null until the first paint decides the default
    const hiddenSyms = new Set();   // chips toggled off, this visit

    const pct = (n, d = 1) => (n == null || !isFinite(n) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(d) + '%');
    const cls = (n) => (n == null ? '' : n >= 0 ? 'pos' : 'neg');
    const mean = (arr) => {
      const xs = arr.filter((x) => x != null && isFinite(x));
      return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
    };

    const PALETTE = ['#22d3ee', '#a78bfa', '#fbbf24', '#fb923c', '#f472b6', '#a3e635',
                     '#60a5fa', '#fb7185', '#2dd4bf', '#e879f9', '#facc15', '#94a3b8'];
    const stockColor = (i) => PALETTE[i % PALETTE.length];

    // The benchmark lines, in draw order. Accent and violet rather than
    // green and red: those two already mean up and down on every chart here,
    // and an index coloured by its own direction would be making a different
    // claim from the one the chart is for.
    const BENCH_TINT = { SPY: '#7c9cff', DIA: '#a78bfa' };
    const benchLines = () => ((curve && curve.bench) || [])
      .map((b) => ({ ...b, color: BENCH_TINT[b.sym] || '#7d8797' }));

    // ---- the one chart: basket + benchmarks + every stock as a thin line ----
    function chartSvg(dates, a, marks, overlays) {
      const W = 1000, H = 340, PL = 64, PR = 20, PT = 14, PB = 30;
      const toPct = (arr) => arr.map((v) => (v == null ? null : (v - 1) * 100));
      const A = toPct(a);
      const M = (marks || []).map((m) => ({ ...m, S: toPct(m.index || []) }));
      const O = (overlays || []).map((o) => ({ sym: o.sym, color: o.color, S: toPct(o.S) }));
      // the scale covers whatever is actually drawn — hide a runaway stock
      // from its chip and the rest get the room back
      const vals = A.concat(...M.map((m) => m.S)).concat(...O.map((o) => o.S)).filter((v) => v != null);
      if (!vals.length) return '<div class="empty">No history for this window.</div>';
      let lo = Math.min(...vals, 0), hi = Math.max(...vals, 0);
      const pad = Math.max(1, (hi - lo) * 0.08); lo -= pad; hi += pad;
      const x = (i) => PL + (i / Math.max(1, dates.length - 1)) * (W - PL - PR);
      const y = (v) => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
      const path = (S) => {
        let d = '', pen = false;
        for (let i = 0; i < S.length; i++) {
          if (S[i] == null) { pen = false; continue; }
          d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(S[i]).toFixed(1);
          pen = true;
        }
        return d;
      };
      // four gridlines, evenly spaced, plus the zero line when it is inside
      let grid = '';
      for (let g = 0; g <= 4; g++) {
        const v = lo + (g / 4) * (hi - lo);
        grid += `<line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="rgba(255,255,255,0.06)"/>` +
          `<text x="${PL - 10}" y="${y(v) + 4}" text-anchor="end" font-size="13" fill="#7d8797" font-family="Geist Mono, monospace">${v.toFixed(0)}%</text>`;
      }
      if (lo < 0 && hi > 0) grid += `<line x1="${PL}" y1="${y(0)}" x2="${W - PR}" y2="${y(0)}" stroke="rgba(255,255,255,0.14)"/>`;
      const d0 = dates[0] || '', d1 = dates[dates.length - 1] || '';
      const endTag = (S, color) => {
        let last = null;
        for (let i = S.length - 1; i >= 0 && last == null; i--) last = S[i];
        if (last == null) return '';
        return `<text x="${W - PR}" y="${Math.max(14, Math.min(H - PB - 4, y(last) - 6))}" text-anchor="end" font-size="14" font-weight="600" fill="${color}" font-family="Geist Mono, monospace">${(last >= 0 ? '+' : '') + last.toFixed(1)}%</text>`;
      };
      const overlayPaths = O.map((o) =>
        `<path data-line="${esc(o.sym)}" d="${path(o.S)}" fill="none" stroke="${o.color}" stroke-width="1.3" opacity="0.5"/>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="This group against the S&amp;P 500 and the Dow">` + grid +
        overlayPaths +
        M.map((m) => `<path d="${path(m.S)}" fill="none" stroke="${m.color}" stroke-width="2" opacity="0.65"/>`).join('') +
        `<path d="${path(A)}" fill="none" stroke="#34d399" stroke-width="2.6"/>` +
        endTag(A, '#34d399') + M.map((m) => endTag(m.S, m.color)).join('') +
        `<text x="${PL}" y="${H - 8}" font-size="12" fill="#7d8797" font-family="Geist Mono, monospace">${esc(d0)}</text>` +
        `<text x="${W - PR}" y="${H - 8}" text-anchor="end" font-size="12" fill="#7d8797" font-family="Geist Mono, monospace">${esc(d1)}</text></svg>`;
    }

    const TREND_TINT = { 'Strong uptrend': '#34d399', 'Above 200D': '#a3e635', 'Below 200D': '#fbbf24',
                         'Downtrend': '#fb923c', 'Breakdown': '#fb7185', 'No data': '#7d8797' };
    function stanceHtml() {
      const order = ActionRules.TREND_ORDER;
      const counts = order.map((t) => rows.filter((s) => s.actionTrend === t).length);
      const total = counts.reduce((x, y) => x + y, 0) || 1;
      const stack = order.map((t, i) => counts[i]
        ? `<div style="width:${counts[i] / total * 100}%;background:${TREND_TINT[t] || '#7d8797'}"></div>` : '').join('');
      const tags = order.map((t, i) => counts[i]
        ? `<span style="color:${TREND_TINT[t] || '#7d8797'}">${esc(t)} <b>${counts[i]}</b></span>` : '').join('');
      const above = rows.filter((s) => s.vs200ma != null && s.vs200ma > 0).length;
      const advice = {};
      rows.forEach((s) => { if (s.action) advice[s.action] = (advice[s.action] || 0) + 1; });
      const advLine = ActionRules.ACTIONS.slice().reverse().filter((a) => advice[a])
        .map((a) => `${esc(a)} <b>${advice[a]}</b>`).join(' · ');
      const changes = rows.filter((s) => s.advicePrev && s.action && s.advicePrev !== s.action);
      const chg = changes.length
        ? changes.map((s) => `<span class="mono">${esc(s.symbol)}</span> ${esc(s.advicePrev)} → <b>${esc(s.action)}</b>`).join(' · ')
        : 'none — every verdict in this list held today';
      return '<section class="bezel card"><div class="core"><h2>Stance</h2>' +
        `<div class="stack">${stack}</div><div class="tags">${tags}</div>` +
        `<p class="chgline">${above}/${rows.length} above their 200-day. Advice (Balanced): ${advLine || '—'}.</p>` +
        `<p class="chgline">Changed since the last session: ${chg}.</p>` +
        '</div></section>';
    }

    function returnsHtml() {
      const HZ = [['1W', 'oneWeekPct'], ['1M', 'oneMonthPct'], ['3M', 'threeMonthPct'],
                  ['6M', 'sixMonthPct'], ['1Y', 'oneYearPct']];
      const cells = (rs) => HZ.map(([, f]) => {
        const m = mean(rs.map((s) => s[f]));
        return `<td class="${cls(m)}">${pct(m)}</td>`;
      }).join('');
      // The SAME benchmarks the curve draws, so the picture and the numbers
      // cannot name different comparisons. An index is one row, so its
      // "mean" is its own return.
      const marks = benchLines()
        .map((b) => ({ ...b, row: allRows.find((s) => s.symbol === b.sym) }))
        .filter((b) => b.row);
      const lead = marks[0];
      const diff = HZ.map(([, f]) => {
        const a = mean(rows.map((s) => s[f])), b = lead ? lead.row[f] : null;
        const d = a != null && b != null ? a - b : null;
        return `<td class="${cls(d)}">${pct(d)}</td>`;
      }).join('');
      return '<section class="bezel card"><div class="core"><h2>Returns, against the index</h2>' +
        `<table><thead><tr><th></th>${HZ.map(([h]) => `<th>${h}</th>`).join('')}</tr></thead><tbody>` +
        `<tr><td>This group (mean of ${rows.length})</td>${cells(rows)}</tr>` +
        marks.map((b) => `<tr><td>${esc(b.label)}</td>${cells([b.row])}</tr>`).join('') +
        (lead ? `<tr><td>Difference vs ${esc(lead.label)}</td>${diff}</tr>` : '') +
        '</tbody></table>' +
        '<p class="note" style="margin-top:10px">Mean of each stock’s own return per horizon — an equal-weight ' +
        'reading, not an account. The index rows are that ETF’s own return over the same horizon, which tracks ' +
        'the index and is not the index itself.</p>' +
        '</div></section>';
    }

    // ---- the four cards a group needs that a theme page never had ----------
    const median = (arr) => {
      const xs = arr.filter((x) => x != null && isFinite(x)).sort((a, b) => a - b);
      if (!xs.length) return null;
      const m = Math.floor(xs.length / 2);
      return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    };
    const money = (n) => {
      if (n == null || !isFinite(n)) return '—';
      const a = Math.abs(n);
      for (const [d, s] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M']]) {
        if (a >= d) return '$' + (n / d).toFixed(1) + s;
      }
      return '$' + Math.round(n);
    };
    const nameOf = (s) => s.shortName || s.name || s.symbol;

    // WHAT THE GROUP IS MADE OF. A curve cannot say this, and it is the
    // difference between "Technology +18%" meaning the sector and meaning two
    // companies: the share bar is by market cap, the count beside it is by
    // company, and when those two disagree that IS the finding.
    function compositionHtml() {
      const field = COMP_BY[SCOPE];
      const by = new Map();
      let blank = 0;
      for (const s of rows) {
        const v = s[field];
        if (!v) { blank++; continue; }
        const e = by.get(v) || { n: 0, cap: 0 };
        e.n++;
        e.cap += Number(s.marketCap) > 0 ? Number(s.marketCap) : 0;
        by.set(v, e);
      }
      if (!by.size) {
        return '<section class="bezel card"><div class="core"><h2>What it is made of</h2>' +
          `<div class="empty">No ${COMP_WORD[field]} recorded here yet — the field fills in as each ` +
          'company profile is next re-pulled.</div></div></section>';
      }
      // Ordered by cap where there is any, else by count: a size ladder and a
      // taxonomy are different questions, but "where is the weight" is the
      // one this card is opened for.
      const capTotal = [...by.values()].reduce((a, b) => a + b.cap, 0);
      let list = [...by.entries()].sort((a, b) => (b[1].cap - a[1].cap) || (b[1].n - a[1].n));
      if (field === 'capBand' && window.Filters) {
        const ord = Filters.CAP_ORDER;
        list = list.sort((a, b) => ord.indexOf(a[0]) - ord.indexOf(b[0]));
      }
      const CAP = 12;
      const shown = list.slice(0, CAP);
      const rest = list.slice(CAP);
      const href = (v) => (field === 'capBand' ? '/size/' : field === 'industry' ? '/industry/' : '/sector/')
        + encodeURIComponent(v);
      const bars = shown.map(([v, e]) => {
        const share = capTotal > 0 ? (e.cap / capTotal) * 100 : (e.n / rows.length) * 100;
        return '<a class="comp" href="' + href(v) + `" title="Open ${esc(v)}">` +
          `<span class="cn">${esc(v)}</span>` +
          `<span class="cb"><span style="width:${Math.max(1, share).toFixed(1)}%"></span></span>` +
          `<span class="cc">${e.n}</span><span class="cm">${money(e.cap)}</span></a>`;
      }).join('');
      const more = rest.length
        ? `<p class="note">…and ${rest.length} more, together ${rest.reduce((a, b) => a + b[1].n, 0)} stocks.</p>` : '';
      const blankNote = blank
        ? `<p class="note">${blank} ${blank === 1 ? 'stock has' : 'stocks have'} no ${COMP_WORD[field].replace(/s$/, '')} recorded yet.</p>` : '';
      return '<section class="bezel card"><div class="core"><h2>What it is made of</h2>' +
        `<div class="complist">${bars}</div>${more}${blankNote}` +
        `<p class="note">${by.size} ${esc(COMP_WORD[field])}, the bar by market cap and the number by company —` +
        ' where those two disagree, a few names carry the group. Each row opens.</p>' +
        '</div></section>';
    }

    // WHICH NAMES DID IT. "The sector fell 4%" is not an answer anyone can
    // act on; these are the same rows, over the window the range buttons
    // chose, so the two cannot tell different stories.
    function leadersHtml() {
      const f = RANGE_FIELD[range.id] || 'oneYearPct';
      const have = rows.filter((s) => s[f] != null && isFinite(s[f]))
        .sort((a, b) => b[f] - a[f]);
      if (!have.length) {
        return '<section class="bezel card"><div class="core"><h2>Leaders and laggards</h2>' +
          `<div class="empty">No ${range.id} return stored for anything in this group yet.</div></div></section>`;
      }
      const N = Math.min(5, Math.floor(have.length / 2)) || Math.min(3, have.length);
      const best = have.slice(0, N);
      const worst = have.slice(-N).reverse();
      const row = (s) => `<a class="ldr" href="/stock/${encodeURIComponent(s.symbol)}">` +
        `<span class="ls mono">${esc(s.symbol)}</span><span class="ln">${esc(nameOf(s))}</span>` +
        `<span class="lv ${cls(s[f])}">${pct(s[f])}</span>` +
        `<span class="la">${esc(s.action || '')}</span></a>`;
      // The same stock can top both columns when the group is tiny; saying so
      // beats printing it twice as if they were different findings.
      const overlap = best.some((b) => worst.some((w) => w.symbol === b.symbol));
      return '<section class="bezel card"><div class="core"><h2>Leaders and laggards</h2>' +
        `<div class="ldrcols"><div><h3>Best over ${esc(range.id)}</h3>${best.map(row).join('')}</div>` +
        `<div><h3>Worst over ${esc(range.id)}</h3>${worst.map(row).join('')}</div></div>` +
        (overlap ? '<p class="note">Only a handful of stocks here, so the two columns overlap.</p>' : '') +
        `<p class="note">${have.length} of ${rows.length} have a ${esc(range.id)} return stored. ` +
        'The verdict is the Balanced rules’ — a reading, not a recommendation.</p>' +
        '</div></section>';
    }

    // CHEAP OR DEAR AGAINST WHAT YOU ACTUALLY TRACK, not in the abstract.
    // MEDIANS, never means: one 300x P/E drags a mean somewhere no company in
    // the group is.
    const FUND_ROWS = [
      { k: 'forwardPe', label: 'Forward P/E', unit: 'x', dp: 1,
        // A multiple off a loss is arithmetic, not cheapness — the Size and
        // Bubble cards' rule, and the peer table's.
        keep: (s) => Number(s.forwardPe) > 0 },
      { k: 'grossMargin', label: 'Gross margin', unit: '%', dp: 1,
        // Meaningless for a lender, and a Financial Services page would be
        // every row — so it is counted and said, never silently dropped.
        keep: (s) => s.sector !== 'Financial Services' },
      { k: 'revenueGrowthYoY', label: 'Revenue growth', unit: '%', dp: 1 },
      { k: 'profitMargin', label: 'Profit margin', unit: '%', dp: 1 },
      { k: 'qualityRating', label: 'Quality (1-10)', unit: '', dp: 0 },
    ];
    function fundamentalsHtml() {
      const fmt = (v, r) => (v == null ? '—'
        : (r.unit === '%' ? (v >= 0 ? '+' : '') + v.toFixed(r.dp) + '%'
          : v.toFixed(r.dp) + r.unit));
      let dropped = 0;
      const body = FUND_ROWS.map((r) => {
        const mine = rows.filter((s) => (r.keep ? r.keep(s) : true));
        if (r.k === 'grossMargin') dropped = rows.length - mine.length;
        const a = median(mine.map((s) => s[r.k]));
        const b = median(allRows.filter((s) => (r.keep ? r.keep(s) : true)).map((s) => s[r.k]));
        const d = a != null && b != null ? a - b : null;
        // A ratio's gap is points of the ratio, not a percentage OF it: 28x
        // against 19x is nine turns, and "+47%" would be a different claim.
        return `<tr><td>${esc(r.label)}</td><td class="mono">${fmt(a, r)}</td>` +
          `<td class="mono dim">${fmt(b, r)}</td>` +
          `<td class="mono ${cls(d)}">${d == null ? '—' : (d >= 0 ? '+' : '') + d.toFixed(r.dp)}</td>` +
          `<td class="mono dim">${mine.filter((s) => s[r.k] != null).length}</td></tr>`;
      }).join('');
      return '<section class="bezel card"><div class="core"><h2>Fundamentals, against the whole screen</h2>' +
        '<table><thead><tr><th></th><th>This group</th><th>All screened</th><th>Gap</th><th>n</th></tr></thead>' +
        `<tbody>${body}</tbody></table>` +
        '<p class="note">Compared against the whole screen rather than an index: the S&P 500 and the Dow ' +
        'are ETFs here, and a fund has no margin, no growth and no P/E of its own to compare with. ' +
        'Medians, not means — one extreme multiple would drag a mean somewhere no company ' +
        'in the group sits. A forward P/E at or below zero is excluded: a multiple off a loss is arithmetic, ' +
        'not cheapness.' +
        (dropped ? ` ${dropped} financial${dropped === 1 ? '' : 's'} excluded from gross margin, where a lender's figure means nothing.` : '') +
        ' The gap is in the figure’s own units — turns of a multiple, points of a percentage.</p>' +
        '</div></section>';
    }

    let listShown = 50;
    function stocksHtml() {
      const f = RANGE_FIELD[range.id] || 'oneYearPct';
      const sorted = rows.slice().sort((a, b) => (Number(b.marketCap) || 0) - (Number(a.marketCap) || 0));
      const shown = sorted.slice(0, listShown);
      const body = shown.map((s) => `<tr>` +
        `<td class="mono"><a href="/stock/${encodeURIComponent(s.symbol)}">${esc(s.symbol)}</a></td>` +
        `<td class="nm">${esc(nameOf(s))}</td>` +
        `<td class="mono">${s.price == null ? '—' : '$' + Number(s.price).toFixed(2)}</td>` +
        `<td class="mono ${cls(s.todayPct)}">${pct(s.todayPct, 2)}</td>` +
        `<td class="mono ${cls(s[f])}">${pct(s[f])}</td>` +
        `<td class="mono">${money(s.marketCap)}</td>` +
        `<td>${esc(s.action || '—')}</td></tr>`).join('');
      return '<section class="bezel card wide"><div class="core">' +
        `<h2>The ${rows.length} stocks</h2>` +
        '<div class="tblwrap"><table class="rowtbl"><thead><tr><th>Symbol</th><th>Name</th><th>Price</th>' +
        `<th>Today</th><th>${esc(range.id)}</th><th>Market cap</th><th>Balanced</th></tr></thead>` +
        `<tbody>${body}</tbody></table></div>` +
        (sorted.length > shown.length
          ? `<button class="stkToggle" id="moreRows">Show 50 more — ${shown.length} of ${sorted.length}</button>` : '') +
        '<p class="note">Biggest first. The return column follows the range above, so it says the same thing ' +
        'the curve does.</p></div></section>';
    }

    function stockItems() {
      const series = (curve && curve.series) || {};
      return ((curve && curve.symbols) || [])
        .filter((sym) => series[sym])
        .map((sym, i) => {
          const S = series[sym];
          let last = null;
          for (let k = S.length - 1; k >= 0 && last == null; k--) last = S[k];
          return { sym, S, color: stockColor(i), end: last == null ? null : (last - 1) * 100 };
        });
    }

    function curveCard() {
      const rngBtns = RANGES.map((r) =>
        `<button class="rng ${range.id === r.id ? 'on' : ''}" data-r="${r.id}">${r.id}</button>`).join('');
      const items = stockItems();
      if (showStocks == null && curve) showStocks = items.length > 0 && items.length <= 15;
      let body = '<div class="empty">Loading the curve…</div>';
      let cap = '';
      let chips = '';
      if (curve && curve.dates && curve.dates.length) {
        const overlays = showStocks ? items.filter((it) => !hiddenSyms.has(it.sym)) : [];
        body = chartSvg(curve.dates, curve.basket || [], benchLines(), overlays);
        const skipped = curve.basketOf - curve.basketUsed;
        cap = 'Equal dollars at the window start, held — a reading of the GROUP, not an account. ' +
          'The index lines are rebased at the same point, on the same convention.' +
          (skipped > 0 ? ` ${skipped} symbol${skipped > 1 ? 's' : ''} had no history at the start and sat out.` : '') +
          (showStocks ? ' Each thin line is one stock on its own first close. Click a chip to hide or show that stock (the scale re-fits), hover one to lift its line out of the crowd, or use None and add back just the ones you want.' : '');
        if (showStocks) {
          chips = `<div class="chips">${items.map((it) =>
            `<span class="chipS ${hiddenSyms.has(it.sym) ? 'off' : ''}" data-chip="${esc(it.sym)}" style="--c:${it.color}" ` +
            `title="Click to ${hiddenSyms.has(it.sym) ? 'show' : 'hide'} ${esc(it.sym)} · hover to highlight its line">` +
            `<span class="cd"></span>${esc(it.sym)} <b class="${cls(it.end)}">${pct(it.end)}</b></span>`).join('')}` +
            `<span class="chipU" data-chips-all>All</span><span class="chipU" data-chips-none>None</span></div>`;
        }
      } else if (curve) {
        body = '<div class="empty">No stored history for this window yet.</div>';
      }
      return '<section class="bezel card"><div class="core"><h2>The basket, as one line</h2>' +
        `<div class="ranges" id="rngRow">${rngBtns}` +
        (items.length ? `<button class="stkToggle ${showStocks ? 'on' : ''}" id="stkToggle">` +
          `${showStocks ? 'Hide' : 'Show'} the ${items.length} stocks</button>` : '') +
        '</div>' +
        `<div id="chartBox">${body}</div>` +
        `<div class="lgd"><span style="--c:#34d399">This group</span>${benchLines()
          .map((b) => `<span style="--c:${b.color}">${esc(b.label)}</span>`).join('')}</div>` +
        chips +
        (cap ? `<p class="note" style="margin-top:10px">${cap}</p>` : '') +
        '</div></section>';
    }

    function paint() {
      const main = $('main');
      if (!rows.length) {
        main.innerHTML = `<div class="head"><h1>${esc(curve ? curve.label : VALUE)}</h1>` +
          `<span class="kind" style="font-size:15px">· ${esc(SCOPE_WORD[SCOPE])}</span></div>` +
          `<div class="bezel card"><div class="core"><div class="empty">No stocks with data in this ${esc(SCOPE_WORD[SCOPE])} yet.</div></div></div>`;
        return;
      }
      const sectors = new Set(rows.map((s) => s.sector).filter(Boolean));
      const inds = new Set(rows.map((s) => s.industry).filter(Boolean));
      // THE MENU CROSSES ALL FOUR DIMENSIONS, because the reason you are on a
      // sector page is often that you want the industry inside it. Grouped
      // and searchable: 11 sectors and 6 bands are a list, ~100 industries is
      // a wall, and one flat list of 130 rows is neither.
      const dimRow = (href, label, on, note, tint) =>
        `<a href="${href}" class="${on ? 'on' : ''}" data-f="${esc(label.toLowerCase())}">` +
        `<span class="pdot" style="background:${tint}"></span>${esc(label)}` +
        (note ? `<span class="n">${esc(note)}</span>` : '') + '</a>';
      const themeRows =
        dimRow('/theme/All', 'All', NAME === 'All', '', 'var(--accent)') +
        sharedNames.map((n) => dimRow('/theme/' + encodeURIComponent(n), n, NAME === n, '', 'var(--accent)')).join('') +
        myNames.map((n) => dimRow('/theme/' + encodeURIComponent('my:' + n), n, NAME === 'my:' + n, 'personal', 'var(--green)')).join('');
      const listOf = (field) => {
        const c = new Map();
        for (const s of allRows) if (s[field]) c.set(s[field], (c.get(s[field]) || 0) + 1);
        return [...c.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      };
      const sizeList = (() => {
        const c = new Map();
        for (const s of allRows) if (s.capBand) c.set(s.capBand, (c.get(s.capBand) || 0) + 1);
        const ord = (window.Filters && Filters.CAP_ORDER) || [...c.keys()];
        return ord.filter((b) => c.has(b)).map((b) => [b, c.get(b)]);
      })();
      const section = (title, items) => items.length
        ? `<div class="sep"></div><div class="mh">${esc(title)}</div>` + items : '';
      const menu =
        '<input id="pfFind" class="pffind" type="search" placeholder="Filter…" aria-label="Filter the list" />' +
        `<div class="mh">Themes</div>${themeRows}` +
        section('Sectors', listOf('sector').map(([n, k]) =>
          dimRow('/sector/' + encodeURIComponent(n), n, SCOPE === 'sector' && VALUE === n, String(k), '#22d3ee')).join('')) +
        section('Size', sizeList.map(([n, k]) =>
          dimRow('/size/' + encodeURIComponent(n), n, SCOPE === 'size' && VALUE === n, String(k), '#94a3b8')).join('')) +
        section('Industries', listOf('industry').map(([n, k]) =>
          dimRow('/industry/' + encodeURIComponent(n), n, SCOPE === 'industry' && VALUE === n, String(k), '#a78bfa')).join('')) +
        '<div class="pfnone" hidden>Nothing matches.</div>';
      const kindWord = SCOPE === 'theme'
        ? (curve && curve.mine ? '· personal theme' : '· theme')
        : '· ' + SCOPE_WORD[SCOPE];
      // A chip has to say something the heading does not. "1 sector" on a
      // sector page is the page's own title counted; an industry names the
      // sector it sits in, which is the fact you cannot see from here.
      const chips = `<span class="chip">${rows.length} stocks</span>` +
        (SCOPE === 'sector' ? `<span class="chip">${inds.size} industr${inds.size === 1 ? 'y' : 'ies'}</span>`
          : SCOPE === 'industry' ? `<span class="chip">${esc([...sectors][0] || 'no sector recorded')}</span>`
            : `<span class="chip">${sectors.size} sector${sectors.size === 1 ? '' : 's'}</span>`);
      main.innerHTML =
        `<div class="head"><h1 class="ppick">` +
        `<button id="pfBtn" aria-expanded="false" aria-haspopup="listbox" title="Pick another group">` +
        `${esc(curve ? curve.label : VALUE)}<svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9.4 6 6 6-6"/></svg></button>` +
        `<div id="pfMenu">${menu}</div>` +
        `</h1><span class="kind" style="font-size:15px">${esc(kindWord)}</span>${chips}</div>` +
        '<p class="lede">A screener’s view of the group as one thing — descriptive throughout, positions nowhere.</p>' +
        `<div class="grid">${curveCard()}${stanceHtml()}${compositionHtml()}${leadersHtml()}` +
        `${returnsHtml()}${fundamentalsHtml()}${stocksHtml()}</div>`;
      const more = $('moreRows');
      if (more) more.addEventListener('click', () => { listShown += 50; paint(); });
      const find = $('pfFind');
      if (find) {
        find.addEventListener('click', (e) => e.stopPropagation());
        find.addEventListener('input', () => {
          const q = find.value.trim().toLowerCase();
          const menuEl = $('pfMenu');
          let any = 0;
          menuEl.querySelectorAll('a[data-f]').forEach((a) => {
            const hit = !q || a.dataset.f.includes(q);
            a.hidden = !hit;
            if (hit) any++;
          });
          // A heading over nothing, and a separator with no section under it,
          // both read as a list that lost its rows.
          menuEl.querySelectorAll('.mh, .sep').forEach((h) => {
            let n = h.nextElementSibling, seen = false;
            while (n && !n.classList.contains('mh') && !n.classList.contains('sep')) {
              if (n.tagName === 'A' && !n.hidden) { seen = true; break; }
              n = n.nextElementSibling;
            }
            h.hidden = !seen;
          });
          menuEl.querySelector('.pfnone').hidden = any > 0;
        });
      }
      const st = $('stkToggle');
      if (st) st.addEventListener('click', () => { showStocks = !showStocks; paint(); });
      document.querySelectorAll('[data-chip]').forEach((c) => {
        c.addEventListener('click', () => {
          const sym = c.dataset.chip;
          if (hiddenSyms.has(sym)) hiddenSyms.delete(sym); else hiddenSyms.add(sym);
          paint();
        });
        // hover lifts that stock's line out of the crowd — attribute tweaks
        // on the drawn path, so no repaint and nothing to flicker
        c.addEventListener('mouseenter', () => {
          document.querySelectorAll('#chartBox [data-line]').forEach((el) => {
            const mine = el.dataset.line === c.dataset.chip;
            el.setAttribute('opacity', mine ? '1' : '0.14');
            el.setAttribute('stroke-width', mine ? '2.6' : '1.3');
          });
        });
        c.addEventListener('mouseleave', () => {
          document.querySelectorAll('#chartBox [data-line]').forEach((el) => {
            el.setAttribute('opacity', '0.5');
            el.setAttribute('stroke-width', '1.3');
          });
        });
      });
      const allBtn = document.querySelector('[data-chips-all]');
      if (allBtn) allBtn.addEventListener('click', () => { hiddenSyms.clear(); paint(); });
      const noneBtn = document.querySelector('[data-chips-none]');
      if (noneBtn) noneBtn.addEventListener('click', () => {
        stockItems().forEach((it) => hiddenSyms.add(it.sym));
        paint();
      });
      const rr = $('rngRow');
      if (rr) rr.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => {
        range = RANGES.find((r) => r.id === b.dataset.r) || range;
        loadCurve();
      }));
      const pb = $('pfBtn'), pm = $('pfMenu');
      if (pb && pm) {
        pb.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = pm.classList.toggle('open');
          pb.setAttribute('aria-expanded', String(open));
          if (open) {
            const cur = pm.querySelector('a.on');
            if (cur) cur.scrollIntoView({ block: 'center' });
          }
        });
        pm.addEventListener('click', (e) => e.stopPropagation());
      }
    }
    document.addEventListener('click', () => {
      const pm = $('pfMenu'), pb = $('pfBtn');
      if (pm && pm.classList.contains('open')) { pm.classList.remove('open'); if (pb) pb.setAttribute('aria-expanded', 'false'); }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const pm = $('pfMenu'), pb = $('pfBtn');
      if (pm) { pm.classList.remove('open'); if (pb) pb.setAttribute('aria-expanded', 'false'); }
    });

    async function loadCurve() {
      const key = range.id;
      if (curveCache[key]) { curve = curveCache[key]; paint(); return; }
      curve = null; paint();
      try {
        const r = await fetch(`/api/basket?name=${encodeURIComponent(NAME)}&days=${range.days}`, { cache: 'no-store' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Could not load the curve.');
        curveCache[key] = d;
        curve = d;
      } catch (err) {
        curve = { dates: [], label: NAME, error: err.message };
      }
      paint();
    }

    (async () => {
      try {
        const [snap, bk, mine] = await Promise.all([
          fetch('/api/stocks', { cache: 'no-store' }).then((r) => r.json()),
          fetch(`/api/basket?name=${encodeURIComponent(NAME)}&days=${range.days}`, { cache: 'no-store' }).then(async (r) => {
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || `No such ${SCOPE_WORD[SCOPE]}.`);
            return d;
          }),
          fetch('/api/my/portfolios', { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : { portfolios: {} }))
            .catch(() => ({ portfolios: {} })),
        ]);
        sharedNames = snap.portfolios || [];
        myNames = Object.keys(mine.portfolios || {});
        allRows = (snap.stocks || []).filter((s) => !s.error);
        const set = new Set(bk.symbols || []);
        rows = allRows.filter((s) => set.has(s.symbol));
        curveCache[range.id] = bk;
        curve = bk;
        document.title = `${bk.label} — ${SCOPE_WORD[SCOPE]} — Tickr Lab`;
        paint();
      } catch (err) {
        $('main').innerHTML = `<div class="bezel card"><div class="core"><div class="error">${esc(err.message)} <a href="/" style="color:var(--accent)">Back to the screener</a>.</div></div></div>`;
      }
    })();
  </script>
</body>
</html>
