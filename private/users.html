<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Users — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    body { min-height: 100dvh; padding: 0 0 80px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 0 32px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 4% -8%, rgba(124, 156, 255, 0.13), transparent 62%),
        radial-gradient(50vw 42vw at 98% 4%, rgba(52, 211, 153, 0.10), transparent 64%); }

    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex;
                   justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%;
      padding: 6px 7px 6px 16px; border-radius: 999px; background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset);
    }

    h1 { margin: 22px 0 0; font-size: clamp(26px, 3vw, 34px); font-weight: 600;
         letter-spacing: -0.035em; line-height: 1.05; }
    .lede { margin: 10px 0 22px; max-width: 70ch; }

    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat > .core { padding: 18px 20px; }
    .stat .val { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .stat:nth-child(1) .val { color: var(--accent); }
    .stat:nth-child(2) .val { color: var(--green); }
    .stat:nth-child(3) .val { color: var(--accent-2); }
    .stat:nth-child(4) .val { color: var(--amber); }
    /* Switched off is a STATE, not an alarm. Amber already means "notice this,
       something is wrong or old" across this app and is spent here on the
       pending count, which genuinely wants a decision; an account the owner
       deliberately turned off wants nothing. */
    .stat:nth-child(5) .val { color: var(--muted); }
    .stat .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em;
                 color: var(--faint); margin-top: 6px; }
    @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } }

    .tbl > .core { padding: 4px 0 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 11px 18px;
             border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
    tbody tr:last-child td { border-bottom: none; }
    td { font-size: 13px; }
    td.email { font-family: var(--mono); font-size: 12.5px; letter-spacing: -0.02em; }
    td.when { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    td.act { text-align: right; }

    .uname { font-weight: 500; }
    .noname { color: var(--faint); }
    .role { display: inline-flex; padding: 2px 10px; border-radius: 999px;
            border: 1px solid; font-size: 10.5px; font-weight: 500; }
    .role.owner { color: var(--amber); border-color: rgba(251, 191, 36, 0.4);
                  background: rgba(251, 191, 36, 0.1); }
    .role.pending { color: var(--amber); border-color: rgba(251, 191, 36, 0.4); margin-left: 6px; }
    /* Accent rather than amber: how somebody signs in is a FACT about the
       account, not a status or a warning, and amber already means "notice
       this" everywhere else in this app. */
    .role.gsign { color: var(--accent); border-color: rgba(124, 156, 255, 0.4);
                  background: rgba(124, 156, 255, 0.1); margin-left: 6px; }
    .approve { font: 600 12px var(--sans); color: var(--green); background: rgba(52, 211, 153, 0.08);
               border: 1px solid rgba(52, 211, 153, 0.35); border-radius: 999px; padding: 5px 14px;
               cursor: pointer; transition: background 0.3s var(--ease); }
    .approve:hover { background: rgba(52, 211, 153, 0.16); }
    .approve:disabled { opacity: 0.4; cursor: default; }
    /* The badge and the button are both NEUTRAL, for the reason the stat is.
       The row is also dimmed as a whole, which is the one thing that reads at
       a glance down a list of twenty — a badge has to be looked for. */
    .role.off { color: var(--muted); border-color: var(--hair-2);
                background: rgba(255, 255, 255, 0.05); margin-left: 6px; }
    tr.offrow .uname, tr.offrow .email, tr.offrow .when { opacity: 0.55; }
    .onoff { font: 600 12px var(--sans); color: var(--muted);
             background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hair-2);
             border-radius: 999px; padding: 5px 14px; margin-right: 6px;
             cursor: pointer; transition: background 0.3s var(--ease); }
    .onoff:hover { background: rgba(255, 255, 255, 0.09); }
    .onoff:disabled { opacity: 0.4; cursor: default; }
    .role.member { color: var(--muted); border-color: var(--hair);
                   background: rgba(255, 255, 255, 0.03); }
    .you { margin-left: 8px; font-size: 10.5px; color: var(--faint); }
    .locked { color: var(--red); font-size: 11px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
           background: var(--green); margin-right: 7px; vertical-align: 1px; }

    .del {
      padding: 5px 12px; border-radius: 999px; cursor: pointer; line-height: 1;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03);
      color: var(--muted); font-family: var(--sans); font-size: 11.5px;
      transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .del:hover { color: var(--red); border-color: rgba(251, 113, 133, 0.4);
                 background: rgba(251, 113, 133, 0.12); }
    .del:disabled { opacity: 0.3; cursor: default; }
    .del:disabled:hover { color: var(--muted); border-color: var(--hair);
                          background: rgba(255, 255, 255, 0.03); }

    .note { margin: 16px 4px 0; line-height: 1.6; }
    .err { color: var(--red); font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark"><span class="wordmark">Tickr Lab</span></span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page">
    <h1>Users</h1>
    <p class="lede">
      Everyone with an account. Accounts are created by signing up, not here — new registrations
      wait as <b>pending</b> until you approve them, and this page is where that happens.
    </p>

    <div class="stats" id="stats"></div>
    <section class="bezel tbl"><div class="core" id="out">
      <p class="lede" style="padding: 20px 18px; margin: 0;">Loading…</p>
    </div></section>
    <p class="note" id="note"></p>
    <div class="err" id="err"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const when = (v) => {
      if (!v) return '—';
      const d = new Date(v);
      return isNaN(d) ? '—' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    };

    let me = null;

    async function load() {
      $('err').textContent = '';
      let data;
      try {
        const res = await fetch('/api/users', { cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (res.status === 403) { window.location.href = '/'; return; }
        data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load users.');
      } catch (e) {
        $('out').innerHTML = `<p class="lede" style="padding:20px 18px;margin:0">${esc(e.message)}</p>`;
        return;
      }

      const users = data.users || [];
      const admins = users.filter((u) => isAdminRole(u.role)).length;
      const active = users.filter((u) => u.activeSessions > 0).length;

      const pending = users.filter((u) => u.status === 'pending').length;
      const off = users.filter((u) => u.status === 'disabled').length;
      $('stats').innerHTML = [
        [users.length, 'Accounts'],
        [admins, admins === 1 ? 'Admin' : 'Admins'],
        [active, 'Signed in now'],
        [pending, 'Awaiting approval'],
        [off, 'Switched off'],
      ].map(([v, l]) => `<div class="bezel stat"><div class="core">
          <div class="val">${v}</div><div class="lbl">${l}</div></div></div>`).join('');

      $('out').innerHTML = `<table><thead><tr>
          <th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Last sign-in</th><th>Themes</th><th></th>
        </tr></thead><tbody>${users.map((u) => row(u)).join('')}</tbody></table>` +
        otherPortfoliosHtml(data.otherPortfolios || []);

      // Why a button may be disabled, said once rather than per row.

      $('note').innerHTML =
        'New registrations wait here as <b>pending</b> until approved — they cannot sign in before that, and Delete is how a request is declined. ' +
        '<b>Disable</b> is the reversible one: the account is signed out everywhere and cannot sign in, but its themes, views, saved layout and chat usage are all kept, so Enable puts the person back exactly where they were. ' +
        'Deleting an account destroys all of that and cannot be undone. ' +
        'Any account can be disabled except the one you are signed in as. An <b>admin</b> account cannot be <b>deleted</b> — change the role to member first — because that one cannot be undone.';
    }

    // 'owner' was renamed to 'admin' on 2026-09-26 and is still accepted on
    // read, exactly as the server does it.
    const isAdminRole = (r) => r === 'admin' || r === 'owner';

    function row(u) {
      const isMe = me && me.email && u.email === me.email;
      // Mirrors the two guards the server enforces, so a button is never
      // offered for something the server would refuse anyway.
      // Mirrors the server: NO admin may be deleted, not merely the last.
      const blocked = isMe || isAdminRole(u.role);
      const isOff = u.status === 'disabled';
      // DELIBERATELY NOT `blocked` — disable has ONE guard where delete has
      // two. An admin may be switched off (it is reversible and destroys
      // nothing); only the account you are signed in as may not, because that
      // would revoke your own session mid-request.
      //
      // Pending is excluded for a different kind of reason: that registration
      // already has Approve and Delete, and Enable on it would be a silent
      // second Approve that skips the welcome email approval exists to send.
      const noFlip = isMe || u.status === 'pending';
      return `<tr class="${isOff ? 'offrow' : ''}">
        <td class="uname">${u.name ? esc(u.name) : '<span class="noname">—</span>'}</td>
        <td class="email">${u.activeSessions > 0 ? '<span class="dot" title="Signed in"></span>' : ''}${esc(u.email)}${isMe ? '<span class="you">you</span>' : ''}</td>
        <td><span class="role ${isAdminRole(u.role) ? 'owner' : 'member'}">${esc(u.role)}</span>
            ${u.status === 'pending' ? '<span class="role pending">pending</span>' : ''}
            ${isOff ? '<span class="role off" title="Switched off by the owner — cannot sign in, and was signed out everywhere. Everything the account has saved is kept.">switched off</span>' : ''}
            ${u.google ? '<span class="role gsign" title="Google is linked to this account — they can sign in with it. Whether they also have a working password is not recorded.">Google</span>' : ''}
            ${u.lockedUntil ? `<div class="locked">locked until ${esc(new Date(u.lockedUntil).toLocaleTimeString())}</div>` : ''}</td>
        <td class="when">${esc(when(u.createdAt))}</td>
        <td class="when">${esc(when(u.lastSignIn))}</td>
        ${pfCell(u.portfolios)}
        <td class="act">${u.status === 'pending'
              ? `<button class="approve" data-approve="${u.id}" data-email="${esc(u.email)}">Approve</button> `
              : `<button class="onoff" data-flip="${u.id}" data-email="${esc(u.email)}"
                   data-to="${isOff ? 'active' : 'disabled'}"
                   ${noFlip ? 'disabled' : ''}>${isOff ? 'Enable' : 'Disable'}</button>`
            }<button class="del" data-id="${u.id}" data-email="${esc(u.email)}"
            ${blocked ? 'disabled' : ''}>Delete</button></td>
      </tr>`;
    }

    // The review column: what this account has built, at a glance, with the
    // full symbol lists in the tooltip — a read-only glance is the whole job.
    function pfCell(pfs) {
      if (!pfs || !pfs.length) return '<td class="when">—</td>';
      const label = pfs.map((p) => `${p.name} (${p.symbols.length})`).join(', ');
      const detail = pfs.map((p) => `${p.name}: ${p.symbols.join(', ') || 'empty'}`).join(' · ');
      return `<td class="when" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(detail)}">${esc(label)}</td>`;
    }

    // Personal portfolios saved under a key with no account row — the legacy
    // 'admin' cookie is the usual one. Surfaced so nothing escapes review.
    function otherPortfoliosHtml(list) {
      if (!list.length) return '';
      return '<p class="lede" style="padding:14px 18px;margin:0">' + list.map((o) =>
        `<strong>${esc(o.user)}</strong> (no account row): ` +
        esc(o.portfolios.map((p) => `${p.name} (${p.symbols.length})`).join(', '))).join('<br>') + '</p>';
    }

    $('out').addEventListener('click', async (e) => {
      const ap = e.target.closest('.approve');
      if (ap && !ap.disabled) {
        ap.disabled = true;
        $('err').textContent = '';
        try {
          const res = await fetch(`/api/users/${encodeURIComponent(ap.dataset.approve)}/approve`, { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Could not approve.');
          await load();   // the badge and button repaint from the fresh list
        } catch (err) {
          $('err').textContent = err.message;
          ap.disabled = false;
        }
        return;
      }
      const fl = e.target.closest('.onoff');
      if (fl && !fl.disabled) {
        const to = fl.dataset.to;
        // Confirmed only on the way OFF. Switching somebody back on restores
        // what they had and needs no second thought; switching them off ends
        // their session wherever they are, which does.
        if (to === 'disabled' && !window.confirm(
          `Switch off ${fl.dataset.email}? They are signed out everywhere and cannot sign in. `
          + 'Nothing they have saved is deleted, and you can switch them back on.')) return;
        fl.disabled = true;
        $('err').textContent = '';
        try {
          const res = await fetch(`/api/users/${encodeURIComponent(fl.dataset.flip)}/status`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ status: to }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Could not change that account.');
          await load();   // the badge, the dimming, the button and the count all repaint
        } catch (err) {
          $('err').textContent = err.message;
          fl.disabled = false;
        }
        return;
      }
      const b = e.target.closest('.del');
      if (!b || b.disabled) return;
      const email = b.dataset.email;
      if (!window.confirm(`Delete ${email}? They lose access immediately and this cannot be undone.`)) return;
      b.disabled = true;
      $('err').textContent = '';
      try {
        const res = await fetch(`/api/users/${encodeURIComponent(b.dataset.id)}`, { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not delete that account.');
        await load();
      } catch (err) {
        $('err').textContent = err.message;
        b.disabled = false;
      }
    });

    (async () => {
      try {
        const who = await (await fetch('/api/me', { cache: 'no-store' })).json();
        me = who.user || null;
        if (!who.admin) { window.location.href = '/'; return; }
      } catch { /* the API calls below will redirect if we are not allowed */ }
      await load();
    })();
  </script>
</body>
</html>
