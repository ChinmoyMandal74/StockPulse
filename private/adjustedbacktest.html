<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Adjusted backtest — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    /* Every class scoped under #ab or an #ab* id. Nine unscoped class names
       have captured later markup on this project; .card, .sub, .mk and .warn
       are all taken somewhere already. */
    body { min-height: 100dvh; padding: 0 0 70px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 0 20px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 4% -8%, rgba(94, 234, 212, 0.07), transparent 62%),
        radial-gradient(50vw 42vw at 98% 4%, rgba(251, 146, 60, 0.08), transparent 64%); }
    .bezel { border-radius: 26px; }

    header.top { display: flex; align-items: center; gap: 14px; padding: 26px 0 18px; flex-wrap: wrap; }
    header.top h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
    .spacer { margin-left: auto; }

    #abNote { color: var(--muted); font-size: 13px; margin: 0 0 22px; max-width: 84ch;
              line-height: 1.6; }
    #abNote b { color: var(--text); font-weight: 600; }

    /* THE CONTROLS SIT IN A PANEL, which is what /backtest does and what
       this page was asked to look like. Bare on the page background they
       read as debug chrome; in a card they read as the instrument. Both
       the shell and the core take the padding, exactly as .panel does
       there -- the doubled inset is what gives that card its weight. */
    /* THE MARGIN IS THE SHELL'S, THE PADDING IS BOTH. Put it on the bare
       class and the CORE carries it too -- 18px of dead space INSIDE the
       card, under the last control, which is what /backtest's own .panel
       does and is the one thing about it not worth copying. */
    section.abpanel { margin-bottom: 18px; }
    .abpanel { padding: 18px 20px; }
    .abrow { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
    .abrow + .abrow { margin-top: 18px; }
    .abrow .fld { display: flex; flex-direction: column; gap: 6px; }
    .abrow .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
                  color: var(--faint); }
    /* One rule for every control in the panel, #abName included -- it had
       its own lighter surface and sat visibly apart from its neighbours. */
    .abrow input[type="date"], .abrow input[type="text"], .abrow select {
      background: var(--surface-2); border: 1px solid var(--hair-2); color: var(--text);
      border-radius: 10px; padding: 9px 11px; font: 500 13px var(--mono); }
    .abrow select, .abrow input[type="text"] {
      font-family: var(--sans); font-size: 12.5px; }
    /* A FLOOR AND A CEILING, because this page has ten selects against
       /backtest s eight and they are wildly uneven on their own: "1Y" is
       three characters and a theme name is forty. Without the floor the
       row reads as ragged offcuts; without the ceiling one long option
       sets a 360px control and pushes the verdicts onto their own line. */
    .abrow select { min-width: 150px; max-width: 250px; }
    .abrow select:disabled { opacity: .45; cursor: not-allowed; }
    .abrow .btn { align-self: flex-end; }

    /* VERDICT-COLOURED WHEN PRESSED, the ladder /backtest already paints.
       Grey-on-grey could not say WHICH verdicts were chosen without
       reading all six, and the ladder is the one thing on this panel a
       reader checks at a glance. data-t is already on the button. */
    #abTiers { display: flex; gap: 7px; flex-wrap: wrap; }
    #abTiers button {
      border: 1px solid var(--hair-2); background: var(--surface-2); color: var(--muted);
      border-radius: 999px; padding: 8px 13px; font: 500 12.5px var(--sans);
      cursor: pointer; transition: all .18s var(--ease); }
    #abTiers button[aria-pressed="true"] { color: var(--void); font-weight: 600; }
    #abTiers button[data-t="Strong Buy"][aria-pressed="true"] { background: var(--green); border-color: var(--green); }
    #abTiers button[data-t="Buy"][aria-pressed="true"] { background: #6ee7b7; border-color: #6ee7b7; }
    #abTiers button[data-t="Buy with Risk"][aria-pressed="true"] { background: var(--amber); border-color: var(--amber); }
    #abTiers button[data-t="Hold"][aria-pressed="true"] { background: var(--muted); border-color: var(--muted); }
    #abTiers button[data-t="Avoid"][aria-pressed="true"] { background: #fda4af; border-color: #fda4af; }
    #abTiers button[data-t="Sell Immediately"][aria-pressed="true"] { background: var(--red); border-color: var(--red); }

    /* A GRID, NOT A WRAPPED ROW: the cards then share one width and read
       as a set rather than as boxes of whatever size their text happened
       to need. The key leads the value, as it does on /backtest -- the
       label is what you scan for and the number is what you stop on. */
    #abCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
               gap: 12px; margin: 0 0 18px; }
    #abCards .st { padding: 15px 17px; }
    #abCards .st .k { display: block; font-size: 10px; letter-spacing: .12em;
                      text-transform: uppercase; color: var(--faint); }
    #abCards .st .n { display: block; font: 600 24px/1.15 var(--mono); margin-top: 7px;
                      font-variant-numeric: tabular-nums; }
    #abCards .st .n.pos { color: var(--green); }
    #abCards .st .n.neg { color: var(--red); }

    /* The chart. Hand-rolled SVG, no library — the app's own call. It keeps
       its own aspect ratio (no preserveAspectRatio="none"), so SVG text is
       safe here, unlike every price chart in this app. */
    /* Saved runs. Scoped under #ab* like everything else on this page. */
    #abFrozen { display: none; border: 1px solid var(--hair-2); border-radius: 10px;
      background: var(--surface-2); padding: 10px 14px; margin: 0 0 14px;
      font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    #abFrozen b { color: var(--text); font-weight: 600; }
    body.frozen #abFrozen { display: block; }
    /* THE CONTROLS GO, NOT JUST THEIR EFFECT. A reader who cannot run
       anything must not be shown a Run button that 403s. */
    body.frozen #abPanel, body.frozen #abRunsBox, body.frozen .top .live { display: none; }
    body:not(.frozen) .top .shared { display: none; }

    #abSaveMsg { font-size: 12px; color: var(--muted); align-self: center; }
    #abSaveMsg.err { color: var(--red); }
    /* Scoped: `.err` is otherwise only defined on #abSaveMsg and #abMsg,
       so a bare class here would draw as ordinary body text. */
    #abTrades .err { color: var(--red); font-size: 12.5px; margin: 14px 0 0;
      line-height: 1.6; }
    #abName { min-width: 190px; }

    #abRunsBox { margin: 0 0 16px; }
    #abRunsBox > summary { cursor: pointer; font-size: 12.5px; color: var(--muted);
      padding: 6px 0; list-style: none; }
    #abRunsBox > summary::-webkit-details-marker { display: none; }
    #abRunsBox > summary::before { content: '\25B8'; display: inline-block; width: 14px;
      color: var(--faint); transition: transform .18s var(--ease); }
    #abRunsBox[open] > summary::before { transform: rotate(90deg); }
    #abRuns { width: 100%; border-collapse: collapse; font-size: 12px; }
    #abRuns th { text-align: left; font-size: 10px; color: var(--faint); font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px 6px 0;
      border-bottom: 1px solid var(--hair); white-space: nowrap; }
    #abRuns td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--hair);
      vertical-align: top; }
    #abRuns td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
    #abRuns td.num .pos { color: var(--green); } #abRuns td.num .neg { color: var(--red); }
    #abRuns .nm { color: var(--text); font-weight: 500; }
    #abRuns .how { color: var(--faint); font-size: 11px; display: block; margin-top: 2px; }
    #abRuns .act { white-space: nowrap; text-align: right; }
    #abRuns .act button, #abRuns .act a { font: 500 11px var(--sans); padding: 4px 8px;
      margin-left: 4px; border-radius: 7px; border: 1px solid var(--hair);
      background: none; color: var(--muted); cursor: pointer; text-decoration: none;
      display: inline-block; }
    #abRuns .act button:hover, #abRuns .act a:hover { color: var(--text); border-color: var(--hair-2); }
    #abRuns .act button.del:hover { color: var(--red); border-color: var(--red); }
    #abRunsMsg { font-size: 12px; color: var(--faint); padding: 8px 0; }

    #abChart { padding: 14px 16px 6px; }
    #abChart svg { width: 100%; height: 300px; display: block; }
    #abChart .gl { stroke: var(--hair); stroke-width: 1; }
    #abChart .ln { fill: none; stroke-width: 2; }
    #abChart .ln.basket { stroke: var(--accent); }
    #abChart .ln.market { stroke: var(--accent-2); }
    #abChart .ln.spy { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1.5; }
    #abChart text { fill: var(--faint); font: 500 10px var(--mono); }
    #abLegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted);
                padding: 2px 4px 10px; }
    #abLegend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid;
                  vertical-align: middle; margin-right: 6px; }
    /* A LEGEND ENTRY IS A BUTTON, so it has to stop looking like one of the
       page's filled buttons and start looking like the legend it replaced. */
    #abLegend button { font: inherit; color: inherit; background: none; border: 0;
                       padding: 2px 4px; border-radius: 6px; cursor: pointer; }
    #abLegend button:hover { background: rgba(255,255,255,.06); color: var(--text); }
    #abLegend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* OFF IS LEGIBLE, NOT INVISIBLE. A hidden line whose legend entry
       disappeared would be a control with no way back — the news ticker's
       rule. It stays, dimmed, with its rule struck through, so the entry
       says both what it is and that it is off. */
    #abLegend button[aria-pressed="false"] { color: var(--faint); }
    #abLegend button[aria-pressed="false"] i { border-top-style: dotted; opacity: .5; }
    #abLegend button[aria-pressed="false"] .lgv { text-decoration: line-through; }
    #abLegend .hint { color: var(--faint); align-self: center; }

    /* The honesty panel is NOT optional furniture — see the note in the file. */
    #abLimits { border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px;
                margin: 16px 0; background: var(--surface); }
    #abLimits h3 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase;
                   letter-spacing: .06em; color: var(--amber); }
    #abLimits ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px;
                   line-height: 1.7; }
    #abLimits b { color: var(--text); font-weight: 600; }

    #abWrap { overflow: auto; max-height: 62dvh; }
    #abTbl { border-collapse: separate; border-spacing: 0; width: 100%; }
    #abTbl th, #abTbl td { padding: 5px 9px; white-space: nowrap; font-size: 11.5px;
                           border-bottom: 1px solid var(--hair); }
    #abTbl td { font: 500 11.5px var(--mono); font-variant-numeric: tabular-nums;
                text-align: right; }
    #abTbl td.t { font-family: var(--sans); text-align: left; }
    #abTbl thead th { position: sticky; top: 0; z-index: 2; background: var(--surface);
      font: 600 10px var(--sans); color: var(--faint); text-transform: uppercase;
      letter-spacing: .05em; text-align: right; cursor: pointer; user-select: none; }
    #abTbl thead th.t { text-align: left; }
    #abTbl td a { color: var(--text); text-decoration: none; }
    #abTbl td a:hover { text-decoration: underline; }
    #abTbl .srt { color: var(--accent); }
    /* the rebalance trade log */
    #abTrades { margin: 16px 0 0; }
    #abTrades details { border: 1px solid var(--hair); border-radius: 10px;
                        margin-bottom: 8px; background: var(--surface); }
    #abTrades summary { cursor: pointer; padding: 9px 13px; font-size: 12.5px;
                        color: var(--text); list-style: none; }
    #abTrades summary::-webkit-details-marker { display: none; }
    #abTrades summary .d { font: 600 12px var(--mono); margin-right: 10px; }
    #abTrades summary .q { color: var(--faint); }
    #abTrades .body { padding: 2px 13px 11px; }
    #abTrades .tr { display: grid;
                    grid-template-columns: 62px minmax(0, 1.05fr) 78px minmax(0, 1.6fr) 78px 84px;
                    gap: 8px; font-size: 11.5px; padding: 3px 0;
                    border-top: 1px solid var(--hair); align-items: baseline; }
    #abTrades .tr .sym { font: 600 11.5px var(--mono); }
    /* THE COMPANY NAME, beside the ticker and in that order — the picks table
       further down the page is Symbol then Name, and a reader moving between
       the two should not have to re-learn which column is which.
       CLIPPED, NEVER WRAPPED, with the whole value on the cell's title: one
       wrapped name makes its row twice as tall, and a run holds a dozen
       blocks of them. The email log's rule, where an unbroken token once gave
       one row 300px. */
    #abTrades .tr .nm { color: var(--muted); overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
    #abTrades .tr .side.sell { color: var(--red); }
    #abTrades .tr .side.buy { color: var(--green); }
    /* NEUTRAL, and that is the point. Green and red here mean bought and
       sold — a direction of trade — and a position that simply carried on is
       neither. Colouring it would put a third claim in a column that makes
       only one. */
    #abTrades .tr .side.keep { color: var(--muted); }
    #abTrades .tr .side.open { color: var(--accent); }
    /* THE BOOK, AS A LIST. The rows under it say what CHANGED; this says what
       is held, which is a different question and the one that was asked
       twice. It leads each block because it is the answer. */
    #abTrades .book { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
                      padding: 9px 0 11px; border-bottom: 1px solid var(--hair);
                      margin-bottom: 4px; }
    #abTrades .book .bk-l { color: var(--faint); font-size: 10.5px; letter-spacing: 0.1em;
                            text-transform: uppercase; margin-right: 4px; }
    #abTrades .book .bk-s { font-family: var(--mono); font-size: 11.5px; color: var(--text);
                            background: rgba(255, 255, 255, 0.055); border-radius: 6px;
                            padding: 2px 7px; }
    #abTrades .book .bk-none { color: var(--muted); font-size: 12px; }
    #abTrades .tr .why { color: var(--muted); }
    /* TWO NUMBERS IN A ROW NEED A HEADER, or the reader has to guess which
       is which. `.rp` is the period return; `.r` is the one that was already
       there. */
    #abTrades .tr .rp { text-align: right; font: 600 11.5px var(--mono); }
    #abTrades .hdr { color: var(--faint); border-top: none; }
    #abTrades .hdr .rp, #abTrades .hdr .r { font: 600 9.5px var(--sans);
      text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
    #abTrades .tot { border-top: 1px solid var(--hair-2); margin-top: 2px;
      padding-top: 6px; }
    #abTrades .tot .why { color: var(--muted); }
    #abTrades .tot .rp { font-size: 12.5px; }
    #abTrades .tr .r { text-align: right; font: 500 11.5px var(--mono); }
    /* A NAME COLUMN IS THE FIRST THING TO GO ON A PHONE: the ticker is
       immediately beside it and the numbers are what the block is read for.
       The peers table stands its compare column aside below 620px for the
       same reason.
       THE TRACK GOES TO ZERO RATHER THAN THE CELL TO `display: none` —
       removing the item would let every cell after it auto-place one track
       to the left, which still renders and is silently the wrong column.
       The narrower fixed tracks fix something that was ALREADY WRONG and was
       found while measuring this: at 390px the five-track grid ran 49px past
       the viewport, because `1fr` is `minmax(auto, 1fr)` and the rule
       column's longest word held the grid open. */
    @media (max-width: 700px) {
      #abTrades .tr { grid-template-columns: 52px 0 58px minmax(0, 1fr) 62px 62px;
                      gap: 6px; }
    }
    #abTrades h3, #abBandNote h3 { font-size: 12px; margin: 18px 0 8px;
      text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
    #abBandNote { color: var(--muted); font-size: 12.5px; line-height: 1.7;
                  margin: 10px 0 0; }
    #abBandNote b { color: var(--text); font-weight: 600; }
    #abChart .ln.rebal { stroke: var(--amber); stroke-width: 1.5; }

    #abMsg { color: var(--muted); font-size: 13px; padding: 18px 4px; }
    #abMsg.err { color: var(--red); }
    @media (max-width: 720px) {
      .page { padding: 0 16px; }
      .abrow { gap: 14px; }
      .abpanel { padding: 14px 15px; }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <header class="top">
      <h1>Adjusted backtest</h1>
      <span class="count" id="abTook"></span>
      <span class="spacer"></span>
      <a class="btn live" href="/adjusted">Adjusted Advice</a>
      <a class="btn live" href="/admin">Admin</a>
      <a class="btn shared" href="/">Tickr Lab</a>
    </header>

    <div id="abFrozen"></div>

    <p id="abNote"></p>

    <section class="bezel abpanel" id="abPanel"><div class="core abpanel">
      <div class="abrow">
      <div class="fld"><span class="lbl">Start date</span>
        <input type="date" id="abDate" /></div>
      <div class="fld"><span class="lbl">Hold for</span>
        <select id="abHz"></select></div>
      <div class="fld"><span class="lbl">Rules</span>
        <select id="abRules"></select></div>
      <div class="fld"><span class="lbl">Theme</span>
        <select id="abTheme"><option value="">All stocks</option></select></div>
      <div class="fld"><span class="lbl">Verdicts</span>
        <div id="abTiers"></div></div>
      </div>

      <div class="abrow">
      <div class="fld"><span class="lbl">How many to hold</span>
        <select id="abTop">
          <option value="0">All of them</option>
          <option value="3">Top 3</option>
          <option value="5">Top 5</option>
          <option value="10">Top 10</option>
          <option value="15">Top 15</option>
          <option value="20">Top 20</option>
          <option value="30">Top 30</option>
        </select></div>
      <div class="fld"><span class="lbl">Rank by</span>
        <select id="abRank">
          <option value="cushion">Cushion (room to the exit)</option>
          <option value="random">At random (the control)</option>
        </select></div>
      <div class="fld"><span class="lbl">Rebalance</span>
        <select id="abEvery">
          <option value="0">Never — buy and hold</option>
          <option value="7">Every week</option>
          <option value="14">Every fortnight</option>
          <option value="30">Every month</option>
        </select></div>
      <div class="fld"><span class="lbl">On each rebalance</span>
        <select id="abMode">
          <option value="rerun">Re-run the rules</option>
          <option value="exit">Sell only on a downgrade</option>
        </select></div>
      <div class="fld"><span class="lbl">Cost</span>
        <select id="abCost">
          <option value="0">None</option>
          <option value="5">5 bps</option>
          <option value="10">10 bps</option>
          <option value="20">20 bps</option>
        </select></div>
      <button class="btn" id="abGo">Run</button>
      <div class="fld"><span class="lbl">Name this run</span>
        <input type="text" id="abName" maxlength="80" placeholder="optional" /></div>
      <button class="btn" id="abSave" disabled>Save run</button>
      <span id="abSaveMsg"></span>
      </div>
    </div></section>

    <details id="abRunsBox">
      <summary id="abRunsSum">Saved runs</summary>
      <table id="abRuns"><thead></thead><tbody></tbody></table>
      <div id="abRunsMsg"></div>
    </details>

    <div id="abCards"></div>

    <div class="bezel"><div class="core" id="abChart">
      <div id="abChartIn"></div>
      <div id="abLegend"></div>
    </div></div>

    <p id="abBandNote"></p>
    <div id="abTrades"></div>

    <div class="bezel"><div class="core">
      <div id="abWrap"><table id="abTbl"><thead></thead><tbody></tbody></table></div>
      <div id="abMsg"></div>
    </div></div>

    <!-- LAST ON THE PAGE (2026-09-30, owner's request). It sat under the
         chart, between the result and the evidence for it. It is still the
         only place that says what the run cannot support, and it is still
         unconditional — what moved is where it sits, not whether it is
         there, and there is a check that every one of its limitations is
         still on the page. -->
    <div id="abLimits"></div>
  </main>

  <!-- /wmark.js lives in private/ and gateAssets 401s it for a signed-out
       reader, so the boot loads it only in the live view. -->
  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var DATA = null, SORT = { key: 'ret', dir: -1 };
    var TIERS = ['Strong Buy', 'Buy', 'Buy with Risk', 'Hold', 'Avoid', 'Sell Immediately'];
    // The owner's default: Strong Buy ALONE. Adding Buy roughly triples the
    // basket and takes it most of the way to being the benchmark, which is
    // the documented reason the trend sweep's own result was hard to read.
    var chosen = { 'Strong Buy': true };

    function we(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // Reject the empty before coercing: Number(null) is 0 and finite.
    function n(v) { if (v == null || v === '') return null; var x = Number(v); return isFinite(x) ? x : null; }
    function pc(v, d) { var x = n(v); return x === null ? '—' : (x >= 0 ? '+' : '') + x.toFixed(d == null ? 1 : d) + '%'; }

    // ---- the chart -------------------------------------------------------
    // Three equal-weight curves on one shared axis, each rebased to 1.0 at
    // the start. The BASKET is what the rules picked; the UNIVERSE line is
    // what every stock with bars did over the same window, and it is the one
    // that answers "did the rules select" — the index is the flattering
    // comparison, because this universe is high-beta by construction.
    function chart() {
      var all = [];
      if (DATA.basket && DATA.basket.values.length) all.push({ c: 'basket', s: DATA.basket });
      if (DATA.rebalanced && DATA.rebalanced.values.length) {
        all.push({ c: 'rebal', s: DATA.rebalanced });
      }
      if (DATA.market && DATA.market.values.length) all.push({ c: 'market', s: DATA.market });
      if (DATA.spy && DATA.spy.values.length) all.push({ c: 'spy', s: DATA.spy });
      if (!all.length) { $('abChartIn').innerHTML = ''; $('abLegend').innerHTML = ''; return; }
      // A line the reader has switched off is dropped from the drawing AND
      // from the scale below. Leaving it in the scale is the version that
      // looks like it works and is not worth having: hiding the S&P is how
      // you get the other three to use the height, and a frozen axis gives
      // you back exactly the squashed chart you were trying to escape.
      var lines = all.filter(function (L) { return !hidden[L.c]; });

      var W = 1000, H = 300, PL = 44, PR = 12, PT = 12, PB = 24;
      var dates = DATA.basket.dates.length ? DATA.basket.dates : DATA.market.dates;
      var lo = Infinity, hi = -Infinity;
      lines.forEach(function (L) {
        L.s.values.forEach(function (v) { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } });
      });
      if (!isFinite(lo) || !isFinite(hi)) return;
      var pad = (hi - lo) * 0.08 || 0.02;
      lo -= pad; hi += pad;
      var x = function (i, len) { return PL + (len < 2 ? 0 : (i / (len - 1)) * (W - PL - PR)); };
      var y = function (v) { return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); };

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="equity curves">';
      for (var g = 0; g <= 4; g++) {
        var vv = lo + (hi - lo) * (g / 4);
        var yy = y(vv);
        svg += '<line class="gl" x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PR)
             + '" y2="' + yy.toFixed(1) + '" />';
        svg += '<text x="' + (PL - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end">'
             + ((vv - 1) * 100).toFixed(0) + '%</text>';
      }
      lines.forEach(function (L) {
        var v = L.s.values, len = v.length, d = '', open = false;
        for (var i = 0; i < len; i++) {
          if (v[i] == null) { open = false; continue; }
          d += (open ? 'L' : 'M') + x(i, len).toFixed(1) + ' ' + y(v[i]).toFixed(1) + ' ';
          open = true;
        }
        svg += '<path class="ln ' + L.c + '" d="' + d.trim() + '" />';
      });
      if (dates.length) {
        svg += '<text x="' + PL + '" y="' + (H - 6) + '">' + we(dates[0]) + '</text>';
        svg += '<text x="' + (W - PR) + '" y="' + (H - 6) + '" text-anchor="end">'
             + we(dates[dates.length - 1]) + '</text>';
      }
      svg += '</svg>';
      $('abChartIn').innerHTML = svg;

      var r = DATA.result;
      // THE LEGEND IS THE CONTROL (2026-10-04, owner: "give options on the
      // graph to show or hide the metric as needed"). It already names every
      // line and carries its colour, so a second row of tick boxes beside it
      // would be two places saying the same thing — the lab's era chips, in
      // a second place.
      var key = { basket: 'var(--accent)', rebal: 'var(--amber)',
        market: 'var(--accent-2)', spy: 'var(--muted)' };
      var btn = function (c, label, val) {
        var on = !hidden[c];
        return '<button type="button" data-line="' + c + '" aria-pressed="' + on + '"'
          + ' title="' + (on ? 'Hide' : 'Show') + ' this line">'
          + '<i style="border-color:' + key[c] + '"></i>'
          + '<span class="lgv">' + label + ' ' + val + '</span></button>';
      };
      $('abLegend').innerHTML =
        btn('basket', (DATA.top ? 'Top ' + DATA.top + ' held' : 'What the rules picked')
          + ' (' + DATA.basket.members + ')', pc(r.basket))
      + (DATA.rebalanced ? btn('rebal', 'Rebalanced', pc(r.rebalanced)) : '')
      + btn('market', 'Every stock, equal weight (' + DATA.market.members + ')', pc(r.market))
      + (DATA.spy ? btn('spy', 'S&amp;P 500', pc(r.spy))
        : '<span>' + we(DATA.spyError || 'No benchmark') + '</span>')
      + '<span class="hint">click a line to hide it</span>';
    }

    // WHICH LINES ARE OFF IS A PER-DEVICE READING CHOICE, not part of a run.
    // It is remembered the way the stock page remembers its chart layers and
    // /compare remembers its hide-matching toggle; it is deliberately NOT
    // stored on a saved run, which freezes the numbers rather than where
    // somebody happened to be looking — the pivot preset's own rule.
    var hidden = {};
    try { hidden = JSON.parse(localStorage.getItem('ab.hide') || '{}') || {}; } catch (e) { hidden = {}; }
    function toggleLine(c) {
      // HIDING THE LAST ONE IS REFUSED. An empty chart is not a view of
      // anything, and the reader would be left with no line to click back.
      if (!hidden[c]) {
        var onNow = ['basket', 'rebal', 'market', 'spy'].filter(function (k) {
          return !hidden[k] && document.querySelector('#abLegend [data-line="' + k + '"]');
        });
        if (onNow.length < 2) return;
      }
      if (hidden[c]) delete hidden[c]; else hidden[c] = 1;
      try { localStorage.setItem('ab.hide', JSON.stringify(hidden)); } catch (e) { /* private window */ }
      chart();
    }
    // Delegated, because the legend is rebuilt on every run.
    $('abLegend').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-line]');
      if (b) toggleLine(b.getAttribute('data-line'));
    });

    function cards() {
      var r = DATA.result, c = DATA.counts;
      var excess = (r.basket == null || r.market == null) ? null : r.basket - r.market;
      var items = [
        [DATA.top ? 'top ' + DATA.top : 'the picks', pc(r.basket), r.basket],
      ];
      if (r.rebalanced != null) items.push(['rebalanced', pc(r.rebalanced), r.rebalanced]);
      items.push(
        ['every stock', pc(r.market), r.market],
        ['excess', pc(excess), excess],
        ['picked', String(c.picked), null],
        ['held', String(c.held), null],
        ['no filings', String(c.noFilings + c.noCik), null]);
      if (r.turnover != null) {
        items.push(['turnover', r.turnover.toFixed(0) + '%', null]);
      }
      $('abCards').innerHTML = items.map(function (x) {
        var cls = x[2] == null ? '' : (x[2] >= 0 ? ' pos' : ' neg');
        return '<div class="bezel"><div class="core st">'
             + '<span class="k">' + we(x[0]) + '</span>'
             + '<span class="n' + cls + '">' + we(x[1]) + '</span></div></div>';
      }).join('');
    }

    // ---- what this is standing on ---------------------------------------
    // NOT optional furniture. One window is one observation, and this
    // project's research log records eight framings that came back flat —
    // a page that prints a positive excess without saying what it cannot
    // rule out is the failure the whole log exists to prevent.
    function limits() {
      var c = DATA.counts, w = DATA.window;
      $('abLimits').innerHTML = '<h3>What this run cannot tell you</h3><ul>'
      + '<li><b>This is ONE window — one observation.</b> It cannot separate the rules '
        + 'from luck, and this project’s research log has taken eight framings and '
        + 'found seven flat. Read a single positive excess as a coincidence until a '
        + 'sweep of many start dates says otherwise.</li>'
      + '<li><b>Survivorship is the ceiling, and it is not fixed here.</b> The pool is '
        + 'today’s ' + c.universe + ' tickers, so companies that went bankrupt or were '
        + 'acquired are absent from BOTH the picks and the benchmark. Perfect '
        + 'point-in-time fundamentals on a survivor-only pool is a better-measured '
        + 'biased answer.</li>'
      + '<li><b>What IS point-in-time:</b> every fundamental comes from filings '
        + 'published on or before ' + we(DATA.date) + ' (<code>filed</code>, not the period '
        + 'end — a quarter is not knowable until it is filed), and the quarters that '
        + 'no company files are re-derived from those same filings. Short interest is '
        + 'FINRA’s, settled on or before ' + we(w.shortCutoff) + ' — '
        + w.shortLagDays + ' days back, because a position is published about eight '
        + 'business days after it settles.</li>'
      + '<li><b>What is NOT:</b> the share FLOAT that short interest is divided by is '
        + 'today’s — no filing states one — and the company names and theme '
        + 'memberships are today’s. Both move slowly; neither is replayed.</li>'
      + '<li><b>' + (c.noFilings + c.noCik) + ' stocks were dropped, not imputed.</b> '
        + c.noCik + ' file nothing with the SEC (funds), and ' + c.noFilings + ' had no '
        + 'usable filing by that date. Falling back to today’s vendor figures is '
        + 'exactly the look-ahead this page exists to remove. Of those kept, '
        + c.noTtm + ' had no trailing year and ' + c.noCap + ' no market cap, so their '
        + 'verdicts rest on fewer inputs.</li>'
      + '<li><b>No dividends, and costs only if you asked for them.</b> '
        + (DATA.every
          ? 'Rebalanced every ' + DATA.every + ' days at ' + DATA.cost + ' bps, '
            + we(DATA.mode === 'exit' ? 'selling only on a downgrade' : 're-running the rules')
            + '. At a weekly rebalance across a hundred names, cost is often the '
            + 'difference between a positive and a negative result.'
          : 'Equal dollars at the start, held to ' + we(DATA.end) + ' with no rebalancing.')
        + '</li>'
      + '</ul>';
    }

    // ---- did the CUT do anything? ---------------------------------------
    // A top-N basket that lands at the 50th percentile of random baskets of
    // the same size is a cut that did nothing, and that is the number worth
    // reading before believing the ranking earned its place.
    function bandNote() {
      var r = DATA.result;
      // A CUT THAT DID NOT BIND IS NOT A CUT, and the page used to say
      // nothing at all in that case — the control read "Top 10" beside a
      // six-stock book and nothing joined the two. It is the correct
      // behaviour (you cannot hold ten stocks when six qualify) and it was
      // invisible, which is the half worth fixing.
      if (!DATA.top && DATA.topAsked > 0) {
        $('abBandNote').innerHTML = '<b>The Top ' + DATA.topAsked
          + ' cut had nothing to trim.</b> Only ' + DATA.picks.length + ' stock'
          + (DATA.picks.length === 1 ? '' : 's') + ' passed the verdicts you chose on '
          + we(DATA.date) + ', so every one of them is held and the ranking never '
          + 'ran. It is a ceiling, not a target \u2014 widen the verdicts, or start '
          + 'from a date with more names, to make it bite.';
        return;
      }
      if (!DATA.top || r.bandPct == null) { $('abBandNote').innerHTML = ''; return; }
      var verdict = r.bandPct >= 80 ? 'ahead of most of them'
        : r.bandPct <= 20 ? 'behind most of them' : 'indistinguishable from them';
      $('abBandNote').innerHTML =
        '<b>The cut, against luck.</b> Holding the top ' + DATA.top + ' by '
      + we(DATA.rank === 'random' ? 'a random draw' : 'cushion') + ' landed at the <b>'
      + r.bandPct + 'th percentile</b> of ' + r.bandTrials + ' random baskets of '
      + DATA.top + ' drawn from the same ' + DATA.picks.length + ' picks ('
      + pc(r.bandLo) + ' to ' + pc(r.bandHi) + ') — ' + verdict + '. '
      + '50 would mean the ranking did nothing.'
      + (DATA.rank !== 'random' && r.rankable < DATA.picks.length
        ? ' <b>Only ' + r.rankable + ' of ' + DATA.picks.length + ' could be ranked</b> '
          + 'on cushion at all, so the rest of the cut was arbitrary.' : '');
    }

    function trades() {
      // A rebalance that was ASKED for and produced nothing must not leave an
      // empty space: the owner reported exactly that — "why is the monthly
      // buy and sell not showing anymore" — against a run where the server
      // had failed silently.
      if (!DATA.trades || !DATA.trades.length) {
        $('abTrades').innerHTML = (DATA.every && DATA.rebalError)
          ? '<p class="err">Rebalancing did not run: ' + we(DATA.rebalError)
            + ' The buy-and-hold result above is unaffected.</p>'
          : '';
        return;
      }
      var open = true;
      // THE BOOK AS A LIST, at the head of every block. The rows below it say
      // what CHANGED at that date; this says what is HELD from it — a
      // different question, and the one actually asked: "what was the new
      // position on 1-April". Naming the kept and bought rows answers it only
      // if the reader adds them up, which is work the page should do.
      // A period return, which is always signed: it is a CHANGE, so it takes
      // the up/down colour the rest of the app gives a change. An em-dash
      // where the name has no price at one end of the period — a stock that
      // stopped trading has no period return, and 0.0% would claim it went
      // nowhere.
      var pr = function (v) {
        return v == null ? '<span class="na">\u2014</span>'
          : '<span class="' + (v >= 0 ? 'pos' : 'neg') + '">' + pc(v) + '</span>';
      };
      // THE NAME CELL, from the name the server already sends: `btTrades`
      // hangs one on every kept/bought/sold row and `picks` carries it for
      // the opening book, so nothing was added to the payload for this.
      // OMITTED where it has collapsed to the ticker — a fund, or a company
      // whose only stored name IS its symbol — because printing the same
      // word twice in two columns 70px apart reads as a fault. Called with
      // no arguments for the header, the total and the trimmed-list fillers,
      // which need the cell to hold the column open and nothing in it.
      var nmCell = function (sym, name) {
        var t = name && name !== sym ? String(name) : '';
        return '<span class="nm"' + (t ? ' title="' + we(t) + '"' : '') + '>'
          + we(t) + '</span>';
      };
      // The window a block's period covers, in words, so the two numbers in
      // each row are never ambiguous about which span they measure.
      var span = function (b, from) {
        if (!b || !b.to) return 'this period';
        return from + ' \u2192 ' + b.to + (b.toEnd ? ' (end)' : '');
      };
      var colHead = function (b, opening) {
        return '<div class="tr hdr"><span class="sym"></span>' + nmCell()
          + '<span class="side"></span>'
          + '<span class="why"></span><span class="rp">This period</span>'
          + '<span class="r">' + (opening ? '' : 'Since entry') + '</span></div>';
      };
      // THE BOOK'S OWN TOTAL, under the column it totals — not the mean of
      // the rows above it. The two differ by the cash the book may hold, by
      // the weights drifting in exit-only mode, and by the cost of the trade
      // that ends the period; claiming the rows add up to it would be a
      // small lie on the one line a reader checks.
      var totalRow = function (b, v) {
        if (!b) return '';
        return '<div class="tr tot"><span class="sym"></span>' + nmCell()
          + '<span class="side"></span>'
          + '<span class="why">The book over ' + we(span(b, b.from || b.d)) + '</span>'
          + '<span class="rp">' + pr(v) + '</span><span class="r"></span></div>';
      };
      var sumRet = function (v) {
        return v == null ? ''
          : '<span class="q"> \u00b7 ' + (v >= 0 ? '+' : '') + v.toFixed(1)
            + '% over the period</span>';
      };
      var bookLine = function (label, syms) {
        return '<div class="book"><span class="bk-l">' + we(label) + '</span>'
          + (syms.length
            ? syms.map(function (s) { return '<span class="bk-s">' + we(s) + '</span>'; }).join('')
            : '<span class="bk-none">nothing held \u2014 in cash until the next rebalance</span>')
          + '</div>';
      };
      // THE OPENING BOOK, which had no block at all: the log started at the
      // FIRST REBALANCE, so the positions taken on the start date were only
      // ever visible as ticks in the picks table further down. It is a block
      // like any other, and it is the one the reader looks for first.
      var openPicks = (DATA.picks || []).filter(function (p) { return p.selected; });
      // THE PERIOD IS THE SERVER'S, not derived here: it knows the trading
      // axis and the book's own value at each end, and the page does not.
      var op = DATA.opening || null;
      var opret = {};
      if (op) (op.members || []).forEach(function (m) { opret[m.sym] = m.pret; });
      var opening = '<details open><summary><span class="d">' + we(DATA.date)
        + '</span><span class="q">opening book \u00b7 ' + openPicks.length
        + ' position' + (openPicks.length === 1 ? '' : 's')
        // Beside the number, because this is where "why six and not ten?"
        // is actually asked.
        + (!DATA.top && DATA.topAsked > 0
          ? ' \u00b7 every stock that qualified, so the Top ' + DATA.topAsked
            + ' cut did not bind' : '')
        + '</span>' + sumRet(op && op.ret) + '</summary>'
        + '<div class="body">'
        + bookLine('Held from ' + DATA.date, openPicks.map(function (p) { return p.symbol; }))
        + colHead(op, true)
        + openPicks.map(function (p) {
          return '<div class="tr"><span class="sym">' + we(p.symbol) + '</span>'
            + nmCell(p.symbol, p.name)
            + '<span class="side open">opened</span>'
            + '<span class="why">' + we((p.action || '?') + (p.flag ? ' \u2014 ' + p.flag : ''))
            + '</span><span class="rp">' + pr(opret[p.symbol]) + '</span>'
            + '<span class="r"></span></div>';
        }).join('')
        + totalRow(op, op && op.ret)
        + '</div></details>';
      $('abTrades').innerHTML = '<h3>The book at every date</h3>' + opening
      + DATA.trades.map(function (t) {
        // UNDER A CUT A HOLDING CAN BE SOLD WITH ITS VERDICT INTACT — it was
        // ranked out, not downgraded. Without saying so the log reads as
        // selling a Hold to buy a Hold, which is a contradiction on its face.
        var reason = function (x, out) {
          if (out && x.ranked) {
            return 'Still ' + (x.action || '?') + ' — ranked below the top ' + DATA.top;
          }
          return (x.action || '?') + (x.flag ? ' — ' + x.flag : '');
        };
        // THE BOOK FIRST, then what left it. The block used to list only the
        // names that changed hands, so a holding that simply carried on was
        // invisible — the summary could say "held 2" above a single row.
        // Kept and bought together ARE the book at this date, which is what
        // makes the count above reconcile with the rows under it.
        var more = function (shown, n) {
          return n > shown
            ? '<div class="tr"><span class="sym"></span>' + nmCell()
              + '<span class="side"></span>'
              + '<span class="why" style="color:var(--faint)">\u2026and ' + (n - shown)
              + ' more, not listed.</span><span class="rp"></span>'
              + '<span class="r"></span></div>'
            : '';
        };
        // Kept and bought ARE the book going forward, so the list is built
        // from the same two arrays the rows are — it cannot disagree with
        // them. Capped lists are the one case it can fall short of `held`,
        // and it says so rather than looking complete.
        var bookSyms = t.kept.map(function (x) { return x.sym; })
          .concat(t.bought.map(function (x) { return x.sym; }));
        var book = bookLine('Held from ' + t.d, bookSyms)
          + (bookSyms.length < t.held
            ? '<div class="tr"><span class="sym"></span>' + nmCell()
              + '<span class="side"></span>'
              + '<span class="why" style="color:var(--faint)">\u2026and '
              + (t.held - bookSyms.length) + ' more held, not listed.</span>'
              + '<span class="rp"></span><span class="r"></span></div>'
            : '');
        var rows = colHead(t) + t.kept.map(function (x) {
          // "so far", never a realised figure: this position is still open,
          // and printing it the way a sale's return is printed would be the
          // more expensive kind of wrong.
          var held = x.days == null ? '' : 'held ' + x.days + ' session' + (x.days === 1 ? '' : 's')
            + (x.from ? ', since ' + x.from : '');
          return '<div class="tr"' + (held ? ' title="' + we(held) + '"' : '') + '>'
            + '<span class="sym">' + we(x.sym) + '</span>'
            + nmCell(x.sym, x.name)
            + '<span class="side keep">held</span>'
            + '<span class="why">' + we(reason(x, false)) + '</span>'
            + '<span class="rp">' + pr(x.pret) + '</span>'
            + '<span class="r">' + (x.ret == null ? '' : pc(x.ret)) + '</span></div>';
        }).join('') + more(t.kept.length, t.keptN)
        + t.bought.map(function (x) {
          return '<div class="tr"><span class="sym">' + we(x.sym) + '</span>'
            + nmCell(x.sym, x.name)
            + '<span class="side buy">bought</span>'
            + '<span class="why">' + we(reason(x, false)) + '</span>'
            + '<span class="rp">' + pr(x.pret) + '</span>'
            + '<span class="r"></span></div>';
        }).join('') + more(t.bought.length, t.boughtN)
        + t.sold.map(function (x) {
          return '<div class="tr"><span class="sym">' + we(x.sym) + '</span>'
            + nmCell(x.sym, x.name)
            + '<span class="side sell">sold</span>'
            + '<span class="why">' + we(reason(x, true)) + '</span>'
            // A sold position is gone at this mark, so it has no period
            // return — see btTrades for why one is not offered.
            + '<span class="rp"></span>'
            + '<span class="r">' + (x.ret == null ? '' : pc(x.ret)) + '</span></div>';
        }).join('') + more(t.sold.length, t.soldN)
        + totalRow(t, t.periodRet);
        var o = open; open = false;
        return '<details' + (o ? ' open' : '') + '><summary><span class="d">'
          + we(t.d) + '</span><span class="q">held ' + t.held + ' \u00b7 sold '
          + t.soldN + ' \u00b7 bought ' + t.boughtN + ' \u00b7 turnover '
          + (t.turnover == null ? '\u2014' : t.turnover.toFixed(0) + '%')
          + '</span>' + sumRet(t.periodRet)
          + '</summary><div class="body">' + book + rows + '</div></details>';
      }).join('')
      + '<p style="color:var(--muted);font-size:12px;line-height:1.6;margin:8px 2px 0">'
      + 'The first block is the book on the start date; each one after it is the book '
      + 'from that rebalance onward, listed in full at the top of the block. Under it, '
      + 'what changed: <b>held</b> and <b>bought</b> together are that book, and they '
      + 'add up to the count beside the date. A name '
      + 'that is kept is re-weighted rather than traded, so it moves dollars without '
      + 'being a trade \u2014 which is why the names will not add up to the turnover. '
      + 'The reason beside each is the verdict that fired for it on that date; for a '
      + 'sale, the one that disqualified it. A return beside a <b>held</b> row is what '
      + 'the position has done SO FAR, from the day it was bought to that date; beside '
      + 'a <b>sold</b> row it is what it did over the whole holding. '
      + '<b>This period</b> is the other question: what each name did from THIS date '
      + 'to the next rebalance, the last block running to the end of the window. A '
      + 'sold name has none \u2014 it is gone at this date, and what it went on to do '
      + 'without us is not a fact about the book. The total under that column is the '
      + 'book\u2019s own value over the period rather than the average of the rows '
      + 'above it: the two differ by any cash held, by the weights drifting in '
      + 'exit-only mode, and by the cost of the rebalance that ends the period. The '
      + 'periods tile the run with no gap, so compounding them gives the rebalanced '
      + 'return on the card above. The opening basket is the picks table above.</p>';
    }

    // ---- the picks -------------------------------------------------------
    var COLS = [
      ['symbol', 'Symbol', 't'], ['name', 'Name', 't'],
      ['action', 'Verdict then', 't'], ['flag', 'Rule that fired', 't'],
      ['type', 'Type', 't'], ['filed', 'Filings as of', 't'],
      ['priceThen', 'Price then', ''], ['priceNow', 'Price after', ''],
      ['ret', 'Return', ''], ['actionNow', 'Verdict now', 't'],
    ];
    function head() {
      $('abTbl').tHead.innerHTML = '<tr>' + COLS.map(function (c) {
        return '<th class="' + c[2] + (SORT.key === c[0] ? ' srt' : '') + '" data-k="'
             + c[0] + '">' + we(c[1]) + '</th>';
      }).join('') + '</tr>';
      [].forEach.call($('abTbl').querySelectorAll('thead th'), function (th) {
        th.addEventListener('click', function () {
          var k = th.getAttribute('data-k');
          if (SORT.key === k) SORT.dir = -SORT.dir; else { SORT.key = k; SORT.dir = -1; }
          head(); rows();
        });
      });
    }
    function rows() {
      var list = DATA.picks.slice().sort(function (a, b) {
        var x = a[SORT.key], y = b[SORT.key];
        // A blank sorts last whichever way the column is sorted.
        var xe = x == null || x === '', ye = y == null || y === '';
        if (xe && ye) return a.symbol < b.symbol ? -1 : 1;
        if (xe) return 1;
        if (ye) return -1;
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * SORT.dir;
        return (String(x) < String(y) ? -1 : 1) * SORT.dir;
      });
      $('abTbl').tBodies[0].innerHTML = list.map(function (p) {
        return '<tr>'
        + '<td class="t"><a href="/stock/' + we(p.symbol) + '" target="_blank" rel="noopener">'
          + we(p.symbol) + '</a></td>'
        + '<td class="t">' + we(p.name) + '</td>'
        + '<td class="t">' + we(p.action) + '</td>'
        + '<td class="t">' + we(p.flag) + '</td>'
        + '<td class="t">' + we(p.type) + '</td>'
        + '<td class="t">' + we(p.filed || '—') + '</td>'
        + '<td>' + (n(p.priceThen) == null ? '—' : p.priceThen.toFixed(2)) + '</td>'
        + '<td>' + (n(p.priceNow) == null ? '—' : p.priceNow.toFixed(2)) + '</td>'
        + '<td class="' + (p.ret >= 0 ? 'pos' : 'neg') + '">' + pc(p.ret) + '</td>'
        + '<td class="t">' + we(p.actionNow || '—') + '</td>'
        + '</tr>';
      }).join('');
      $('abMsg').textContent = list.length ? '' : 'No stock carried one of those verdicts on that date.';
      $('abMsg').className = '';
    }

    function note() {
      var common =
        'The <b>same rules</b> as the Advice column, replayed on a past date with every '
      + 'fundamental taken from <b>filings that were public on that date</b> and every '
      + 'technical rebuilt from the price bars. That is what lets it start in '
      + we(DATA.floor) + ' rather than two months ago: a filing carries the day it was '
      + 'published, where the vendor snapshot only carries today.';
      // The shared view drops the last sentence: it says "Research only" a
      // second time three lines under the banner, and it links to /backtest,
      // which a reader with no account cannot open. A dead link and a
      // repeated caveat are both worse than the shorter paragraph.
      $('abNote').innerHTML = RUNID ? common : common
        + ' <b>Research only</b> — nothing here reaches the screener, the Advice column or '
        + '<a href="/backtest">/backtest</a>, which is unchanged.';
    }

    function paintTiers() {
      $('abTiers').innerHTML = TIERS.map(function (t) {
        return '<button type="button" data-t="' + we(t) + '" aria-pressed="'
             + (chosen[t] ? 'true' : 'false') + '">' + we(t) + '</button>';
      }).join('');
      [].forEach.call($('abTiers').querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          var t = b.getAttribute('data-t');
          chosen[t] = !chosen[t];
          paintTiers();
        });
      });
    }

    // ---- saved runs ------------------------------------------------------
    // A FROZEN run, not a saved URL. The same parameters give a different
    // answer over time — the pool is today's universe, restatements arrive on
    // the nightly SEC rotation, and the float and theme memberships are
    // today's — so a link re-computes and a saved run does not. That is the
    // whole reason this exists: the thing you showed somebody is what they
    // see.
    var RUNID = (location.pathname.match(/^\/adjustedbacktest\/run\/([0-9a-f]{8,64})$/) || [])[1] || null;

    function stamp(ms) {
      var x = n(ms);
      if (x === null) return '';
      // Local time, deliberately: this is "when I saved it", read by whoever
      // has the link, and there is no market clock involved.
      return new Date(x).toLocaleString(undefined,
        { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    // What the run was set to, in one line, read off the stored row rather
    // than re-derived — the list and the frozen page must describe it the
    // same way.
    function howRun(r) {
      var bits = [r.horizon || '?', r.rules || 'Balanced'];
      if (r.theme) bits.push(r.theme);
      if (r.tiers) bits.push(r.tiers);
      if (r.topAsked) bits.push('top ' + r.topAsked + ' by ' + (r.rankBy || 'cushion'));
      if (r.everyDays) {
        bits.push('rebalanced every ' + r.everyDays + 'd'
          + (r.mode === 'exit' ? ', exit only' : '')
          + (r.costBps ? ', ' + r.costBps + ' bps' : ''));
      }
      return bits.join(' · ');
    }

    function runsRows(runs) {
      var tb = $('abRuns').querySelector('tbody');
      $('abRuns').querySelector('thead').innerHTML =
        '<tr><th>Run</th><th>Start</th><th style="text-align:right">Basket</th>'
        + '<th style="text-align:right">Universe</th><th>Saved</th><th></th></tr>';
      tb.innerHTML = runs.map(function (r) {
        var b = n(r.basketRet), m = n(r.marketRet);
        var url = '/adjustedbacktest/run/' + r.id;
        return '<tr data-id="' + we(r.id) + '">'
          + '<td><span class="nm">' + we(r.label || ('Run of ' + r.startDate)) + '</span>'
          + '<span class="how">' + we(howRun(r)) + '</span></td>'
          + '<td>' + we(r.startDate) + '</td>'
          + '<td class="num"><span class="' + (b >= 0 ? 'pos' : 'neg') + '">' + pc(b) + '</span></td>'
          + '<td class="num"><span class="' + (m >= 0 ? 'pos' : 'neg') + '">' + pc(m) + '</span></td>'
          + '<td>' + we(stamp(r.createdAt)) + '</td>'
          + '<td class="act"><a href="' + we(url) + '" target="_blank" rel="noopener">Open</a>'
          + '<button class="cp" data-url="' + we(url) + '">Copy link</button>'
          + '<button class="del">Delete</button></td>'
          + '</tr>';
      }).join('');

      [].forEach.call(tb.querySelectorAll('button.cp'), function (b) {
        b.addEventListener('click', function () {
          var full = location.origin + b.getAttribute('data-url');
          var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy link'; }, 1400); };
          // Clipboard access can be refused; showing the address is a worse
          // answer than copying it and a far better one than silence.
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(full).then(done, function () { window.prompt('Copy this link', full); });
          } else window.prompt('Copy this link', full);
        });
      });
      [].forEach.call(tb.querySelectorAll('button.del'), function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var nm = tr.querySelector('.nm').textContent;
          // CONFIRMED, because it cannot be undone and it breaks a link
          // somebody may already have been given.
          if (!window.confirm('Delete "' + nm + '"?\n\nThis cannot be undone, and any '
            + 'link to it stops working.')) return;
          b.disabled = true;
          fetch('/api/adjusted-backtest/runs/' + encodeURIComponent(tr.getAttribute('data-id')),
            { method: 'DELETE', credentials: 'same-origin' })
            .then(function (r) { return r.json().then(function (j) {
              if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
            .then(function () { loadRuns(); })
            .catch(function (e) { b.disabled = false; $('abRunsMsg').textContent = e.message; });
        });
      });
    }

    function loadRuns() {
      return fetch('/api/adjusted-backtest/runs', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var runs = (j && j.runs) || [];
          $('abRunsSum').textContent = runs.length
            ? 'Saved runs (' + runs.length + ')' : 'Saved runs';
          runsRows(runs);
          $('abRunsMsg').textContent = runs.length ? ''
            : 'None yet. Run a backtest, then press Save run to keep it.';
        })
        .catch(function () { $('abRunsMsg').textContent = 'Could not read the saved runs.'; });
    }

    function save() {
      if (!DATA) return;
      $('abSave').disabled = true;
      $('abSaveMsg').className = '';
      $('abSaveMsg').textContent = 'Saving…';
      fetch('/api/adjusted-backtest/runs', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: $('abName').value, data: DATA }),
      })
        .then(function (r) { return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
        .then(function (j) {
          $('abSaveMsg').textContent = 'Saved.';
          $('abSave').disabled = false;
          $('abName').value = '';
          var box = $('abRunsBox');
          box.open = true;                       // the thing just saved is in there
          loadRuns();
        })
        .catch(function (e) {
          $('abSave').disabled = false;
          $('abSaveMsg').className = 'err';
          $('abSaveMsg').textContent = e.message;
        });
    }

    // The frozen view. Everything below the banner is the live page's own
    // painters over the stored payload, so the shared run cannot drift from
    // what the owner saw — including the honesty panel, which is the half a
    // shareable page most needs.
    function openSaved(id) {
      document.body.classList.add('frozen');
      $('abMsg').textContent = 'Loading the saved run…';
      fetch('/api/adjusted-backtest/run/' + encodeURIComponent(id))
        .then(function (r) { return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
        .then(function (j) {
          DATA = j.data;
          document.title = (j.label ? j.label + ' — ' : '') + 'Saved backtest — Tickr Lab';
          $('abFrozen').innerHTML = '<b>' + we(j.label || ('Backtest from ' + DATA.date)) + '</b> — '
            + 'a saved run, frozen as it stood when it was saved on ' + we(stamp(j.savedAt)) + '. '
            + 'Running the same settings today would not necessarily give these numbers: '
            + 'the pool of stocks grows, company filings get restated, and the share counts '
            + 'and theme memberships are whatever they were on the day. '
            + '<b>Research only</b> — this is not advice, and the limitations below are part of it.';
          $('abTook').textContent = '';
          note(); cards(); chart(); bandNote(); limits(); trades(); head(); rows();
        })
        .catch(function (e) {
          $('abMsg').textContent = e.message;
          $('abMsg').className = 'err';
          $('abFrozen').textContent = 'This saved run is not available.';
        });
    }

    function load() {
      var tiers = TIERS.filter(function (t) { return chosen[t]; });
      if (!tiers.length) { $('abMsg').textContent = 'Pick at least one verdict.'; return; }
      var q = '?date=' + encodeURIComponent($('abDate').value)
        + '&horizon=' + encodeURIComponent($('abHz').value)
        + '&rules=' + encodeURIComponent($('abRules').value)
        + '&theme=' + encodeURIComponent($('abTheme').value)
        + '&top=' + encodeURIComponent($('abTop').value)
        + '&rank=' + encodeURIComponent($('abRank').value)
        + '&every=' + encodeURIComponent($('abEvery').value)
        + '&mode=' + encodeURIComponent($('abMode').value)
        + '&cost=' + encodeURIComponent($('abCost').value)
        + '&tiers=' + encodeURIComponent(tiers.join(','));
      $('abTook').textContent = 'running…';
      $('abMsg').textContent = 'Reading the archive. A cold run takes about a minute — '
        + 'it rebuilds every technical from bars and every fundamental from filings.';
      $('abMsg').className = '';
      var t0 = Date.now();
      fetch('/api/adjusted-backtest' + q, { credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
        .then(function (j) {
          DATA = j;
          note(); cards(); chart(); bandNote(); limits(); trades(); head(); rows();
          $('abTook').textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's'
            + (j.cached ? ' (cached)' : '');
          $('abSave').disabled = false;
          $('abSaveMsg').textContent = '';
          try { history.replaceState(null, '', location.pathname + q); } catch (e) { /* not fatal */ }
          if (window.trackLoad) window.trackLoad('adjustedbacktest');
        })
        .catch(function (e) {
          $('abTook').textContent = '';
          $('abMsg').textContent = e.message;
          $('abMsg').className = 'err';
        });
    }

    // ---- boot ------------------------------------------------------------
    // THE SHARED VIEW EXITS BEFORE ANY OF THE LIVE WIRING. A public reader
    // has no session, so /api/portfolios, /wmark.js and the activity beacon
    // would each 401 — noise in the console on the one page strangers see.
    if (RUNID) { openSaved(RUNID); return; }

    // The watermark is a private asset and signs a member's captures; it is
    // loaded here rather than in the markup so the shared view never asks
    // for it.
    var wm = document.createElement('script');
    wm.src = '/wmark.js';
    document.body.appendChild(wm);

    var p = new URLSearchParams(location.search);
    ['1M', '3M', '6M', '1Y'].forEach(function (h) {
      var o = document.createElement('option'); o.value = h; o.textContent = h;
      $('abHz').appendChild(o);
    });
    $('abHz').value = p.get('horizon') || '1Y';
    if (p.get('tiers')) {
      chosen = {};
      p.get('tiers').split(',').forEach(function (t) { chosen[t.trim()] = true; });
    }
    // A year back on a Monday is a sane default: long enough to have an
    // answer, recent enough that the filings are dense.
    var d = p.get('date');
    if (!d) {
      var back = new Date(Date.now() - 400 * 86400000);
      d = back.toISOString().slice(0, 10);
    }
    $('abDate').value = d;
    $('abDate').min = '2018-01-01';
    $('abDate').max = new Date(Date.now() - 32 * 86400000).toISOString().slice(0, 10);
    paintTiers();
    $('abGo').addEventListener('click', load);
    $('abSave').addEventListener('click', save);
    loadRuns();

    // The rule sets and themes come off endpoints the app already has, so
    // this page restates neither list.
    fetch('/api/portfolios', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var names = Object.keys((j && j.portfolios) || {}).sort();
        names.forEach(function (nm) {
          var o = document.createElement('option'); o.value = nm; o.textContent = nm;
          $('abTheme').appendChild(o);
        });
        if (p.get('theme')) $('abTheme').value = p.get('theme');
      })
      .catch(function () { /* the picker simply offers All */ });

    ['Balanced', 'Trend Rider', 'Dip Buyer', 'Aggressive', 'Max Risk'].forEach(function (nm) {
      var o = document.createElement('option'); o.value = nm; o.textContent = nm;
      $('abRules').appendChild(o);
    });
    $('abRules').value = p.get('rules') || 'Balanced';

    // The five new controls, restored from the address so a run can be sent.
    // THE DEFAULTS ARE THE OWNER'S OWN, so the page opens on the run they
    // actually make rather than on one nobody asked for. A cut of 10 and a
    // monthly rebalance also mean `abRank`, `abMode` and `abCost` open LIVE
    // rather than greyed, which `syncCtl` below works out for itself.
    [['abTop', 'top', '10'], ['abRank', 'rank', 'cushion'], ['abEvery', 'every', '30'],
      ['abMode', 'mode', 'rerun'], ['abCost', 'cost', '0']].forEach(function (x) {
      var v = p.get(x[1]);
      var el = $(x[0]);
      // An unknown value would leave the select blank and then send an empty
      // string, so fall back rather than trusting the address bar.
      var okv = [].some.call(el.options, function (o) { return o.value === v; });
      el.value = okv ? v : x[2];
    });
    // Ranking and the two rebalance knobs only mean something once there is
    // something to rank or a rebalance to make; a live control that cannot
    // change the answer reads as broken.
    function syncCtl() {
      $('abRank').disabled = $('abTop').value === '0';
      var off = $('abEvery').value === '0';
      $('abMode').disabled = off;
      $('abCost').disabled = off;
    }
    $('abTop').addEventListener('change', syncCtl);
    $('abEvery').addEventListener('change', syncCtl);
    syncCtl();

    if (p.get('date')) load();
    else {
      $('abMsg').textContent = 'Pick a start date and press Run.';
      $('abNote').innerHTML = 'The same rules as the Advice column, replayed on a past '
        + 'date with every fundamental taken from filings public on that date. '
        + '<b>Research only</b> — nothing here reaches the screener or the Advice '
        + 'column, and <a href="/backtest">/backtest</a> is unchanged.';
    }
  }());
  </script>
</body>
</html>
