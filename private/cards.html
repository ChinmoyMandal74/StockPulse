<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cards — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/wmark.js" defer></script>
  <style>
    /* The member room for the same cards the studio draws: controls in a bar
       above, one card below, one shape (the 4:5 post). No crop guide and no
       size picker — this is a way to read the screener, not a design tool. */
    body { min-height: 100dvh; padding: 0 0 60px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 6% -8%, rgba(52, 211, 153, 0.11), transparent 62%),
        radial-gradient(50vw 42vw at 96% 4%, rgba(124, 156, 255, 0.10), transparent 64%); }

    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex;
                   justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .island { pointer-events: auto; display: flex; align-items: center; gap: 8px;
      width: max-content; max-width: 100%; padding: 6px 7px 6px 16px; border-radius: 999px;
      background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair);
      box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }

    h1 { margin: 26px 0 0; font-size: clamp(24px, 3vw, 32px); font-weight: 600; letter-spacing: -0.035em; }
    .lede { margin: 8px 0 20px; font-size: 12.5px; max-width: 68ch; }

    /* the control bar */
    .bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px;
           padding: 16px 18px; margin-bottom: 18px; }
    .fld { display: flex; flex-direction: column; gap: 5px; }
    .fld label { font-size: 9.5px; font-weight: 500; text-transform: uppercase;
                 letter-spacing: 0.16em; color: var(--faint); }
    .bar select {
      appearance: none; -webkit-appearance: none; cursor: pointer;
      padding: 8px 30px 8px 12px; border-radius: 10px; min-width: 148px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.04);
      color: var(--text); font: 500 12.5px var(--sans);
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239aa3b2' stroke-width='1.4' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 12px center;
    }
    .bar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .bar .spacer { flex: 1 1 0; }
    #dlBtn { align-self: flex-end; }
    #dlMsg { width: 100%; margin: 2px 0 0; font-size: 11px; color: var(--faint); }

    /* the card, scaled to the column */
    .stagewrap { display: flex; justify-content: center; }
    /* the artboard itself is .s-art in cards.js; this page fixes the one
       shape it offers and gives it the page's own frame */
    #stage { height: 1350px; border-radius: 22px;
             box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9); }

    /* When the prices behind these cards were last pulled. The card prints the
       DATA's date; this says when that data arrived. */
    .freshline { margin: 0 0 16px; padding: 8px 12px; border-radius: 10px; font-size: 11.5px;
                 border: 1px solid var(--hair); background: var(--surface); color: var(--muted); }
    .freshline b { color: var(--text); font-weight: 600; }
    .freshline.stale { border-color: rgba(251, 191, 36, 0.32); background: rgba(251, 191, 36, 0.08);
                       color: var(--amber); }
    .freshline.stale b { color: var(--amber); }

    .err { color: var(--red); padding: 30px; font-size: 13px; }
    @media (max-width: 768px) { .page { padding: 0 14px; } .bar select { min-width: 132px; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.4v10.2"/><path d="m7.8 10.6 4.2 4.2 4.2-4.2"/><path d="M4.6 18.6h14.8"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark">Tickr Lab</span>
      </span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page">
    <h1>Cards</h1>
    <p class="lede">The screener, summarised — tonight's movers, a chart, and what the rules read.
      Save any card as an image to keep or share; every one carries the date it was built and the
      note that these are mechanical readings, not advice.</p>
    <p class="freshline" id="freshLine">Checking the data…</p>

    <section class="bezel bar-shell"><div class="core bar" id="bar"></div></section>

    <div class="stagewrap"><div id="stagewrap"><div id="stage" class="s-art"></div></div></div>
  </main>

  <script src="/action.js"></script>
  <script src="/cards.js"></script>
  <script src="/cardshot.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // One shape here, deliberately: the 4:5 post. The studio keeps the other
    // two, because choosing an aspect ratio is a publishing decision.
    const SIZE = { id: 'portrait', w: 1080, h: 1350 };
    // Three cards, not eight — the explainers and the announcement are the
    // brand's own voice and stay with the owner.
    const KINDS = [
      { id: 'movers', name: 'Movers' },
      { id: 'chart', name: 'Chart' },
      { id: 'advboard', name: 'Advice' },
    ];
    let kind = 'movers';
    let stocks = [];
    let myLists = {};
    let portfolioNames = [];

    // ---- the control bar, rebuilt per card kind --------------------------
    const S = (id, label, options, cur) =>
      `<div class="fld"><label for="${id}">${esc(label)}</label><select id="${id}">` +
      options.map(([v, t]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(t)}</option>`).join('') +
      '</select></div>';

    const scopeOptions = () => [['All', 'All screened']]
      .concat(portfolioNames.map((n) => [n, n]))
      .concat(Object.keys(myLists).map((n) => ['my:' + n, n + ' (yours)']));
    const sectorOptions = () => [['All', 'All sectors']]
      .concat(Cards.sectors(stocks).map((n) => [n, n]));
    const symOptions = () => stocks.slice().sort((a, b) => a.symbol.localeCompare(b.symbol))
      .map((s) => [s.symbol, s.symbol + (s.name ? ' — ' + s.name : '')]);
    const PERIODS = [['d', 'Day'], ['w1', 'Week'], ['w2', '2 weeks'], ['m1', '1 month'],
                     ['m3', '3 months'], ['m6', '6 months'], ['y1', '1 year']];

    // Control values survive a rebuild of the bar, so switching cards and
    // coming back does not reset what you picked.
    const state = {
      movPeriod: 'w1', movCmp: '', movCount: '10', movDir: 'up', movScope: 'All', movSector: 'All',
      chtMode: 'list', chtWin: 'm6', chtScope: 'All', chtLines: '5', chtSym: '', chtSector: 'All',
      advMode: 'board', advTier: 'Strong Buy', advSym: '', advScope: 'All', advProf: 'Balanced',
      advSector: 'All',
    };

    function barHtml() {
      let f = S('kind', 'Card', KINDS.map((k) => [k.id, k.name]), kind);
      if (kind === 'movers') {
        f += S('movPeriod', 'Time window', PERIODS, state.movPeriod);
        f += S('movCmp', 'Compare with', [['', 'Nothing']].concat(PERIODS), state.movCmp);
        f += S('movDir', 'Direction', [['up', 'Gainers'], ['down', 'Losers'],
                                       ['both', 'Either way'], ['split', 'Side by side']], state.movDir);
        f += S('movCount', 'How many', [['5', 'Top 5'], ['10', 'Top 10'], ['15', 'Top 15']], state.movCount);
        f += S('movScope', 'Within', scopeOptions(), state.movScope);
        f += S('movSector', 'Sector', sectorOptions(), state.movSector);
      } else if (kind === 'chart') {
        f += S('chtMode', 'Chart', [['list', 'A list vs the screen'], ['leaders', 'The leaders in a list'],
                                    ['stock', 'One stock']], state.chtMode);
        f += S('chtWin', 'Window', [['w1', 'Past week'], ['m1', 'Past month'], ['m3', 'Past three months'],
                                    ['m6', 'Past six months'], ['y1', 'Past year']], state.chtWin);
        if (state.chtMode === 'stock') f += S('chtSym', 'Stock', symOptions(), state.chtSym);
        else {
          f += S('chtScope', 'Within', scopeOptions(), state.chtScope);
          f += S('chtSector', 'Sector', sectorOptions(), state.chtSector);
        }
        if (state.chtMode === 'leaders') f += S('chtLines', 'How many lines',
          [['3', 'Top 3'], ['5', 'Top 5'], ['8', 'Top 8']], state.chtLines);
      } else {
        f += S('advMode', 'Show', [['board', "Tonight's board"], ['firing', "What's firing"],
                                   ['changed', 'What changed'], ['profiles', 'Five profiles, one stock'],
                                   ['tier', 'Everything at one verdict']], state.advMode);
        if (state.advMode === 'profiles') f += S('advSym', 'Stock', symOptions(), state.advSym);
        else {
          if (state.advMode === 'tier') f += S('advTier', 'Verdict',
            ActionRules.ACTIONS.slice().reverse().map((a) => [a, a]), state.advTier);
          f += S('advScope', 'Within', scopeOptions(), state.advScope);
          f += S('advSector', 'Sector', sectorOptions(), state.advSector);
          f += S('advProf', 'Rules', Cards.ADV_PROFILES.map((n) => [n, n]), state.advProf);
        }
      }
      return f + '<span class="spacer"></span>' +
        '<button class="btn btn-primary" id="dlBtn" title="Save this card as an image">' +
        '<svg class="ic ic-sm" aria-hidden="true"><use href="#i-download" /></svg>Save image</button>' +
        '<p id="dlMsg"></p>';
    }

    function wireBar() {
      $('kind').addEventListener('change', () => { kind = $('kind').value; paint(); });
      Object.keys(state).forEach((id) => {
        const el = $(id);
        if (!el) return;
        el.addEventListener('change', () => { state[id] = el.value; paint(); });
      });
      $('dlBtn').addEventListener('click', downloadPng);
    }

    // ---- the archive read the chart card needs ---------------------------
    const chartCache = {};
    let chartPending = null;
    function getBasket(days) {
      if (chartCache[days]) return chartCache[days];
      if (chartPending === days) return null;
      chartPending = days;
      fetch(`/api/basket?name=All&days=${days}`, { cache: 'no-store' })
        .then((r) => r.json())
        .then((d) => { chartCache[days] = d; chartPending = null; if (kind === 'chart') paint(); })
        .catch(() => { chartPending = null; });
      return null;
    }

    function paint() {
      $('bar').innerHTML = barHtml();
      wireBar();
      $('stage').classList.add('sz-' + SIZE.id);
      $('stage').innerHTML = '<div class="s-aura"></div>' +
        `<div class="s-in">${Cards.build(kind, { stocks, myLists, size: SIZE, opts: state, getBasket })}</div>`;
      fit();
    }
    function fit() {
      const w = document.querySelector('.page').clientWidth;
      const s = Math.min(w / SIZE.w, 1);
      $('stage').style.transform = `scale(${s})`;
      $('stagewrap').style.width = SIZE.w * s + 'px';
      $('stagewrap').style.height = SIZE.h * s + 'px';
    }
    window.addEventListener('resize', fit);

    // The rasteriser lives in cardshot.js — the studio, this page and the
    // phone all take the same shot; three copies of it was two too many.
    async function downloadPng() {
      const btn = $('dlBtn'), msg = $('dlMsg');
      btn.disabled = true;
      msg.textContent = 'Rendering…';
      try {
        const blob = await CardShot.shoot($('stage'), { w: SIZE.w, h: SIZE.h });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `tickrlab-${kind}-${new Date().toISOString().slice(0, 10)}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        msg.textContent = 'Saved ' + a.download;
      } catch (err) {
        msg.textContent = 'Could not save: ' + err.message + '. A screenshot still works.';
      }
      btn.disabled = false;
    }

    // Two different facts: when the prices were pulled, and the day they
    // belong to — the second is what a card prints. Amber past a day.
    function paintFresh(updatedAt, rows) {
      const el = $('freshLine');
      const t = Date.parse(updatedAt || '');
      const day = (rows || []).reduce((m, x) => (x && x.latestDate && x.latestDate > m ? x.latestDate : m), '');
      if (!isFinite(t)) {
        el.className = 'freshline stale';
        el.textContent = 'No refresh time on this data.';
        return;
      }
      const age = Date.now() - t;
      const mins = Math.round(age / 60000);
      const ago = mins < 60 ? mins + ' min ago'
        : mins < 60 * 36 ? Math.round(mins / 60) + 'h ago'
          : Math.round(mins / 1440) + ' days ago';
      el.className = 'freshline' + (age > 26 * 60 * 60 * 1000 ? ' stale' : '');
      el.innerHTML = `Prices refreshed <b>${esc(new Date(t).toLocaleString(undefined,
        { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</b>` +
        ` · ${esc(ago)}` + (day ? ` · cards are dated <b>${esc(day)}</b>` : '');
    }

    Cards.injectStyle();
    (async () => {
      try {
        const data = await fetch('/api/stocks', { cache: 'no-store' }).then((r) => r.json());
        if (data.error) throw new Error(data.error);
        stocks = (data.stocks || []).filter((s) => !s.error);
        paintFresh(data.updatedAt, stocks);
        portfolioNames = data.portfolios || [];
        try {
          const mine = await fetch('/api/my/portfolios', { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : { portfolios: {} }));
          myLists = mine.portfolios || {};
        } catch { myLists = {}; }
        if (stocks.length) { state.chtSym = stocks[0].symbol; state.advSym = stocks[0].symbol; }
        paint();
      } catch (err) {
        document.querySelector('.stagewrap').innerHTML =
          `<div class="err">Could not load: ${esc(err.message)} <a href="/" style="color:var(--accent)">Back to the screener</a>.</div>`;
      }
    })();
  </script>
</body>
</html>
