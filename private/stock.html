        `<span class="v">${nx.absMedian == null ? '—' : '±' + nx.absMedian.toFixed(1) + '%'}</span>` +
        `<span class="s">whichever way it went</span></div>`);
      // A HIT RATE WITHOUT ITS BASE RATE SAYS NOTHING — a stock that rises most
      // days hands a flattering number to a signal that knows nothing.
      const upPct = Math.round((nx.up / nx.n) * 100);
      figs.push(`<div class="fg"><span class="k">Rose after</span>` +
        `<span class="v">${upPct}%</span>` +
        `<span class="s">${nx.up} of ${nx.n}` +
        (st.base ? ` · ${st.base.upPct}% on an ordinary session` : '') + `</span></div>`);
      if (st.driftStat) {
        figs.push(`<div class="fg"><span class="k">Month after</span>` +
          `<span class="v${sgn(st.driftStat.median)}">${pc(st.driftStat.median)}</span>` +
          `<span class="s">from the reaction on, ${st.driftStat.n} quarters</span></div>`);
      }

      const xs = [[0, '−' + st.window.pre], [st.window.pre, 'report'],
        [st.window.pre + 1 + st.drift, '+' + st.drift], [st.window.pre + st.window.post, '+' + st.window.post]];
      const xlabels = xs.map(([k, t], i) =>
        `<span class="xl${t === 'report' ? ' report' : ''}` +
        `${i === 0 ? ' first' : ''}${i === xs.length - 1 ? ' last' : ''}"` +
        ` style="left:${g.xAt(k).toFixed(2)}%;top:100%">${t}</span>`).join('');
      const ylabels = [g.hi, 0, g.lo].map((v) =>
        `<span class="yl" style="top:${g.yAt(v).toFixed(2)}%">` +
        `${Math.round(v) === 0 ? '0%' : pc(v, 0)}</span>`).join('');

      // The split, worded so a thin side teaches the real fact rather than
      // printing a median of one.
      const splitBits = [];
      if (nx.beat) {
        splitBits.push(nx.beat.median != null
          ? `after a beat (${nx.beat.n}) the median is <b>${pc(nx.beat.median)}</b>`
          : `only ${nx.beat.n} were beats`);
      }
      if (nx.miss) {
        splitBits.push(nx.miss.median != null
          ? `after a miss (${nx.miss.n}) <b>${pc(nx.miss.median)}</b>`
          : `misses are rare here — ${nx.miss.n} of ${nx.n}, too few to summarise`);
      }

      const notes = [];
      notes.push(`<b>${st.n} quarters</b> drawn, ${st.from} to ${st.to}. Each line is one report, ` +
        'rebased to its own closing price on the day; the bold line is the median and the band the ' +
        'middle half.');
      notes.push('Nearly every company here reports <b>after the close</b>, so the market’s answer ' +
        'is the <b>next</b> session — that is the step at the dashed line, and the window stops at ' +
        `+${st.window.post} sessions so it does not run into the following report.`);
      if (splitBits.length) notes.push(splitBits.join('; ') + '.');
      notes.push('A few dozen quarters is a small sample and this is a <b>description of what ' +
        'happened</b>, not evidence of what will. Drift after earnings is untested on this data.');

      return '<div id="around">' +
        '<div class="ahead"><h3>Around earnings</h3>' +
        `<span class="n">${st.n} quarters</span><span class="sp"></span>` +
        '<button class="tog" id="aroundTog" type="button"></button></div>' +
        '<div id="aroundBody">' +
        `<div class="figs">${figs.join('')}</div>` +
        `<div class="plot">${g.svg}${xlabels}${ylabels}</div>` +
        `<p class="note">${notes.join(' ')}</p>` +
        '</div></div>';
    }

    function paintAround() {
      const b = document.getElementById('aroundBody');
      const t = document.getElementById('aroundTog');
      if (!b || !t) return;
      const on = aroundOn();
      b.hidden = !on;
      // Labelled with the direction it will GO, the read-only note's rule.
      t.textContent = on ? 'Hide' : 'Show';
      t.setAttribute('aria-expanded', on ? 'true' : 'false');
    }
    function wireAround() {
      const t = document.getElementById('aroundTog');
      if (!t) return;
      t.addEventListener('click', () => {
        try { localStorage.setItem(AROUND_KEY, aroundOn() ? '0' : '1'); } catch (e) { /* private window */ }
        paintAround();
      });
      paintAround();
    }

    // The dates that qualify every figure in the Fundamentals section, named
    // SEPARATELY rather than fused into one "as of" — the Price pulled
    // column's rule, where conflating "we asked" with "something came back"
    // hid the staleness the column existed to show. Four different facts:
    // the period the figures cover, when the company announced it, when the
    // next one is due, and when we last pulled.
    //
    // THE PERIOD IS THE VENDOR'S OWN and is rounded to month end for a
    // 52/53-week filer (Micron reads 31 May against a filed 28 May), so it
    // is right for these figures and must not be printed against a filed
    // one. Nothing from the SEC card belongs in this line.
    // Rewrites the Fundamentals caption in place, once the filings land.
    // Text only: the caption is one node, and rebuilding the section would
    // throw away the reader's scroll for a sentence.
    //
    // THE FILING DATE IS PASSED IN, never reached for. `secData` is a local
    // of the boot IIFE just as `payload` is, so a script-scope helper
    // reading it saw `undefined` and the clause silently never appeared —
    // the same trap twice in one change, which is why nothing here now
    // depends on what scope it happens to be called from.
    let fundFiled = null;
    function paintFundCaption(filed) {
      if (filed !== undefined) fundFiled = filed || null;
      const secs = [...document.querySelectorAll('.rc-sec')];
      const f = secs.find((x) => /fundamentals/i.test(
        (x.querySelector('.rc-sec-h') || {}).textContent || ''));
      const cap = f && f.querySelector('.rc-cap');
      if (cap) cap.textContent = fundDates(stock, earnRows, profilePulledAt, fundFiled);
    }

    // Takes the two things it reads rather than `payload`, which is a LOCAL
    // of the boot IIFE — paintFundCaption lives at script scope, so calling
    // it with `payload` threw straight into loadSec's catch and the clause
    // silently never appeared. The documented trap that took the whole
    // chart down once already with paintChart.
    function fundDates(s, earnings, pulledAt, filed) {
      const d = (v) => {
        if (!v) return null;
        // Parsed at local NOON: a bare yyyy-mm-dd is UTC midnight and renders
        // as the day before west of Greenwich — the card module's own trap.
        const t = /^\d{4}-\d{2}-\d{2}$/.test(String(v))
          ? new Date(String(v) + 'T12:00:00') : new Date(v);
        return Number.isFinite(t.getTime())
          ? t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          : null;
      };
      const parts = [];
      const ttm = d(s.mostRecentQuarter);
      // Without the period there is nothing to qualify, so the line does not
      // open with a half-claim — it simply says less.
      if (ttm) parts.push('Trailing twelve months to ' + ttm);
      // Only when it is NOT December: four companies in five end their year
      // then, and saying so is noise. It earns its place on the fifth, where
      // it explains why "Q3" ended in May.
      const fy = s.fiscalYearEnd;
      if (fy && !/-12-3[01]$/.test(String(fy))) {
        const t = /^\d{4}-\d{2}-\d{2}$/.test(String(fy))
          ? new Date(String(fy) + 'T12:00:00') : null;
        if (t) parts.push('fiscal year ends ' + t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
      }
      // The announcement, from the stored quarters the page already holds —
      // a different fact from the period, and measured 23-29 days after it.
      // `readEarnings` RENAMES on the way out: the rows carry `date` and
      // `time`, not the table's `d` and `reported`. Reading the column names
      // gives undefined and the clause silently vanishes — the same trap as
      // readScreens returning `group` rather than the column's `grp`.
      const today = new Date().toISOString().slice(0, 10);
      const last = (earnings || []).find((e) => e && e.date && e.date <= today);
      if (last) {
        const when = d(last.date);
        if (when) {
          const t = String(last.time || '').trim();
          parts.push('reported ' + when + (t ? ', ' + t.toLowerCase() : ''));
        }
      }
      // TWO things this clause got wrong, both reported against Loews (L),
      // whose line read "next due 8 Sept 2026" three weeks after that date.
      //
      // `nextEarningsEstimated` means WE derived it — the last report plus 91
      // days — rather than the vendor confirming it. The Next Earn column has
      // always marked that with a leading `~`; this line stated the estimate
      // as a fact. And a date in the PAST cannot be "next due" at all.
      // Measured on the live screen the day it was found: 51 of 1,188 rows
      // carry a next-earnings date that has passed and EVERY ONE of them is
      // an estimate — a confirmed date never goes stale, our +91 guess lapses
      // the moment the real report slips past it. So the honest statement is
      // about our own record rather than about the company, which may well
      // have reported without the vendor telling us.
      // THE PAGE WAS CONTRADICTING ITSELF. For VNO this caption said
      // "reported 4 May 2026" while the SEC EDGAR card further down the same
      // page showed the 10-Q for the quarter to 30 June, filed 3 August —
      // which is what the owner checked against Google. The filings are
      // already fetched for that card, so saying it costs nothing.
      //
      // It NAMES the filing rather than replacing the date: the figures in
      // this group really are the vendor's, struck at the vendor's date, and
      // relabelling them with a filing date they do not come from would be a
      // worse kind of wrong than being late.
      let filedClause = false;
      if (last && filed && filed > last.date) {
        const gap = Math.round(
          (new Date(filed + 'T12:00:00') - new Date(last.date + 'T12:00:00')) / 86400000);
        if (gap > RowCard.SEC_BEHIND_DAYS) {
          parts.push('but the company filed with the SEC on ' + d(filed)
            + ', which the earnings feed has not recorded');
          filedClause = true;
        }
      }
      const nd = s.nextEarningsDate;
      const next = d(nd);
      if (next) {
        const about = s.nextEarningsEstimated ? 'about ' : '';
        if (String(nd) >= today) parts.push('next due ' + about + next);
        // A LAPSED estimate says the same thing as the clause above it, and
        // says it worse: "a report was due and has not arrived" when we have
        // just named the filing that did arrive. Live on VNO the two even
        // landed on the SAME DAY — the +91 estimate from 4 May is 3 Aug, and
        // the 10-Q really was filed 3 Aug — so the line read as a
        // contradiction. Where the filing is known, it is the better fact.
        else if (!filedClause) parts.push('due ' + about + next + ', not yet recorded');
      }
      const pulled = pulledAt;
      if (pulled) {
        const days = Math.floor((Date.now() - Number(pulled)) / 86400000);
        parts.push('pulled ' + (days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'));
      }
      return parts.join(' · ');
    }

    // ---- Announced (SEC) ---------------------------------------------
    //
    // THE THIRD DATE, and the one the screener has that this page did not.
    // It is NOT a FIELD_SPEC row: `secLastResults` is stamped client-side
    // from a separate endpoint and is never on the snapshot, so a FIELD_SPEC
    // entry would print an em-dash on the tiles, the phone and /compare —
    // which is exactly what `extra` exists for.
    //
    // `after: 'Reported'` because this value is READ AGAINST that one: it is
    // marked when it runs ahead of it, and appended it would land twenty-five
    // rows below the only number it can be compared with.
    //
    // The decision is `RowCard.announcedSec`, shared with the screener's
    // column — the wrong-channel rule (a company that announces under Item
    // 7.01 has a 2.02 from 2016, and printing it here would read as "last
    // reported 2016") is the kind of judgement that silently diverges when
    // it is written twice.
    const ANN_LABEL = 'Announced (SEC)';
    function annRow(pending) {
      const v = RowCard.announcedSec(stock, { pending: pending });
      return { k: ANN_LABEL, t: v.t, c: v.c, title: v.title, after: 'Reported' };
    }

    // The filings land after the first paint, so the row is drawn with a
    // "still reading" dash and filled in here — the caption's own bargain,
    // and for the same reason: rebuilding the section would throw away the
    // reader's place for one value.
    function paintAnnRow() {
      const v = annRow(false);
      [...document.querySelectorAll('.rc-row')].forEach((row) => {
        const k = row.querySelector('.rc-k');
        if (!k || k.textContent !== ANN_LABEL) return;
        const val = row.querySelector('.rc-v');
        if (!val) return;
        val.textContent = v.t;
        val.className = 'rc-v ' + (v.c || '');
        row.title = v.title;
      });
    }

    function companyRows(c) {
      if (!c) return [];
      const rows = [];
      if (c.employees != null && isFinite(c.employees)) {
        rows.push({ k: 'Employees', t: Number(c.employees).toLocaleString() });
      }
      if (c.website) {
        rows.push({ k: 'Website', t: String(c.website).replace(/^https?:\/\//, '').replace(/\/$/, ''),
                    href: c.website });
      }
      return rows;
    }

    // ---- similar stocks ------------------------------------------------
    // Descriptive, and it has to stay that way: this is who else is on the
    // screen measured the same way, never a list of better alternatives. So
    // there is no ordering by return, no tick on a "winner", and the note under
    // the table says so in as many words.
    function peersCard(p, sym) {
      if (!p || !p.rows || !p.rows.length) return '';
      // `na` means the value is MISSING, not that it has no colour — a price
      // and a market cap come back with an empty class and must not be drawn
      // faint as though they were em-dashes.
      const cell = (c) => `<td class="${c ? (c.c || '') : 'na'}">${esc(c ? c.t : '—')}</td>`;
      const how = p.byName ? 'closest in size' : 'largest first';
      // Name the rule the table actually used. A peer list that silently
      // widened its definition would be the one place in this app that does
      // not say which cut is on screen.
      // NAMES WHAT IT MEASURED, and nothing more. Co-movement is not the same
      // business — Bright Horizons turns up beside DraftKings — so this must
      // not be worded as "similar companies". It says they moved alike,
      // because that is the only thing that was checked.
      const basis = p.basis === 'moves'
        ? (p.thin != null
          ? `Only ${p.thin} other${p.thin === 1 ? '' : 's'} in <b>${esc(p.industry)}</b>, so these are the
             <b>${esc(p.group)}</b> stocks whose price has moved most like ${esc(sym)} over the past year.`
          : `No industry recorded for ${esc(sym)} yet, so these are the <b>${esc(p.group)}</b> stocks whose
             price has moved most like it over the past year.`)
        : p.basis === 'industry'
        ? `Others in <b>${esc(p.group)}</b>, ${how} — ${p.total} in the industry.`
        : p.thin != null
          ? `Only ${p.thin} other${p.thin === 1 ? '' : 's'} in <b>${esc(p.industry)}</b>, so this is
             <b>${esc(p.group)}</b> instead, ${how} — ${p.total} in the sector.`
          : `No industry recorded for ${esc(sym)} yet, so this is <b>${esc(p.group)}</b>,
             ${how} — ${p.total} in the sector.`;
      // One row builder for both, so the anchor cannot drift from the peers
      // in markup any more than it can in formatting. `me` is the only
      // difference and it changes exactly three things: the tint, a name
      // that is not a link to the page you are already on, and no `vs` pill
      // — comparing a stock with itself is not a comparison.
      const rowHtml = (r, me) => `<tr${me ? ' class="me"' : ''}>
        <td class="nm">${me
          ? `<span class="self">${esc(r.name)}</span>`
          : `<a class="namelink" href="/stock/${encodeURIComponent(r.symbol)}">${esc(r.name)}</a>`}
          <span class="sym">${esc(r.symbol)}</span>${me ? '<span class="here">this stock</span>' : ''}</td>
        ${cell(r.Price)}${cell(r.Today)}${cell(r['1Y'])}${cell(r['Market Cap'])}${cell(r['Fwd P/E'])}
        <td class="av ${r.Advice ? (r.Advice.c || '') : 'na'}"${
          r.why ? ` title="${esc(r.why)}"` : ''}>${esc(r.Advice ? r.Advice.t : '—')}</td>
        <td class="cmp">${me ? '' : `<a class="rng" href="/compare/${encodeURIComponent(sym)}/${
          encodeURIComponent(r.symbol)}" title="Open ${esc(r.symbol)} beside ${esc(sym)} — every field, side by side">vs</a>`}</td>
      </tr>`;
      // An older server sends no `self`; the table simply opens with the
      // peers, as it did before. Deploy order is not a thing to think about.
      const body = (p.self ? rowHtml(p.self, true) : '') +
        p.rows.map((r) => rowHtml(r, false)).join('');
      return `
        <section class="bezel card" id="peers" data-jump="Similar stocks" data-icon="i-nodes"><div class="core">
          <div class="sec-h"><h2>Similar stocks</h2></div>
          <p class="summary">${basis}</p>
          <div class="ptab"><table>
            <thead><tr><th>Company</th><th>Price</th><th>Today</th><th>1Y</th>
              <th>Market cap</th><th>Fwd P/E</th><th>Advice</th><th></th></tr></thead>
            <tbody>${body}</tbody>
          </table></div>
          <p class="note">${p.basis === 'moves'
            ? 'Ranked by how closely each one’s daily returns tracked this stock over the past year. '
              + 'Moving together is not the same as being the same business — it is the closest reading '
              + 'available when an industry holds too few companies to compare within.'
            : `Same ${p.basis}, ranked by ${p.byName ? 'how close each one is in market cap' : 'size'}.`}
            It is who else is on this screen measured the same way — not a ranking, and not a list of
            better alternatives. Advice is the Balanced rule set; hover it for the rule that fired.
            A dash under Fwd P/E is a company with no positive forward earnings, or none reported —
            a multiple off a loss is arithmetic, not cheapness.</p>
        </div></section>`;
    }

    // ---- the earnings rug --------------------------------------------------
    //
    // One tick per report, under the plot. It answers a single question — "was
    // that gap earnings?" — and deliberately nothing else: the aggregate lives
    // in the Around earnings block further down.
    //
    // SELF-GATING rather than range-gated: it draws whatever falls inside the
    // window and hides when nothing does, so a 1W chart is clean without a
    // rule about which ranges may have it, and a report that DID land in a
    // short window is still shown.
    let showEarnRug = false;
    const RUG_KEY = 'stock.earnrug';
    // OFF BY DEFAULT, like the other two (the owner, 2026-09-29). `=== '1'`
    // rather than `!== '0'`: someone who deliberately switched it ON has '1'
    // stored and keeps it, while someone who never touched it now starts
    // clean. That chart carries the price, two averages, up to five
    // overlays, the trend ribbon, an RSI pane and a volume pane before any
    // of these three.
    try { showEarnRug = localStorage.getItem(RUG_KEY) === '1'; } catch (e) { /* private window */ }

    // The ceiling for the bar heights. The 90th percentile of what is actually
    // in view, floored at 3% -- a robust ceiling rather than the maximum, for
    // a plain reason: one enormous quarter would otherwise flatten every
    // honest one into a sliver.
    function rugScale(mags) {
      const a = mags.filter((v) => v != null && isFinite(v)).map(Math.abs).sort((x, y) => x - y);
      if (!a.length) return 5;
      return Math.max(3, a[Math.floor(a.length * 0.9)] || 3);
    }

    function earnRugHtml(dates, closes, events) {
      if (!showEarnRug || !Array.isArray(dates) || dates.length < 2) return '';
      const at = new Map();
      dates.forEach((d, i) => at.set(d, i));
      const first = dates[0];
      const last = dates[dates.length - 1];
      const hits = [];
      let earliest = null;
      for (const e of (events || [])) {
        const d = e && e.date;
        if (!d) continue;
        if (earliest == null || d < earliest) earliest = d;
        if (d < first || d > last) continue;
        let i = at.get(d);
        if (i == null) {
          // The report can land on a non-trading day; take the session before
          // it rather than dropping the event.
          for (let k = dates.length - 1; k >= 0; k--) if (dates[k] <= d) { i = k; break; }
          if (i == null) continue;
        }
        // THE REACTION IS THE NEXT SESSION -- almost every company here reports
        // after the close, so the bar the tick sits on does not contain the
        // market's answer to it.
        const nx = i + 1 < closes.length && closes[i] > 0
          ? (closes[i + 1] / closes[i] - 1) * 100 : null;
        hits.push({ e, i, nx, d });
      }
      if (!hits.length) return '';
      const scale = rugScale(hits.map((h) => h.nx));
      const HALF = 17;                       // px either side of the centre line
      const marks = hits.map((h) => {
        const sp = h.e.surprisePrc == null ? null : Number(h.e.surprisePrc);
        const verdict = (h.e.epsEstimate == null || sp == null || !isFinite(sp)) ? null
          : sp > 0 ? 'beat' : sp < 0 ? 'missed' : 'met';
        const left = ((h.i / (dates.length - 1)) * 100).toFixed(3);
        const tipHead = h.d + ' — reported' + (h.e.time ? ' ' + String(h.e.time).toLowerCase() : '') +
          (verdict ? ', ' + verdict + (verdict === 'met' ? ' the estimate'
            : ' by ' + Math.abs(sp).toFixed(1) + '%') : '');
        if (h.nx == null) {
          return `<i class="pending" style="left:${left}%" title="${esc(tipHead +
            '. The next session is past the right edge of this chart.')}"></i>`;
        }
        const mag = Math.min(1, Math.abs(h.nx) / scale);
        const capped = Math.abs(h.nx) > scale;
        const px = Math.max(2, Math.round(mag * HALF));
        const tip = tipHead + '. Next session ' + (h.nx >= 0 ? '+' : '') + h.nx.toFixed(1) + '%' +
          (capped ? ' — past the scale, so the bar is drawn full height.' : '.');
        return `<i class="${h.nx >= 0 ? 'up' : 'dn'}${capped ? ' capped' : ''}"` +
          ` style="left:${left}%;height:${px}px" title="${esc(tip)}"></i>`;
      });
      // WHAT THE ABSENCE MEANS. The bar archive reaches back twenty years and
      // the earnings record does not, so a stretch with no bars is "nothing
      // stored", not "no reports happened" -- and on a Max chart that is most
      // of the picture.
      const gap = earliest && earliest > first
        ? ` · the stored record starts ${earliest}, so anything before that is missing rather than quiet`
        : '';
      return '<div class="erug"><span class="base"></span>' + marks.join('') + '</div>' +
        `<p class="erugnote">${hits.length} report${hits.length === 1 ? '' : 's'} in view ` +
        `— bar height is the next session’s move, green where it rose, ` +
        `the scale stopping at ±${scale.toFixed(1)}%${gap}</p>`;
    }

    // ---- the short-interest layer -------------------------------------
    // The same bargain as the rug: a chart LAYER with its own toggle,
    // remembered per device, self-gating so a window with no settlement in
    // it is clean without a rule about which ranges may have one.
    //
    // It arrives on its own fetch rather than with the page — /api/shortint
    // is a separate route precisely so the price never waits on it — so the
    // series lands AFTER the first paint and the strip is drawn again then.
    // `sintRows` and `lastDates` are script scope for the reason earnRows is:
    // paintChart cannot see the boot IIFE's locals, and reaching for one is
    // a ReferenceError that kills the whole chart.
    let showSintStrip = false;
    let sintRows = null;
    let lastDates = null;
    const SINT_KEY = 'stock.sintstrip';
    try { showSintStrip = localStorage.getItem(SINT_KEY) === '1'; } catch (e) { /* private window */ }

    // ---- the fundamental strip ----------------------------------------
    // The FIRST of the three optional layers under the plot, on exactly the
    // short strip's bargain: its own toggle, remembered per device, drawn in
    // its own box beneath the chart, self-gating, repainted ALONE when its
    // series lands.
    //
    // IT WAS A PANE INSIDE THE SVG FOR AN HOUR and the owner moved it out
    // (2026-09-29). A strip is the better shape twice over: the three layers
    // now read as one stack in one place rather than one being inside the
    // chart and two outside, and it drops the four-way coupling a pane forced
    // between rowcard.js's bands and this page's box heights. What it costs is
    // the adjacency to the price that a pane had — which is why it leads the
    // three rather than sitting under the rug.
    const FUND_METRICS = [
      { k: 'revenue', label: 'Revenue TTM' },
      { k: 'netIncome', label: 'Net income TTM' },
    ];
    let showFund = false;
    let fundMetric = 'revenue';
    // `secTtm` is script scope for the reason `sintRows` is: paintChart cannot
    // see the boot IIFE's locals, and reaching for one is a ReferenceError that
    // takes the whole chart down (it happened once, with `payload`).
    let secTtm = null;
    const FUND_KEY = 'stock.fundpane';
    const FUNDM_KEY = 'stock.fundmetric';
    try {
      showFund = localStorage.getItem(FUND_KEY) === '1';
      const m = localStorage.getItem(FUNDM_KEY);
      if (FUND_METRICS.some((x) => x.k === m)) fundMetric = m;
    } catch (e) { /* private window */ }
    const fundLabel = () =>
      (FUND_METRICS.find((m) => m.k === fundMetric) || FUND_METRICS[0]).label;

    // A filed figure stepped across the drawn window. `RowCard.stepSeries`
    // lays the quarterly points onto the session axis — carried forward, never
    // interpolated, and bounded so a company that stopped filing does not draw
    // a flat line to today.
    function fundStripHtml(dates) {
      if (!showFund || !Array.isArray(dates) || dates.length < 2) return '';
      if (!secTtm || !secTtm.length) return '';
      const vals = RowCard.stepSeries(dates, secTtm, fundMetric);
      const seen = vals.filter((v) => v != null);
      if (!seen.length) return '';

      const mn = Math.min.apply(null, seen);
      const mx = Math.max.apply(null, seen);
      const PAD = 5;                      // px of headroom top and bottom
      const H = 56;                       // matches .frug in the CSS
      const span = mx - mn;
      // A flat series would divide by zero; draw it down the middle, which is
      // what "it did not move" looks like. The short strip's rule.
      const y = (v) => (span > 1e-9 ? PAD + (1 - (v - mn) / span) * (H - PAD * 2) : H / 2);
      const n = dates.length - 1;
      const X = (i) => ((n ? i / n : 0) * 1000).toFixed(2);

      // A STEP, NEVER A SLOPE: a figure stands until the next filing replaces
      // it, and a slope would claim it drifted day by day. One command per
      // CHANGE of level rather than one per session — at Max range the latter
      // is ~5,200 of them for a line with forty levels.
      let d = '', pen = false, prev = null, startI = -1, lastI = -1;
      const hits = [];
      const close = () => {
        if (!pen || lastI <= startI) return;
        d += ' L' + X(lastI) + ',' + y(prev).toFixed(2);
        hits.push({ from: startI, to: lastI, v: prev });
      };
      for (let i = 0; i < vals.length; i++) {
        const v = vals[i];
        if (v == null) { close(); pen = false; continue; }
        if (!pen) { d += (d ? ' M' : 'M') + X(i) + ',' + y(v).toFixed(2); pen = true; prev = v; startI = i; lastI = i; continue; }
        if (v !== prev) {
          // Along at the level that was standing, THEN step to the new one —
          // the other order draws the change a quarter early.
          d += ' L' + X(i) + ',' + y(prev).toFixed(2) + ' L' + X(i) + ',' + y(v).toFixed(2);
          hits.push({ from: startI, to: i, v: prev });
          prev = v; startI = i;
        }
        lastI = i;
      }
      close();
      if (!d) return '';

      // ZERO WHERE THE DATA SPANS IT, never where the padded box does — that
      // distinction is what put a zero line on MU's revenue chart, whose
      // trailing revenue runs $8.0B to $90.3B and can never be negative.
      const zero = (mn < 0 && mx > 0)
        ? `<line class="fz" x1="0" y1="${y(0).toFixed(2)}" x2="1000" y2="${y(0).toFixed(2)}"/>` : '';
      // preserveAspectRatio="none" stretches x to the strip's width, which is
      // what keeps the steps aligned with the price above. No <text> inside
      // for the same reason: a glyph would be stretched with the box.
      const svg = `<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">` +
        zero + `<path class="fl" d="${d}" /></svg>`;
      const area = hits.map((h) => {
        const l = (h.from / (n || 1)) * 100;
        const w = Math.max(0.2, ((h.to - h.from) / (n || 1)) * 100);
        const pt = secTtm.filter((x) => x[fundMetric] === h.v).pop();
        return `<i style="left:${l.toFixed(3)}%;width:${w.toFixed(3)}%"` +
          ` title="${esc(RowCard.fmtMktCap(h.v) + (pt ? ' — the four quarters to ' + pt.d : ''))}"></i>`;
      }).join('');

      const newest = seen[seen.length - 1];
      const pts = secTtm.filter((x) => x[fundMetric] != null);
      const earliest = pts.length ? pts[0].d : null;
      const gap = earliest && earliest > dates[0]
        ? ` The filed record starts ${esc(earliest)}, so anything before that is missing rather than flat.`
        : '';
      return '<div class="frug">' + svg + area + '</div>' +
        `<p class="frugnote"><b>${esc(fundLabel())}</b> — ${esc(RowCard.fmtMktCap(newest))} ` +
        `at the newest filed quarter, four quarters summed from the company's own SEC ` +
        `filings, as filed. Stepped because a figure stands until the next filing ` +
        `replaces it. <b>The baseline is its own range, not zero</b> ` +
        `(${esc(RowCard.fmtMktCap(mn))} to ${esc(RowCard.fmtMktCap(mx))}), so read the shape ` +
        `rather than the height. <b>Each step is dated to the quarter END</b>, and the ` +
        `figure became public some weeks after that — so this cannot be read for lead or ` +
        `lag against the price.${gap}</p>`;
    }

    function paintFundStrip() {
      const el = document.getElementById('fundStrip');
      if (!el) return;
      const html = fundStripHtml(lastDates);
      el.innerHTML = html;
      el.hidden = !html;
    }

    function sintStripHtml(dates) {
      if (!showSintStrip || !Array.isArray(dates) || dates.length < 2) return '';
      if (!sintRows || !sintRows.length) return '';
      const first = dates[0];
      const last = dates[dates.length - 1];
      const n = dates.length - 1;
      // The index of the session at or before a settlement date — a
      // settlement can land on a non-trading day.
      const idxAt = (d) => {
        for (let k = dates.length - 1; k >= 0; k--) if (dates[k] <= d) return k;
        return null;
      };
      // THE READING BEFORE THE WINDOW IS PART OF THE PICTURE. A position
      // stands until the next settlement, so the level in force at the left
      // edge was set by the last reading BEFORE it — dropping that would
      // leave the first fortnight of every chart blank and imply the shorts
      // arrived later than they did.
      let carried = null;
      const inView = [];
      for (const r of sintRows) {
        if (r.d < first) { carried = r; continue; }
        if (r.d > last) continue;
        inView.push(r);
      }
      const seq = (carried ? [Object.assign({}, carried, { carried: true })] : []).concat(inView);
      if (!seq.length) return '';

      const dtcs = seq.map((r) => r.dtc).filter((v) => v != null && isFinite(v));
      if (!dtcs.length) return '';

      // A STEP LINE, NOT BARS, AND THE BASELINE IS THE REASON (2026-09-28,
      // the owner's call after seeing the doubled strip). Days to cover sits
      // in a narrow band on most stocks — measured across four: MU's whole
      // year runs 1.00 to 1.22, so zero-based bars put every reading between
      // 50% and 61% of the track and the strip read as a solid block. The
      // bottom half was dead space on every symbol.
      //
      // Truncating a BAR axis is the classic misleading chart, so the bars
      // could not simply be given a floor. A LINE carries no such claim — it
      // is read as a shape rather than as a quantity measured from zero — so
      // the range becomes the data's own and the variation fills the strip.
      // The note says the baseline is not zero, because that is the one
      // thing a reader could otherwise get wrong.
      const lo = Math.min.apply(null, dtcs);
      const hi = Math.max.apply(null, dtcs);
      const PAD = 4;                      // px of headroom top and bottom
      const H = 56;                       // matches .srug in the CSS
      const span = hi - lo;
      // A flat series would divide by zero; draw it down the middle, which
      // is what "it did not move" looks like.
      const y = (v) => (span > 1e-9
        ? PAD + (1 - (v - lo) / span) * (H - PAD * 2)
        : H / 2);

      const posOf = (r) => {
        if (r.carried) return 0;
        const k = idxAt(r.d);
        return k == null ? 0 : (k / n) * 100;
      };
      // x runs 0..1000 in the viewBox; the box is stretched to the strip's
      // width, so a percentage and a viewBox unit are the same position.
      const X = (pct) => (pct * 10).toFixed(2);

      let d = '';
      const hits = [];
      seq.forEach((r, i) => {
        if (r.dtc == null) return;
        const left = posOf(r);
        const nextL = i + 1 < seq.length ? posOf(seq[i + 1]) : 100;
        const yy = y(r.dtc).toFixed(2);
        // Step AFTER: the level holds flat until the next settlement, then
        // steps. That is what a short position actually does.
        d += (d ? ' L' : 'M') + X(left) + ',' + yy + ' L' + X(nextL) + ',' + yy;
        const tip = (r.carried ? 'Standing at the left edge, set ' + r.d : r.d) +
          ' — ' + r.dtc.toFixed(2) + ' days to cover' +
          (r.shares != null ? ', ' + Number(r.shares).toLocaleString() + ' shares short' : '') +
          (r.split ? ' · a split lands in this fortnight, so the share counts either side are not comparable' : '');
        hits.push(`<i class="${r.split ? 'split' : ''}"` +
          ` style="left:${left.toFixed(3)}%;width:${Math.max(0.2, nextL - left).toFixed(3)}%"` +
          ` title="${esc(tip)}"></i>`);
      });
      if (!d) return '';

      // `preserveAspectRatio="none"` stretches x to the strip's width, which
      // is what keeps the line aligned with the price above it — and is
      // exactly why the stroke needs `vector-effect: non-scaling-stroke`,
      // or the horizontal runs and the vertical steps draw at different
      // weights. No <text> in here for the same reason: a glyph would be
      // stretched with the box.
      const svg = `<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">` +
        `<path class="sl" d="${d}" /></svg>`;

      // WHAT THE ABSENCE MEANS, the rug's rule. FINRA's record starts in
      // 2017 and the bar archive reaches back to 1998, so on a Max chart a
      // blank left half is "not published", never "nobody was short".
      const earliest = sintRows[0] && sintRows[0].d;
      const gap = earliest && earliest > first
        ? ` FINRA's record starts ${earliest}, so anything before that is missing rather than quiet.`
        : '';
      const range = span > 1e-9
        ? `${lo.toFixed(2)} at the foot to ${hi.toFixed(2)} at the top`
        : `flat at ${lo.toFixed(2)}`;
      return '<div class="srug">' + svg + hits.join('') + '</div>' +
        `<p class="srugnote"><b>Short interest</b> — ${inView.length} ` +
        `settlement${inView.length === 1 ? '' : 's'} in view, in days to cover ` +
        `(the position divided by average daily volume), ${range}. ` +
        `<b>The baseline is the lowest reading in view, not zero</b>, so read the ` +
        `shape rather than the height. Days to cover is drawn instead of the share ` +
        `count because FINRA files counts as reported and never restates them for ` +
        `splits, where a ratio rides straight through.${gap}</p>`;
    }

    function paintSintStrip() {
      const el = document.getElementById('sintStrip');
      if (!el) return;
      const html = sintStripHtml(lastDates);
      el.innerHTML = html;
      el.hidden = !html;
    }

    // ---- trend ribbon builders ---------------------------------------
    // The Trend column's ladder replayed over the padded series: one word per
    // drawn bar, through ActionRules.trendAt — the engine's own definitions()
    // and states(), so the ribbon can never disagree with the screener. The
    // 50D/200D averages come from the same RowCard.sma the overlays draw, so
    // a colour change on the strip lands exactly where the MA lines cross.
    // ONE rule for the dashed line, at the owner's instruction (2026-09-13):
    // in while the trend reads Strong uptrend or Above 200D, out otherwise.
    // The verdict replay came off the LINE because a full advice history is
    // not honestly reconstructible — the line may only claim what the bars
    // can prove. The Balanced verdicts stay as EXPLAINERS: the readout's
    // Model row and the why card below, which answer "why does the model's
    // advice differ from the trend" without pretending to be an equity curve.
    const RULES_CFG = ActionRules.resolve(null, 'Balanced').cfg;
    function rulesCfg() { return RULES_CFG; }
    let whyOpen = false, paintCtx = null;
    const TS_CLS = {
      'Breakdown': 'ts-breakdown', 'Downtrend': 'ts-downtrend',
      'Below 200D': 'ts-below-200d', 'Near 200D': 'ts-near-200d',
      'Above 200D': 'ts-above-200d', 'Strong uptrend': 'ts-strong-uptrend',
    };
    function trendSeries(all, from, type, cfg) {
      const C = cfg || rulesCfg();
      const s200 = RowCard.sma(all, 200), s50 = RowCard.sma(all, 50);
      const words = [];
      for (let j = from; j < all.length; j++) {
        const c = all[j];
        const pct = (base) => (c != null && base != null && base > 0 ? (c / base - 1) * 100 : null);
        words.push(ActionRules.trendAt({
          v200: pct(s200[j]), v50: pct(s50[j]),
          m1: j >= 21 ? pct(all[j - 21]) : null,
          m3: j >= 63 ? pct(all[j - 63]) : null,
        }, type, C));
      }
      return words;
    }
    function trendStripHtml(words, th) {
      const n = words.length;
      if (!n || !words.some((w) => TS_CLS[w])) return '';
      // Runs of one word become one segment; boundaries sit at the midpoint
      // between bars, the same linear mapping the crosshair uses. 'No data'
      // stays unpainted — the track showing through is the honest picture.
      let segs = '', a = 0;
      for (let i = 1; i <= n; i++) {
        if (i === n || words[i] !== words[a]) {
          const cls = TS_CLS[words[a]];
          if (cls) {
            const L = a === 0 ? 0 : ((a - 0.5) / (n - 1)) * 100;
            const R = i === n ? 100 : ((i - 0.5) / (n - 1)) * 100;
            segs += `<i class="${cls}" style="left:${L.toFixed(2)}%;width:${(R - L).toFixed(2)}%" title="${esc(words[a])}"></i>`;
          }
          a = i;
        }
      }
      const present = ['Strong uptrend', 'Above 200D', 'Near 200D', 'Below 200D', 'Downtrend', 'Breakdown']
        .filter((w) => words.indexOf(w) >= 0)
        .map((w) => `<span class="tl"><i class="${TS_CLS[w]}"></i>${esc(w)}</span>`);
      const lbl = arguments.length > 2 && arguments[2] ? arguments[2] : 'Trend-held';
      const stat = th
        ? `<span class="tl thl"><i></i>${esc(lbl)} ${th.endPct >= 0 ? '+' : ''}${th.endPct.toFixed(1)}%` +
          ` vs ${th.holdPct >= 0 ? '+' : ''}${th.holdPct.toFixed(1)}% hold · ${th.trips} round trip${th.trips === 1 ? '' : 's'}</span>`
        : '';
      const why = arguments.length > 3 && arguments[3] && th
        ? '<button class="tl why-link" data-why>Why do these differ?</button>' : '';
      return `<div class="tstrip">${segs}</div>` +
        `<div class="tlegend"><span class="cap-t">Trend</span>${present.join('')}${stat}${why}</div>`;
    }

    // What holding only the green states returns, as an equity line in price
    // units. The word at day t is known at t's close, so a green t earns the
    // t -> t+1 move — the signal acts at the close it appears on, never a day
    // it did not yet exist (the look-ahead discipline the strategy backtest
    // learned the hard way). Anchored to the price where the ribbon starts,
    // so the gap between the two lines IS the verdict and the flat shelves
    // are the stretches in cash. Pure price: no costs, nothing earned in
    // cash, no dividends — the round-trip count is the tell for what costs
    // would take, and /single is the full instrument.
    const TH_GREEN = { 'Strong uptrend': 1, 'Above 200D': 1 };
    // An index rebased to THIS stock's price at the left edge of the window, so
    // the gap between the lines is relative performance and the price axis keeps
    // meaning what it says. The same anchoring the trend-hold line uses — the
    // alternative, rebasing both to 100, would change the axis for everyone to
    // serve an overlay that is off by default.
    //
    // Aligned BY DATE, not by index: a stock that listed recently, or one that
    // keeps a different calendar, does not share the benchmark's session list,
    // and lining up two arrays by position would silently shear them.
    function benchSeries(dates, closes, hist) {
      if (!hist || !Array.isArray(hist.dates) || hist.dates.length < 2) return null;
      const by = new Map();
      hist.dates.forEach((d, i) => { const c = hist.closes[i]; if (c > 0) by.set(d, c); });
      // last close on or before each of the stock's dates, so a missing session
      // holds its level rather than breaking the line
      const raw = new Array(dates.length).fill(null);
      let last = null, k = 0;
      const hd = hist.dates;
      for (let i = 0; i < dates.length; i++) {
        while (k < hd.length && hd[k] <= dates[i]) { const c = hist.closes[k]; if (c > 0) last = c; k++; }
        raw[i] = last;
      }
      let a = 0;
      while (a < raw.length && (raw[a] == null || closes[a] == null)) a++;
      if (a >= raw.length - 1) return null;
      const scale = closes[a] / raw[a];
      return raw.map((v) => (v == null ? null : v * scale));
    }

    function trendHoldSeries(closes, words) {
      const n = closes.length;
      const values = new Array(n).fill(null);
      let a = 0;
      while (a < n && (words[a] === 'No data' || closes[a] == null)) a++;
      if (a >= n - 1) return null;
      let eq = closes[a], trips = 0, inPos = false, z = a;
      values[a] = eq;
      for (let i = a + 1; i < n; i++) {
        const held = !!TH_GREEN[words[i - 1]];
        if (held && !inPos) trips++;
        inPos = held;
        if (closes[i] != null) {
          if (held && closes[i - 1] != null) eq *= closes[i] / closes[i - 1];
          z = i;
        }
        values[i] = eq;
      }
      return { values, trips, anchor: a,
        endPct: (values[z] / closes[a] - 1) * 100,
        holdPct: (closes[z] / closes[a] - 1) * 100 };
    }

    // The model-hold replay: the picked profile's technical verdicts, walked
    // as the recommendations they are — a Buy-or-better enters, Hold keeps
    // whatever position stands, Avoid or Sell exits. Same one-day lag as the
    // trend hold: day t's verdict is known at t's close and earns t -> t+1.
    // It replays the all-technical rule list (the framing the action
    // backtest validated), so the profiles differ here through their chase
    // caps and stop widths; the fundamentals half, where Dip Buyer and the
    // Early rules live, has no history to replay — blanks satisfy nothing.
    const AP_TIER = { 'Sell Immediately': 0, 'Avoid': 1, 'Hold': 2, 'Buy with Risk': 3, 'Buy': 4, 'Strong Buy': 5 };
    function verdictSeries(all, from, cfg, rsiAll) {
      const s200 = RowCard.sma(all, 200), s50 = RowCard.sma(all, 50);
      const out = [];
      for (let j = from; j < all.length; j++) {
        const c = all[j];
        let hi = null;
        for (let k = Math.max(0, j - 251); k <= j; k++) {
          if (all[k] != null && (hi == null || all[k] > hi)) hi = all[k];
        }
        const pct = (base) => (c != null && base != null && base > 0 ? (c / base - 1) * 100 : null);
        const v = ActionRules.actionAt({
          v200: pct(s200[j]), v50: pct(s50[j]), rsi: rsiAll ? rsiAll[j] : null,
          m1: j >= 21 ? pct(all[j - 21]) : null,
          m3: j >= 63 ? pct(all[j - 63]) : null,
          fh: pct(hi),
        }, cfg);
        out.push({ a: v.action, f: v.flag });
      }
      return out;
    }
    // Day-by-day position under the verdict machine — position for the
    // return into day i comes from day i-1's verdict, the same lag as
    // everything else. One copy, used by the line, the hover readout and the
    // why comparison, so they cannot disagree.
    function modelPositions(verds) {
      const n = verds.length, pos = new Array(n).fill(false);
      let inPos = false;
      for (let i = 1; i < n; i++) {
        const t = AP_TIER[verds[i - 1].a];
        if (t >= 3) inPos = true;
        else if (t <= 1) inPos = false;
        pos[i] = inPos;
      }
      return pos;
    }
    function modelHoldSeries(closes, verds) {
      if (!verds) return null;
      const n = closes.length;
      const pos = modelPositions(verds);
      const values = new Array(n).fill(null);
      let a = 0;
      while (a < n && closes[a] == null) a++;
      if (a >= n - 1) return null;
      let eq = closes[a], trips = 0, z = a;
      values[a] = eq;
      for (let i = a + 1; i < n; i++) {
        if (pos[i] && !pos[i - 1]) trips++;
        if (closes[i] != null) {
          if (pos[i] && closes[i - 1] != null) eq *= closes[i] / closes[i - 1];
          z = i;
        }
        values[i] = eq;
      }
      return { values, trips, anchor: a,
        endPct: (values[z] / closes[a] - 1) * 100,
        holdPct: (closes[z] / closes[a] - 1) * 100 };
    }

    // Why the two rules differ, as data: their day-by-day positions diffed,
    // the disagreement stretches ranked by what the price did during each,
    // and every stretch named by the flag that kept the other rule out.
    function compareRuns(closes, words, verds) {
      const n = closes.length;
      const pT = new Array(n).fill(false);
      for (let i = 1; i < n; i++) pT[i] = !!TH_GREEN[words[i - 1]];
      const pM = modelPositions(verds);
      const ret = (i) => (closes[i] != null && closes[i - 1] != null ? closes[i] / closes[i - 1] : 1);
      let eT = 1, eM = 1, tD = 0, mD = 0;
      for (let i = 1; i < n; i++) {
        if (pT[i]) { eT *= ret(i); tD++; }
        if (pM[i]) { eM *= ret(i); mD++; }
      }
      const runs = [];
      let a = -1, kind = null;
      for (let i = 1; i <= n; i++) {
        const k = i < n ? (pT[i] === pM[i] ? null : pT[i] ? 'trend' : 'model') : null;
        if (k !== kind) {
          if (kind) runs.push({ kind, a, b: i - 1 });
          a = i; kind = k;
        }
      }
      let refused = 1, held = 1;
      for (const r of runs) {
        let g = 1;
        for (let i = r.a; i <= r.b; i++) g *= ret(i);
        r.pct = (g - 1) * 100;
        r.days = r.b - r.a + 1;
        r.why = r.kind === 'trend' ? (verds[r.a - 1] ? verds[r.a - 1].f : '') : (words[r.a - 1] || '');
        if (r.kind === 'trend') refused *= g; else held *= g;
      }
      runs.sort((x, y) => Math.abs(y.pct) - Math.abs(x.pct));
      return { runs, tPct: (eT - 1) * 100, mPct: (eM - 1) * 100, tDays: tD, mDays: mD,
        refusedPct: (refused - 1) * 100, heldPct: (held - 1) * 100 };
    }
    function whyHtml(cmp, dates, name) {
      const pn = (x) => (x >= 0 ? '+' : '') + x.toFixed(1) + '%';
      // The verdict sentence is templated from the two measured buckets —
      // prose from numbers, never numbers from prose.
      const sents = [];
      if (Math.abs(cmp.refusedPct) >= 5) {
        sents.push(cmp.refusedPct >= 0
          ? `Most of the gap is entry friction: the trend rule boards the first day back above the 200D, while ${esc(name)} waited for a clean entry through moves worth ${pn(cmp.refusedPct)} compounded.`
          : `The trend rule's eager re-entries cost it ${pn(cmp.refusedPct)} compounded in stretches ${esc(name)} refused to enter.`);
      }
      if (Math.abs(cmp.heldPct) >= 5) {
        sents.push(cmp.heldPct >= 0
          ? `${esc(name)} gained ${pn(cmp.heldPct)} compounded holding through grey stretches the trend rule sat out.`
          : `${esc(name)} gave back ${pn(cmp.heldPct)} compounded holding through drops the trend rule sidestepped.`);
      }
      if (!sents.length) sents.push('The two rules barely disagreed over this range.');
      const rows = cmp.runs.slice(0, 5).map((r) =>
        `<div class="why-run"><span class="wd">${esc(dates[r.a])} → ${esc(dates[r.b])} · ${r.days}d</span>` +
        `<span class="wp ${r.pct >= 0 ? 'pos' : 'neg'}">${pn(r.pct)}</span>` +
        `<span class="ww">${r.kind === 'trend'
          ? `Trend in — ${esc(name)} out: ${esc(r.why)}`
          : `${esc(name)} in, trend out — holding through: ${esc(r.why)}`}</span></div>`).join('');
      return '<div class="core">' +
        `<div class="why-head"><b>Trend only ${pn(cmp.tPct)}</b>&nbsp;(${cmp.tDays}d in) · ` +
        `<b>${esc(name)} ${pn(cmp.mPct)}</b>&nbsp;(${cmp.mDays}d in)` +
        '<button class="why-x" data-why-close aria-label="Close">✕</button></div>' +
        `<div class="why-verdict">${sents.join(' ')}</div>` +
        (rows ? `<div class="why-sub">Largest disagreements — one rule in, the other out</div>${rows}` : '') +
        '<div class="why-note">Zero costs, next-session execution, the model replayed on technicals alone — the flags are its own words. Same range as the chart above.</div></div>';
    }

    // The return tag at the line's end — where the eye lands after
    // following it. Clamped a hair inside the plot so a line ending on an
    // extreme cannot push its own label out of the box.
    function thEndTag(th, priceAt) {
      if (!th || !th.values.length) return '';
      const last = th.values[th.values.length - 1];
      if (last == null) return '';
      const f = Math.max(0.02, Math.min(0.98, priceAt(last)));
      const sign = th.endPct >= 0 ? '+' : '';
      return `<span class="thend ${th.endPct >= 0 ? 'pos' : 'neg'}" style="top:${atY(f)}"` +
        ` title="Trend-held return over this range — the dashed line's end">${sign}${th.endPct.toFixed(1)}%</span>`;
    }

    // ---- news renderers (extracted for the headless test) --------------
    // Date, source, headline linking out in a new tab. Headlines are third-
    // party text: everything is escaped, and the href is vetted to http(s).
    function newsAge(iso) {
      const d = Date.now() - Date.parse(iso);
      if (!isFinite(d)) return '';
      const days = Math.floor(d / 86400000);
      if (days <= 0) return 'today';
      if (days === 1) return '1d ago';
      return days + 'd ago';
    }
    // A PAGE AT A TIME. The archive is bounded by a 21-day window rather than a
    // count, so a heavily-covered stock can hold a few hundred headlines —
    // rendering them all to show ten, as the first cut did, does not scale and
    // neither does sending them. `total` comes from the server, so the button
    // can say how many are left and disappear when there are none.
    const NEWS_PAGE = 10;
    function renderNewsList(items, total) {
      const ok = (items || []).filter((x) => x && x.headline && /^https?:\/\//i.test(x.url || ''));
      if (!ok.length) return '<div class="msg">No stored headlines yet — they accrue as refreshes run.</div>';
      const rows = ok.map((x) =>
        `<div class="news-item"><span class="nd">${esc(newsAge(x.published_at))}</span>` +
        `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.headline)}</a>` +
        `<span class="ns">${esc(x.source || '')}</span></div>`).join('');
      const list = `<div class="news-cols">${rows}</div>`;
      const n = Number(total) || ok.length;
      if (ok.length >= n) {
        // Everything is on screen. Offer the way back only once the list has
        // actually grown past a page.
        return list + (ok.length > NEWS_PAGE
          ? `<button type="button" class="rng newsmore" id="newsLess">Show fewer</button>` : '');
      }
      return list + `<button type="button" class="rng newsmore" id="newsMore">` +
        `Show more — ${ok.length} of ${n}</button>`;
    }
    // ---- end news renderers ---------------------------------------------

    // ---- earnings history ------------------------------------------------
    // What the company reported each quarter against what was expected. The
    // rows come from `earnings_history`, which fills for free: /earnings
    // returns up to 40 quarters for the same 20 credits as 8.
    const EARN_PAGE = 8;
    let earnRows = [];
    // Script scope for the same reason earnRows is: the caption is redrawn
    // when the filings land, long after the boot IIFE has returned.
    let profilePulledAt = null;
    let earnAll = false;

    const eps = (v) => (v == null || !isFinite(v) ? null : Number(v));
    // A quarter counts as a beat or a miss only if somebody forecast it.
    const hasEst = (r) => eps(r.epsEstimate) != null && eps(r.epsActual) != null;

    // ---- the dumbbell --------------------------------------------------
    // One column per quarter, oldest on the left: a hollow dot at the
    // estimate, a filled dot at what was reported, and a line joining them,
    // green for a beat and red for a miss.
    //
    // IT REPLACED A STRIP OF SURPRISE PERCENTAGES, and is better twice over.
    // A percentage is a ratio against the estimate, so a near-zero estimate
    // made it enormous (this archive holds a -262%) and the strip needed a
    // capped scale; here the two real numbers are plotted, so a two-cent miss
    // looks like a two-cent miss. And it shows the LEVEL: earnings climbing
    // or falling across quarters, which a row of percentages cannot.
    //
    // HTML, never SVG: the box is as wide as the page, and a stretched svg
    // would turn every dot into an ellipse. Each mark is placed by percentage
    // inside a box that is inset by the dot's own radius.
    const EARN_WIN = 12;
    let earnWide = false;
    // The last split, as the profile reports it. Script scope for the reason
    // earnRows is: paintEarnings runs again from a click, long after the boot
    // IIFE that holds the stock has returned.
    let earnSplit = null;

    // REPORTED EPS IS NOT RESTATED FOR A SPLIT. Measured on the stored rows:
    // NVIDIA reads 3.37 / 4.02 one quarter and 0.46 / 0.52 the next, across
    // its ten-for-one. Each quarter's own pair is on one basis, so the beat
    // or miss is always right -- but the LEVEL either side of a split is not
    // comparable, and one axis over both would draw a collapse in earnings
    // that never happened. So the chart keeps to one share count: the
    // quarters reported since the last split where there are at least three,
    // otherwise the ones before it. The rest stay in the table.
    function earnSegment(list) {
      const sp = earnSplit && /^\d{4}-\d{2}-\d{2}/.test(earnSplit) ? earnSplit.slice(0, 10) : null;
      if (!sp) return { rows: list, split: null, held: 0, side: null };
      const after = list.filter((r) => r.date > sp);
      const before = list.filter((r) => r.date <= sp);
      if (!before.length) return { rows: list, split: null, held: 0, side: null };
      return after.length >= 3
        ? { rows: after, split: sp, held: before.length, side: 'since' }
        : { rows: before, split: sp, held: after.length, side: 'before' };
    }

    const epsFig = (v) => (v < 0 ? '−' : '') + '$' + Math.abs(v).toFixed(2);
    const qLabel = (d) => {
      const t = new Date(d + 'T12:00:00');       // local noon: a bare date is UTC midnight
      return isNaN(t) ? d : t.toLocaleDateString('en-US', { month: 'short' }) + " '" + String(t.getFullYear()).slice(2);
    };

    function earnDumbbell(list) {
      const seg = earnSegment(list);
      // Newest first on the wire; the window is the newest N, drawn oldest left.
      const win = (earnWide ? seg.rows : seg.rows.slice(0, EARN_WIN)).slice().reverse();
      const pts = [];
      for (const r of win) {
        const e = eps(r.epsEstimate), a = eps(r.epsActual);
        if (e != null) pts.push(e);
        if (a != null) pts.push(a);
      }
      if (pts.length < 2) return { html: '', seg, shown: 0 };
      let lo = Math.min(...pts), hi = Math.max(...pts);
      // A flat series would divide by zero; give it a band around its value.
      if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
      const y = (v) => ((hi - v) / (hi - lo) * 100).toFixed(2);
      // The zero line only where the window really crosses it: profit or loss
      // is the reading, and a line the data never reaches would imply a
      // crossing that did not happen.
      const zero = lo < 0 && hi > 0;

      const cols = win.map((r) => {
        const e = eps(r.epsEstimate), a = eps(r.epsActual);
        if (a == null && e == null) return '<span class="dq"></span>';
        // A quarter nobody forecast is neither a beat nor a miss: one neutral
        // dot at what was reported, and no line.
        if (e == null || a == null) {
          const v = a == null ? e : a;
          return `<span class="dq none" title="${esc(r.date + ' — ' + (a == null ? 'estimate ' : 'reported ')
            + epsFig(v) + ', ' + (a == null ? 'not yet reported' : 'no estimate on record'))}">` +
            `<i class="dot ${a == null ? 'est' : 'act'}" style="top:${y(v)}%"></i></span>`;
        }
        const beat = a >= e;
        const s = eps(r.surprisePrc);
        const t = `${r.date} — reported ${epsFig(a)} against an estimate of ${epsFig(e)}` +
          (s == null ? '' : ` (${s >= 0 ? '+' : ''}${s.toFixed(1)}%)`);
        const top = Math.min(Number(y(a)), Number(y(e))), h = Math.abs(Number(y(a)) - Number(y(e)));
        return `<span class="dq ${beat ? 'hit' : 'miss'}" title="${esc(t)}">` +
          `<i class="ln" style="top:${top.toFixed(2)}%;height:${h.toFixed(2)}%"></i>` +
          `<i class="dot est" style="top:${y(e)}%"></i>` +
          `<i class="dot act" style="top:${y(a)}%"></i></span>`;
      }).join('');

      // Few enough labels to read: about six, always including the newest.
      const step = Math.max(1, Math.ceil(win.length / (window.innerWidth < 620 ? 3 : 6)));
      const xs = win.map((r, i) =>
        `<span${i === win.length - 1 ? ' class="last"' : ''}>${(win.length - 1 - i) % step === 0 ? esc(qLabel(r.date)) : ''}</span>`).join('');

      const canWiden = seg.rows.length > EARN_WIN;
      const html =
        '<div class="dleg"><span><i class="dot est"></i>estimate</span>' +
        '<span><i class="dot act"></i>reported</span>' +
        '<span class="k hit">beat</span><span class="k miss">miss</span>' +
        (canWiden ? `<button type="button" class="rng" id="earnWide">` +
          (earnWide ? `Last ${EARN_WIN}` : `All ${seg.rows.length} quarters`) + '</button>' : '') +
        '</div>' +
        '<div class="dumb"><div class="dy">' +
          `<span style="top:0">${esc(epsFig(hi))}</span>` +
          (zero && Number(y(0)) > 14 && Number(y(0)) < 86 ? `<span style="top:${y(0)}%">$0</span>` : '') +
          `<span style="top:100%">${esc(epsFig(lo))}</span></div>` +
        '<div class="dplot"><div class="dcols">' +
          (zero ? `<i class="dzero" style="top:${y(0)}%"></i>` : '') +
          cols + '</div></div></div>' +
        `<div class="dx">${xs}</div>`;
      return { html, seg, shown: win.length };
    }

    function earnTable(list) {
      const shown = earnAll ? list : list.slice(0, EARN_PAGE);
      const body = shown.map((r) => {
        const est = eps(r.epsEstimate), act = eps(r.epsActual), s = eps(r.surprisePrc);
        const sc = s == null ? 'na' : s >= 0 ? 'up' : 'dn';
        return '<tr>' +
          `<td class="q">${esc(r.date)}</td>` +
          `<td class="${est == null ? 'na' : ''}">${est == null ? '—' : est.toFixed(2)}</td>` +
          `<td class="${act == null ? 'na' : ''}">${act == null ? '—' : act.toFixed(2)}</td>` +
          `<td class="${sc}">${s == null ? '—' : (s >= 0 ? '+' : '') + s.toFixed(1) + '%'}</td>` +
          `<td class="when">${esc(r.time || '')}</td>` +
          '</tr>';
      }).join('');
      return '<table><thead><tr><th>Quarter</th><th>Estimate</th><th>Reported</th>' +
        '<th>Surprise</th><th>When</th></tr></thead><tbody>' + body + '</tbody></table>' +
        (list.length > EARN_PAGE
          ? `<button type="button" class="rng earnmore" id="earnMore">` +
            (earnAll ? 'Show fewer' : `Show all ${list.length} quarters`) + '</button>'
          : '');
    }

    // ---- month by month ------------------------------------------------------
    // A grid of year by month, each cell the stock's return for that month.
    // It shows what a line hides: the bad years, the months that were bad for
    // everything at once, and how lumpy the returns are.
    //
    // IT IS A RECORD, NOT A SEASONAL PATTERN, and the card is built to say so.
    // Ten years is ten samples a month, and with twelve months to choose from
    // one of them always looks special by chance. So the foot of the grid is
    // a COUNT ("up 7 of 10") beside the stock's ordinary share of up months,
    // never an average return dressed as a tendency, and there is no best- or
    // worst-month callout.
    //
    // Script scope, like earnRows: the switch repaints long after the boot
    // IIFE has returned.
    let monthData = null;
    let monthRel = false;
    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    // Full colour is reached here; a bigger move is drawn at full colour and
    // still prints its real number. Relative moves are smaller, so the cap is.
    const MONTH_CAP = { raw: 20, rel: 12 };
    // Thirteen month ends is twelve returns: under a year there is no grid.
    const monthsReady = (m) => !!(m && Array.isArray(m.stock) && m.stock.length >= 13);

    // [ym, close] pairs to { 'YYYY-MM': return % }, each month against the
    // month end before it. A missing month in between is a gap, never bridged:
    // a return across two months filed under one would be a wrong cell.
    function monthReturns(rows) {
      const out = {};
      for (let i = 1; i < rows.length; i++) {
        const [ym, c] = rows[i], [pym, pc] = rows[i - 1];
        const y = Number(ym.slice(0, 4)), mo = Number(ym.slice(5, 7));
        const prev = mo === 1 ? (y - 1) + '-12' : y + '-' + String(mo - 1).padStart(2, '0');
        if (pym !== prev || !(pc > 0) || !(c > 0)) continue;
        out[ym] = (c / pc - 1) * 100;
      }
      return out;
    }
    // A calendar year, December to December, compounded from the month ends.
    // The first year held is partial unless the December before it is too.
    function yearReturns(rows) {
      const by = {};
      for (const [ym, c] of rows) by[ym] = c;
      const out = {};
      const years = [...new Set(rows.map((r) => Number(r[0].slice(0, 4))))];
      for (const y of years) {
        const start = by[(y - 1) + '-12'];
        const lastYm = rows.filter((r) => Number(r[0].slice(0, 4)) === y).map((r) => r[0]).sort().pop();
        if (start > 0 && by[lastYm] > 0) out[y] = (by[lastYm] / start - 1) * 100;
      }
      return out;
    }

    function monthCell(v, cap, extra) {
      if (v == null || !isFinite(v)) return '<td class="na"></td>';
      // The sign comes from the ROUNDED value, so a move that prints as 0.0
      // is never "-0.0" in red.
      const r = Math.round(v * 10) / 10;
      const a = Math.round((0.1 + 0.7 * Math.min(Math.abs(v) / cap, 1)) * 100);
      const cls = r > 0 ? 'up' : r < 0 ? 'dn' : 'flat';
      const txt = (r > 0 ? '+' : r < 0 ? '−' : '') + (Math.abs(r) >= 100 ? Math.round(Math.abs(r)) : Math.abs(r).toFixed(1));
      return `<td class="${cls}${extra && extra.cls ? ' ' + extra.cls : ''}" style="--a:${a}%"` +
        (extra && extra.title ? ` title="${esc(extra.title)}"` : '') + `>${txt}</td>`;
    }

    function paintMonths() {
      const box = document.getElementById('monthsBody');
      if (!box || !monthsReady(monthData)) return;
      const rows = monthData.stock;
      const own = monthReturns(rows), ownY = yearReturns(rows);
      const idx = monthReturns(monthData.bench || []), idxY = yearReturns(monthData.bench || []);
      const canRel = Object.keys(idx).length >= 12;
      const rel = monthRel && canRel;
      // AGAINST THE INDEX is the stock's month less the index's, in points. A
      // month the index has no reading for is blank rather than shown raw:
      // one cell on a different footing from its neighbours is worse than a gap.
      const val = (ym) => (own[ym] == null ? null : !rel ? own[ym] : idx[ym] == null ? null : own[ym] - idx[ym]);
      const valY = (y) => (ownY[y] == null ? null : !rel ? ownY[y] : idxY[y] == null ? null : ownY[y] - idxY[y]);
      const cap = rel ? MONTH_CAP.rel : MONTH_CAP.raw;
      const lastYm = rows[rows.length - 1][0], lastDay = rows[rows.length - 1][2] || '';
      const years = [...new Set(Object.keys(own).map((k) => Number(k.slice(0, 4))))].sort((a, b) => b - a);

      const body = years.map((y) => {
        const cells = MONTH_NAMES.map((_, i) => {
          const ym = y + '-' + String(i + 1).padStart(2, '0');
          // The newest month is still running: marked, and said on hover.
          return monthCell(val(ym), cap, ym === lastYm
            ? { cls: 'part', title: MONTH_NAMES[i] + ' ' + y + ' so far, to ' + lastDay } : null);
        }).join('');
        const yv = valY(y);
        return `<tr><th scope="row">${y}</th>${cells}` +
          monthCell(yv, cap * 3, { cls: 'yr' + (String(y) === lastYm.slice(0, 4) ? ' part' : ''),
            title: String(y) === lastYm.slice(0, 4) ? y + ' so far' : 'Calendar ' + y }) + '</tr>';
      }).join('');

      // The foot: how many of the years each month was up. A COUNT, and only
      // over finished months -- the one still running has not happened yet.
      let ups = 0, all = 0;
      const foot = MONTH_NAMES.map((_, i) => {
        let u = 0, n = 0;
        for (const y of years) {
          const ym = y + '-' + String(i + 1).padStart(2, '0');
          const v = ym === lastYm ? null : val(ym);
          if (v == null) continue;
          n++; if (v > 0) u++;
        }
        ups += u; all += n;
        return `<td>${n ? u + '/' + n : ''}</td>`;
      }).join('');
      const base = all ? Math.round(ups / all * 100) : null;

      box.innerHTML =
        '<div class="mbar">' +
          (canRel ? '<span class="seg">' +
            `<button type="button" class="rng${rel ? '' : ' on'}" data-rel="0">Own return</button>` +
            `<button type="button" class="rng${rel ? ' on' : ''}" data-rel="1">Against the S&amp;P 500</button></span>` : '') +
          `<span class="mkey"><i class="dn"></i>−${cap}% or worse<i class="up"></i>+${cap}% or better</span></div>` +
        '<div class="mwrap"><table><thead><tr><th></th>' +
          MONTH_NAMES.map((m) => `<th scope="col">${m}</th>`).join('') + '<th scope="col" class="yr">Year</th></tr></thead>' +
          `<tbody>${body}</tbody>` +
          `<tfoot><tr><th scope="row">${rel ? 'Ahead' : 'Up'}</th>${foot}<td></td></tr></tfoot></table></div>` +
        '<p class="note">' + (rel
          ? 'Each cell is the stock’s return for that month less the S&amp;P 500’s, in points — whether it beat the market, not whether it rose. '
          : 'Each cell is the price return for that calendar month, in percent; dividends are not included. ') +
        'The dotted cell is the month still running. ' +
        `The bottom row counts the years each month was ${rel ? 'ahead of the index' : 'up'}` +
        (base == null ? '. ' : `; across every month here the figure is ${base}%, which is what any one month should be read against. `) +
        `With about ${years.length} readings a month and twelve months to choose from, one will always look ` +
        'special by chance. This is a record of what happened, not a pattern to trade.</p>';

      box.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
        monthRel = b.getAttribute('data-rel') === '1'; paintMonths();
      }));
    }

    // ---- the jump bar -------------------------------------------------------
    // BUILT FROM THE PAGE, never from a list written down beside it. Which
    // cards exist here is not fixed the way /admin's eight sections are:
    // Earnings, About and Similar stocks are only rendered when there is
    // something to render, and SEC EDGAR, Insiders and Short interest start
    // hidden and are revealed by their own fetches long after the first paint
    // -- a fund files no statements and gets none of the three. A written list
    // would offer a chip that jumps to nothing, which is worse than no chip.
    //
    // So a card opts in with `data-jump` (its chip's label, which is allowed
    // to be shorter than its heading) and `data-icon`, and the bar is whatever
    // is on screen at the time.
    let jumpSig = null;
    function paintJumps() {
      const bar = document.getElementById('jumps');
      if (!bar) return;
      const cards = [...document.querySelectorAll('section.card[data-jump][id]')]
        .filter((el) => !el.hidden);
      // REWRITTEN ONLY WHEN THE SET CHANGES, and this is NOT an optimisation:
      // the bar lives inside the subtree the observer below watches, so
      // rewriting its markup is itself a mutation. Without this line the
      // observer feeds itself and the page never finishes loading — measured,
      // `networkidle` is never reached and the navigation times out. It also
      // happens to stop the chip under the pointer being thrown away on every
      // chart redraw and every table the page fills in.
      const sig = cards.map((el) => el.id + '|' + el.getAttribute('data-jump')).join(',');
      if (sig === jumpSig) return;
      jumpSig = sig;
      // One chip is not a bar, it is a button that scrolls to the only thing
      // there is. Nothing to jump BETWEEN, so nothing is drawn.
      bar.hidden = cards.length < 2;
      bar.innerHTML = cards.map((el) => {
        const icon = el.getAttribute('data-icon');
        return '<a class="jump" href="#' + esc(el.id) + '">'
          + (icon ? '<svg class="ic ic-sm" aria-hidden="true"><use href="#' + esc(icon) + '" /></svg>' : '')
          + esc(el.getAttribute('data-jump')) + '</a>';
      }).join('');
    }

    // The three async cards are revealed by setting `hidden` false, and they
    // land at different times. WATCHING THE DOM rather than calling
    // paintJumps() from each loader: that would be three call sites to keep in
    // step and a fourth card later would be the one somebody forgets. One
    // observer, and a card added afterwards is picked up for nothing.
    //
    // `childList` as well as the attribute, because those loaders ALSO call
    // `card.remove()` — and while every early return removes a card that was
    // still hidden, the catch at the end of each one can fire AFTER it has
    // been shown, which would leave a chip pointing at nothing. The signature
    // guard above is what makes watching the whole subtree affordable.
    let jumpWatch = null;
    function watchJumps() {
      if (jumpWatch) jumpWatch.disconnect();
      const bar = document.getElementById('jumps');
      const host = bar && bar.parentNode;
      if (!host || typeof MutationObserver !== 'function') return;
      jumpWatch = new MutationObserver(() => paintJumps());
      jumpWatch.observe(host, {
        attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true });
    }

    function paintEarnings() {
      const box = document.getElementById('earnBody');
      if (!box) return;
      const list = earnRows;
      const scored = list.filter(hasEst);
      const beats = scored.filter((r) => eps(r.epsActual) >= eps(r.epsEstimate)).length;
      const mags = scored.map((r) => eps(r.surprisePrc)).filter((v) => v != null && isFinite(v))
        .sort((a, b) => a - b);
      const med = mags.length ? mags[Math.floor(mags.length / 2)] : null;
      const dumb = earnDumbbell(list);

      const summary = scored.length
        ? `Beat the estimate in <b>${beats} of ${scored.length}</b> quarters` +
          (med == null ? '' : `, median surprise <b>${med >= 0 ? '+' : ''}${med.toFixed(1)}%</b>`) + '.'
        : `<b>${list.length}</b> quarter${list.length === 1 ? '' : 's'} on record, none with an estimate to compare against.`;

      box.innerHTML =
        `<p class="summary">${summary}</p>` +
        dumb.html +
        earnTable(list) +
        '<p class="note">Each quarter is two dots and the line between them: hollow is the estimate, ' +
        'filled is what the company reported, green where it beat and red where it missed; oldest on the left. ' +
        'A quarter nobody forecast is one grey dot. ' +
        (dumb.seg.split ? 'Reported earnings per share are not restated for a share split, so the chart keeps to the ' +
          'quarters reported ' + (dumb.seg.side === 'since' ? 'since' : 'before') + ' the split of ' + esc(dumb.seg.split) +
          ', which are on one share count; ' + (dumb.seg.held === 1 ? 'the other one is' : 'the other ' + dumb.seg.held + ' are') + ' in the table. ' : '') +
        'Reported figures only: this is what happened, not a forecast.</p>';

      const wide = document.getElementById('earnWide');
      if (wide) wide.addEventListener('click', () => { earnWide = !earnWide; paintEarnings(); });
      const more = document.getElementById('earnMore');
      if (more) more.addEventListener('click', () => { earnAll = !earnAll; paintEarnings(); });
    }

    // `force` asks the feed now instead of waiting out the six-hour rule. The
    // provider is free, so the only cost is the wait; the server keeps a
    // one-minute floor per stock so the button cannot be held down.
    function newsChecked(ms) {
      const el = document.getElementById('newsWhen');
      if (!el) return;
      if (!ms) { el.textContent = 'never checked'; return; }
      const h = (Date.now() - Number(ms)) / 3600000;
      el.textContent = 'checked ' + (h < 0.02 ? 'just now' : h < 1 ? Math.round(h * 60) + 'm ago'
        : h < 24 ? Math.round(h) + 'h ago' : Math.round(h / 24) + 'd ago');
    }

    // What has been fetched so far, and how many exist. Kept outside loadNews so
    // Show more appends to it rather than re-reading page one.
    let newsHave = [];
    let newsTotal = 0;
    let newsBusy = false;
    function paintNews() {
      const box = document.getElementById('newsList');
      if (!box) return;
      box.innerHTML = renderNewsList(newsHave, newsTotal);
      const more = document.getElementById('newsMore');
      if (more) more.addEventListener('click', moreNews);
      const less = document.getElementById('newsLess');
      // Folding back keeps what was fetched — it is already in hand, and
      // throwing it away would make the next Show more ask for it again.
      if (less) less.addEventListener('click', () => {
        newsHave = newsHave.slice(0, NEWS_PAGE);
        paintNews();
      });
    }
    async function moreNews() {
      if (newsBusy) return;
      newsBusy = true;
      const more = document.getElementById('newsMore');
      if (more) { more.disabled = true; more.textContent = 'Loading…'; }
      try {
        const res = await fetch(`/api/news?symbol=${encodeURIComponent(SYMBOL)}` +
          `&offset=${newsHave.length}&limit=${NEWS_PAGE}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'news unavailable');
        // De-duplicated by url on append: a headline can arrive between two
        // pages and shift the window, which would otherwise show it twice.
        const seen = new Set(newsHave.map((x) => x.url));
        newsHave = newsHave.concat((data.items || []).filter((x) => x && !seen.has(x.url)));
        if (Number(data.total)) newsTotal = Number(data.total);
        // A page that came back empty means there is no more, whatever the
        // count said — otherwise the button would sit there forever.
        if (!(data.items || []).length) newsTotal = newsHave.length;
        paintNews();
      } catch (err) {
        if (more) { more.disabled = false; more.textContent = 'Could not load more — try again'; }
      } finally { newsBusy = false; }
    }

    async function loadNews(force) {
      const box = document.getElementById('newsList');
      if (!box) return;
      const btn = document.getElementById('newsBtn');
      if (btn) { btn.disabled = true; if (force) btn.textContent = 'Checking…'; }
      try {
        const res = await fetch(`/api/news?symbol=${encodeURIComponent(SYMBOL)}&limit=${NEWS_PAGE}${force ? '&force=1' : ''}`, { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'news unavailable');
        newsHave = data.items || [];
        newsTotal = Number(data.total) || newsHave.length;
        paintNews();
        newsChecked(data.checkedAt);
      } catch (err) {
        box.innerHTML = '<div class="msg">Headlines unavailable right now.</div>';
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Check now'; }
      }
    }

    function paintChart() {
      const box = document.getElementById('chart');
      if (!box) return;
      box.dataset.range = range.id;
      box.classList.toggle('has-rsi', showRSI);
      // The chosen stock rides with the indices: one list, so the fetch, the
      // rebasing, the overlay paths and the legend all treat it identically.
      const wantBench = BENCH.filter((b) => b.on).concat(
        compareSym ? [{ sym: compareSym, label: cmpLabel(compareSym), cls: 'bm-cmp', on: true }] : []);
      Promise.all([
        RowCard.loadHistory(SYMBOL, range.days + REPLAY_PAD),
        // A benchmark that cannot be read must not take the chart down with it
        // — a guest is refused these symbols outright, and a fresh install has
        // no bars for them yet.
        ...wantBench.map((b) => RowCard.loadHistory(b.sym, range.days + REPLAY_PAD).catch(() => null)),
      ]).then(([data, ...benchHist]) => {
        if (box.dataset.range !== range.id) return;      // a later click won
        const all = (data && data.closes) || [];
        box.classList.remove('up', 'down');
        if (all.length < 2) {
