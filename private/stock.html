          box.innerHTML = '<div class="msg">No price history stored for this symbol yet</div>';
          return;
        }
        // Averaged over everything fetched, then sliced to the window asked
        // for, so each line is drawn from the first visible bar.
        const from = Math.max(0, all.length - range.days);
        const closes = all.slice(from);
        const series = MAS.map((m) => ({
          ma: m, values: RowCard.sma(all, m.len).slice(from),
        })).filter((x) => x.ma.on && x.values.some((v) => v != null));
        const volumes = (data.volumes || []).slice(from);
        const dates = (data.dates || []).slice(from);
        const first = closes[0], last = closes[closes.length - 1];
        const chg = ((last - first) / first) * 100;
        box.classList.add(chg >= 0 ? 'up' : 'down');
        const rsiAllFull = RowCard.rsiSeries(all, RSI_LEN);   // the replay reads it even when the pane is off
        const rsi = showRSI ? rsiAllFull.slice(from) : null;
        const rsiNow = rsi ? [...rsi].reverse().find((v) => v != null) ?? null : null;
        // ALWAYS computed: the ribbon is a reading of the bars, not an
        // option, and the crosshair's Trend row comes off the same words.
        // Thresholds follow the stock's current type — the classification is
        // not replayable historically; today's rules, today's type, replayed.
        const trend = trendSeries(all, from, (stock && stock.companyType) || 'Established', rulesCfg());
        // The Balanced verdicts feed the readout's Model row and the why
        // card only — never the line. Both of those explain the GAP between
        // the dashed line and the model, so they follow the line's toggle.
        const verds = showTrendLine ? verdictSeries(all, from, rulesCfg(), rsiAllFull) : null;
        const th = showTrendLine ? trendHoldSeries(closes, trend) : null;
        // Resolved before the chart is built, so the legend and the lines are
        // drawn from one list and cannot disagree about which indices are up.
        const drawnBench = wantBench.map((b, i) => {
          const values = benchSeries(dates, closes, benchHist[i]);
          return values ? { ...b, values } : null;
        }).filter(Boolean);
        const thLabel = 'Trend-held';
        paintCtx = { all, from, closes, dates, trend, rsiAll: rsiAllFull };
        const c = RowCard.chartSVG(closes, {
          volumes, ticks: 5, rsi,
          overlays: series.map((x) => ({ values: x.values, cls: x.ma.cls }))
            .concat(th ? [{ values: th.values, cls: 'th-ln' }] : [])
            .concat(drawnBench.map((b) => ({ values: b.values, cls: 'bm-ln ' + b.cls }))),
        });

        // Axis labels are HTML rather than SVG text: the chart stretches with
        // preserveAspectRatio="none", which would distort any glyph inside it.
        const ticks = [];
        const want = Math.min(5, Math.max(2, Math.floor(closes.length / 25) + 1));
        for (let k = 0; k < want; k++) {
          const i = Math.round((k / (want - 1)) * (dates.length - 1));
          const pct = dates.length === 1 ? 50 : (i / (dates.length - 1)) * 100;
          ticks.push(`<span class="tick" style="left:${pct.toFixed(2)}%">${esc(axisLabel(dates[i]))}</span>`);
        }

        // The price axis replaces the old floating high/low captions — with real
        // gridlines those two were saying the same thing twice.
        // Only ticks that actually got a gridline: one outside the band is a
        // price label hanging beside nothing.
        const yLabels = c.ticks.filter((tk) => tk.drawn).map((tk) =>
          `<span class="ytick" style="top:${atY(tk.top)}">${esc(tickLabel(tk.v))}</span>`
        ).join('');

        box.innerHTML = c.svg +
          `<span class="cap chg">${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%${c.log ? ' · log scale' : ''}</span>` +
          thEndTag(th, (v) => c.panes.price.at(v)) +
          `<span class="cap ma">${series.map((x) =>
            `<i class="${x.ma.cls}"></i>${x.ma.len}-day`).join('')}${
            drawnBench.map((b) => `<i class="bm ${b.cls}"></i>${b.label}`).join('')}</span>` +
          (c.panes.rsi
            ? `<span class="cap rsi" style="top:${atY(c.panes.rsi.top)}">` +
              `RSI ${RSI_LEN}${rsiNow == null ? '' : ' &middot; ' + rsiNow.toFixed(0)}</span>` +
              `<span class="rsi-lbl" style="top:${atY(c.panes.rsi.at(70))}">70</span>` +
              `<span class="rsi-lbl" style="top:${atY(c.panes.rsi.at(30))}">30</span>` +
              `<span class="rsi-zone hi" style="top:${atY(c.panes.rsi.at(70))}">Overbought</span>` +
              `<span class="rsi-zone lo" style="top:${atY(c.panes.rsi.at(30))}">Oversold</span>`
            : '') +
          `<span class="cap vol" style="top:${atY(c.panes.volume.top)}">Volume</span>` +
          `<span class="yaxis">${yLabels}</span>` +
          `<span class="axis">${ticks.join('')}</span>` +
          // Overlaid rather than drawn into the svg: preserveAspectRatio="none"
          // would stretch a dot into an ellipse and distort any text.
          '<span class="xhair" hidden></span>' +
          '<span class="xdot" hidden></span>' +
          '<span class="xdate" hidden></span>' +
          '<span class="readout" hidden></span>';

        const rug = document.getElementById('earnRug');
        if (rug) {
          // `earnRows` rather than `payload`: paintChart lives at script scope
          // and `payload` is a local of the boot IIFE, so reaching for it here
          // is a ReferenceError that kills the whole chart — which is exactly
          // what the first cut did. earnRows is the page's own copy of the
          // same list, already populated before the first paint, so the rug
          // still costs no fetch and no query.
          const rh = earnRugHtml(dates, closes, earnRows);
          rug.innerHTML = rh;
          rug.hidden = !rh;
        }
        // Both the fundamental and short-interest series arrive on their own
        // fetches, so the dates are kept for the repaint that happens when
        // each lands.
        lastDates = dates;
        paintFundStrip();
        paintSintStrip();
        const strip = document.getElementById('trendStrip');
        if (strip) {
          // Always offered; empty only when no session carries a known trend
          // word, where an unpainted track would say nothing.
          const html = trendStripHtml(trend, th, thLabel, true);
          strip.innerHTML = html;
          strip.hidden = !html;
          const wl = strip.querySelector('[data-why]');
          if (wl) wl.addEventListener('click', toggleWhy);
        }
        const wb = document.getElementById('whyBox');
        if (wb) {
          if (!showTrendLine) whyOpen = false;
          if (whyOpen) renderWhy();          // a repaint means a new range or rule set
          else { wb.hidden = true; wb.innerHTML = ''; }
        }

        // Everything the crosshair needs, kept for the pointer handler.
        hover = { dates, closes, volumes, rsi, trend, th: th ? th.values : null,
          verd: verds, pM: verds ? modelPositions(verds) : null, panes: c.panes };
      });
    }

    function toggleWhy() {
      whyOpen = !whyOpen;
      window.track && track('chart', 'why:' + (whyOpen ? 'open' : 'close'));
      const wb = document.getElementById('whyBox');
      if (!whyOpen) { if (wb) { wb.hidden = true; wb.innerHTML = ''; } return; }
      renderWhy();
    }
    // In 'Trend only' mode the comparison runs against Balanced — the
    // question "why do these differ" needs a second rule to differ from.
    function renderWhy() {
      const wb = document.getElementById('whyBox');
      if (!wb || !paintCtx || !showTrendLine || !paintCtx.trend) return;
      const pName = 'Balanced';

            const inM = hover.pM[i];
            if (inT && !inM) return `<span class="k">Model</span> <span class="v" style="color:var(--amber)">out — ${esc(hover.verd[i - 1].f)}</span>`;
            if (!inT && inM) return `<span class="k">Model</span> <span class="v">in — holding through ${esc(hover.trend[i] || '')}</span>`;
            return '';
          })() : '');
        out.hidden = false;
        chartEl.classList.add('hovering');
      });

      chartEl.addEventListener('pointerleave', hideHover);

      // ---- compare with another stock ----------------------------------------
      // The universe minus this stock and minus the four indices, which already
      // have their own buttons — offering SPY here as well would be two
      // controls for one line.
      universeRows = payload.universe || [];
      const cmpPick = document.getElementById('cmpPick');
      if (cmpPick) {
        const taken = new Set([SYMBOL].concat(BENCH.map((b) => b.sym)));
        cmpPick.innerHTML = '<option value="">Compare…</option>' +
          universeRows.filter((r) => !taken.has(r.symbol))
            .map((r) => `<option value="${esc(r.symbol)}"${r.symbol === compareSym ? ' selected' : ''}>` +
              `${esc(r.symbol)} — ${esc(r.short || r.name || r.symbol)}</option>`).join('');
        // The full-comparison link follows the overlay, so the page it opens is
        // the pair on screen. With nothing overlaid it still carries this stock,
        // which is the half the reader has already chosen.
        const cmpFull = document.getElementById('cmpFull');
        const syncFull = () => {
          if (!cmpFull) return;
          cmpFull.href = '/compare/' + encodeURIComponent(SYMBOL)
            + (compareSym ? '/' + encodeURIComponent(compareSym) : '');
          cmpFull.title = compareSym
            ? `Open ${SYMBOL} against ${compareSym} on the compare page — every field, side by side`
            : 'Open ' + SYMBOL + ' on the compare page and pick a stock to set against it';
        };
        syncFull();
        cmpPick.addEventListener('change', () => {
          compareSym = cmpPick.value || '';
          cmpPick.classList.toggle('on', !!compareSym);
          window.track && track('chart', 'compare:' + (compareSym || 'off'));
          syncFull();
          paintChart();
        });
      }

      const fuPick = document.getElementById('fuPick');
      if (fuPick) {
        fuPick.addEventListener('change', () => {
          if (FUND_METRICS.some((m) => m.k === fuPick.value)) fundMetric = fuPick.value;
          try { localStorage.setItem(FUNDM_KEY, fundMetric); } catch (e) { /* private window */ }
          window.track && track('chart', 'fund:' + fundMetric);
          paintFundStrip();
        });
      }

      document.querySelector('.ranges').addEventListener('click', (e) => {
        const b = e.target.closest('.rng');
        if (!b) return;
        if (b.id === 'thBtn') {
          showTrendLine = !showTrendLine;
          window.track && track('chart', 'trend:' + (showTrendLine ? 'on' : 'off'));
          b.classList.toggle('on', showTrendLine);
          paintChart();
          return;
        }
        if (b.id === 'rsiBtn') {
          showRSI = !showRSI;
          window.track && track('chart', 'pane:rsi:' + (showRSI ? 'on' : 'off'));
          b.classList.toggle('on', showRSI);
          paintChart();
          return;
        }
        if (b.id === 'fuBtn') {
          showFund = !showFund;
          // Per device, like the rug and the short strip: a chart layer is a
          // display choice rather than an account preference, and this page
          // makes no prefs round trip to put it in.
          try { localStorage.setItem(FUND_KEY, showFund ? '1' : '0'); } catch (e) { /* private window */ }
          window.track && track('chart', 'strip:fund:' + (showFund ? 'on' : 'off'));
          b.classList.toggle('on', showFund);
          const fp = document.getElementById('fuPick');
          // The metric picker cannot change anything while the strip is off,
          // and a control that does nothing reads as broken.
          if (fp) { fp.hidden = !showFund; fp.classList.toggle('on', showFund); }
          // The strip alone, never paintChart(): a full repaint would rebuild
          // the plot, the ribbon and every overlay to switch one layer beneath
          // them. The short strip's rule.
          paintFundStrip();
          return;
        }
        if (b.id === 'erBtn') {
          showEarnRug = !showEarnRug;
          // Remembered per device, the way /compare's hide and /m's switches
          // are: a display choice, not data, and a guest has no prefs key.
          try { localStorage.setItem(RUG_KEY, showEarnRug ? '1' : '0'); } catch (e) { /* private window */ }
          window.track && track('chart', 'earnrug:' + (showEarnRug ? 'on' : 'off'));
          b.classList.toggle('on', showEarnRug);
          paintChart();
          return;
        }
        if (b.id === 'siBtn') {
          showSintStrip = !showSintStrip;
          try { localStorage.setItem(SINT_KEY, showSintStrip ? '1' : '0'); } catch (e) { /* private window */ }
          window.track && track('chart', 'shortint:' + (showSintStrip ? 'on' : 'off'));
          b.classList.toggle('on', showSintStrip);
          // Only the strip changes, so the chart is not repainted — a full
          // repaint would rebuild the plot, the ribbon and every overlay to
          // toggle one layer underneath them.
          paintSintStrip();
          return;
        }
        if (b.dataset.bm) {
          const bm = BENCH.find((x) => x.sym === b.dataset.bm);
          bm.on = !bm.on;
          window.track && track('chart', 'bench:' + bm.sym + ':' + (bm.on ? 'on' : 'off'));
          b.classList.toggle('on', bm.on);
          paintChart();
          return;
        }
        if (b.dataset.ma) {
          const m = MAS.find((x) => String(x.len) === b.dataset.ma);
          m.on = !m.on;
          window.track && track('chart', 'ma:' + m.len + ':' + (m.on ? 'on' : 'off'));
          b.classList.toggle('on', m.on);
          paintChart();
          return;
        }
        range = RANGES.find((r) => r.id === b.dataset.r) || RANGES[0];
        window.track && track('chart', 'range:' + range.id);
        document.querySelectorAll('.rng[data-r]').forEach((x) => x.classList.toggle('on', x.dataset.r === range.id));
        paintChart();
      });
      // ---- save the chart as a post or a story -------------------------------
      // The card is built from the SAME numbers the chart on screen was drawn
      // from (paintCtx), so the image can never show a different window from
      // the one being looked at. It is drawn off-screen at its true 1080px
      // rather than scaled up from the page: a 468px chart blown up to a
      // 1920px story is a blurred screenshot, and the whole point of going
      // through cards.js is that the card is LAID OUT for the artboard.
      const SHOT_SIZES = {
        portrait: { id: 'portrait', w: 1080, h: 1350 },
        story: { id: 'story', w: 1080, h: 1920 },
      };
      const share = document.getElementById('share');
      const shrBtn = document.getElementById('shrBtn');
      const shrMenu = document.getElementById('shrMenu');
      const shrMsg = document.getElementById('shrMsg');

      // Guests are refused, the way /promo refuses them. A guest sees
      // five preview stocks; handing them a branded, dated image of one is the
      // one thing the preview is not for.
      fetch('/api/me', { cache: 'no-store' })
        .then((r) => r.json())
        .then((me) => { if (!me || !me.guest) share.hidden = false; })
        .catch(() => { share.hidden = false; });   // open mode, or /api/me down

      const closeShare = () => { shrMenu.hidden = true; shrBtn.setAttribute('aria-expanded', 'false'); };
      shrBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = shrMenu.hidden;
        shrMenu.hidden = !open;
        shrBtn.setAttribute('aria-expanded', String(open));
      });
      shrMenu.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', closeShare);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeShare(); });

      async function saveCard(sizeId) {
        const size = SHOT_SIZES[sizeId];
        const rows = shrMenu.querySelectorAll('.shr-row');
        if (!paintCtx || !paintCtx.closes || paintCtx.closes.length < 2) {
          shrMsg.textContent = 'The chart has not drawn yet.';
          shrMsg.classList.add('bad');
          return;
        }
        rows.forEach((b) => { b.disabled = true; });
        shrMsg.classList.remove('bad');
        shrMsg.textContent = 'Rendering at 1080 × ' + size.h + '…';
        const stage = document.createElement('div');
        stage.id = 'shot';
        stage.className = 's-art sz-' + size.id;
        stage.style.height = size.h + 'px';
        try {
          Cards.injectStyle();
          stage.innerHTML = '<div class="s-aura"></div><div class="s-in">' +
            Cards.build('stock', {
              stocks: [stock], size, updatedAt: payload.updatedAt,
              chart: {
                // The DISPLAY name, the rule every other card follows:
                // "NVIDIA" beside a line, not "NVIDIA Corporation". The
                // screener carries a Short name column, so the string exists
                // on every row and costs nothing to prefer.
                symbol: stock.symbol,
                name: stock.shortName || stock.name || stock.symbol,
                closes: paintCtx.closes, dates: paintCtx.dates,
                rangeLabel: range.word,
                price, today,
              },
            }) + '</div>';
          document.body.appendChild(stage);
          const blob = await CardShot.shoot(stage, { w: size.w, h: size.h });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `tickrlab-${stock.symbol}-${range.id}-${size.id}.png`;
          // The synthetic click BUBBLES to the document, where the
          // outside-click handler reads it as "clicked somewhere else" and
          // shuts the menu — so saving a post closed the menu you would then
          // have to reopen to save the story. Saving is not a reason to close
          // it; wanting both shapes is the common case.
          a.addEventListener('click', (e) => e.stopPropagation());
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          shrMsg.textContent = 'Saved ' + a.download;
          window.track && track('chart', 'save:' + size.id);
        } catch (err) {
          shrMsg.textContent = 'Could not save: ' + err.message + '. A screenshot still works.';
          shrMsg.classList.add('bad');
        }
        stage.remove();
        rows.forEach((b) => { b.disabled = false; });
      }
      shrMenu.querySelectorAll('.shr-row').forEach((b) =>
        b.addEventListener('click', () => saveCard(b.dataset.sz)));

      // ---- SEC EDGAR ---------------------------------------------------------
      // Its own fetch, after the chart, for the sparklines reason: a section
      // below the fold must not make the price wait. ~30-60KB against the
      // page's ~10KB, which is also why it is not folded into /api/stock.
      let secData = null;
      let secMode = 'quarterly';
      // Which columns: the filed dollars, or the ratios derived from them.
      let secView = 'figures';

      // Money as filed: compact, signed, and NEVER abbreviated past the point
      // where -183.0M and -1.83B look alike.
      const secMoney = (v) => {
        if (v == null || !Number.isFinite(v)) return null;
        const a = Math.abs(v);
        const [d, u] = a >= 1e12 ? [1e12, 'T'] : a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M']
          : a >= 1e3 ? [1e3, 'K'] : [1, ''];
        return (v < 0 ? '-' : '') + '$' + (a / d).toFixed(a / d >= 100 ? 0 : a / d >= 10 ? 1 : 2) + u;
      };
      const SEC_COLS = [
        ['revenue', 'Revenue', secMoney], ['grossProfit', 'Gross profit', secMoney],
        ['operatingIncome', 'Op. income', secMoney], ['netIncome', 'Net income', secMoney],
        ['epsDiluted', 'EPS dil.', (v) => (v == null ? null : (v < 0 ? '-' : '') + '$' + Math.abs(v).toFixed(2))],
        ['operatingCashFlow', 'Op. cash flow', secMoney], ['capex', 'Capex', secMoney],
        ['freeCashFlow', 'FCF', secMoney], ['assets', 'Assets', secMoney],
        // Stored since the card shipped and never drawn. Liabilities is the
        // other half of the balance sheet — assets and equity without it
        // leave leverage to be inferred — and the diluted share count is how
        // dilution shows up at all, since every per-share figure hides it.
        // `costOfRevenue` stays out: it is revenue less gross profit, both
        // already in the row, so it would be a column restating two others.
        ['liabilities', 'Liabilities', secMoney],
        ['equity', 'Equity', secMoney], ['cash', 'Cash', secMoney], ['debt', 'LT debt', secMoney],
        ['sharesDiluted', 'Shares dil.', (v) => (v == null ? null
          : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : (v / 1e6).toFixed(0) + 'M')],
      ];

      // THE RATIOS THE RULES READ, computed from the filings. Percentages, so
      // a loss is a true negative margin and is kept — unlike a multiple off
      // a loss, which is arithmetic rather than cheapness.
      const secPct = (v) => (v == null || !isFinite(v) ? null
        : (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%');
      const SEC_RATIO_COLS = [
        ['grossMargin', 'Gross margin', secPct],
        ['operatingMargin', 'Op. margin', secPct],
        ['profitMargin', 'Profit margin', secPct],
        ['fcfMargin', 'FCF margin', secPct],
        ['revenueGrowthYoY', 'Revenue YoY', secPct],
        ['earningsGrowthYoY', 'Earnings YoY', secPct],
      ];
      // Which of those the Balanced rules actually read, and under what name
      // on the snapshot row. Operating margin is shown because it is useful
      // and is deliberately NOT in this map: no rule reads it.
      const ENGINE_KEYS = {
        grossMargin: 'grossMargin', profitMargin: 'profitMargin',
        fcfMargin: 'fcfMargin', revenueGrowthYoY: 'revenueGrowthYoY',
        earningsGrowthYoY: 'earningsGrowthYoY',
      };

      // ---- the statements, laid out AS statements ---------------------------
      // (2026-10-05, owner's request, from two screenshots of a broker's
      // Financials tab.) The SEC EDGAR card below reads period-per-ROW with
      // the concepts as columns, which is right for "what did this filing
      // say" and is NOT how a financial statement is read. This is the
      // transpose: line items down, periods across, newest first.
      //
      // IT SHARES secData AND FETCHES NOTHING. Same rows, same request, a
      // second reading of them -- which is the whole reason this is small.
      // The raw card is untouched, deliberately: it carries the filing link
      // and the per-filing provenance this layout has no room for.
      let stmtTab = 'income';
      const STMT_COLS = 5;

      // IN MILLIONS, NO UNIT PER CELL, and that is the one real difference
      // from secMoney. That formatter picks a unit per value, which is right
      // for a mixed row and wrong for a COLUMN you read down: $1.2B above
      // $985.0M is a comparison the eye has to do twice. One scale, thousands
      // separated, negatives in parentheses -- the convention every statement
      // uses, and the one the screenshots use.
      const stmtM = (v) => (v == null || !Number.isFinite(v)) ? null
        : (v < 0 ? '(' : '') + Math.round(Math.abs(v) / 1e6).toLocaleString() + (v < 0 ? ')' : '');
      const stmtEps = (v) => (v == null || !Number.isFinite(v)) ? null
        : (v < 0 ? '(' : '') + Math.abs(v).toFixed(2) + (v < 0 ? ')' : '');
      const stmtSh = (v) => (v == null || !Number.isFinite(v)) ? null
        : Math.round(v / 1e6).toLocaleString();

      // THREE STATEMENTS, and every line is a field the filings actually
      // state. "Total operating expense" is on the reference screenshot and
      // is NOT here: we do not store it, and revenue minus operating income
      // is not the same thing -- inventing a line to match a layout is how a
      // card starts asserting something no filing says.
      const STMT_DEFS = {
        income: { label: 'Income statement', rows: [
          ['revenue', 'Revenue', stmtM],
          ['costOfRevenue', 'Cost of revenue', stmtM],
          ['grossProfit', 'Gross profit', stmtM],
          ['operatingIncome', 'Operating income', stmtM],
          ['netIncome', 'Net income', stmtM],
          ['epsDiluted', 'Diluted EPS', stmtEps],
        ] },
        balance: { label: 'Balance sheet', rows: [
          ['assets', 'Total assets', stmtM],
          ['liabilities', 'Total liabilities', stmtM],
          ['equity', 'Shareholders’ equity', stmtM],
          ['cash', 'Cash', stmtM],
          ['debt', 'Long-term debt', stmtM],
          ['sharesDiluted', 'Diluted shares', stmtSh],
        ] },
        cash: { label: 'Cash flow', rows: [
          ['operatingCashFlow', 'Operating cash flow', stmtM],
          ['capex', 'Capital expenditure', stmtM],
          ['freeCashFlow', 'Free cash flow', stmtM],
        ] },
      };

      // A SIGNED bar chart, because half these lines go negative and a chart
      // that plotted |v| would draw a loss as a gain. Scaled to the largest
      // magnitude in the row, so each row is read against itself -- a shared
      // scale would flatten EPS to nothing beside revenue.
      //
      // OLDEST TO NEWEST, which runs the OTHER WAY from the columns, and the
      // header says so. The two conventions genuinely conflict: a statement
      // puts the newest period first, a sparkline is universally read left to
      // right as time passing. Matching the columns would draw a trend
      // backwards, which is the worse of the two errors, so the column is
      // labelled rather than silently reversed.
      function stmtSpark(vals) {
        const has = vals.filter((v) => v != null && Number.isFinite(v));
        if (has.length < 2) return '';
        const max = Math.max(...has.map(Math.abs)) || 1;
        const anyNeg = has.some((v) => v < 0);
        const H = 22, MID = anyNeg ? H / 2 : H, W = 7, G = 2;
        const bars = vals.map((v, i) => {
          if (v == null || !Number.isFinite(v)) return '';
          const h = Math.max(1, (Math.abs(v) / max) * (anyNeg ? H / 2 : H));
          const y = v < 0 ? MID : MID - h;
          return '<rect x="' + (i * (W + G)) + '" y="' + y.toFixed(1) + '" width="' + W +
            '" height="' + h.toFixed(1) + '" class="' + (v < 0 ? 'dn' : 'up') + '"></rect>';
        }).join('');
        const w = vals.length * (W + G) - G;
        return '<svg class="sspark" viewBox="0 0 ' + w + ' ' + H + '" width="' + w +
          '" height="' + H + '" aria-hidden="true">' +
          (anyNeg ? '<line x1="0" y1="' + MID + '" x2="' + w + '" y2="' + MID + '" class="zl"></line>' : '') +
          bars + '</svg>';
      }

      function paintStmt() {
        const host = document.getElementById('stmtBody');
        if (!host || !secData) return;
        const all = secData[secMode] || [];
        if (!all.length) {
          host.innerHTML = '<p class="msg">No ' + secMode + ' periods filed.</p>';
          return;
        }
        const cols = all.slice(0, STMT_COLS);               // newest first, as filed
        const def = STMT_DEFS[stmtTab] || STMT_DEFS.income;
        // A LINE WITH NOTHING IN IT IS DROPPED, never drawn as a row of
        // dashes: the balance sheet is sparse for some filers and five empty
        // cells under a label says only that we hold nothing.
        const live = def.rows.filter(([k]) => cols.some((r) => r[k] != null));
        if (!live.length) {
          host.innerHTML = '<p class="msg">Nothing filed for the ' +
            esc(def.label.toLowerCase()) + ' over these periods.</p>';
          return;
        }
        let anyDerived = false;
        let h = '<div class="stab"><table class="stmt"><thead><tr><th class="li">' +
          esc(def.label) + '</th><th class="tr">Trend</th>' +
          cols.map((r) => '<th>' + esc(r.periodEnd) +
            (r.fp ? '<span class="fp">' + esc(r.fp) + '</span>' : '') + '</th>').join('') +
          '</tr></thead><tbody>';
        for (const [k, label, fmt] of live) {
          // The spark reads oldest -> newest; the columns read newest first.
          const series = cols.map((r) => r[k]).slice().reverse();
          h += '<tr><td class="li">' + esc(label) + '</td>' +
            '<td class="tr">' + stmtSpark(series) + '</td>';
          for (const r of cols) {
            const t = fmt(r[k]);
            const isD = r.derived || (r.derivedFields || []).indexOf(k) >= 0;
            if (t != null && isD) anyDerived = true;
            const cls = [t == null ? 'na' : '', t != null && r[k] < 0 ? 'neg' : '',
              t != null && isD ? 'dv' : ''].filter(Boolean).join(' ');
            h += '<td' + (cls ? ' class="' + cls + '"' : '') +
              (t != null && isD ? ' title="Computed here by differencing the cumulative periods — no filing states this quarter on its own"' : '') +
              '>' + (t == null ? '—' : esc(t)) + '</td>';
          }
          h += '</tr>';
        }
        h += '</tbody></table></div>';
        h += '<p class="note">Figures in millions, except per-share data and the share count. ' +
          '( ) = negative. Periods run newest first; the trend runs oldest to newest and is ' +
          'scaled to the largest figure in its own row. ' +
          (anyDerived ? 'A dotted value was computed here rather than filed — no company files a fourth quarter, and a cash-flow statement is year-to-date. ' : '') +
          'The same filings as the SEC EDGAR card below, which names the document each row came from.</p>';
        host.innerHTML = h;
      }

      function paintSec() {
        const host = document.getElementById('secBody');
        if (!host || !secData) return;
        const rows = secData[secMode] || [];
        if (!rows.length) {
          host.innerHTML = '<p class="msg">No ' + secMode + ' periods filed.</p>';
          return;
        }
        if (secView === 'ratios') { host.innerHTML = secRatiosHtml(rows); return; }
        const anyDerived = rows.some((r) => r.derived || (r.derivedFields || []).length);
        let h = '<div class="stab"><table><thead><tr><th>Period</th>' +
          SEC_COLS.map((c) => '<th>' + esc(c[1]) + '</th>').join('') +
          '<th>Filed</th></tr></thead><tbody>';
        for (const r of rows) {
          h += '<tr><td class="per">' + esc(r.periodEnd) +
            (r.fp ? '<span class="fp">' + esc(r.fp) + '</span>' : '') + '</td>';
          for (const [k, label, fmt] of SEC_COLS) {
            const t = fmt(r[k]);
            // A value this app computed, not one the filing states. Marked,
            // with the reason on the cell — passing arithmetic off as a
            // filing is the one thing this card must not do.
            const isD = r.derived || (r.derivedFields || []).indexOf(k) >= 0;
            const cls = [t == null ? 'na' : '', t != null && r[k] < 0 ? 'neg' : '',
              t != null && isD ? 'dv' : ''].filter(Boolean).join(' ');
            h += '<td' + (cls ? ' class="' + cls + '"' : '') +
              (t != null && isD ? ' title="Computed here by differencing the cumulative periods — no filing states this quarter on its own"' : '') +
              '>' + (t == null ? '—' : esc(t)) + '</td>';
          }
          h += '<td class="filed">' + (r.url
            ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" title="' +
              esc((r.form || 'filing') + ' filed ' + r.filed + ' — open it on sec.gov') + '">' +
              esc(r.filed) + '</a>'
            : esc(r.filed || '—')) + '</td></tr>';
        }
        h += '</tbody></table></div>';
        // WHY THESE NUMBERS DIFFER FROM THE CARDS ABOVE, said before anyone
        // has to wonder: a different source, on a fiscal calendar, as filed.
        h += '<p class="note">Straight from the company’s own filings at ' +
          '<a class="rc-link" href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=' +
          esc(String(secData.cik || '')) + '&type=10-&dateb=&owner=include&count=40" target="_blank" rel="noopener">SEC EDGAR</a>' +
          ', on the company’s fiscal calendar and as reported in the filing named on each row — ' +
          'so they will not always match the vendor figures elsewhere on this page, which are trailing-twelve-month and restated to today. ' +
          'Later filings restate earlier periods; each row shows the most recent version. ' +
          (anyDerived ? 'A dotted value was computed here rather than filed: no company files a fourth quarter, and a cash-flow statement is year-to-date, so those quarters are the difference between the cumulative periods either side. ' : '') +
          'Nothing on this card feeds the Advice verdict or the screener.</p>';
        host.innerHTML = h;
      }

      // WHAT THE RULES MADE OF THOSE NUMBERS — the last step in the chain the
      // card walks: what the company filed, what the verdict read, and now
      // what it concluded. Computed here from the same engine the screener
      // uses, on the same snapshot row, so the word can never disagree with
      // the Fund. column there.
      //
      // THE THRESHOLDS ARE DELIBERATELY ABSENT. The rule ladder has been
      // admin-only since 2026-09-26 — a member keeps the verdict and the one
      // rule that fired, and loses the threshold list, which is the one
      // genuinely copyable thing in the model. This page has NO admin gate at
      // all, so anything printed here reaches members and guests: the state
      // word and the fired rule are already theirs on the screener, and the
      // numbers behind them are already columns. Nothing more goes here.
      function secFundHtml() {
        let ev = null;
        try { ev = ActionRules.evaluate(stock, RULES_CFG); } catch (e) { return ''; }
        if (!ev || !ev.states) return '';
        const word = ev.states.fund;
        // An ETF is scored on the technical rules alone, so it has no
        // fundamentals reading — saying "—" without saying why reads as a gap
        // in the data rather than as the design.
        const isEtf = ev.type === 'ETF';
        const cls = word === 'Weak' ? 'weak' : '';
        return '<div class="fundv">' +
          '<span class="k">What the rules made of these</span>' +
          '<span class="v ' + cls + '">' + esc(isEtf ? 'Not scored' : word) + '</span>' +
          '<span class="x">' + (isEtf
            ? 'A fund is scored on the technical rules alone — it files no statements and has no fundamentals reading.'
            : esc(ev.type) + ' company, so the ' +
              (ev.type === 'Early' ? 'early-stage' : 'established') +
              ' fundamentals rules apply. The Balanced verdict is <b>' + esc(ev.action) +
              '</b>' + (ev.flag ? ': ' + esc(ev.flag) : '') + '.') +
          '</span></div>';
      }

      // The ratios view. The comparison strip is the reason it earns its
      // place: without it a reader sees "Gross margin 61.2%" beside a verdict
      // and assumes that is what the verdict read. It is not — the engine
      // takes the vendor's trailing-twelve-month figure, restated to today
      // and computed on a different basis, and this project has measured the
      // two ~4 points apart on one company. Showing both and naming the gap
      // turns a confusing discrepancy into the useful half of the card.
      function secRatiosHtml(rows) {
        // THE COMPARISON LEADS, because it is what the view is for and it was
        // buried under twenty-six rows of history where nobody found it.
        let h = '';
        let table = '<div class="stab"><table><thead><tr><th>Period</th>' +
          SEC_RATIO_COLS.map((c) => '<th>' + esc(c[1]) + '</th>').join('') +
          '<th>Filed</th></tr></thead><tbody>';
        // THE SUM HAS TO BE ON SCREEN OR THE COMPARISON CANNOT BE CHECKED.
        // Reported by the owner from a screenshot: the growth lines above
        // trace straight to the newest quarter — +345.7% is +345.7% — while
        // the margins traced to nothing, because they are four quarters
        // summed and no row showed that sum. 72.6% against a visible 84.6%
        // reads as a contradiction rather than as a different basis, however
        // carefully the basis is labelled.
        const ttmRow = secData.ttm;
        if (ttmRow) {
          table += '<tr class="ttmrow"><td class="per">Last 4 quarters' +
            '<span class="fp">to ' + esc(ttmRow.to) + '</span></td>';
          for (const [k, , fmt] of SEC_RATIO_COLS) {
            // Growth is NOT summed over a year — it is the newest quarter
            // against the one a year before, which is the row below. A
            // number here would be a third basis nobody asked for.
            if (/YoY$/.test(k)) {
              table += '<td class="na" title="' +
                esc('Growth is compared on the newest quarter, the row below — not over the summed year') +
                '">—</td>';
              continue;
            }
            const v = fmt(ttmRow[k]);
            table += '<td class="' + (v == null ? 'na' : (ttmRow[k] < 0 ? 'neg' : '')) + '">' +
              (v == null ? '—' : esc(v)) + '</td>';
          }
          table += '<td class="filed">—</td></tr>';
        }
        for (const r of rows) {
          table += '<tr><td class="per">' + esc(r.periodEnd) +
            (r.fp ? '<span class="fp">' + esc(r.fp) + '</span>' : '') + '</td>';
          for (const [k, , fmt] of SEC_RATIO_COLS) {
            const t = fmt(r[k]);
            const cls = [t == null ? 'na' : '', t != null && r[k] < 0 ? 'neg' : '']
              .filter(Boolean).join(' ');
            // A growth figure says which period it is against, because a gap
            // in the filings or a changed fiscal year end moves it.
            const tip = (/YoY$/.test(k) && r.yoyAgainst)
              ? ' title="' + esc('against ' + r.yoyAgainst) + '"' : '';
            table += '<td' + (cls ? ' class="' + cls + '"' : '') + tip + '>' +
              (t == null ? '—' : esc(t)) + '</td>';
          }
          table += '<td class="filed">' + (r.url
            ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.filed) + '</a>'
            : esc(r.filed || '—')) + '</td></tr>';
        }
        table += '</tbody></table></div>';

        // LIKE FOR LIKE, OR THE STRIP LIBELS THE VENDOR. The engine's MARGINS
        // are trailing-twelve-month, so they are compared against four filed
        // quarters summed — measured on MU, a single quarter against them
        // showed a 33.9-point FCF "gap" that was almost entirely period
        // length, since its revenue is up 345% year on year. Its GROWTH is
        // last-quarter-year-on-year, which is why those two lines stay on the
        // quarterly basis and already agreed to +0.0pt.
        const newest = rows[0];
        const t = secData.ttm;
        const cmp = [];
        for (const [k, label] of SEC_RATIO_COLS) {
          const ek = ENGINE_KEYS[k];
          if (!ek) continue;
          const isGrowth = /YoY$/.test(k);
          const mine = isGrowth ? newest[k] : (t ? t[k] : null);
          // Name the row each figure comes from. "four filed quarters" told
          // a reader the basis but not where to look, so a margin that
          // matched nothing visible read as an error.
          const basis = isGrowth
            ? 'the ' + newest.periodEnd + ' row below, against a year earlier'
            : (t ? 'the “Last 4 quarters” row below' : null);
          const theirs = stock[ek] == null ? null : Number(stock[ek]);
          if (mine == null && theirs == null) continue;
          const gap = (mine != null && theirs != null) ? mine - theirs : null;
          cmp.push('<tr><td class="who">' + esc(label) +
            (basis ? '<span class="basis">' + esc(basis) + '</span>' : '') + '</td>' +
            '<td>' + (secPct(mine) || '—') + '</td>' +
            '<td>' + (secPct(theirs) || '—') + '</td>' +
            '<td class="' + (gap == null ? 'na' : Math.abs(gap) >= 2 ? 'warn' : '') + '">' +
            (gap == null ? '—' : (gap >= 0 ? '+' : '') + gap.toFixed(1) + 'pt') + '</td></tr>');
        }
        if (cmp.length) {
          h += '<div class="cmpwrap"><table class="cmp"><thead><tr>' +
            '<th>Against what the verdict reads</th><th>From the filings</th>' +
            '<th>Twelve Data</th><th>Gap</th></tr></thead><tbody>' +
            cmp.join('') + '</tbody></table></div>';
          h += secFundHtml();
        }
        // A missing TTM is stated rather than left as four em-dashes: four
        // consecutive filed quarters is not something every filer has.
        if (cmp.length && !t) {
          h += '<p class="note">The margins have no trailing-twelve-month figure here — ' +
            'that needs four consecutive filed quarters, and this company does not have ' +
            'them in the window stored.</p>';
        }
        // WHY THERE IS NO VENDOR COLUMN ON EVERY ROW, said before anyone has
        // to wonder. Twelve Data reports ONE current trailing-twelve-month
        // figure per field rather than a series, and our own record of those
        // readings (`fundamentals_history`) only begins 2026-08-30 — months
        // after most filed periods ended, so there is no vendor value
        // contemporaneous with them to place alongside.
        h += '<p class="note"><b>Twelve Data has no per-period history to set beside each ' +
          'row.</b> It reports one current trailing-twelve-month figure per field rather ' +
          'than a series, so the two can only be compared on the newest period, above. ' +
          'Everything below is the filings’ own record, which does go back.</p>' + table;

        h += '<p class="note"><b>Computed here from the filings above</b>, not taken from ' +
          'a vendor — each is that period’s own figure divided by that period’s own ' +
          'revenue, on the company’s fiscal calendar. <b>These are not the numbers the ' +
          'Advice verdict used.</b> The engine reads the vendor’s trailing-twelve-month ' +
          'values, restated to today and computed on a different basis, which is why the ' +
          'gap column is rarely zero and is marked once it passes two points. ' +
          '<b>The comparison is like for like:</b> the margins are four filed quarters ' +
          'summed, because the vendor’s are trailing-twelve-month, and the growth ' +
          'lines are the newest quarter against a year earlier, because the vendor’s ' +
          'are too. Comparing one quarter’s margin against a trailing year shows a ' +
          'thirty-point gap that is only period length. ' +
          '<b>FCF is the one to read with care:</b> here it is operating cash flow less ' +
          'capital expenditure, straight from the cash-flow statement, and a vendor may ' +
          'define it more strictly — measured on one company, revenue, net income and ' +
          'gross margin all reconciled to the decimal while FCF did not, which makes that ' +
          'gap a difference of definition rather than of arithmetic. ' +
          'A growth figure is against the same period a year earlier — hover it for which — ' +
          'and is withheld where the earlier figure was a loss, since growth from a negative ' +
          'base inverts its own sign. Operating margin is shown because it is worth seeing; ' +
          'no rule reads it. <b>Nothing on this card feeds the Advice verdict or the ' +
          'screener</b> — it is here so you can see what the company actually filed.</p>';
        return h;
      }

      async function loadSec() {
        const card = document.getElementById('sec');
        if (!card) return;
        // Both cards are the same filings, so they live and die together:
        // an empty card headed "Financial statements" is worse than none.
        // ONE removal with THREE callers -- a refused fetch, a company with
        // no periods, and the catch. Three copies is three places to forget,
        // which the first cut did: it covered the catch alone and left #stmt
        // hidden-but-present on the other two.
        const drop = () => {
          card.remove();
          const sb = document.getElementById('stmt');
          if (sb) sb.remove();
        };
        try {
          const r = await fetch('/api/sec?symbol=' + encodeURIComponent(stock.symbol));
          // A refusal has to settle the row too, or it reads "still reading
          // the filings" for the rest of the session.
          if (!r.ok) { paintAnnRow(); drop(); return; }
          const j = await r.json();
          // THE ANNOUNCEMENT DATE IS STAMPED BEFORE THE EARLY RETURN BELOW,
          // and that ordering is load-bearing: the ~64 IFRS filers answer 404
          // on companyfacts and draw no card at all, yet they still file an
          // Item 2.02 8-K — so a stamp after the return would leave their row
          // reading "still reading the filings" for ever. The card is the
          // statements; the row is a date, and they are different facts.
          // It rides this response rather than asking /api/sec/filed for a
          // second copy: one read of sec_state already happened in here.
          stock.secLastResults = j.lastResults || null;
          paintAnnRow();
          // Nothing filed is the normal answer for a fund. No card at all,
          // rather than a heading over an empty table.
          if (!(j.annual || []).length && !(j.quarterly || []).length) { drop(); return; }
          secData = j;
          // The caption above was built before this landed, so it is redrawn
          // now that the filings are known — the one clause that needs them.
          paintFundCaption(j.lastFiled);
          // The strip rides this fetch rather than asking for its own —
          // /api/sec is already on this page, so the layer costs no endpoint
          // and no read. It lands AFTER the first paint, so the strip is drawn
          // then, and ALONE.
          secTtm = Array.isArray(j.ttmSeries) ? j.ttmSeries : null;
          paintFundStrip();
          secMode = (j.quarterly || []).length ? 'quarterly' : 'annual';
          card.hidden = false;
          const qb = document.getElementById('secQ');
          const ab = document.getElementById('secA');
          const fb = document.getElementById('secFig');
          const rb = document.getElementById('secRat');
          // ONE PERIOD SWITCH FOR BOTH CARDS. A second Quarterly/Annual pair
          // on the statements card would be two controls for one question,
          // and they could be set to disagree.
          const sb = document.getElementById('stmt');
          const tabs = [['stmtInc', 'income'], ['stmtBal', 'balance'], ['stmtCf', 'cash']];
          const sync = () => {
            qb.classList.toggle('on', secMode === 'quarterly');
            ab.classList.toggle('on', secMode === 'annual');
            if (fb) fb.classList.toggle('on', secView === 'figures');
            if (rb) rb.classList.toggle('on', secView === 'ratios');
            for (const [id, key] of tabs) {
              const el = document.getElementById(id);
              if (el) el.classList.toggle('on', stmtTab === key);
            }
            paintSec();
            paintStmt();
          };
          if (sb) {
            sb.hidden = false;
            for (const [id, key] of tabs) {
              const el = document.getElementById(id);
              if (el) el.addEventListener('click', () => { stmtTab = key; sync(); });
            }
          }
          qb.addEventListener('click', () => { secMode = 'quarterly'; sync(); });
          ab.addEventListener('click', () => { secMode = 'annual'; sync(); });
          if (fb) fb.addEventListener('click', () => { secView = 'figures'; sync(); });
          if (rb) rb.addEventListener('click', () => { secView = 'ratios'; sync(); });
          sync();
        } catch (e) { drop(); }
      }

      // ---- insider transactions ----------------------------------------------
      // Open-market purchases and sales only. A grant is not a decision and
      // tax withholding is automatic, so the compensation machinery — which
      // is 93% of what gets filed — never reaches this card.
      async function loadInsider() {
        const card = document.getElementById('ins');
        if (!card) return;
        try {
          const r = await fetch('/api/insider?symbol=' + encodeURIComponent(stock.symbol));
          if (!r.ok) { card.remove(); return; }
          const j = await r.json();
          if (!j.rows || !j.rows.length) { card.remove(); return; }
          const s = j.summary || { bought: {}, sold: {} };
          const months = Math.round((j.windowDays || 180) / 30);
          document.getElementById('insWin').textContent = 'last ' + months + ' months';

          // COUNT PEOPLE, NOT JUST TRADES. One director topping up three
          // times is one person's opinion; three directors buying is the
          // thing worth noticing, and a trade count cannot tell them apart.
          const side = (d, cls, verb) => {
            if (!d || !d.trades) return '';
            return '<span class="' + cls + '"><b>' + d.people + '</b> ' +
              (d.people === 1 ? 'insider ' : 'insiders ') + verb +
              (d.value ? ' <b>' + secMoney(d.value) + '</b>' : '') +
              ' <span style="color:var(--faint)">(' + d.trades +
              (d.trades === 1 ? ' trade' : ' trades') +
              (d.valued < d.trades ? ', ' + (d.trades - d.valued) + ' without a price' : '') +
              ')</span></span>';
          };
          let h = '<div class="sum">' + (side(s.bought, 'bought', 'bought') ||
            '<span>No purchases in the window</span>') +
            (side(s.sold, 'sold', 'sold') || '') + '</div>';

          h += '<div class="stab"><table><thead><tr><th>Filed</th><th>Insider</th>' +
            '<th>Action</th><th>Shares</th><th>Price</th><th>Value</th><th>Held after</th>' +
            '<th>Traded</th></tr></thead><tbody>';
          for (const t of j.rows) {
            const n = (v, d) => (v == null ? '—' : Number(v).toLocaleString(undefined,
              { maximumFractionDigits: d == null ? 0 : d }));
            h += '<tr>' +
              '<td class="filed">' + (t.url
                ? '<a href="' + esc(t.url) + '" target="_blank" rel="noopener" title="' +
                  esc((t.form || 'Form 4') + ' filed ' + t.filed + ' — open it on sec.gov') +
                  '">' + esc(t.filed) + '</a>'
                : esc(t.filed)) + '</td>' +
              '<td class="who" title="' + esc((t.ownerName || '') + (t.ownerRole ? ' — ' + t.ownerRole : '')) + '">' +
                esc(t.ownerName || '—') +
                (t.ownerRole ? '<span class="role">' + esc(t.ownerRole) + '</span>' : '') + '</td>' +
              '<td class="act ' + (t.buy ? 'buy' : 'sell') + '">' + esc(t.word) +
                (t.planned ? '<span class="plan" title="A 10b5-1 plan is scheduled months ahead, so it says much less about what the insider thinks today">plan</span>' : '') + '</td>' +
              '<td>' + n(t.shares) + '</td>' +
              '<td>' + (t.price == null ? '—' : '$' + Number(t.price).toFixed(2)) + '</td>' +
              '<td>' + (t.value == null ? '—' : esc(secMoney(t.value))) + '</td>' +
              '<td>' + n(t.sharesAfter) + '</td>' +
              '<td>' + esc(t.transDate) + '</td></tr>';
          }
          h += '</tbody></table></div>';
          h += '<p class="note"><b>Open-market purchases and sales only.</b> Grants, option ' +
            'exercises and shares withheld to pay tax are left out — they are compensation ' +
            'machinery rather than a decision, and they are about 93% of what gets filed. ' +
            '<b>Filed</b> is the date it became public, which is what you could have known; ' +
            '<b>Traded</b> is when it happened, usually two business days earlier. ' +
            'Marked <span class="plan">plan</span> means a 10b5-1 schedule set up months in ' +
            'advance. Straight from the filer’s own Form 4 at SEC EDGAR, and read by ' +
            'nothing else in this app — not the Advice verdict, not the screener.</p>';
          document.getElementById('insBody').innerHTML = h;
          card.hidden = false;
        } catch (e) { card.remove(); }
      }

      // ---- short interest ----------------------------------------------------
      // FINRA's BI-WEEKLY consolidated position — the shares actually held
      // short at a settlement date. Deliberately not the RegSHO daily file,
      // which is short VOLUME: mostly market-maker intermediation, flat again
      // by the close, and routinely 50-60% on a liquid name.
      //
      // Read by nothing else in this app. The Advice rules do read short
      // interest, but they take it from the profile as they always have; this
      // table exists to give that number a history.
      async function loadShortInt() {
        const card = document.getElementById('sint');
        if (!card) return;
        try {
          const r = await fetch('/api/shortint?symbol=' + encodeURIComponent(stock.symbol));
          if (!r.ok) { card.remove(); return; }
          const j = await r.json();
          const st = j.study;
          if (!st || !st.series || !st.series.length) { card.remove(); return; }
          // The chart layer reads the same series this card does — one fetch
          // serves both. It lands after the first paint, so the strip is
          // drawn now; the chart itself is left alone.
          sintRows = st.series;
          paintSintStrip();
          const L = st.latest || {};
          // Just the count. "210 readings since 2017-12-29" collided with the
          // heading at 390px, and the from-date is already the left end of
          // the axis below — so the long version was both broken and a
          // repetition.
          document.getElementById('sintWin').textContent =
            st.n + (st.n === 1 ? ' reading' : ' readings');

          const n0 = (v, d) => (v == null ? '—' : Number(v).toLocaleString(undefined,
            { maximumFractionDigits: d == null ? 0 : d }));
          const fig = (k, v, x) => '<div class="fig"><span class="k">' + esc(k) +
            '</span><span class="v">' + esc(v) + '</span>' +
            (x ? '<span class="x">' + esc(x) + '</span>' : '') + '</div>';

          let h = '<div class="sum">';
          // PERCENT OF FLOAT IS THE LATEST READING ONLY. Float history is not
          // stored, so dividing a 2019 position by today's float would invent
          // a series — the figure is shown where today's float is genuinely
          // contemporaneous, and nowhere else.
          h += fig('Short interest',
            L.pctFloat == null ? n0(L.shares) + ' sh' : L.pctFloat.toFixed(2) + '% of float',
            L.pctFloat == null ? 'float not reported' : n0(L.shares) + ' shares');
          h += fig('Days to cover', L.dtc == null ? '—' : Number(L.dtc).toFixed(2),
            L.adv ? 'on ' + n0(L.adv) + ' avg daily volume' : '');
          // A bare reading means nothing without its own base rate — the
          // research log's rule, and the Cushion column's.
          if (L.rank != null) {
            h += fig('Against its own history', L.rank + 'th pct',
              'median ' + (st.medianDtc == null ? '—' : Number(st.medianDtc).toFixed(2)) +
              ' days over ' + st.n + ' readings');
          }
          // The change is WITHHELD across a split rather than printed: FINRA
          // reports NVDA's June 2024 fortnight as +978.77%, which is the 10:1
          // and not a change in positioning.
          if (L.changePct != null) {
            h += fig('Change on the fortnight',
              (L.changePct >= 0 ? '+' : '') + Number(L.changePct).toFixed(1) + '%',
              L.prev == null ? '' : 'from ' + n0(L.prev) + ' sh');
          } else if (L.split) {
            h += fig('Change on the fortnight', '—', 'a split makes it meaningless');
          }
          h += '</div>';

          const scale = st.scale || 2;
          h += '<div class="strip">';
          for (const p of st.series) {
            const capped = p.dtc != null && p.dtc > scale;
            const frac = p.dtc == null ? 0 : Math.min(1, p.dtc / scale);
            const px = Math.max(2, Math.round(frac * 44));
            const cls = [p.d === L.d ? 'now' : '', capped ? 'capped' : '', p.split ? 'split' : '']
              .filter(Boolean).join(' ');
            const tip = p.d + ' — ' + (p.dtc == null ? 'no reading'
              : Number(p.dtc).toFixed(2) + ' days to cover') +
              (capped ? ' (past the top of the scale)' : '') +
              (p.split ? ' · a split lands in this fortnight, so the share counts either ' +
                'side are not comparable' : '');
            h += '<i class="' + cls + '" style="height:' + px + 'px" title="' + esc(tip) + '"></i>';
          }
          h += '</div><div class="axis"><span>' + esc(st.from) + '</span>' +
            '<span>days to cover, scale to ' + Number(scale).toFixed(1) + '</span>' +
            '<span>' + esc(st.to) + '</span></div>';

          h += '<p class="note"><b>The bi-weekly consolidated position</b>, not the daily ' +
            'short-volume file — that one counts shares sold short intraday, most of which ' +
            'is market-maker inventory that is flat by the close. Settled <b>' + esc(st.to) +
            '</b> and published about eight business days later, so it is a fortnightly ' +
            'snapshot rather than a live reading. ' +
            '<b>The strip is days to cover</b>, because FINRA files share counts as-reported ' +
            'and never restates them for splits' +
            (st.splits ? ' (' + st.splits + ' in this history, marked)' : '') +
            ' — a ratio rides through a split, a share count does not. Percent of float ' +
            'uses today’s float, so it is shown for the latest reading only. Straight from ' +
            '<a href="https://www.finra.org/finra-data/browse-catalog/short-interest/files" ' +
            'target="_blank" rel="noopener">FINRA</a>, and read by nothing else in this app ' +
            '— not the Advice verdict, not the screener.</p>';

          document.getElementById('sintBody').innerHTML = h;
          card.hidden = false;
        } catch (e) { card.remove(); }
      }

      paintChart();
      // The markup is already in the page (it ships with the earnings card);
      // this only attaches the toggle and applies the remembered choice.
      wireAround();
      loadNews();          // after the chart: a decoration must not make the data wait
      loadSec();           // and the filings after that, for the same reason
      loadInsider();
      loadShortInt();
      const nb = document.getElementById('newsBtn');
      if (nb) nb.addEventListener('click', () => loadNews(true));
    })();
  </script>
  <div id="tip"></div>
</body>
</html>
