<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stock — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/wmark.js" defer></script>
  <!-- The card and the rasteriser, both shared: cards.js owns what a card
       looks like and says, cardshot.js turns one into a PNG at its true
       1080px. The studio, the phone and this page all take the same shot —
       three copies of it was two too many. -->
  <script src="/cards.js"></script>
  <script src="/cardshot.js"></script>
  <style>
    body { min-height: 100dvh; padding: 0 0 60px; overflow-x: clip; }
    /* Full width: the chart is the page, and an 18-year ribbon deserves
       every pixel. Prose keeps its own readable measure below. */
    .page { position: relative; z-index: 1; max-width: none; margin: 0 auto; padding: 0 32px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 6% -6%, rgba(52, 211, 153, 0.12), transparent 62%),
        radial-gradient(50vw 44vw at 96% 4%, rgba(124, 156, 255, 0.12), transparent 64%); }

    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center;
                   padding: 10px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%;
      padding: 6px 7px 6px 16px; border-radius: 999px; background: rgba(9, 11, 15, 0.72);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset);
    }

    /* ---- the jump bar: every card is one click from the top (2026-10-04,
       owner's request, after the one on /admin). Its chips are BUILT FROM THE
       PAGE rather than written down -- see paintJumps(). ------------------- */
    .jumps { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 20px; }
    .jump {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03); color: var(--muted);
      font-size: 12.5px; font-weight: 500; text-decoration: none; cursor: pointer;
      transition: color .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
    }
    .jump:hover { color: var(--text); border-color: var(--hair-2); background: rgba(255, 255, 255, 0.06); }
    .jump .ic { color: var(--faint); }
    .jump:hover .ic { color: var(--accent); }
    /* THE ISLAND IS STICKY AT THE TOP, so a bare anchor jump parks the heading
       underneath it. Measured rather than guessed: the island's own box plus
       its wrapper's 10px and a little air. */
    section.card { scroll-margin-top: 76px; }
    /* On a phone nine chips wrap to four rows, which is a screen of furniture
       in front of the thing being read -- so they become ONE row that scrolls
       sideways inside its own box, the treatment the table columns already
       take. The page itself still cannot be panned. */
    @media (max-width: 720px) {
      .jumps { flex-wrap: nowrap; overflow-x: auto; margin: 2px -20px 16px; padding: 0 20px 4px;
               scrollbar-width: none; }
      .jumps::-webkit-scrollbar { display: none; }
      .jump { flex: 0 0 auto; }
    }

    /* masthead — the chips sit on this row rather than claiming one of their
       own, which was costing a 26px band plus 30px of margins above the chart */
    .head { display: flex; align-items: baseline; gap: 10px 14px; flex-wrap: wrap; margin: 12px 0 0; }
    /* The symbol doubles as the way to reach another one. Styled to look like
       the heading it replaced, so the page does not grow a control: the caret
       is the only thing that says it opens. */
    /* margin: 0 is load-bearing, not tidying. This is an <h1>, app.css carries
       no heading reset, and nothing else here sets one — so it kept the
       browser's own `margin: 0.67em 0`. At this type size that is ~27px of
       empty band above the symbol and the same below it, sitting between the
       nav pill and the masthead for no reason anyone chose. `.head` is a flex
       container, so an item's margin does not collapse into anything: it is
       simply added. */
    .sympick { position: relative; margin: 0; }
    #symBtn {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      margin: 0; padding: 2px 6px 2px 0; border: 0; background: none; border-radius: 10px;
      font: inherit; color: inherit; letter-spacing: inherit;
      transition: background 0.35s var(--ease);
    }
    #symBtn:hover, #symBtn[aria-expanded="true"] { background: rgba(255, 255, 255, 0.05); }
    #symBtn .caret { width: 15px; height: 15px; color: var(--faint); flex: none;
                     transition: transform 0.4s var(--ease), color 0.35s var(--ease); }
    #symBtn:hover .caret { color: var(--muted); }
    #symBtn[aria-expanded="true"] .caret { transform: rotate(180deg); }

    #symMenu {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: var(--z-nav);
      display: none; width: 320px; max-width: calc(100vw - 32px);
      padding: 6px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--hair);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      box-shadow: 0 34px 70px -24px rgba(0, 0, 0, 0.95);
    }
    #symMenu.open { display: block; }
    #symMenu .menucore { background: rgba(10, 12, 17, 0.92); border-radius: 13px;
                         padding: 8px; box-shadow: var(--inset); }
    #symFilter {
      width: 100%; padding: 8px 11px; margin-bottom: 6px; border-radius: 10px;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.04);
      color: var(--text); font-family: var(--sans); font-size: 13px; outline: none;
      transition: border-color 0.35s var(--ease);
    }
    #symFilter:focus { border-color: var(--hair-2); }
    #symList { max-height: 46vh; overflow-y: auto; scrollbar-width: thin; }
    #symList .opt {
      display: flex; align-items: baseline; gap: 9px; width: 100%;
      padding: 7px 10px; border: 0; border-radius: 9px; cursor: pointer;
      background: none; color: var(--text); text-align: left; font-family: var(--sans);
      transition: background 0.25s var(--ease);
    }
    #symList .opt .s { font-family: var(--mono); font-size: 12.5px; font-weight: 600;
                       min-width: 62px; flex: none; }
    #symList .opt .n { font-size: 12px; color: var(--faint); overflow: hidden;
                       text-overflow: ellipsis; white-space: nowrap; }
    #symList .opt:hover, #symList .opt.active { background: rgba(255, 255, 255, 0.07); }
    #symList .opt.here .s { color: var(--accent); }
    #symList .none { padding: 12px 10px; font-size: 12px; color: var(--faint); }
    /* Deliberately louder than the chips beside it and quieter than the price:
       these are the page's ways OUT, and the owner's note was that the
       screener's ticker link is too easy to miss. `align-self: center`
       because .head aligns on the baseline and a pill with padding hangs low
       on one.
       RENAMED from `.gfin` when Yahoo joined it (2026-09-27): two links
       sharing a class named after one of them is a small wrongness the next
       reader trips on, and unlike a prefs key or a group id a class in one
       page has no stored data behind it. `olink` rather than a bare `link`
       or `out` — six unscoped names have captured later markup here.

       NEUTRAL, NOT A SECOND ACCENT (owner, 2026-09-27: "all the pills are in
       blue, make google and yahoo more distinct"). They were accent-blue and
       so are the chips now — the group chips became links the day before and
       were given the accent deliberately — so the masthead read as one blue
       row and the two loudest things on it were the two that say least about
       the stock.

       IT IS NOT ANOTHER SIGNAL COLOUR, and that is the point rather than a
       compromise. On this page every coloured token already MEANS something
       about the data: green and red are direction, amber is `notice this, it
       is old`, violet is RSI in three places (the toggle, the caption and the
       crosshair readout), and the accent is now `this chip opens its group`.
       An external link is not a reading about the stock — it is navigation —
       so it takes the treatment navigation already has here, the `Back to
       screener` pill: white on glass, a hairline, no hue. That makes it
       distinct from every chip beside it WITHOUT spending the one unspent
       colour left in the palette.

       Still louder than a chip, which was the original brief: a filled box at
       33px against a 26px outline, and --text against --muted. */
    .olink {
      display: inline-flex; align-items: center; gap: 7px; align-self: center;
      padding: 6px 13px; border-radius: 999px; text-decoration: none; white-space: nowrap;
      font-size: 12.5px; font-weight: 600; color: var(--text);
      border: 1px solid var(--hair-2); background: rgba(255, 255, 255, 0.075);
      transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .olink:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.28); }
    /* The out-arrow stays quieter than the word — it is a repeated glyph on
       both pills and saying "elsewhere" twice at full strength is noise. */
    .olink .ic { width: 14px; height: 14px; color: var(--muted); }
    /* The two sit as a pair and share one treatment: they are the same kind
       of thing going to two places, so colouring them apart would be a
       distinction with nothing behind it. The gap is the pair's, not .head's
       — .head's own gap would space them like the chips. */
    .outs { display: inline-flex; align-items: center; gap: 8px; align-self: center;
            flex-wrap: wrap; }
    .px { margin-left: auto; text-align: right; align-self: flex-end; }
    .px b { display: block; font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .px span { font-family: var(--mono); font-size: 12.5px; }
    /* Metadata, not a reading, so it is the quietest thing in the masthead —
       and `--faint` is contrast-floored at 5.4:1, so quiet is not unreadable.
       Scoped under .px: nine unscoped class names on this project have
       captured later markup. It takes `.warn` for its colour ONLY, which is
       all `.warn` does in app.css — amber already means "notice this, it is
       old" everywhere here, which is exactly what a day-old price is. */
    .px .asof { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
    .px .asof.warn { color: var(--amber); }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
            font-size: 12px; color: var(--faint); }
    .chip.has-tip { cursor: help; border-color: var(--hair-2); }
    .chip.has-tip:hover { background: rgba(255, 255, 255, 0.06); }
    .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hair);
            background: rgba(255, 255, 255, 0.03); color: var(--muted); }
    /* A chip that goes somewhere, and it has to LOOK like one — the first
       cut kept the chip's muted grey "because a row of tinted pills would
       shout", and the owner reported the obvious consequence: the links
       were invisible. ACCENT, the same signal the Google Finance pill on
       this very masthead already uses, so a reader learns one thing rather
       than two; a shade lighter than that pill's filled background, which
       keeps the primary action primary.
       `text-decoration: none` is not optional — nothing else here resets
       it, and the peer table's `vs` pill arrived underlined for that. */
    a.chip.go { text-decoration: none; cursor: pointer; color: var(--accent);
                border-color: rgba(124, 156, 255, 0.34);
                background: rgba(124, 156, 255, 0.07);
                transition: background 0.35s var(--ease), border-color 0.35s var(--ease); }
    a.chip.go:hover { border-color: rgba(124, 156, 255, 0.6);
                      background: rgba(124, 156, 255, 0.17); }

    /* Full card width, as asked. The usual 70-80ch reading limit is dropped
       here on purpose: this is four or five sentences read once, not prose you
       work down, and the surrounding cards already run the full width. */
    /* No max-width (owner, 2026-09-26). It carried `max-width: 1100px` — a
       reading measure, which is the right default for prose and made this the
       ONLY constrained block on the page: the earnings note, the peers note and
       the closing line all run the full card, so on a wide monitor the
       description stopped ~800px short of everything above and below it and
       read as a layout fault rather than as a measure. */
    .about { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); }

    /* The same primary button the screener uses for Export to Excel: both hand
       you a spreadsheet, so they should not look like different kinds of action.
       .btn-primary and its nub come from app.css. Hidden entirely when there is
       no quality score — a link that downloads an error is worse than none. */
    .sec-h .model { text-decoration: none; }
    .sec-h .deeper { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sec-h .study { text-decoration: none; }

    section.card { margin-bottom: 16px; }
    section.card:first-of-type { margin-top: 14px; }
    section.card > .core { padding: 13px 18px 16px; }
    .sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
                text-transform: uppercase; color: var(--muted); }
    .ranges { margin-left: auto; display: flex; gap: 5px; }

    /* Save the chart as a post or a story — the studio's export, on the one
       chart this page is about (2026-09-22, owner's request). A menu rather
       than two more buttons: the toolbar already carries sixteen, and the
       shape is a choice made once at the moment of saving, not a mode the
       page sits in. */
    .share { position: relative; display: flex; }
    .rng.shr { display: inline-flex; align-items: center; gap: 5px; }
    .rng.shr .ic-sm { width: 13px; height: 13px; }
    .shr-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; width: 232px;
      padding: 6px; border-radius: 14px; border: 1px solid var(--hair-2);
      background: rgba(9, 11, 15, 0.94); box-shadow: 0 30px 70px -28px rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); }
    .shr-row {
      display: flex; align-items: baseline; gap: 7px; width: 100%; padding: 9px 11px;
      border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left;
      color: var(--text); font: 500 13px var(--sans); }
    .shr-row b { font-family: var(--mono); font-weight: 600; color: var(--muted); }
    .shr-row span { margin-left: auto; font: 400 11px var(--mono); color: var(--faint); }
    .shr-row:hover { background: rgba(255, 255, 255, 0.06); }
    .shr-row:disabled { opacity: 0.45; cursor: default; background: none; }
    .shr-msg { margin: 4px 6px 2px; font-size: 11px; line-height: 1.5; color: var(--faint); }
    .shr-msg.bad { color: var(--red); }
    /* The artboard is built off-screen at its true 1080px and shot from there,
       so nothing on the page moves while it renders. `fixed` keeps it out of
       the document flow entirely; cardshot neutralises this offset on its own
       clone, which is what stops the export coming back blank. */
    #shot { position: fixed; left: -20000px; top: 0; pointer-events: none; }
    .rng {
      padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
      font-family: var(--sans); border: 1px solid var(--hair); color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .rng:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .rng.on { background: rgba(124, 156, 255, 0.14); border-color: rgba(124, 156, 255, 0.4); color: var(--text); }

    /* the shared chart, at page scale — taller, with a gutter on the right for
       the price axis and room underneath for the dates. The svg fills the
       content box, so the padding is what creates both. */
    /* The svg stretches with preserveAspectRatio="none", so a taller viewBox
       alone would squash every band instead of adding one — what has to stay
       constant is PIXELS PER VIEWBOX UNIT. These two numbers are derived from
       the bands in rowcard.js and have to be re-derived whenever those change:
       the 18px of bottom padding is the date axis and is not part of the svg,
       so the arithmetic is (viewBox height x px-per-unit) + 18.

                          viewBox H                  px/unit   height
         volume only      254+13+44+6      = 317      1.4196    468px
         + RSI            254+13+58+13+44+6 = 388     1.4407    577px

       Those px-per-unit figures are the ones the original 320/427 pair already
       implied and have been held constant through both increases, which is
       what keeps the volume band at 62px and the RSI band at 84px while the
       PRICE panel went 213 -> 277 -> 361px (two 30% steps, 2026-09-21).
       Change PRICE_H and these must move with it, or the bands silently shrink
       instead of the price growing. */
    #chart.rc-chart { height: 468px; border-radius: 12px; padding: 0 52px 18px 0;
                      transition: height 0.45s var(--ease); }
    #chart.rc-chart.has-rsi { height: 577px; }
    #chart .cap { font-size: 12.5px; }
    #chart .cap.chg { font-size: 17px; }
    /* Pane labels sit against the geometry the chart reports, not a guessed
       percentage — turning RSI on moves the volume band down. */
    #chart .cap.vol, #chart .cap.rsi {
      left: 9px; bottom: auto; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.12em;
      transform: translateY(-125%);
    }
    #chart .cap.rsi { color: var(--accent-2); }
    /* Worded thresholds, sitting just clear of the lines they name — above the
       overbought line, below the oversold one, as a terminal draws them. */
    #chart .rsi-zone {
      position: absolute; left: 50%; pointer-events: none;
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
      text-shadow: 0 0 4px rgba(10, 12, 17, 0.95), 0 0 2px rgba(10, 12, 17, 0.95);
    }
    #chart .rsi-zone.hi { color: var(--red); transform: translate(-50%, -118%); }
    #chart .rsi-zone.lo { color: var(--green); transform: translate(-50%, 18%); }

    #chart .rsi-lbl {
      position: absolute; right: 56px; transform: translateY(-50%);
      font-family: var(--mono); font-size: 10.5px; color: var(--faint);
      pointer-events: none;
      text-shadow: 0 0 4px rgba(10, 12, 17, 0.95), 0 0 2px rgba(10, 12, 17, 0.95);
    }
    .rsi-toggle.on { background: rgba(167, 139, 250, 0.14);
                     border-color: rgba(167, 139, 250, 0.4); color: var(--accent-2); }
    /* legend: a swatch per average, in that average's own colour */
    #chart .cap.ma { left: 9px; top: 32px; font-size: 11.5px; color: var(--faint);
                     display: flex; gap: 12px; }
    #chart .cap.ma i { display: inline-block; width: 10px; height: 2px;
                       margin-right: 5px; vertical-align: 3px; border-radius: 1px; }
    #chart .cap.ma i.ma50 { background: var(--accent); }
    #chart .cap.ma i.ma200 { background: var(--amber); }

    .ma-toggle:first-of-type { margin-left: 10px; }
    .ma-toggle.ma50.on { background: rgba(124, 156, 255, 0.14);
                         border-color: rgba(124, 156, 255, 0.4); color: var(--accent); }
    .ma-toggle.ma200.on { background: rgba(251, 191, 36, 0.14);
                          border-color: rgba(251, 191, 36, 0.4); color: var(--amber); }

    /* price axis, in the right gutter */
    #chart .yaxis { position: absolute; top: 0; right: 0; bottom: 18px; width: 52px;
                    pointer-events: none; }
    #chart .ytick {
      position: absolute; right: 0; transform: translateY(-50%);
      padding-left: 8px; font-family: var(--mono); font-size: 11.5px;
      color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    /* The ticks come back low-to-high, so the FIRST is the bottom of the axis
       and the LAST is the top — the reverse of reading order. Getting this the
       wrong way round pushed the top label 6px above the chart, where
       overflow:hidden ate it. */
    #chart .ytick:first-child { transform: translateY(-100%); }
    #chart .ytick:last-child { transform: translateY(0); }

    /* crosshair */
    #chart .xhair {
      position: absolute; top: 0; bottom: 18px; width: 0; pointer-events: none;
      border-left: 1px dashed rgba(255, 255, 255, 0.45);
    }
    #chart .xdot {
      position: absolute; width: 7px; height: 7px; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      background: var(--text); box-shadow: 0 0 0 2px var(--surface);
    }
    #chart .xdate {
      position: absolute; bottom: 0; padding: 2px 7px; border-radius: 6px;
      background: var(--surface-2); border: 1px solid var(--hair);
      font-family: var(--mono); font-size: 11px; color: var(--text);
      white-space: nowrap; pointer-events: none;
    }
    /* Sits over the static change caption while hovering, so the top-left says
       one thing at a time. */
    /* ---- the earnings rug ----------------------------------------------
       WHEN the company reported, under the plot rather than on it — the
       owner ruled out drawing on the chart, and a tick beneath a gap answers
       "was that earnings?" without fighting the price line. Same 52px right
       margin as the trend ribbon, so the ticks land on the plot's own x-axis
       and agree with the crosshair. */
    #earnRug { margin: 7px 52px 0 0; }
    /* The short-interest layer, aligned by the rug's own trick: the same
       52px right margin to clear the price axis, children placed by
       percentage, so the bars, the crosshair and the plot cannot disagree.
       Everything scoped under #sintStrip. */
    #sintStrip { margin: 7px 52px 0 0; }
    /* 56px, doubled from 28 at the owner's request (2026-09-28) — at half
       this the steps were a squat band under a 500px plot and the shape was
       hard to read. The bar scale in sintStripHtml moves with it: the two
       are one measurement and must not drift apart. */
    #sintStrip .srug { position: relative; height: 56px; }
    #sintStrip .srug svg { display: block; width: 100%; height: 56px; }
    /* A LEVEL, NOT AN EVENT — a step line, flat until the next settlement.
       NEUTRAL, AND DELIBERATELY SO: green and red are the price's direction
       on this chart, and "short interest rose" is not a direction the price
       went, so colouring it would make a claim the data does not.
       `non-scaling-stroke` because the box is stretched to the strip's width
       — without it the flat runs and the steps draw at different weights. */
    #sintStrip .srug path.sl { fill: none; stroke: var(--text); stroke-width: 1.4;
                               opacity: 0.75; vector-effect: non-scaling-stroke;
                               stroke-linejoin: miter; }
    /* Transparent hit areas over the line, one per settlement, so every
       reading keeps its tooltip — a path cannot carry one per segment. */
    #sintStrip .srug i { position: absolute; top: 0; height: 100%; display: block;
                         background: transparent; }
    /* The split is the exception to the no-colour rule: amber is "notice
       this", and the share counts either side of it are not comparable. The
       whole fortnight is tinted rather than a line drawn, because it is the
       period that is untrustworthy, not an instant. */
    #sintStrip .srug i.split { background: rgba(251, 191, 36, 0.16); }
    #sintStrip .srugnote { color: var(--faint); font-size: 10.5px; margin: 3px 0 0;
                           line-height: 1.5; }
    /* The fundamental strip, FIRST of the three layers under the plot (the
       owner's order, 2026-09-29). Same gutter as the rug and the short strip,
       so all three align to the plot's own x-axis, and the same shape: a step
       line on its own range with the caveats in a note beneath it. */
    #fundStrip { margin: 7px 52px 0 0; }
    #fundStrip .frug { position: relative; height: 56px; }
    #fundStrip .frug svg { display: block; width: 100%; height: 56px; }
    /* NEUTRAL, on the short strip's reasoning: green and red are the PRICE's
       direction on this chart, and "revenue rose" is not a direction the price
       went. non-scaling-stroke because a step draws flat runs and vertical
       risers, which would otherwise come out at different weights under
       preserveAspectRatio="none". */
    #fundStrip .frug path.fl { fill: none; stroke: var(--text); stroke-width: 1.4;
                               stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    /* Drawn only where the DATA spans zero, which for a net-income line is the
       reading itself. A reference, so it takes no signal colour. */
    #fundStrip .frug line.fz { stroke: rgba(255, 255, 255, 0.32); stroke-width: 1;
                               stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    #fundStrip .frug i { position: absolute; top: 0; height: 100%; display: block; }
    #fundStrip .frugnote { color: var(--faint); font-size: 10.5px; margin: 3px 0 0;
                           line-height: 1.5; }
    /* Taller than the ribbon on purpose (the owner: "you can also increase the
       height"): the bar has to carry a magnitude, not just a position. */
    .erug { position: relative; height: 38px; }
    .erug .base { position: absolute; left: 0; right: 0; top: 50%; height: 1px;
      background: var(--hair-2); }
    /* GREEN AND RED HERE ARE THE SAME WORDS THEY ARE EVERYWHERE ELSE on this
       chart -- the price went up, the price went down. The earlier objection
       to colouring these marks was about beat/miss, which really would have
       collided; the REACTION is direction, so it takes the direction colours.
       Height is the size of that reaction, against a robust ceiling. */
    .erug i { position: absolute; width: 3px; margin-left: -1.5px; border-radius: 1px;
      opacity: .82; cursor: help; }
    .erug i:hover { opacity: 1; }
    .erug i.up { bottom: 50%; background: var(--green); }
    .erug i.dn { top: 50%; background: var(--red); }
    /* Past the 90th-percentile ceiling: drawn full height with a cap, and the
       tooltip says so -- the earnings strip's own rule, so a single enormous
       quarter cannot flatten every honest one. */
    .erug i.capped { box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px currentColor; }
    .erug i.up.capped { color: var(--green); }
    .erug i.dn.capped { color: var(--red); }
    /* No next session inside the window, so there is no reaction to draw --
       a neutral stub at the line rather than a bar implying zero. */
    .erug i.pending { top: calc(50% - 3px); height: 6px; width: 2px;
      background: var(--muted); opacity: .5; }
    .erugnote { margin: 6px 52px 0 0; font-size: 11px; color: var(--faint); }

    /* ---- trend ribbon --------------------------------------------------
       The Trend column's word, per session, painted under the chart — the
       same ladder the screener's column collapses by, replayed over the bars
       on screen. Right margin matches the chart's 52px price axis, so the
       strip lines up with the plot and the crosshair. */
    #trendStrip { margin: 8px 52px 0 0; }
    .tstrip { position: relative; height: 11px; border-radius: 4px; overflow: hidden;
      background: rgba(255, 255, 255, 0.04); }
    .tstrip i { position: absolute; top: 0; bottom: 0; }
    .ts-breakdown { background: var(--red); }
    .ts-downtrend { background: color-mix(in srgb, var(--red) 55%, var(--surface)); }
    .ts-below-200d { background: color-mix(in srgb, var(--red) 26%, var(--surface)); }
    .ts-near-200d { background: rgba(255, 255, 255, 0.10); }
    .ts-above-200d { background: color-mix(in srgb, var(--green) 30%, var(--surface)); }
    .ts-strong-uptrend { background: var(--green); }
    .tlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px;
      font-size: 11.5px; color: var(--faint); }
    .tlegend .cap-t { letter-spacing: 0.1em; text-transform: uppercase; font-size: 10.5px; }
    .tlegend .tl { display: inline-flex; align-items: center; gap: 5px; }
    .tlegend .tl i { width: 10px; height: 5px; border-radius: 2px; display: inline-block; }
    /* The trend-hold verdict lives here, under the chart, not over the plot —
       three caption lines stacked on the price was unreadable. */
    .tlegend .thl { color: var(--muted); margin-left: auto; }
    .tlegend .thl i { background: none; height: 0; border-top: 2px dashed var(--text);
      border-radius: 0; opacity: 0.75; }
    .tlegend .why-link { background: none; border: none; color: var(--accent); cursor: pointer;
      font: 11.5px var(--sans); padding: 0; }
    .tlegend .why-link:hover { text-decoration: underline; }
    /* The "why do these differ" card: the ranked stretches where one rule was
       in and the other was not, each named by the model's own flag. */
    #whyBox { margin: 10px 52px 0 0; }
    #whyBox .why-head { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--muted); }
    #whyBox .why-head b { color: var(--text); font-weight: 600; }
    #whyBox .why-x { margin-left: auto; background: none; border: none; color: var(--faint);
      cursor: pointer; font-size: 13px; padding: 0 0 0 6px; font-family: var(--sans); }
    #whyBox .why-x:hover { color: var(--text); }
    #whyBox .why-verdict { margin-top: 7px; font-size: 13px; color: var(--text); line-height: 1.65; max-width: 1000px; }
    #whyBox .why-sub { margin-top: 11px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
    #whyBox .why-run { display: flex; gap: 14px; align-items: baseline; padding: 6px 0 5px;
      border-top: 1px solid var(--hair); margin-top: 5px; font-size: 12.5px; }
    #whyBox .wd { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
    #whyBox .wp { font-family: var(--mono); min-width: 68px; text-align: right; font-variant-numeric: tabular-nums; }
    #whyBox .wp.pos { color: var(--green); }
    #whyBox .wp.neg { color: var(--red); }
    #whyBox .ww { color: var(--muted); min-width: 0; }
    #whyBox .why-note { margin-top: 10px; font-size: 11px; color: var(--faint); }

    /* The trend-hold line: hypothetical, so it is dashed. Its return for
       the drawn range rides as a tag at the line's end, in the axis gutter —
       where the eye lands following the line, priced like an axis label. */
    #chart .thend { position: absolute; right: 2px; transform: translateY(-50%);
      font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
      padding: 1px 5px; border-radius: 6px; background: var(--surface);
      border: 1px dashed var(--hair-2); white-space: nowrap; }
    #chart .thend.pos { color: var(--green); }
    #chart .thend.neg { color: var(--red); }
    #chart .ov.th-ln { stroke: var(--text); stroke-dasharray: 5 4; opacity: 0.75; }
    /* The index overlays. Dashed and thinner than the price, because they are
       context: on a 1Y view the eye should still find the stock first. */
    #chart .ov.bm-ln { stroke-width: 1.1; stroke-dasharray: 3 3; opacity: 0.8; }
    #chart .ov.bm-spy { stroke: #94a3b8; }
    #chart .ov.bm-qqq { stroke: #f0abfc; }
    #chart .ov.bm-iwm { stroke: #22d3ee; }
    #chart .ov.bm-dia { stroke: #fb923c; }
    #chart .cap.ma i.bm { height: 0; border-top: 2px dashed currentColor; border-radius: 0;
                          background: none; width: 12px; }
    #chart .cap.ma i.bm.bm-spy { color: #94a3b8; }
    #chart .cap.ma i.bm.bm-qqq { color: #f0abfc; }
    #chart .cap.ma i.bm.bm-iwm { color: #22d3ee; }
    #chart .cap.ma i.bm.bm-dia { color: #fb923c; }
    /* The chosen comparison stock. Its own colour, because it is not one of the
       four indices and should not read as one. */
    #chart .ov.bm-cmp { stroke: #a3e635; }
    #chart .cap.ma i.bm.bm-cmp { color: #a3e635; }
    .bm-toggle:first-of-type { margin-left: 10px; }
    .bm-toggle.on { color: var(--text); }
    .bm-toggle.bm-spy.on { background: rgba(148, 163, 184, 0.20); }
    .bm-toggle.bm-qqq.on { background: rgba(240, 171, 252, 0.16); }
    .bm-toggle.bm-iwm.on { background: rgba(34, 211, 238, 0.16); }
    .bm-toggle.bm-dia.on { background: rgba(251, 146, 60, 0.16); }
    /* The compare picker sits with the overlay toggles and is styled as one, so
       the row reads as a single family of "what else is on this chart". */
    select.cmp-pick { appearance: none; -webkit-appearance: none; margin-left: 6px;
      padding: 4px 22px 4px 9px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.04);
      color: var(--muted); font: 500 11px var(--sans); max-width: 190px;
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239aa3b2' stroke-width='1.4' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 7px center; }
    select.cmp-pick.on { color: #a3e635; border-color: rgba(163, 230, 53, 0.4);
      background-color: rgba(163, 230, 53, 0.12); }
    select.cmp-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .th-toggle.on { background: rgba(233, 236, 242, 0.12); color: var(--text);
      border-color: var(--hair-2); }

    #chart .readout {
      position: absolute; left: 9px; top: 8px; padding: 5px 10px; border-radius: 8px;
      background: rgba(13, 16, 23, 0.92); border: 1px solid var(--hair);
      font-family: var(--mono); font-size: 12.5px; white-space: nowrap;
      pointer-events: none; display: flex; gap: 7px; align-items: baseline;
    }
    #chart .readout .k { color: var(--faint); font-size: 10.5px;
                         text-transform: uppercase; letter-spacing: 0.1em; }
    #chart .readout .v { color: var(--text); }
    #chart .readout .v.rsi { color: var(--accent-2); }
    /* the captions the readout replaces */
    #chart.hovering .cap.chg, #chart.hovering .cap.ma { opacity: 0; }
    #chart .cap.chg, #chart .cap.ma { transition: opacity 0.2s var(--ease); }

    #chart .axis { position: absolute; left: 0; right: 52px; bottom: 3px; height: 12px;
                   pointer-events: none; }
    #chart .axis .tick {
      position: absolute; transform: translateX(-50%); white-space: nowrap;
      font-family: var(--mono); font-size: 11px; color: var(--faint);
    }
    /* the end labels would otherwise hang off the edges */
    #chart .axis .tick:first-child { transform: none; }
    #chart .axis .tick:last-child { transform: translateX(-100%); }
    .ranges { flex-wrap: wrap; }
    .rng { padding: 5px 10px; }

    /* the shared sections, wider than the card's three columns */
    .fields { column-count: 4; column-gap: 26px; }
    .fields .rc-sec { margin-bottom: 14px; }
    /* ---- news card ------------------------------------------------- */
    .sec-h .news-when { margin-left: auto; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
    #newsBtn[disabled] { opacity: 0.55; cursor: default; }
    #newsList { font-size: 13px; }
    #newsList .msg { color: var(--faint); font-size: 12.5px; padding: 4px 0; }
    .newsmore { margin-top: 10px; }
    /* Two columns, the same mechanism .fields above already uses. The ROWS are
       wrapped so the Show more / Show fewer button stays full width underneath
       instead of flowing into a column as a third item. */
    .news-cols { column-count: 2; column-gap: 30px; }
    .news-item { display: flex; gap: 14px; align-items: baseline; padding: 7px 0;
      border-top: 1px solid var(--hair);
      /* Without this a headline that wraps can be split down the middle by the
         column break, with half of it at the foot of one column. */
      break-inside: avoid; -webkit-column-break-inside: avoid; }
    /* EVERY item keeps its rule in two-column mode, including the first. Only
       the DOM-first child can be matched, so dropping its border leaves column
       one starting flush and column two starting under a stray hairline --
       asymmetric for no reason anyone chose. Two rules under the heading reads
       as deliberate. */
    .news-cols .news-item:first-child { border-top: 1px solid var(--hair); }
    .news-item .nd { font-family: var(--mono); font-size: 11px; color: var(--faint);
      white-space: nowrap; min-width: 52px; }
    .news-item .ns { font-size: 11.5px; color: var(--muted); white-space: nowrap;
      max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .news-item a { color: var(--text); text-decoration: none; min-width: 0; }
    .news-item a:hover { text-decoration: underline; }

    .fields .rc-row { line-height: 1.9; font-size: 13px; }
    .fields .rc-v { font-size: 12.5px; }
    @media (max-width: 1000px) { .fields { column-count: 2; } }
    @media (max-width: 1000px) {
      .news-cols { column-count: 1; }
      .news-cols .news-item:first-child { border-top: 0; }
    }
    @media (max-width: 620px)  { .fields { column-count: 1; } }

    /* ---- around earnings ------------------------------------------------
       Scoped under #around throughout. `.band`, `.path`, `.fig` and `.rule`
       are exactly the generic names that have captured later markup on this
       project eight times. */
    #around { margin: 0 0 22px; }
    #around .ahead { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
    #around .ahead h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
    #around .ahead .n { font: 500 11px var(--mono); color: var(--faint); }
    #around .ahead .sp { flex: 1 1 0; }
    /* The way back is always visible: a hide with no way back is a trapdoor,
       and this button is labelled with the direction it will go. */
    #around .tog { font: 500 11.5px var(--sans); color: var(--muted); background: none;
      border: 1px solid var(--hair-2); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
    #around .tog:hover { color: var(--text); border-color: var(--hair-2); }

    #around .figs { display: flex; flex-wrap: wrap; gap: 20px 30px; margin: 0 0 14px; }
    #around .fg { min-width: 132px; }
    #around .fg .k { font: 600 9.5px var(--sans); letter-spacing: .07em;
      text-transform: uppercase; color: var(--faint); display: block; margin: 0 0 3px; }
    #around .fg .v { font: 600 17px var(--mono); color: var(--text); }
    #around .fg .v.pos { color: var(--green); }
    #around .fg .v.neg { color: var(--red); }
    #around .fg .s { display: block; font-size: 11px; color: var(--faint); margin: 2px 0 0; }

    #around .plot { position: relative; height: 190px; margin: 0 0 20px; }
    #around svg { width: 100%; height: 190px; display: block; overflow: visible; }
    /* Every stroke non-scaling: the box is stretched to the page width, so
       without this a horizontal line and a vertical one draw at different
       weights. */
    #around svg * { vector-effect: non-scaling-stroke; }
    #around .qline { fill: rgba(124,156,255,.13); stroke: none; }
    #around .one { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 1; }
    #around .med { fill: none; stroke: var(--accent); stroke-width: 2.25; }
    #around .zero { stroke: var(--hair-2); stroke-width: 1; }
    #around .evt { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    /* HTML, never SVG text: the box is stretched, which would distort glyphs —
       the reason every label on the price chart is HTML too. */
    #around .xl, #around .yl { position: absolute; font: 500 10px var(--mono);
      color: var(--faint); pointer-events: none; white-space: nowrap; }
    #around .xl { transform: translateX(-50%); }
    #around .xl.first { transform: none; }
    #around .xl.last { transform: translateX(-100%); }
    #around .xl.report { color: var(--muted); }
    #around .yl { right: 100%; padding-right: 6px; transform: translateY(-50%); }
    #around .note { font-size: 11.5px; line-height: 1.6; color: var(--faint); margin: 26px 0 0; }
    #around .note b { color: var(--muted); font-weight: 600; }
    @media (max-width: 620px) {
      #around .figs { gap: 14px 20px; }
      #around .fg { min-width: 104px; }
      #around .fg .v { font-size: 15px; }
    }
    /* ---- month by month ------------------------------------------------
       A year-by-month grid of returns. Every selector is scoped to #months:
       td.up, .seg and .note are exactly the generic names that capture
       later markup when left loose. */
    #months .mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 12px; }
    #months .seg { display: inline-flex; gap: 6px; }
    #months .seg .rng.on { color: var(--text); border-color: var(--hair-2);
                           background: rgba(255, 255, 255, 0.075); }
    #months .mkey { margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
                    font-size: 11px; color: var(--faint); font-family: var(--mono); }
    #months .mkey i { width: 14px; height: 10px; border-radius: 2px; display: block; }
    #months .mkey i.up { background: color-mix(in srgb, var(--green) 80%, transparent); margin-left: 8px; }
    #months .mkey i.dn { background: color-mix(in srgb, var(--red) 80%, transparent); }
    /* The one wide thing on the card scrolls inside its own box, so the page
       itself never pans sideways on a phone. */
    #months .mwrap { overflow-x: auto; }
    #months table { width: 100%; min-width: 660px; border-collapse: separate; border-spacing: 2px;
                    table-layout: fixed; }
    #months th, #months td { font-family: var(--mono); font-size: 11.5px; text-align: center;
                             padding: 7px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #months thead th, #months tfoot td, #months tfoot th, #months tbody th {
      color: var(--faint); font-weight: 500; font-size: 10.5px; }
    #months th:first-child { width: 46px; text-align: left; }
    #months tbody td { border-radius: 3px; color: var(--text); }
    /* The colour is the move, the number is the data: the tint is strength
       only, so the figure stays readable on every cell. */
    #months tbody td.up { background: color-mix(in srgb, var(--green) var(--a), transparent); }
    #months tbody td.dn { background: color-mix(in srgb, var(--red) var(--a), transparent); }
    #months tbody td.flat { background: rgba(255, 255, 255, 0.04); }
    #months tbody td.na { background: transparent; }
    #months tbody td.part { outline: 1px dotted var(--muted); outline-offset: -1px; }
    #months .yr { width: 62px; }
    #months tbody td.yr { font-weight: 700; }
    #months tfoot td, #months tfoot th { padding-top: 9px; }
    #months .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }

    /* ---- earnings history ---------------------------------------------
       Reported EPS against what was expected, one row per quarter. Scoped to
       #earn throughout: `.bar`, `.hit` and `.miss` are the kind of generic
       names this project has been bitten by five times when left unscoped. */
    #earn .count { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
    #earn .summary { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.6; }
    #earn .summary b { color: var(--text); font-weight: 600; }
    /* The dumbbell: one column per quarter, oldest left. A hollow dot at the
       estimate, a filled dot at what was reported, a line between. Every
       class is scoped to #earn -- .dot, .ln and .hit are exactly the generic
       names an unscoped rule captures later. */
    #earn .dleg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
                  font-size: 11.5px; color: var(--faint); margin: 0 0 10px; }
    #earn .dleg span { display: inline-flex; align-items: center; gap: 6px; }
    #earn .dleg .dot { position: static; transform: none; color: var(--muted); }
    #earn .dleg .k::before { content: ''; width: 14px; height: 3px; border-radius: 2px;
                             background: currentColor; }
    #earn .dleg .k.hit { color: var(--green); }
    #earn .dleg .k.miss { color: var(--red); }
    #earn .dleg .rng { margin-left: auto; }
    #earn .dumb { display: grid; grid-template-columns: 52px minmax(0, 1fr); }
    /* The gutter and the plot share one inset, the dot's own radius, so a
       percentage means the same height in both. */
    #earn .dy, #earn .dcols { position: relative; height: 190px; margin: 8px 0; }
    #earn .dy span { position: absolute; right: 10px; transform: translateY(-50%);
                     font-family: var(--mono); font-size: 10.5px; color: var(--faint);
                     white-space: nowrap; }
    #earn .dplot { border-left: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
    #earn .dcols { display: flex; }
    #earn .dzero { position: absolute; left: 0; right: 0; height: 0;
                   border-top: 1px dashed var(--hair-2); }
    #earn .dq { flex: 1 1 0; min-width: 0; position: relative; display: block; }
    #earn .dq:hover { background: rgba(255, 255, 255, 0.035); }
    #earn .dq.hit { color: var(--green); }
    #earn .dq.miss { color: var(--red); }
    #earn .dq.none { color: var(--faint); }
    #earn .ln { position: absolute; left: 50%; width: 2px; margin-left: -1px;
                background: currentColor; opacity: 0.75; display: block; }
    #earn .dot { position: absolute; left: 50%; width: 11px; height: 11px; display: block;
                 box-sizing: border-box; border-radius: 50%; transform: translate(-50%, -50%);
                 border: 2px solid currentColor; }
    /* Hollow means expected, filled means happened. The hollow dot is filled
       with the card's own surface so the line does not show through it. */
    #earn .dot.est { background: var(--surface); }
    #earn .dot.act { background: currentColor; }
    #earn .dx { display: flex; margin: 4px 0 14px 52px; }
    #earn .dx span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap;
                     overflow: visible; font-size: 10.5px; color: var(--faint);
                     font-family: var(--mono); }
    #earn table { width: 100%; border-collapse: collapse; }
    #earn th, #earn td { text-align: right; padding: 6px 0 6px 14px; font-size: 12.5px;
                         border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
    #earn th { color: var(--faint); font-weight: 500; font-size: 10.5px;
               text-transform: uppercase; letter-spacing: 0.1em; }
    #earn td { font-family: var(--mono); color: var(--text); }
    #earn th:first-child, #earn td:first-child { text-align: left; padding-left: 0; }
    #earn td.q { font-family: var(--sans); color: var(--muted); }
    #earn td.when { font-family: var(--sans); color: var(--faint); font-size: 11.5px; }
    #earn td.up { color: var(--green); }
    #earn td.dn { color: var(--red); }
    #earn td.na { color: var(--faint); }
    #earn .earnmore { margin-top: 12px; }
    #earn .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }
    @media (max-width: 620px) {
      #earn .dy, #earn .dcols { height: 130px; }
      #earn .dumb { grid-template-columns: 44px minmax(0, 1fr); }
      #earn .dx { margin-left: 44px; }
      #earn .dx .last { display: flex; justify-content: flex-end; }
    }

    /* Similar stocks. Every selector is scoped — an unscoped rule in a page has
       captured shared markup eight times on this project, and `.sym`, `.nm` and
       `.note` are exactly the kind of name that does it. */
    #peers .summary { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 12px; }
    #peers .summary b { color: var(--text); font-weight: 600; }
    /* The one thing on the page allowed to scroll sideways, and only inside its
       own box: seven columns do not fit a phone and the body must not move. */
    #peers .ptab { overflow-x: auto; }
    #peers table { width: 100%; border-collapse: collapse; }
    #peers th, #peers td { text-align: right; padding: 7px 0 7px 14px; font-size: 12.5px;
                           border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
    #peers th { color: var(--faint); font-weight: 500; font-size: 10.5px;
                text-transform: uppercase; letter-spacing: 0.1em; }
    #peers td { font-family: var(--mono); color: var(--text); }
    #peers th:first-child, #peers td:first-child { text-align: left; padding-left: 0; }
    #peers td.nm { font-family: var(--sans); }
    /* The link truncates, not the cell: a `max-width` on a `td` is advisory and
       a legal name runs to 40 characters. inline-block so it can be clipped
       while the ticker beside it stays on the same line. */
    #peers td.nm .namelink { display: inline-block; max-width: 230px; overflow: hidden;
                             text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    #peers td.nm .sym { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-left: 7px; }
    #peers td.av { font-family: var(--sans); }
    #peers td.up, #peers td.pos { color: var(--green); }
    #peers td.down, #peers td.neg { color: var(--red); }
    #peers td.na { color: var(--faint); }
    #peers td.cmp { padding-left: 10px; }
    /* The anchor's own row. A TINT and nothing louder: the palette's colours
       all mean something on this page (green and red are direction, amber is
       "notice this", the accent is a link), and "this is the stock you are
       looking at" is not a reading about the data. Same treatment as a
       hovered row, held on. */
    #peers tr.me td { background: rgba(255, 255, 255, 0.05); }
    #peers tr.me td:first-child { border-top-left-radius: 9px; border-bottom-left-radius: 9px; }
    #peers tr.me td:last-child { border-top-right-radius: 9px; border-bottom-right-radius: 9px; }
    /* The same box as `.namelink`, because it stands in the same place: a
       long legal name has to truncate here exactly as a peer's does, or the
       one row that is not a link is the one row that breaks the column. */
    #peers td.nm .self { display: inline-block; max-width: 230px; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
                         color: var(--text); font-weight: 600; }
    #peers .here { display: inline-block; margin-left: 9px; padding: 1px 7px; border-radius: 999px;
                   border: 1px solid var(--hair); font-family: var(--sans); font-size: 9.5px;
                   letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
                   vertical-align: 1px; }
    /* .rng never resets it, so as an <a> the pill arrives underlined. */
    #peers td.cmp .rng { padding: 2px 8px; font-size: 11px; text-decoration: none; }
    #peers .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }

    /* The statements, laid out as statements. Every rule scoped under
       #stmt: this page already carries .card, .note, .msg and .stab, and
       an unscoped class here would capture the SEC card below it. */
    #stmt table.stmt { width: 100%; border-collapse: collapse; }
    #stmt table.stmt th, #stmt table.stmt td {
      padding: 6px 10px; text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--hair); font: 500 12px var(--mono);
      font-variant-numeric: tabular-nums; }
    #stmt table.stmt thead th {
      font: 600 10px var(--sans); color: var(--faint); text-transform: uppercase;
      letter-spacing: .06em; white-space: nowrap; }
    #stmt table.stmt th.li, #stmt table.stmt td.li {
      text-align: left; font-family: var(--sans); color: var(--text);
      font-weight: 500; }
    #stmt table.stmt td.li { font-size: 12.5px; }
    #stmt table.stmt th.tr, #stmt table.stmt td.tr {
      text-align: left; width: 1%; padding-right: 18px; }
    #stmt table.stmt .fp { color: var(--faint); font-size: 9px; display: block;
      font-family: var(--mono); letter-spacing: 0; }
    #stmt table.stmt td.na { color: var(--faint); }
    #stmt table.stmt td.neg { color: var(--red); }
    /* A value this app computed, not one the filing states -- the SEC
       card's own marking, carried over. Passing arithmetic off as a filing
       is the one thing neither surface may do. */
    #stmt table.stmt td.dv { border-bottom-style: dotted; border-bottom-color: var(--hair-2); }
    #stmt .sspark .up { fill: var(--accent); }
    #stmt .sspark .dn { fill: var(--red); }
    #stmt .sspark .zl { stroke: var(--hair-2); stroke-width: 1; }
    #stmt .sspark { display: block; }

    /* ---- the SEC EDGAR card (2026-09-27, owner's request) -----------------
       ITS OWN SECTION, MIXED WITH NOTHING — the owner's instruction, and the
       right call: these are the company's filed statements, on a different
       basis and a different calendar from the vendor numbers in the cards
       above. Two revenues on one page that quietly disagree read as a bug,
       so they are kept apart and the card says where its own come from.

       Scoped to #sec throughout. Seven unscoped class names have captured
       later markup on this project; a table this wide would be a generous
       eighth. */
    #sec .stab { overflow-x: auto; }
    #sec table { width: 100%; border-collapse: collapse; }
    #sec th, #sec td { text-align: right; padding: 7px 0 7px 14px; font-size: 12.5px;
                       border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
    #sec th { color: var(--faint); font-weight: 500; font-size: 10.5px;
              text-transform: uppercase; letter-spacing: 0.1em; }
    #sec td { font-family: var(--mono); color: var(--text); }
    #sec th:first-child, #sec td:first-child { text-align: left; padding-left: 0; }
    #sec td.neg { color: var(--red); }
    #sec td.na { color: var(--faint); }
    /* A value this app COMPUTED rather than read off a filing — a quarter
       that was never filed as one. Dotted underline, the language a footnote
       already has here, plus the reason on the cell's title. */
    #sec td.dv { border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                 text-decoration: underline dotted rgba(251, 191, 36, 0.55);
                 text-underline-offset: 3px; cursor: help; }
    #sec td.per { font-family: var(--sans); font-weight: 600; }
    #sec td.per .fp { color: var(--faint); font-weight: 400; margin-left: 7px;
                      font-family: var(--mono); font-size: 11px; }
    /* The filing link is the whole argument for this source, so it reads as
       a link rather than as one more grey date. */
    #sec td.filed a { color: var(--accent); text-decoration: none; font-size: 11.5px; }
    #sec td.filed a:hover { text-decoration: underline; }
    /* A hairline between the two switches, so "which periods" and "which
       columns" read as two questions rather than one row of four buttons. */
    #sec .secsep { display: inline-block; width: 1px; height: 15px; margin: 0 6px -3px;
                   background: var(--hair-2); }
    /* The comparison against what the verdict actually read. Its own table,
       because it has different columns and answers a different question from
       the period rows above it. */
    #sec .cmpwrap { overflow-x: auto; margin: 16px 0 0; }
    #sec table.cmp { width: auto; min-width: 380px; }
    #sec table.cmp th:first-child, #sec table.cmp td.who { text-align: left; padding-left: 0;
                                                           font-family: var(--sans); }
    /* A gap past two points is worth noticing, and amber already means
       exactly that here. It is NOT a fault — the two are computed on
       different bases and are expected to differ. */
    #sec table.cmp td.warn { color: var(--amber); }
    /* Each row says which basis it is on, because the margins and the growth
       lines are deliberately on different ones. */
    #sec table.cmp td.who .basis { display: block; color: var(--faint); font-size: 10.5px;
                                   font-weight: 400; margin-top: 2px; }
    /* What the rules concluded — the last step in the chain. */
    #sec .fundv { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
                  margin: 14px 0 0; padding: 11px 13px; border: 1px solid var(--hair);
                  border-radius: var(--r-core); background: rgba(255, 255, 255, 0.02); }
    #sec .fundv .k { color: var(--faint); font-size: 10.5px; text-transform: uppercase;
                     letter-spacing: 0.1em; }
    #sec .fundv .v { font-family: var(--mono); font-size: 16px; color: var(--text); }
    /* COLOUR ONLY ON THE DANGER WORD, the Advice group's own rule — and AMBER
       rather than red, because on this page red is the price falling and a
       weak balance sheet is not a price move. Amber already means "notice
       this" here. */
    #sec .fundv .v.weak { color: var(--amber); }
    #sec .fundv .x { color: var(--muted); font-size: 12px; flex: 1 1 260px; line-height: 1.5; }
    #sec .fundv .x b { color: var(--text); }
    /* The summed year, set apart from the quarters so it reads as a total
       rather than as another period — and it is what the comparison above
       is computed from, so it has to be findable. */
    #sec tr.ttmrow td { background: rgba(255, 255, 255, 0.035);
                        border-bottom: 1px solid var(--hair-2); }
    #sec tr.ttmrow td.per { font-family: var(--sans); font-weight: 600; }
    #sec tr.ttmrow td.per .fp { margin-left: 6px; }
    #sec .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }
    #sec .msg { color: var(--muted); font-size: 12.5px; padding: 6px 0; }
    @media (max-width: 620px) { #sec th, #sec td { padding-left: 10px; } }

    /* ---- insider transactions (2026-09-27) --------------------------------
       Its own card again, beside the filings one and mixed with nothing.
       Scoped to #ins throughout — the same reason #sec is. */
    #ins .stab { overflow-x: auto; }
    #ins table { width: 100%; border-collapse: collapse; }
    #ins th, #ins td { text-align: right; padding: 7px 0 7px 14px; font-size: 12.5px;
                       border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
    #ins th { color: var(--faint); font-weight: 500; font-size: 10.5px;
              text-transform: uppercase; letter-spacing: 0.1em; }
    #ins td { font-family: var(--mono); color: var(--text); }
    #ins th:first-child, #ins td:first-child { text-align: left; padding-left: 0; }
    #ins td.who { font-family: var(--sans); max-width: 30ch; overflow: hidden;
                  text-overflow: ellipsis; }
    #ins td.who .role { color: var(--faint); font-size: 11px; margin-left: 7px; }
    /* BOUGHT AND SOLD ARE NOT UP AND DOWN, and on this page green and red
       already mean the price moved. They are used here anyway, because on a
       buy/sell column every reader expects them and the WORD carries the
       meaning on its own — the colour is the second reading, never the only
       one. It is on the word, never on a number, so nothing in a price
       column can be misread as a direction. */
    #ins td.act { font-family: var(--sans); font-weight: 600; }
    #ins td.act.buy { color: var(--green); }
    #ins td.act.sell { color: var(--red); }
    /* A 10b5-1 trade was scheduled months ahead, so it says much less about
       what the insider thinks today. Marked, quietly. */
    #ins .plan { color: var(--faint); font-size: 10px; margin-left: 6px;
                 text-transform: uppercase; letter-spacing: 0.08em; }
    #ins td.filed a { color: var(--accent); text-decoration: none; font-size: 11.5px; }
    #ins td.filed a:hover { text-decoration: underline; }
    #ins .sum { display: flex; gap: 22px; flex-wrap: wrap; margin: 0 0 14px;
                font-size: 13px; color: var(--muted); }
    #ins .sum b { color: var(--text); font-weight: 600; }
    #ins .sum .bought b { color: var(--green); }
    #ins .sum .sold b { color: var(--red); }
    #ins .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }
    #ins .msg { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

    /* ---- short interest (2026-09-28) --------------------------------------
       Scoped to #sint throughout, the reason #sec and #ins are: nine unscoped
       class names have captured later markup on this project. */
    /* The heading and its count share a row, and at 390px they overlapped —
       `.sec-h` is shared with #sec and #ins, so the wrap is scoped here
       rather than changed underneath them. */
    #sint .sec-h { flex-wrap: wrap; gap: 4px 12px; }
    #sint .sum { display: flex; gap: 26px; flex-wrap: wrap; margin: 0 0 16px; }
    #sint .fig { display: flex; flex-direction: column; gap: 3px; }
    #sint .fig .k { color: var(--faint); font-size: 10.5px; text-transform: uppercase;
                    letter-spacing: 0.1em; }
    #sint .fig .v { font-family: var(--mono); font-size: 19px; color: var(--text); }
    #sint .fig .x { color: var(--muted); font-size: 11.5px; }
    /* THE STRIP IS DAYS TO COVER AND NOTHING ELSE, and that is a correctness
       decision rather than a style one. FINRA does not restate history for
       splits — measured on NVDA's 10:1 of June 2024, the position goes
       29,202,972 to 315,033,985 across one fortnight — so a raw shares-short
       series would draw a 40x build-up in bearish bets that never happened.
       Days to cover is a ratio, so both halves scale and it rides straight
       through: NVDA sits at ~1.0 on both sides of both splits. */
    #sint .strip { display: flex; align-items: flex-end; gap: 1px; height: 46px;
                   margin: 2px 0 8px; }
    #sint .strip i { flex: 1 1 0; min-width: 0; display: block; background: var(--muted);
                     opacity: 0.55; border-radius: 1px 1px 0 0; }
    #sint .strip i.now { background: var(--text); opacity: 1; }
    /* Past the p90 ceiling a bar is drawn full height and SAYS SO on hover,
       rather than being silently clipped — the earnings strip's own rule. */
    #sint .strip i.capped { opacity: 0.9; }
    /* A split is marked on the strip because the readings either side of it
       are not comparable as share counts, even though their ratios are. */
    #sint .strip i.split { background: var(--amber); opacity: 0.8; }
    #sint .axis { display: flex; justify-content: space-between; color: var(--faint);
                  font-size: 10.5px; font-family: var(--mono); }
    #sint .note { color: var(--faint); font-size: 11.5px; line-height: 1.6; margin: 12px 0 0; }
    #sint .note a { color: var(--accent); text-decoration: none; }
    #sint .note a:hover { text-decoration: underline; }
    #sint .msg { color: var(--muted); font-size: 12.5px; padding: 6px 0; }
    @media (max-width: 620px) { #ins th, #ins td { padding-left: 10px; } }
    /* On a phone the table scrolls inside its own box, and what you should see
       BEFORE scrolling is a company and what it did — not a company name using
       the whole viewport. The compare pill goes: the row itself already opens
       the stock, and /compare is not a phone-shaped page. */
    @media (max-width: 620px) {
      #peers td.nm .namelink, #peers td.nm .self { max-width: 116px; }
      #peers th, #peers td { padding-left: 10px; }
      #peers td.cmp, #peers th:last-child { display: none; }
      /* THE CHIP GOES ON A PHONE, and the existing suite is what caught it:
         "this stock" is ~70px of a 390px screen and it pushed Today off the
         visible box — the exact fault that rule above was written for. The
         tint already says which row this is, and on a page titled with the
         symbol it was never carrying much. */
      #peers .here { display: none; }
    }

    .later { color: var(--faint); font-size: 12px; line-height: 1.6; }
    .err { color: var(--red); font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark"><span class="wordmark">Tickr Lab</span></span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Back to screener</a>
    </nav>
  </div>

  <main class="page" id="page">
    <p class="lede" id="status">Loading…</p>
  </main>

  <script src="/rowcard.js"></script>
  <script src="/action.js"></script>
  <script src="/track.js"></script>
  <script>
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // /stock/MU  ->  MU
    const SYMBOL = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '').toUpperCase();

    // Trading days, not calendar days — roughly 21 a month. The archive reaches
    // ~20 years for older listings and a symbol simply gets whatever it has, so
    // "Max" is honest rather than a fixed promise.
    // `word` is for prose rather than for the button: a saved card's kicker
    // reads "NVDA · past year", where "the past 1Y" would read like a form
    // field. The button keeps the short label, which is all a toolbar has room
    // for. One list, so the two can never name different windows.
    const RANGES = [
      { id: '1w',  label: '1W',  days: 5,    word: 'past week' },
      { id: '2w',  label: '2W',  days: 10,   word: 'past fortnight' },
      { id: '1m',  label: '1M',  days: 21,   word: 'past month' },
      { id: '3m',  label: '3M',  days: 63,   word: 'past three months' },
      { id: '6m',  label: '6M',  days: 126,  word: 'past six months' },
      { id: '1y',  label: '1Y',  days: RowCard.HISTORY_DAYS, word: 'past year' },
      { id: '5y',  label: '5Y',  days: 1260, word: 'past five years' },
      { id: 'max', label: 'Max', days: 5200, word: 'whole archive' },
    ];
    let range = RANGES.find((r) => r.id === '1y');
    // Moving averages. Adding another is one entry here plus a colour in
    // app.css; nothing else needs to change.
    const MAS = [
      { len: 50,  cls: 'ma50',  label: '50D',  on: true },
      { len: 200, cls: 'ma200', label: '200D', on: true },
    ];
    // Always padded by the longest average rather than by whichever are
    // switched on, so toggling redraws from the cache instead of refetching.
    // The server clamps at its own ceiling, which only bites on Max, where 200
    // missing bars are invisible across twenty years.
    const MA_PAD = Math.max.apply(null, MAS.map((m) => m.len));
    // Index overlays. The four US benchmarks are ordinary universe rows with
    // twenty years of archived bars, so these cost a cached /api/history read
    // and no API credits. Off by default — the chart is about this stock, and
    // a comparison is something you ask for.
    const BENCH = [
      { sym: 'SPY', label: 'S&P 500',      cls: 'bm-spy', on: false },
      { sym: 'QQQ', label: 'Nasdaq 100',   cls: 'bm-qqq', on: false },
      { sym: 'IWM', label: 'Russell 2000', cls: 'bm-iwm', on: false },
      { sym: 'DIA', label: 'Dow 30',       cls: 'bm-dia', on: false },
    ].filter((b) => b.sym !== SYMBOL);   // never overlay a stock on itself

    // ONE MORE LINE, CHOSEN: the same overlay the four indices use, pointed at
    // any stock in the universe. It is not a new mechanism — benchSeries does
    // the alignment and the rebasing, chartSVG draws the path, and the legend
    // already lists whatever is drawn — so this is a fifth entry in the list
    // that paintChart builds, with a symbol that happens to be chosen.
    //
    // Rebased like the indices: scaled to this stock's price at the first date
    // they share, so the line answers "what would that have done from the same
    // starting point" and the GAP between the lines is the relative
    // performance. Two raw price lines on one axis would be the misleading
    // version — NVDA at $180 against KSS at $12 flattens one of them.
    let compareSym = '';
    let universeRows = [];   // filled once /api/stock lands; the picker reads it
    // The company NAME where we have one, because "Advanced Micro Devices" says
    // more on a legend than AMD does — the same call the cards make.
    function cmpLabel(sym) {
      const r = universeRows.find((x) => x.symbol === sym);
      return (r && (r.short || r.name)) || sym;
    }
    // The verdict replay reads the 252-session high beside the 200-day
    // average, so the fetch pads by the larger of the two needs.
    const REPLAY_PAD = 260;
    // On by default. RSI(14) rides on the same padding the averages need —
    // Wilder smoothing converges slowly, so a short warm-up would not match the
    // screener's own RSI column.
    const RSI_LEN = 14;
    // THE FOUR GROUPS A STOCK BELONGS TO, defined once (2026-09-27). The
    // masthead chips and the rows in "Everything the screener knows" both
    // read this, so a chip and the row under it can never point at different
    // addresses — and the KEYS ARE THE FIELD_SPEC LABELS, which is what lets
    // the card match them without a second list.
    //
    // Each returns a LIST: Portfolios is many values in one row, and two
    // themes are two links rather than one link over both names. An empty
    // list is the honest answer for a stock whose profile has not arrived —
    // fewer chips and a plain row, never /industry/undefined.
    const GROUP_LINKS = {
      Sector: (s) => (s.sector ? [{ t: s.sector, href: '/sector/' + encodeURIComponent(s.sector) }] : []),
      Industry: (s) => (s.industry ? [{ t: s.industry, href: '/industry/' + encodeURIComponent(s.industry) }] : []),
      Size: (s) => (s.capBand ? [{ t: s.capBand, href: '/size/' + encodeURIComponent(s.capBand) }] : []),
      Portfolios: (s) => (s.portfolios || []).map((x) => ({ t: x, href: '/theme/' + encodeURIComponent(x) })),
    };
    const GROUP_LINK_ORDER = ['Sector', 'Industry', 'Size', 'Portfolios'];
    let showRSI = true;
    // THE RIBBON AND THE LINE ARE TWO THINGS, and only one of them is a
    // hypothesis. The ribbon is a reading of the bars — what the trend rules
    // said on each session — and is always drawn. The dashed trend-hold line
    // is a simulated equity curve, and this flag is ONLY that line (with the
    // legend's return stat and the why card, which both describe it). Off by
    // default at the owner's instruction: the chart opens as a price chart.
    let showTrendLine = false;
    let stock = null;

    const curSym = (c) => ({ USD: '$', EUR: '€', GBP: '£', JPY: '¥', KRW: '₩', INR: '₹' }[c] || '');

    // HOW OLD IS THIS PAGE — under the price, because that is the number it
    // qualifies (2026-10-02, owner's request).
    //
    // IT EXISTS BECAUSE THE SCREENER SELF-RELOADS AND THIS PAGE DOES NOT. A
    // visible screener tab polls /api/status every five minutes and reloads
    // when the snapshot moves; /stock has no poller, so two tabs left open
    // across an intraday slot show different prices, different returns and
    // sometimes a different verdict — all correct, none of it dated. The
    // owner reported exactly that (ASML at $1857.6/+2.7% against the
    // screener's $1865.5/+3.2%, one slot apart) and neither page said which
    // was older: the screener has its Price pulled column and status pill,
    // and this page had nothing.
    //
    // THE VALUE COMES FROM FIELD_SPEC'S OWN FORMATTER, never a second copy of
    // the rule, so the masthead and the screener's column cannot drift on
    // what counts as stale or how a time is written.
    //
    // ASKING IS NOT RECEIVING, and the tooltip carries that rather than
    // letting a fresh-looking clock imply a fresh bar: ten stocks were once
    // pulled on time and were not on the day's bar, AVB carrying a close from
    // five weeks earlier. The pull time and the newest stored bar are two
    // facts and are named as two.
    function asOfHtml(s) {
      const f = RowCard.fieldValues(s)['short|Price pulled'];
      const bar = s.latestDate ? `Newest stored bar: ${s.latestDate}.` : 'No stored bar yet.';
      if (!f || f.t == null) {
        return '<span class="asof" title="No price pull recorded for this symbol yet. ' +
          esc(bar) + '">Price as of —</span>';
      }
      const tip = `Price last pulled for ${s.symbol} at ${f.t}. ${bar} ` +
        'Asking and receiving are different facts — read the two together.';
      return `<span class="asof${f.c === 'warn' ? ' warn' : ''}" title="${esc(tip)}">Price as of ${esc(f.t)}</span>`;
    }

    // Axis labels want to be scannable, not precise: decimals on a gridline are
    // noise, but a $2 stock still needs them.
    function tickLabel(v) {
      const a = Math.abs(v);
      if (a >= 100) return String(Math.round(v));
      if (a >= 10) return v.toFixed(1);
      return v.toFixed(2);
    }

    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    // Short spans want a day, long ones want a year; a month alone is ambiguous
    // over five years and redundant over five days.
    function axisLabel(iso) {
      const p = String(iso || '').split('-');
      if (p.length !== 3) return iso || '';
      const [y, m, d] = p;
      if (range.days <= 63) return `${+d} ${MON[+m - 1]}`;
      if (range.days <= 253) return `${MON[+m - 1]} ${y.slice(2)}`;
      return `${MON[+m - 1]} ${y}`;
    }

    // chartSVG reports positions as fractions of the viewBox, but the svg does
    // not fill the box — 18px at the bottom is reserved for the date axis. A
    // raw top:% therefore lands everything progressively low, which pushed the
    // oversold label clean out of its pane. Convert once, here.
    const AXIS_H = 18;
    const atY = (f) => `calc(${f.toFixed(4)} * (100% - ${AXIS_H}px))`;

    // The series currently drawn, so the crosshair can read values without
    // recomputing anything.
    let hover = null;

    const fmtVol = (v) => {
      if (v == null || !isFinite(v) || v <= 0) return '—';
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return Math.round(v / 1e3) + 'K';
      return String(Math.round(v));
    };
    const fullDate = (iso) => {
      const p = String(iso || '').split('-');
      return p.length === 3 ? `${MON[+p[1] - 1]} ${+p[2]}, ${p[0]}` : (iso || '');
    };

    // Rows appended to the Info group. Each is skipped rather than shown empty:
    // a profile that has not been re-pulled since these fields were captured
    // simply has fewer rows, which reads better than a column of em-dashes.
    // ---- around earnings ---------------------------------------------------
    //
    // How this stock has behaved around its OWN reports: one faint line per
    // quarter rebased to the report-date close, the median over them, and the
    // interquartile band. The spaghetti is deliberate — it shows the sample
    // size and the dispersion without asking anyone to read a number.
    //
    // DESCRIPTION, NOT A SIGNAL. Post-earnings drift is untested on this data
    // (docs/backlog.md entry 1) and seven of eight framings in the research
    // log came back flat. The note says so rather than leaving the chart to
    // imply otherwise.
    const AROUND_KEY = 'stock.around';
    // localStorage rather than prefs: this is a per-device display choice, the
    // same call /compare's "hide matching rows" and /m's view switch made. A
    // prefs flag would follow the account but would cost this page a round
    // trip it does not currently make — and a guest has no prefs key at all.
    const aroundOn = () => { try { return localStorage.getItem(AROUND_KEY) !== '0'; } catch (e) { return true; } };

    function aroundChart(st) {
      const W = 720; const H = 190;
      const pre = st.window.pre; const post = st.window.post;
      const len = pre + post + 1;
      let lo = 0; let hi = 0;
      for (const p of st.paths) for (const v of p.path) { if (v == null) continue; if (v < lo) lo = v; if (v > hi) hi = v; }
      if (hi - lo < 1) { hi = 1; lo = -1; }
      const padY = (hi - lo) * 0.08;
      lo -= padY; hi += padY;
      const X = (k) => (k / (len - 1)) * W;
      const Y = (v) => H - ((v - lo) / (hi - lo)) * H;
      const poly = (arr) => arr.map((v, k) => (v == null ? null : X(k) + ',' + Y(v)))
        .filter(Boolean).join(' ');

      // The band as one closed path: q3 forward, q1 back.
      let band = '';
      if (st.q1 && st.q3) {
        const up = st.q3.map((v, k) => X(k) + ',' + Y(v)).join(' L ');
        const dn = st.q1.map((v, k) => X(k) + ',' + Y(v)).reverse().join(' L ');
        band = `<path class="qline" d="M ${up} L ${dn} Z" />`;
      }
      const zeroY = Y(0);
      const evtX = X(pre);
      return {
        svg: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">` +
          band +
          `<line class="zero" x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" />` +
          `<line class="evt" x1="${evtX}" y1="0" x2="${evtX}" y2="${H}" />` +
          st.paths.map((p) => `<polyline class="one" points="${poly(p.path)}" />`).join('') +
          `<polyline class="med" points="${poly(st.median)}" />` +
          '</svg>',
        // Fractions so the HTML labels sit on the same geometry the svg drew.
        xAt: (k) => (k / (len - 1)) * 100,
        yAt: (v) => ((hi - v) / (hi - lo)) * 100,
        lo, hi,
      };
    }

    function aroundHtml(st) {
      if (!st || !st.n || !st.next) return '';
      const g = aroundChart(st);
      const pc = (v, d) => (v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d == null ? 1 : d) + '%');
      const sgn = (v) => (v == null ? '' : v > 0 ? ' pos' : v < 0 ? ' neg' : '');
      const nx = st.next;

      const figs = [];
      figs.push(`<div class="fg"><span class="k">Typical reaction</span>` +
        `<span class="v${sgn(nx.median)}">${pc(nx.median)}</span>` +
        `<span class="s">median next session, ${nx.n} quarters</span></div>`);
      // The size of the event, which the signed median alone hides.
      figs.push(`<div class="fg"><span class="k">Typical size</span>` +
