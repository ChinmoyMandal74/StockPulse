<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blog — Tickr Lab</title>
  <meta name="description" content="Notes from building Tickr Lab: what the data says, what the screener does, and the tests that came back flat." />
  <meta property="og:title" content="Tickr Lab blog" />
  <meta property="og:description" content="Notes from building a stock screener that explains itself." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    footer .ftag { color: var(--green); letter-spacing: .1em; text-transform: uppercase;
                    font-size: 10.5px; margin-right: auto; }

    body { min-height: 100dvh; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 28px 80px; }
    .aura { background:
      radial-gradient(48vw 42vw at 6% -10%, rgba(124, 156, 255, 0.12), transparent 62%),
      radial-gradient(46vw 40vw at 98% 2%, rgba(52, 211, 153, 0.10), transparent 64%); }
    .nav-wrap { position: sticky; top: 0; z-index: 40; display: flex; justify-content: center; padding: 16px 20px 0; pointer-events: none; }
    .nav { pointer-events: auto; display: flex; align-items: center; gap: 8px; width: min(860px, 100%);
      padding: 8px 10px 8px 18px; border-radius: 999px; background: rgba(9, 11, 15, 0.74);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px rgba(0, 0, 0, 0.9), var(--inset); }
    .nav .mark { display: inline-flex; align-items: center; gap: 9px; margin-right: auto; text-decoration: none; color: var(--text); }
    .nav .glyph { width: 26px; height: 26px; border-radius: 9px; display: inline-flex; align-items: center;
      justify-content: center; color: var(--green);
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.20), rgba(52, 211, 153, 0.04));
      border: 1px solid rgba(52, 211, 153, 0.24); }
    header.masthead { padding: 60px 0 10px; }
    h1 { margin: 0; font-size: clamp(38px, 6vw, 62px); font-weight: 600; letter-spacing: -0.045em; line-height: 0.96; }
    .lede { margin: 18px 0 0; max-width: 60ch; font-size: 15px; line-height: 1.7; color: var(--muted); }

    .posts { margin-top: 42px; display: grid; gap: 12px; }
    a.post { text-decoration: none; color: inherit; display: block; }
    a.post .core { padding: 22px 24px; transition: border-color .18s var(--ease), transform .18s var(--ease);
                   display: flex; gap: 22px; align-items: flex-start; }
    a.post:hover .core { border-color: rgba(52, 211, 153, 0.35); transform: translateY(-1px); }
    /* `min-width: 0` or a long unbroken title refuses to shrink and pushes the
       picture off the card — the flex default is min-content, not zero. */
    .ptext { flex: 1 1 auto; min-width: 0; }
    /* ---- the thumbnail ------------------------------------------------------
       ON THE RIGHT, which is not only to echo the post page's picture rail: a
       left-hand thumbnail would start each row's text at a different place
       depending on whether that post happens to have a picture, and a list of
       four where two are indented reads as broken rather than as varied.
       On the right, every title lines up and a post without one simply has
       nothing there. */
    .pthumb { flex: 0 0 200px; display: block; width: 200px; aspect-ratio: 4 / 3;
              border-radius: 10px; overflow: hidden; border: 1px solid var(--hair);
              background: var(--surface-2); }
    /* `cover` keeps every card the same shape; `top` is what makes that safe.
       These pictures are posters and screenshots rather than photographs, so
       the part worth seeing is the headline at the top — a centred crop takes
       the middle band of a 4:5 promo card and shows nobody anything. */
    .pthumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .meta { display: block; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--faint); text-transform: uppercase; }
    a.post h2 { margin: 10px 0 0; font-size: clamp(19px, 2.4vw, 25px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; }
    a.post p { margin: 10px 0 0; font-size: 14px; line-height: 1.65; color: var(--muted); }
    .more { display: block; margin-top: 14px; font-size: 13px; color: var(--green); }
    /* Narrow: the picture goes ABOVE the text, which is what a card does on a
       phone. `order` rather than a reversed DOM, so the heading still comes
       first for a screen reader and for anything reading the markup. */
    @media (max-width: 620px) {
      a.post .core { flex-direction: column; gap: 14px; }
      .pthumb { flex: none; width: 100%; aspect-ratio: 16 / 9; order: -1; }
    }
    .empty { padding: 40px 4px; color: var(--faint); font-size: 14px; }
    footer { margin-top: 56px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 24px;
             display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--faint); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); text-decoration: underline; }
    @media (max-width: 640px) { .page { padding: 0 16px 60px; } header.masthead { padding: 40px 0 4px; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
  </svg>

  <div class="nav-wrap">
    <nav class="nav">
      <a class="mark" href="/">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark">Tickr Lab</span>
      </a>
      <a class="btn" href="/login">Sign in</a>
      <a class="btn btn-primary" href="/login?guest=1">Try it</a>
    </nav>
  </div>

  <main class="page">
    <header class="masthead">
      <h1>The blog</h1>
      <p class="lede">Notes from building the screener: what the data turned out to say, what got removed when it
        did not hold up, and the occasional thing that worked.</p>
    </header>

    <div class="posts">%POSTS%</div>

    <footer>
      <span class="ftag">From data to decisions</span>
      <a href="/">Home</a>
      <a href="/login">Sign in</a>
      <a href="/login?guest=1">Guest preview</a>
    </footer>
  </main>
</body>
</html>
