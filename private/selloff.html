<!DOCTYPE html>
<html lang="en" data-themeable>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ideas — Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <!-- The account watermark every data page carries: members and guests, never the admin. -->
  <script src="/wmark.js" defer></script>
  <script src="/releaseview.js"></script>
  <!-- RowCard.fmtMktCap: the screener's own market-cap formatting. -->
  <script src="/rowcard.js"></script>
  <style>
    /* The shell is the IPO pipeline's. Everything this page adds is prefixed sw- . */
    body { min-height: 100dvh; padding: 0 0 80px; overflow-x: clip; }
    .page { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 0 32px; }
    .aura {
      background:
        radial-gradient(46vw 40vw at 4% -8%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 62%),
        radial-gradient(50vw 42vw at 98% 4%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 64%); }
    .bezel { border-radius: 26px; }
    .bezel > .core { border-radius: 20px; }
    .island-wrap { position: sticky; top: 0; z-index: 40; display: flex;
                   justify-content: center; padding: 12px 20px 0; pointer-events: none; }
    .island {
      pointer-events: auto; display: flex; align-items: center; gap: 8px;
      width: max-content; max-width: 100%; padding: 6px 7px 6px 16px; border-radius: 999px;
      background: color-mix(in srgb, var(--glass) 72%, transparent);
      backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
      border: 1px solid var(--hair); box-shadow: 0 28px 70px -26px color-mix(in srgb, var(--shade) 90%, transparent), var(--inset);
    }
    .mark .glyph {
      width: 26px; height: 26px; border-radius: 9px; display: inline-flex;
      align-items: center; justify-content: center; color: var(--green);
      background: linear-gradient(160deg, color-mix(in srgb, var(--green) 20%, transparent), color-mix(in srgb, var(--green) 4%, transparent));
      border: 1px solid color-mix(in srgb, var(--green) 24%, transparent);
    }
    /* Compact (owner, 2026-11-03: "reduce the vertical space"): no label above the heading, a smaller heading, the tabs close under it. */
    h1 { margin: 0; font-size: clamp(30px, 3.2vw, 40px); font-weight: 600; line-height: 1; letter-spacing: -0.04em; }
    .masthead { margin: 18px 0 14px; }

    .sw-bar { display: flex; align-items: center; gap: 10px; margin: 0 4px 12px; flex-wrap: wrap; }
    .sw-tab { font: 500 12px var(--sans); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--hair);
              background: none; color: var(--muted); cursor: pointer; }
    .sw-tab.on { color: var(--text); border-color: var(--accent); }
    .sw-tab .sw-n { font-family: var(--mono); color: var(--faint); margin-left: 4px; }
    .sw-win { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
    .sw-win select { font: 500 12px var(--sans); color: var(--text); background: var(--surface-2); border: 1px solid var(--hair-2); border-radius: 999px; padding: 6px 10px; }
    .sw-xl { font-size: 12px; padding: 7px 14px; }
    /* Frozen heading row (owner, 2026-11-03), on the page's one scroll ("I don't like 2 scrollbars"). Sticky needs
       every box between the heading and the page to leave overflow alone, so on wide screens, where the table fits,
       neither this card's core nor the wrap clips; the heading sticks just under the floating nav (--sw-stick, measured).
       Narrow screens (under 1280px since the Signal column) keep the sideways scroll inside the card, and with it an ordinary heading. */
    .sw-card > .core { overflow: visible; }
    .sw-wrap { overflow: visible; }
    .sw-wrap thead th { position: sticky; top: var(--sw-stick, 70px); z-index: 2; background: var(--surface); box-shadow: inset 0 -1px 0 var(--hair-2); }
    /* Once the heading is pinned, the band above it (around the floating nav) is painted, so rows pass under it
       rather than showing round the nav. */
    body.sw-stuck .island-wrap { background: var(--bg); box-shadow: inset 0 -1px 0 var(--hair); }
    .sw-wrap thead th:first-child { border-top-left-radius: 20px; }
    .sw-wrap thead th:last-child { border-top-right-radius: 20px; }
    .sw-wrap table { width: 100%; border-collapse: collapse; }
    .sw-wrap th, .sw-wrap td { padding: 9px 6px; border-bottom: 1px solid var(--hair); font-size: 12.5px; text-align: left; vertical-align: middle; white-space: nowrap; }
    .sw-wrap th:first-child, .sw-wrap td:first-child { padding-left: 16px; }
    .sw-wrap th:last-child, .sw-wrap td:last-child { padding-right: 16px; }
    /* Headings wrap to their words so a long name ("From 52-week high") does not set the column's width. */
    .sw-wrap th { font-weight: 500; color: var(--faint); font-size: 10px; line-height: 1.35; text-transform: uppercase; letter-spacing: 0.06em;
                  white-space: normal; vertical-align: bottom; min-width: 4.2em; cursor: pointer; user-select: none; }
    /* The word columns may wrap too: "Growing, profitable" over two lines. */
    .sw-wrap th .sw-h { display: inline-block; max-width: 7.2em; }
    .sw-wrap td.sw-wd { white-space: normal; min-width: 8ch; line-height: 1.35; }
    .sw-wrap th:hover { color: var(--text); }
    .sw-wrap th.sw-on { color: var(--text); }
    .sw-wrap th.sw-r, .sw-wrap td.sw-r { text-align: right; }
    .sw-wrap tr.sw-grp > td { border-top: 2px solid var(--hair-2); }
    .sw-co a { font: 600 12.5px var(--mono); color: var(--text); text-decoration: none; }
    .sw-co a:hover { color: var(--accent); }
    .sw-co span { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; max-width: 14ch; overflow: hidden; text-overflow: ellipsis; }
    .sw-num { font-family: var(--mono); }
    .sw-sub { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; font-family: var(--mono); }
    .sw-up { color: var(--green); }
    .sw-dn { color: var(--red); }
    .sw-faint { color: var(--faint); }
    .sw-wrap td.sw-sig { white-space: normal; min-width: 11ch; max-width: 17ch; line-height: 1.3; }
    .sw-sig b { font-weight: 600; font-size: 12px; }
    .sw-sig-up { color: var(--green); }
    .sw-sig-dn { color: var(--red); }
    .sw-why { font-family: var(--sans); white-space: normal; }
    .sw-tone a.sw-tn-v { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; }
    .sw-tone.sw-tn-pos a.sw-tn-v { color: var(--blue); }
    .sw-tone.sw-tn-neg a.sw-tn-v { color: var(--orange); }
    .sw-tone a.sw-tn-v:hover { text-decoration: underline; }
    .sw-tone .sw-tn-n { margin-left: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
    .sw-grpname { color: var(--muted); font-size: 11.5px; }
    .sw-from { display: block; color: var(--faint); font-size: 10.5px; margin-top: 2px; max-width: 15ch; overflow: hidden; text-overflow: ellipsis; }
    .sw-empty { padding: 26px; font-size: 13px; color: var(--muted); }
    .sw-foot { margin: 16px 6px 0; font-size: 12px; color: var(--faint); line-height: 1.65; max-width: 110ch; }
    @media (max-width: 860px) { .page { padding: 0 16px; } .hide-sm { display: none !important; } .sw-win { margin-left: 0; } }
    @media (max-width: 1279px) { .sw-card > .core { overflow: hidden; } .sw-wrap { overflow-x: auto; } .sw-wrap thead th { position: static; } }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <svg id="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 17.4 8.6 12l3.6 2.7L20 6.4"/><path d="M14.6 6.4H20v5.4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5.6"/><path d="M10.6 6.6 5.2 12l5.4 5.4"/></symbol>
  </svg>

  <div class="island-wrap">
    <nav class="island">
      <span class="mark">
        <span class="glyph"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-logo" /></svg></span>
        <span class="wordmark hide-sm">Tickr Lab</span>
      </span>
      <span class="divider"></span>
      <a class="btn" href="/"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-arrow-left" /></svg>Screener</a>
    </nav>
  </div>

  <main class="page">
    <header class="masthead">
      <h1>Ideas</h1>
    </header>

    <div class="sw-bar">
      <!-- First, and the tab the page opens on (owner, 2026-11-03). -->
      <button class="sw-tab" data-v="watch">AI watchlist<span class="sw-n" id="nwatch"></span></button>
      <button class="sw-tab" data-v="tech">Tech: strong results, fell anyway<span class="sw-n" id="ntech"></span></button>
      <button class="sw-tab" data-v="nontech">Non-tech: growing, profitable, fell after results<span class="sw-n" id="nnontech"></span></button>
      <button class="sw-tab" data-v="bounce">Bouncing off the lows<span class="sw-n" id="nbounce"></span></button>
      <!-- Three more (owner, 2026-11-05), screens over the screener's own Long run and insider readings. -->
      <button class="sw-tab" data-v="quality">Quality compounders on a pullback<span class="sw-n" id="nquality"></span></button>
      <button class="sw-tab" data-v="divlow">Dividend growers near their lows<span class="sw-n" id="ndivlow"></span></button>
      <button class="sw-tab" data-v="insider">Insider buying clusters<span class="sw-n" id="ninsider"></span></button>
      <label class="sw-win" id="winWrap">Releases from the past
        <select id="days" aria-label="How far back a results release counts"></select>
      </label>
      <!-- All three tables in one workbook, a sheet each, for the window chosen. -->
      <a class="btn sw-xl" id="xlsx" href="/api/selloff.xlsx" download title="All three tables as an Excel workbook, a sheet each, with every figure a number you can sort and filter. A fourth sheet says what each column means.">Export to Excel</a>
    </div>

    <div class="bezel sw-card"><div class="core" style="padding:0"><div class="sw-wrap" id="list"><div class="sw-empty">Reading the screener&hellip;</div></div></div></div>

    <p class="sw-foot" id="foot"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const we = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const qs = new URLSearchParams(location.search);
    const VIEWS = ['tech', 'nontech', 'watch', 'bounce', 'quality', 'divlow', 'insider'];
    // The two results screens have a reaction day and a window; the list and the bounce screen do not.
    const SCREENS = ['tech', 'nontech'];
    // The AI watchlist opens first (owner, 2026-11-03); ?show= still picks a tab.
    const DEFAULT_VIEW = 'watch';
    const state = { view: VIEWS.includes(qs.get('show')) ? qs.get('show') : DEFAULT_VIEW, days: Number(qs.get('days')) || null, sort: null, dir: 1 };
    let data = null;

    const fmtDay = (s) => (s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—');
    const isNum = (v) => v != null && v !== '' && Number.isFinite(Number(v));
    const pct = (v, signed) => (isNum(v) ? (signed && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(0) + '%' : '—');
    // Green and red mean the price rose or fell: the moves and the distance from the high, nothing else.
    const move = (v) => (isNum(v) ? '<span class="sw-num ' + (v < 0 ? 'sw-dn' : v > 0 ? 'sw-up' : '') + '">' + pct(v, true) + '</span>' : '<span class="sw-faint">—</span>');
    // A move with one decimal, for the short horizons; green up, red down.
    const moveD = (v) => (isNum(v) ? '<span class="sw-num ' + (v < 0 ? 'sw-dn' : v > 0 ? 'sw-up' : '') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%</span>' : '<span class="sw-faint">—</span>');
    const mult = (v) => (isNum(v) ? (v >= 100 ? Math.round(v) : Number(v).toFixed(1)) + 'x' : '—');
    const guide = (g) => (!g ? '<span class="sw-faint">—</span>' : g === 'given' ? '<span class="sw-faint">Given</span>' : (window.ReleaseView ? ReleaseView.changeTag(g) : we(g)));

    // One column list; the screens add the reaction, the watchlist its group.
    const COLS = [
      { k: 'symbol', t: 'Company', cell: (r) => '<td class="sw-co"><a href="/stock/' + encodeURIComponent(r.symbol) + '" target="_blank" rel="noopener">' + we(r.symbol) + '</a><span>' + we(r.name || '') + '</span></td>', sort: (r) => r.symbol },
      // The group, and under it why the company is here: the published list, or the theme it came in by.
      { k: 'group', t: 'Group', only: 'watch', cell: (r) => '<td class="sw-grpname">' + we(r.group) + '<span class="sw-from" title="' + we(fromTitle(r)) + '">' + we(r.from === 'list' ? 'Published list' : r.from || '') + '</span></td>', sort: (r) => GROUPS.indexOf(r.group) },
      { k: 'sector', t: 'Sector', only: 'nontech', cls: 'hide-sm', cell: (r) => '<td class="sw-grpname sw-wd hide-sm">' + we(r.sector || '—') + '</td>', sort: (r) => r.sector || '' },
      { k: 'cap', t: 'Market cap', r: true, title: 'Market value at the latest price, as on the screener.',
        cell: (r) => '<td class="sw-r sw-num">' + we((isNum(r.cap) && window.RowCard && RowCard.fmtMktCap(Number(r.cap), r.currency)) || '—') + '</td>', num: true },
      { k: 'today', t: 'Today', r: true, title: 'The latest session’s price change, as on the screener: the previous close to the latest price.',
        cell: (r) => '<td class="sw-r">' + (isNum(r.today) ? '<span class="sw-num ' + (r.today < 0 ? 'sw-dn' : r.today > 0 ? 'sw-up' : '') + '">' + (r.today > 0 ? '+' : r.today < 0 ? '−' : '') + Math.abs(r.today).toFixed(1) + '%</span>' : '<span class="sw-faint">—</span>') + '</td>', num: true },
      // The quality tab's two long-run readings and where the recent quarters stand.
      { k: 'crChecks', t: 'Ten-year record', only: 'quality', r: true, title: 'The screener’s Compounding record: how many of five checks over up to ten years of annual reports hold: revenue rose in 80% of years, EPS grew 10% a year, the worst operating margin held 70% of typical, free cash flow was 80% of net income, the share count grew 0.5% a year or less.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.crChecks) ? r.crChecks + ' of 5' : '—') + '</td>', num: true },
      { k: 'fScore', t: 'F-score', only: 'quality', r: true, title: 'Piotroski’s nine checks of profit, balance sheet and efficiency on the latest annual report; how many hold.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.fScore) ? r.fScore + ' of 9' : '—') + '</td>', num: true },
      { k: 'crNow', t: 'Quarters now', only: 'quality', title: 'The screener’s Compounding now: whether the latest quarters are still growing, slowing or declining.',
        cell: (r) => '<td class="sw-wd">' + we(NOW_WORD[r.crNow] || '—') + '</td>', sort: (r) => r.crNow || '' },
      // The dividend tab: how long the raises have run, how fast, and the yield.
      { k: 'divStreak', t: 'Dividend raised', only: 'divlow', r: true, title: 'Years running the dividend has been raised, and the year the run began.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.divStreak) ? r.divStreak + ' yrs' : '—') + (r.divSince ? '<span class="sw-sub">since ' + we(r.divSince) + '</span>' : '') + '</td>', num: true },
      { k: 'divGrowth5y', t: 'Dividend /yr 5Y', only: 'divlow', r: true, title: 'The dividend’s compound growth a year over five years.',
        cell: (r) => '<td class="sw-r sw-num">' + pct(r.divGrowth5y, true) + '</td>', num: true },
      { k: 'divYield', t: 'Yield', only: 'divlow', r: true, title: 'Forward dividend yield at the latest price, as on the screener.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.divYield) ? Number(r.divYield).toFixed(1) + '%' : '—') + '</td>', num: true },
      // The insider tab: how many bought, how many sold, and the net as a share of market value.
      { k: 'insBuyers', t: 'Insiders buying', only: 'insider', r: true, title: 'Insiders who bought shares on the open market in the window (Form 4).',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.insBuyers) ? r.insBuyers : '—') + '</td>', num: true },
      { k: 'insSellers', t: 'Insiders selling', only: 'insider', r: true, title: 'Insiders who sold on the open market in the window, leaving out sales under a prearranged plan.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.insSellers) ? r.insSellers : '—') + '</td>', num: true },
      { k: 'insNet', t: 'Insider net', only: 'insider', r: true, title: 'Purchases less sales in the window, as a percent of market value: the screener’s Insider net.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.insNet) ? (r.insNet > 0 ? '+' : r.insNet < 0 ? '−' : '') + (Math.abs(r.insNet) < 0.01 ? Math.abs(r.insNet).toFixed(3) : Math.abs(r.insNet).toFixed(2)) + '%' : '—') + '</td>', num: true },
      { k: 'range52', t: '52-week range', only: ['bounce', 'divlow'], r: true, title: 'Where the price sits in its 52-week range: 0 at the low, 100 at the high.',
        cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.range52) ? Math.round(r.range52) : '—') + '</td>', num: true },
      { k: 'w2', t: '2 weeks', only: 'bounce', r: true, title: 'The price change over the past two weeks.', cell: (r) => '<td class="sw-r">' + moveD(r.w2) + '</td>', num: true },
      { k: 'm1', t: '1 month', only: 'bounce', r: true, title: 'The price change over the past month.', cell: (r) => '<td class="sw-r">' + moveD(r.m1) + '</td>', num: true },
      { k: 'filed', t: 'Reported', cell: (r) => '<td class="sw-num">' + we(fmtDay(r.filed)) + '</td>', sort: (r) => r.filed || '' },
      { k: 'guidance', t: 'Guidance', cell: (r) => '<td>' + guide(r.guidance) + '</td>', sort: (r) => r.guidance || '' },
      { k: 'reaction', t: 'Reaction', screen: true, r: true, title: 'The worse of the filing day (previous close to that day’s close) and the day after (that close to the next one). The date under it is the day.',
        cell: (r) => '<td class="sw-r">' + move(r.reaction) + '<span class="sw-sub">' + we(fmtDay(r.reactionOn)) + '</span></td>', num: true },
      { k: 'since', t: 'Since', screen: true, r: true, title: 'The reaction day’s close to the latest price.', cell: (r) => '<td class="sw-r">' + move(r.since) + '</td>', num: true },
      { k: 'fromHigh', t: 'From 52-week high', r: true, cell: (r) => '<td class="sw-r">' + move(r.fromHigh) + '</td>', num: true },
      { k: 'rsi', t: 'RSI', r: true, title: 'Relative strength index, 14-day, at the latest close.', cell: (r) => '<td class="sw-r sw-num">' + (isNum(r.rsi) ? Number(r.rsi).toFixed(0) : '—') + '</td>', num: true },
      { k: 'pe', t: 'P/E', r: true, title: 'Trailing twelve months, as the data provider reports it; a dash off a loss.', cell: (r) => '<td class="sw-r sw-num">' + mult(r.pe) + '</td>', num: true },
      { k: 'fpe', t: 'Fwd P/E', r: true, cell: (r) => '<td class="sw-r sw-num">' + mult(r.fpe) + '</td>', num: true },
      { k: 'valueVsIndustry', t: 'Value vs industry', cell: (r) => '<td class="sw-wd">' + we(r.valueVsIndustry || '—') + '</td>', sort: (r) => r.valueVsIndustry || '' },
      { k: 'revGrowth', t: 'Revenue growth', r: true, title: 'The latest quarter on the same quarter a year earlier.', cell: (r) => '<td class="sw-r sw-num">' + pct(r.revGrowth, true) + '</td>', num: true },
      { k: 'profitMargin', t: 'Profit margin', r: true, title: 'Net income over revenue, twelve months.', cell: (r) => '<td class="sw-r sw-num">' + pct(r.profitMargin, false) + '</td>', num: true },
      { k: 'growthProfile', t: 'Growth & profit', cell: (r) => '<td class="sw-wd">' + we(r.growthProfile || '—') + '</td>', sort: (r) => r.growthProfile || '' },
      // The Signal, with the rule that fired under it (never the word alone), coloured as the screener colours it.
      { k: 'signal', t: 'Signal', title: 'The screener’s Signal under its Balanced rules, and the rule that fired. A reading of strength, not an instruction to trade.',
        cell: (r) => (r.signal
          ? '<td class="sw-sig"><b class="' + (/Strong/.test(r.signal) ? 'sw-sig-up' : /Weak/.test(r.signal) ? 'sw-sig-dn' : '') + '">' + we(r.signal) + '</b>' + (r.signalWhy ? '<span class="sw-sub sw-why">' + we(r.signalWhy) + '</span>' : '') + '</td>'
          : '<td class="sw-faint">—</td>'),
        sort: (r) => { const i = SIGNALS.indexOf(r.signal); return i < 0 ? null : i; } },
      // Article tone, as the screener's Tone 7D draws it: blue and orange, never green and red (a reading of words, not a price).
      { k: 'tone', t: 'Tone 7D', r: true, title: 'Article tone over the last seven days, as on the screener: the average of an AI model’s reading of how each article mainly about the company leans, from −1 to +1, with the number of articles read beside it. Blue is +0.25 or more, orange −0.25 or less. A description of what was written, not a forecast, and never an input to the Signal. Click a figure for the articles.',
        cell: (r) => toneCell(r), sort: (r) => (r.tone ? r.tone.avg : null) },
    ];
    function toneCell(r) {
      const t = r.tone;
      if (!t || !isNum(t.avg)) return '<td class="sw-r sw-faint" title="No article read in the last seven days">—</td>';
      const band = Number(data.toneBand) || 0.25, a = t.avg;
      const num = (a > 0 ? '+' : a < 0 ? '−' : '') + Math.abs(a).toFixed(2);
      const word = a >= band ? 'positive' : a <= -band ? 'negative' : 'neutral';
      const tip = 'Last seven days: ' + t.n + ' article' + (t.n === 1 ? '' : 's') + ' read, ' + t.pos + ' positive, ' + t.neg + ' negative; average ' + num + ' (' + word + '). Click for the articles.';
      return '<td class="sw-r sw-tone' + (a >= band ? ' sw-tn-pos' : a <= -band ? ' sw-tn-neg' : '') + '" title="' + we(tip) + '"><a class="sw-tn-v" href="/stock/' + encodeURIComponent(r.symbol) + '#tone" target="_blank" rel="noopener">' + num + '</a><span class="sw-tn-n">' + we(String(t.n)) + '</span></td>';
    }
    // Strongest first when sorted.
    const SIGNALS = ['Very Strong', 'Strong', 'Strong – Elevated Risk', 'Neutral', 'Weak', 'Very Weak'];
    const GROUPS = ['Memory', 'Power', 'Networking', 'Semicap', 'Compute', 'Neoclouds', 'Hyperscalers', 'Servers & data centres'];
    const fromTitle = (r) => (r.from === 'list' ? 'On the published list of 25' : 'From your theme ' + r.from) + (r.themes && r.themes.length ? '. In: ' + r.themes.join(', ') : '');
    const NOW_WORD = { grow: 'Still growing', slow: 'Slowing', decline: 'Declining' };
    const colsFor = (v) => COLS.filter((c) => (!c.only || [].concat(c.only).includes(v)) && (!c.screen || SCREENS.includes(v)));

    // Each tab's rule, as its tooltip (owner, 2026-11-03: no text above the tables).
    function what(view) {
      const d = data.drop, g = data.minGrowth, w = data.days;
      if (view === 'tech') return 'Technology and Communication Services companies whose newest results release, filed in the past ' + w + ' days, showed revenue up ' + g + '% or more on the year, a net profit and guidance, and whose shares fell ' + Math.abs(d.tech) + '% or more on the reaction day. Worst reaction first.';
      if (view === 'nontech') return 'Companies in every other sector meeting the same release test (filed in the past ' + w + ' days, revenue up ' + g + '% or more, a net profit, guidance), that read Growing, profitable and Below industry or In line on value, and whose shares fell ' + Math.abs(d.nontech) + '% or more on the reaction day. Worst reaction first.';
      if (data.ideaRules && data.ideaRules[view]) return data.ideaRules[view] + ' Every reading is the screener’s own.';
      if (view === 'bounce') {
        const b = data.bounceScreen;
        return b ? 'The screener’s screen “' + b.name + '”: ' + b.description + ' (' + b.rule + '). Lowest in the 52-week range first. The same screen as on the screener, so a change made to it there shows here too.' : 'The screen is not available.';
      }
      const L = data.views.watch, n = L.filter((r) => r.from === 'list').length;
      return 'AI-linked companies in eight groups, largest first within each: the ' + n + ' published by ' + data.watchSource + ', and every company in your AI themes (AI - Optical Networking, AI - Power Generation, Memory, Neoclouds, Hyperscalers, and Cloud Infra, Hardware & Networking), each company once. '
        + 'The line under each group says where it came from. It follows the themes as they stand; it is not a screen and does not change as prices move.';
    }

    async function load() {
      try {
        const r = await fetch('/api/selloff' + (state.days ? '?days=' + state.days : ''), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'This page is for members. Sign in with an account to see it.' : 'The server answered ' + r.status + '.');
        data = await r.json();
        state.days = data.days;
        $('xlsx').href = '/api/selloff.xlsx?days=' + data.days;
        $('days').innerHTML = data.windows.map((n) => '<option value="' + n + '"' + (n === data.days ? ' selected' : '') + '>' + n + ' days</option>').join('');
        paint();
      } catch (e) {
        $('list').innerHTML = '<div class="sw-empty">' + we(e.message || 'Something went wrong.') + '</div>';
      }
    }
    function paint() {
      document.querySelectorAll('.sw-tab').forEach((b) => b.classList.toggle('on', b.dataset.v === state.view));
      $('winWrap').style.display = SCREENS.includes(state.view) ? '' : 'none';
      $('xlsx').style.marginLeft = SCREENS.includes(state.view) ? '' : 'auto';
      if (!data) return;
      for (const v of VIEWS) $('n' + v).textContent = data.views[v].filter((r) => !r.missing).length;
      document.querySelectorAll('.sw-tab').forEach((b) => { b.title = what(b.dataset.v); });
      const cols = colsFor(state.view);
      let L = data.views[state.view].slice();
      const c = state.sort && cols.find((x) => x.k === state.sort);
      if (c) {
        const val = c.num ? (r) => (isNum(r[c.k]) ? Number(r[c.k]) : null) : c.sort;
        // A blank sorts last whichever way.
        L.sort((a, b) => { const x = val(a), y = val(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1; return (x < y ? -1 : x > y ? 1 : 0) * state.dir; });
      }
      if (!L.length) { $('list').innerHTML = '<div class="sw-empty">No company matches in this window.</div>'; return; }
      const grouped = state.view === 'watch' && !c;
      $('list').innerHTML = '<table><thead><tr>' + cols.map((x) => '<th data-k="' + x.k + '" class="' + [x.r ? 'sw-r' : '', x.cls || '', state.sort === x.k ? 'sw-on' : ''].join(' ') + '"' + (x.title ? ' title="' + we(x.title) + '"' : '') + '><span class="sw-h">' + we(x.t) + (state.sort === x.k ? (state.dir > 0 ? ' ↑' : ' ↓') : '') + '</span></th>').join('') + '</tr></thead><tbody>'
        + L.map((r, i) => r.missing
          ? '<tr' + (grouped && i && L[i - 1].group !== r.group ? ' class="sw-grp"' : '') + '><td class="sw-co"><b class="sw-num">' + we(r.symbol) + '</b></td><td class="sw-grpname">' + we(r.group) + '</td><td colspan="' + (cols.length - 2) + '" class="sw-faint">Not on the screener</td></tr>'
          : '<tr' + (grouped && i && L[i - 1].group !== r.group ? ' class="sw-grp"' : '') + '>' + cols.map((x) => x.cell(r)).join('') + '</tr>').join('')
        + '</tbody></table>';
      const at = data.at ? new Date(data.at).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' Eastern' : 'not known';
      $('foot').innerHTML = 'Prices as of ' + we(at) + '. Reported is the results release’s filing day (for a company that files none with the SEC, the data provider’s report date); Guidance is what that release said about its own outlook. '
        + 'Revenue growth, profit margin and the two words follow the screener: the release while it is the newest report, then the SEC filings, else the data provider. '
        + 'P/E is the data provider’s trailing figure, a dash when its own earnings per share are a loss. From 52-week high is the latest price against the highest of the past year; market cap is the market value at the latest price, as on the screener; Today is the latest session’s move from the previous close; Signal is the screener’s reading under its Balanced rules, with the rule that fired. '
        + (['quality', 'divlow', 'insider'].includes(state.view) ? we(data.ideaRules[state.view]) + ' ' : '')
        + 'Click a column heading to sort. Nothing here is a recommendation to trade.';
    }
    $('list').addEventListener('click', (e) => {
      const th = e.target.closest('th[data-k]');
      if (!th) return;
      const k = th.dataset.k;
      if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; }
      paint();
    });
    const syncUrl = () => history.replaceState(null, '', '/ideas' + (state.view !== DEFAULT_VIEW ? '?show=' + state.view : ''));
    document.querySelectorAll('.sw-tab').forEach((b) => b.addEventListener('click', () => { state.view = b.dataset.v; state.sort = null; state.dir = 1; syncUrl(); paint(); }));
    $('days').addEventListener('change', () => { state.days = Number($('days').value); $('list').innerHTML = '<div class="sw-empty">Reading the screener&hellip;</div>'; load(); });
    // Where the heading stops: the bottom of the floating nav, which keeps one height but is measured, not assumed.
    const stick = () => { const n = document.querySelector('.island-wrap'); if (n) document.documentElement.style.setProperty('--sw-stick', Math.round(n.getBoundingClientRect().height) + 'px'); };
    addEventListener('resize', stick);
    stick();
    const stuck = () => {
      const th = document.querySelector('#list thead th');
      const on = !!th && getComputedStyle(th).position === 'sticky' && document.getElementById('list').getBoundingClientRect().top < parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sw-stick') || 70);
      document.body.classList.toggle('sw-stuck', on);
    };
    addEventListener('scroll', stuck, { passive: true });
    addEventListener('resize', stuck);
    paint();
    load();
  </script>
</body>
</html>
