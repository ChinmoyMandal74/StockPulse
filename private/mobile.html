<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <title>Tickr Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    /* Built for a phone held in one hand: nothing smaller than 13px, every
       target at least 44px tall, one column, and the page scrolls normally —
       the desktop screener's locked 100dvh layout is exactly what does not
       work here. */
    body { min-height: 100dvh; margin: 0; padding: 0 0 calc(64px + env(safe-area-inset-bottom));
           overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    .aura { background:
      radial-gradient(70vw 50vw at 10% -8%, rgba(52, 211, 153, 0.10), transparent 62%),
      radial-gradient(70vw 50vw at 95% 2%, rgba(124, 156, 255, 0.10), transparent 64%); }
    .wrap { position: relative; z-index: 1; padding: 0 14px; }

    /* ---- top bar ------------------------------------------------------- */
    .top { position: sticky; top: 0; z-index: 30; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
           background: rgba(5, 5, 5, 0.86); backdrop-filter: blur(18px);
           border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
    .top-row { display: flex; align-items: center; gap: 10px; }
    .brand { font-family: var(--sans); font-weight: 600; letter-spacing: -0.02em; font-size: 15px; }
    .brand .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green);
                  margin-right: 7px; box-shadow: 0 0 8px var(--green); }
    .vbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
            padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair);
            background: rgba(255, 255, 255, 0.05); color: var(--text); font: 500 13px var(--sans); }
    .vbtn small { color: var(--faint); font-size: 11px; }
    .cbtn { margin-left: 8px; display: inline-flex; align-items: center; justify-content: center;
            min-height: 36px; min-width: 36px; padding: 0 9px; border-radius: 999px;
            border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.05); color: var(--faint); }
    .cbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7;
                stroke-linecap: round; stroke-linejoin: round; }
    .cbtn.on { color: var(--green); border-color: rgba(52, 211, 153, 0.34); background: rgba(52, 211, 153, 0.10); }
    .back { min-height: 36px; padding: 7px 12px 7px 8px; border-radius: 999px; border: 1px solid var(--hair);
            background: none; color: var(--muted); font: 500 13px var(--sans); }
    h1 { margin: 12px 0 2px; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
    .sub { margin: 0; font-size: 12.5px; color: var(--faint); line-height: 1.45; }

    /* ---- screens list --------------------------------------------------- */
    .grp { margin: 18px 2px 8px; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
    .card { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box;
            min-height: 60px; padding: 13px 15px; margin-bottom: 8px; border-radius: 15px;
            border: 1px solid var(--hair); background: var(--surface); color: inherit;
            text-align: left; font: inherit; }
    .card:active { background: rgba(255, 255, 255, 0.06); }
    .card .t { flex: 1; min-width: 0; }
    .card .nm { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
    .card .ds { margin-top: 3px; font-size: 12px; color: var(--faint); line-height: 1.4;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .card .n.zero { color: var(--faint); opacity: 0.6; }

    /* ---- stock rows ----------------------------------------------------- */
    .row { display: block; width: 100%; box-sizing: border-box; text-align: left; font: inherit; color: inherit;
           padding: 12px 14px; margin-bottom: 8px; border-radius: 15px;
           border: 1px solid var(--hair); background: var(--surface); }
    .row:active { background: rgba(255, 255, 255, 0.06); }
    .r-top { display: flex; align-items: baseline; gap: 10px; }
    .r-sym { font-family: var(--mono); font-size: 14px; font-weight: 600; }
    .r-nm { font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .r-px { margin-left: auto; text-align: right; white-space: nowrap; }
    .r-price { font-family: var(--mono); font-size: 14px; }
    .r-today { font-family: var(--mono); font-size: 12px; margin-left: 8px; }
    .r-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; margin-top: 9px; }
    .r-f { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
    .r-f .k { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .r-f .v { margin-left: auto; font-family: var(--mono); }
    .r-verdict { margin-top: 8px; font-size: 12.5px; font-weight: 600; }
    /* The chart. app.css stocks svg.spark at 20px with a muted stroke for the
       table's deliberately neutral column; on a phone it is the biggest thing
       in the row, so it is taller and takes the colour of its own 90 days.
       These rules match that specificity and sit after it, so they win. */
    .r-spark { display: block; margin: 10px 0 1px; color: var(--muted); }
    .r-spark svg { width: 100%; display: block; height: 40px; }
    .r-spark svg path { stroke: currentColor; }
    .r-spark .spark-area { fill: currentColor; opacity: 0.11; stroke: none; }
    .r-spark.up { color: var(--green); } .r-spark.dn { color: var(--red); }
    .ranges { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
    .ranges::-webkit-scrollbar { display: none; }
    .rg { flex: 1 0 auto; min-height: 32px; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent;
          background: none; color: var(--faint); font: 500 12.5px var(--sans); }
    .rg.on { background: rgba(255, 255, 255, 0.08); border-color: var(--hair); color: var(--text); }
    /* A card row is the shared stock card, so it carries no layout of its own
       beyond the box it sits in. */
    .card-row { padding: 14px 15px; }
    .card-row .sc-sym { font-size: 14px; }
    .card-row .sc-nm { font-size: 12px; }
    .card-row .sc-px { font-size: 15px; }
    .card-row .sc-chg { font-size: 12.5px; }
    .card-row .sc-fields { font-size: 12.5px; }
    .r-spark.sh { margin: 2px 0 12px; }
    .r-spark.sh svg { height: 96px; }
    .r-spark .sp-cap { margin-top: 5px; font-size: 11px; color: var(--faint); }
    .up { color: var(--green); } .dn { color: var(--red); } .na, .flat { color: var(--faint); }
    .pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--amber); }

    /* ---- sheets --------------------------------------------------------- */
    .veil { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 86dvh; overflow: auto;
             border-radius: 20px 20px 0 0; border-top: 1px solid var(--hair-2);
             background: #0a0c11; padding: 8px 16px calc(22px + env(safe-area-inset-bottom));
             animation: rise .18s var(--ease); }
    @keyframes rise { from { transform: translateY(12px); opacity: 0.6 } to { transform: none; opacity: 1 } }
    .grab { width: 38px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.18); margin: 6px auto 12px; }
    .sheet h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .sheet .meta { font-size: 12px; color: var(--faint); margin-bottom: 12px; }
    .sheet .verdict { padding: 11px 13px; border-radius: 13px; border: 1px solid var(--hair);
                      background: rgba(255, 255, 255, 0.03); margin-bottom: 14px; }
    .sheet .verdict .v { font-size: 15px; font-weight: 600; }
    .sheet .verdict .why { margin-top: 3px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .sec { margin-top: 14px; }
    .sec h3 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tint, var(--faint)); }
    .sec .pair { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 13px; }
    .sec .pair .k { color: var(--muted); }
    .sec .pair .v { margin-left: auto; font-family: var(--mono); }
    .news a { display: block; padding: 9px 0; border-top: 1px solid rgba(255, 255, 255, 0.05);
              text-decoration: none; color: var(--text); font-size: 13px; line-height: 1.4; }
    .news .src { display: block; margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
    .vopt { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; min-height: 52px;
            padding: 12px 14px; margin-bottom: 8px; border-radius: 13px; border: 1px solid var(--hair);
            background: var(--surface); color: inherit; font: inherit; text-align: left; }
    .vopt.on { border-color: var(--green); background: rgba(52, 211, 153, 0.08); }
    .vopt .nm { font-size: 14px; font-weight: 600; }
    .vopt .fl { margin-top: 2px; font-size: 11.5px; color: var(--faint); }

    /* ---- tabs ----------------------------------------------------------- */
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex;
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
            background: rgba(5, 5, 5, 0.92); backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .tab { flex: 1; min-height: 50px; border: 0; background: none; color: var(--faint);
           font: 500 11px var(--sans); letter-spacing: 0.04em; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 4px; border-radius: 12px; }
    .tab.on { color: var(--green); }
    .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }

    .msg { padding: 24px 4px; color: var(--faint); font-size: 13.5px; line-height: 1.5; }
    input[type="search"] { width: 100%; box-sizing: border-box; min-height: 44px; padding: 11px 14px;
      border-radius: 13px; border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.05);
      color: var(--text); font: 400 15px var(--sans); }
    .foot { padding: 20px 4px 6px; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>

  <header class="top">
    <div class="top-row">
      <button class="back" id="back" hidden>‹ Back</button>
      <span class="brand"><span class="dot"></span>Tickr Lab</span>
      <button class="vbtn" id="viewBtn">View <small id="viewName">…</small></button>
      <button class="cbtn" id="chartBtn" aria-pressed="true" aria-label="Show charts" title="Charts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.4 9 10.2l3.6 3.4 7.9-8.2"/></svg>
      </button>
    </div>
    <h1 id="title">Screens</h1>
    <p class="sub" id="subtitle">Ready-made questions over every stock tracked.</p>
    <!-- One control for the whole list, not one per card: every chart on
         screen then covers the same window, which is what makes two cards
         comparable — and it is one fetch, not one per card. -->
    <div class="ranges" id="ranges" hidden role="group" aria-label="Chart range"></div>
  </header>

  <main class="wrap" id="main"><div class="msg">Loading…</div></main>

  <nav class="tabs">
    <button class="tab on" data-tab="screens">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Screens</button>
    <button class="tab" data-tab="all">
      <svg viewBox="0 0 24 24"><path d="M4 18h4V9H4zM10 18h4V4h-4zM16 18h4v-6h-4z"/></svg>All</button>
    <button class="tab" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>Search</button>
  </nav>

  <script>
    const $ = (id) => document.getElementById(id);
    const we = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const get = async (u) => {
      const r = await fetch(u, { cache: 'no-store' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
      return d;
    };
    const GROUP_NAMES = { info: 'Info', rank: 'Scores', act: 'Advice', chart: 'Chart', short: 'Short term',
      long: 'Long term', rel: 'Relative', trend: 'Trend', vol: 'Volume', size: 'Size',
      fund: 'Fundamentals', own: 'Ownership' };
    const GROUP_TINT = { info: '#7c9cff', rank: '#a3e635', act: '#5eead4', short: '#34d399', long: '#a78bfa',
      rel: '#22d3ee', trend: '#fbbf24', vol: '#f472b6', size: '#94a3b8', fund: '#fb7185', own: '#f0abfc' };

    let views = [];
    let viewId = null;
    let tab = 'screens';
    let screens = [];
    let allRows = null;            // the All tab's rows, for Search too

    // The chosen view is remembered here rather than server-side: a guest has
    // no account to store it against, and it is a display choice either way.
    const remember = (id) => { try { localStorage.setItem('m.view', id); } catch (e) { /* private mode */ } };
    const remembered = () => { try { return localStorage.getItem('m.view'); } catch (e) { return null; } };

    // Charts are on by default and remembered per device, like the view. The
    // toggle controls the PAYLOAD as well as the display: with it off the
    // server draws nothing and sends nothing, so the rows stay tiny.
    let chartOn = true;
    try { chartOn = localStorage.getItem('m.chart') !== 'off'; } catch (e) { /* private mode */ }
    let ranges = [];
    let rangeId = null;
    try { rangeId = localStorage.getItem('m.range'); } catch (e) { /* private mode */ }
    const chartQ = () => (chartOn ? '&chart=1&range=' + encodeURIComponent(rangeId || '') : '');

    function paintView() {
      const v = views.find((x) => x.id === viewId) || views[0];
      $('viewName').textContent = v ? v.name : '';
      $('chartBtn').classList.toggle('on', chartOn);
      $('chartBtn').setAttribute('aria-pressed', chartOn ? 'true' : 'false');
      $('chartBtn').setAttribute('aria-label', chartOn ? 'Hide charts' : 'Show charts');
      paintRanges();
    }

    // The strip shows only where there are charts to change: with the toggle
    // off, or on the screens list, it would be a control over nothing.
    function paintRanges() {
      const show = chartOn && ranges.length && tab !== 'screens';
      $('ranges').hidden = !show;
      if (!show) return;
      $('ranges').innerHTML = ranges.map((r) =>
        `<button class="rg ${r.id === rangeId ? 'on' : ''}" data-range="${we(r.id)}" ` +
        `aria-label="${we(r.label)}"${r.id === rangeId ? ' aria-current="true"' : ''}>${we(r.short)}</button>`).join('');
      $('ranges').querySelectorAll('[data-range]').forEach((b) =>
        b.addEventListener('click', () => {
          if (b.dataset.range === rangeId) return;
          rangeId = b.dataset.range;
          try { localStorage.setItem('m.range', rangeId); } catch (e) { /* private mode */ }
          allRows = null;                       // the cached rows hold the old window
          paintRanges();
          if (tab === 'search') showSearch();
          else if (currentScreen) showScreen(currentScreen);
        }));
    }

    // ---- screens ------------------------------------------------------------
    async function showScreens() {
      tab = 'screens';
      $('back').hidden = true;
      $('title').textContent = 'Screens';
      $('subtitle').textContent = 'Ready-made questions over every stock tracked.';
      paintRanges();
      $('main').innerHTML = '<div class="msg">Loading…</div>';
      try {
        const d = await get('/api/m/screens');
        screens = d.screens || [];
        const groups = [];
        for (const sc of screens) {
          let g = groups.find((x) => x.name === (sc.grp || 'Other'));
          if (!g) groups.push((g = { name: sc.grp || 'Other', items: [] }));
          g.items.push(sc);
        }
        $('main').innerHTML = groups.map((g) =>
          `<div class="grp">${we(g.name)}</div>` + g.items.map((sc) =>
            `<button class="card" data-screen="${we(sc.id)}"><span class="t">` +
            `<span class="nm">${we(sc.name)}</span>` +
            (sc.description ? `<span class="ds">${we(sc.description)}</span>` : '') +
            `</span><span class="n${sc.count ? '' : ' zero'}">${sc.count}</span></button>`).join('')).join('') +
          `<p class="foot">${d.universe} stocks screened nightly · mechanical readings, not investment advice.<br>` +
          '<a href="/">Open the full screener</a></p>';
        $('main').querySelectorAll('[data-screen]').forEach((b) =>
          b.addEventListener('click', () => showScreen(b.dataset.screen)));
      } catch (e) {
        $('main').innerHTML = `<div class="msg">Could not load the screens: ${we(e.message)}</div>`;
      }
    }

    function rowHTML(r) {
      // With charts on the server sends the whole card, drawn by the same
      // RowCard.stockCard() the screener's tiles use. Without them the row
      // stays the compact line it has always been.
      if (r.card) return `<button class="row card-row" data-stock="${we(r.symbol)}">${r.card}</button>`;
      const fields = (r.fields || []).map((f) =>
        `<span class="r-f"><span class="k">${we(f.k)}</span><span class="v ${we(f.c || '')}">${we(f.t)}</span></span>`).join('');
      return `<button class="row" data-stock="${we(r.symbol)}">` +
        '<span class="r-top">' +
        `<span class="r-sym">${we(r.symbol)}</span>` +
        `<span class="r-nm">${we(r.name)}</span>` +
        '<span class="r-px">' +
        `<span class="r-price">${we(r.price || '—')}</span>` +
        (r.today ? `<span class="r-today ${r.up ? 'up' : 'dn'}">${we(r.today)}</span>` : '') +
        '</span></span>' +
        (fields ? `<span class="r-fields">${fields}</span>` : '') +
        '</button>';
    }

    let currentScreen = null;
    async function showScreen(id) {
      currentScreen = id;
      tab = id === 'all' ? 'all' : 'list';
      $('back').hidden = false;
      $('main').innerHTML = '<div class="msg">Loading…</div>';
      try {
        const d = await get(`/api/m/screen?id=${encodeURIComponent(id)}&view=${encodeURIComponent(viewId || '')}${chartQ()}`);
        if (id === 'all') allRows = d.rows;   // Search reuses them
        // The server decides which range it actually served; adopt it, so a
        // stored id it no longer offers cannot leave the strip lying.
        if (d.ranges) ranges = d.ranges;
        if (d.range && d.range !== rangeId) { rangeId = d.range; }
        paintRanges();
        $('title').textContent = d.name;
        $('subtitle').textContent = (d.description || '') +
          (d.description ? ' · ' : '') + `${d.total} stock${d.total === 1 ? '' : 's'}`;
        $('main').innerHTML = d.rows.length
          ? d.rows.map(rowHTML).join('') +
            (d.total > d.rows.length ? `<p class="foot">Showing ${d.rows.length} of ${d.total}.</p>` : '')
          : '<div class="msg">Nothing matches this screen today.</div>';
        $('main').querySelectorAll('[data-stock]').forEach((b) =>
          b.addEventListener('click', () => showStock(b.dataset.stock)));
      } catch (e) {
        $('main').innerHTML = `<div class="msg">Could not load it: ${we(e.message)}</div>`;
      }
    }

    // ---- search -------------------------------------------------------------
    async function showSearch() {
      tab = 'search';
      $('back').hidden = true;
      $('title').textContent = 'Search';
      $('subtitle').textContent = 'By ticker or company name.';
      paintRanges();
      $('main').innerHTML = '<input type="search" id="q" placeholder="NVDA, or Nvidia" autocomplete="off" ' +
        'autocapitalize="characters" /><div id="hits"></div>';
      const run = () => {
        const q = $('q').value.trim().toLowerCase();
        if (!q) { $('hits').innerHTML = '<div class="msg">Type a ticker or a name.</div>'; return; }
        const hits = (allRows || []).filter((r) =>
          r.symbol.toLowerCase().includes(q) || String(r.name).toLowerCase().includes(q)).slice(0, 40);
        $('hits').innerHTML = hits.length
          ? hits.map(rowHTML).join('')
          : '<div class="msg">Nothing matches.</div>';
        $('hits').querySelectorAll('[data-stock]').forEach((b) =>
          b.addEventListener('click', () => showStock(b.dataset.stock)));
      };
      $('q').addEventListener('input', run);
      if (!allRows) {
        try { allRows = (await get(`/api/m/screen?id=all&view=${encodeURIComponent(viewId || '')}&limit=200${chartQ()}`)).rows; }
        catch (e) { /* search simply finds nothing */ }
      }
      run();
      $('q').focus();
    }

    // ---- the sheets ---------------------------------------------------------
    function closeSheet() {
      document.querySelectorAll('.veil, .sheet').forEach((el) => el.remove());
    }
    function openSheet(html) {
      closeSheet();
      const veil = document.createElement('div');
      veil.className = 'veil';
      veil.addEventListener('click', closeSheet);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.innerHTML = '<div class="grab"></div>' + html;
      document.body.append(veil, sheet);
      return sheet;
    }

    async function showStock(sym) {
      const sheet = openSheet('<div class="msg">Loading…</div>');
      try {
        const d = await get('/api/m/stock?symbol=' + encodeURIComponent(sym) + chartQ());
        const vcls = /Buy/.test(d.action || '') ? 'up' : /Sell|Avoid/.test(d.action || '') ? 'dn' : 'flat';
        const secs = (d.groups || []).map((g) =>
          `<div class="sec" style="--tint:${GROUP_TINT[g.group] || 'var(--faint)'}">` +
          `<h3>${we(GROUP_NAMES[g.group] || g.group)}</h3>` +
          g.rows.map((r) => `<div class="pair"><span class="k">${we(r.k)}</span>` +
            `<span class="v ${we(r.c || '')}">${we(r.t)}</span></div>`).join('') + '</div>').join('');
        const news = (d.news || []).length
          ? '<div class="sec news"><h3>News</h3>' + d.news.map((n) => {
            const age = (() => {
              const h = (Date.now() - Date.parse(n.published_at)) / 3600000;
              return !isFinite(h) ? '' : h < 24 ? Math.round(h) + 'h ago' : Math.round(h / 24) + 'd ago';
            })();
            const href = /^https?:\/\//i.test(n.url || '') ? n.url : null;
            const body = `${we(n.headline)}<span class="src">${we([n.source, age].filter(Boolean).join(' · '))}</span>`;
            return href ? `<a href="${we(href)}" target="_blank" rel="noopener">${body}</a>` : `<a>${body}</a>`;
          }).join('') + '</div>'
          : '';
        sheet.innerHTML = '<div class="grab"></div>' +
          `<h2>${we(d.name)}</h2>` +
          `<div class="meta">${we(d.symbol)}${d.sector ? ' · ' + we(d.sector) : ''}${d.industry ? ' · ' + we(d.industry) : ''}</div>` +
          (d.spark ? `<div class="r-spark sh ${d.sparkUp ? 'up' : 'dn'}">${d.spark}` +
            `<div class="sp-cap">${we(d.sparkWindow || '')}</div></div>` : '') +
          (d.action ? '<div class="verdict">' +
            `<div class="v ${vcls}">${we(d.action)}</div>` +
            (d.actionFlag ? `<div class="why">${we(d.actionFlag)}</div>` : '') +
            (d.actionTrend ? `<div class="why">Trend: ${we(d.actionTrend)}</div>` : '') +
            '</div>' : '') +
          news + secs;
      } catch (e) {
        sheet.innerHTML = `<div class="grab"></div><div class="msg">Could not load it: ${we(e.message)}</div>`;
      }
    }

    function showViews() {
      const sheet = openSheet('<h2>View</h2>' +
        '<div class="meta">What each row shows. Set by the owner; pick the one you want.</div>' +
        views.map((v) => `<button class="vopt ${v.id === viewId ? 'on' : ''}" data-view="${we(v.id)}">` +
          `<span><span class="nm">${we(v.name)}</span>` +
          // The stored keys are group-prefixed (short|Today); only the label is for reading.
          `<span class="fl">${we(v.fields.map((k) => k.slice(k.indexOf('|') + 1)).join(' · '))}</span>` +
          '</span></button>').join(''));
      sheet.querySelectorAll('[data-view]').forEach((b) =>
        b.addEventListener('click', () => {
          viewId = b.dataset.view;
          remember(viewId);
          paintView();
          closeSheet();
          if (tab === 'search') showSearch();
          else if (currentScreen) showScreen(currentScreen);
          else showScreens();
        }));
    }

    // ---- boot ---------------------------------------------------------------
    $('viewBtn').addEventListener('click', showViews);
    $('chartBtn').addEventListener('click', () => {
      chartOn = !chartOn;
      try { localStorage.setItem('m.chart', chartOn ? 'on' : 'off'); } catch (e) { /* private mode */ }
      paintView();
      // The cached All rows either carry charts or do not, so they have to go.
      allRows = null;
      closeSheet();
      if (tab === 'search') showSearch();
      else if (tab === 'screens') showScreens();
      else if (currentScreen) showScreen(currentScreen);
    });
    $('back').addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'screens'));
      showScreens();
    });
    document.querySelectorAll('.tab').forEach((b) =>
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
        closeSheet();
        if (b.dataset.tab === 'screens') showScreens();
        else if (b.dataset.tab === 'all') { tab = 'all'; showScreen('all'); }
        else showSearch();
      }));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

    (async function boot() {
      try {
        const cfg = await get('/api/m/config');
        views = cfg.views || [];
        ranges = cfg.ranges || [];
        if (rangeId && !ranges.some((r) => r.id === rangeId)) rangeId = null;
        const want = remembered();
        viewId = (views.find((v) => v.id === want) || views[0] || {}).id || null;
        paintView();
      } catch (e) { /* the list still works with the server's default view */ }
      showScreens();
    })();
  </script>
</body>
</html>
